<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Nakulaku</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
tailwind.config={theme:{extend:{
colors:{wine:{50:'#FBF2F5',100:'#F7E1E8',200:'#EFC3D1',300:'#E19AB1',400:'#D06A8C',500:'#B9446C',600:'#A62C57',700:'#8C1D3C',800:'#771731',900:'#64142B',950:'#400A1B'},ink:'#202024'},
fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},
boxShadow:{card:'0 1px 2px rgba(32,32,36,.05),0 8px 24px rgba(32,32,36,.06)'}
}}}
</script>
</head>
<body class="bg-[#F7F4F5] font-sans text-ink">

<header class="bg-gradient-to-b from-wine-800 to-wine-700 rounded-b-[28px] px-4 md:px-6 pt-5 pb-6 relative overflow-hidden">
  <svg class="absolute inset-0 w-full h-full opacity-10" viewBox="0 0 400 300" fill="none"><path d="M-20 220 C120 140,260 260,420 120" stroke="white" stroke-width="1.5"/></svg>
  <div class="relative max-w-3xl mx-auto flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center"><i data-lucide="message-square" class="w-5 h-5 text-white"></i></div>
    <div class="flex-1"><h1 class="text-white font-extrabold text-lg">Feedback</h1><p class="text-white/60 text-xs">Saran, Bug & Apresiasi</p></div>
    <span id="demo-badge" class="hidden bg-amber-400 text-amber-950 text-[9px] font-extrabold px-1.5 py-0.5 rounded">DEMO</span>
    <a href="../home.html" class="text-white/80 text-xs font-bold flex items-center gap-1 bg-white/10 px-3 py-1.5 rounded-full"><i data-lucide="home" class="w-3.5 h-3.5"></i> Beranda</a>
  </div>
</header>

<main class="max-w-3xl mx-auto p-4 md:p-6 space-y-5 pb-24">

  <!-- FORM -->
  <div class="bg-white rounded-2xl shadow-card p-5">
    <p class="font-bold mb-3 flex items-center gap-2"><i data-lucide="pen-line" class="w-4 h-4 text-wine-700"></i> Kirim Masukan</p>
    <div class="grid grid-cols-3 gap-2 mb-3">
      <button onclick="setJenis('Saran')" id="j-Saran" class="jenis bg-wine-800 text-white rounded-xl py-2.5 text-sm font-bold">💡 Saran</button>
      <button onclick="setJenis('Bug')" id="j-Bug" class="jenis bg-gray-100 rounded-xl py-2.5 text-sm font-bold">🐞 Bug</button>
      <button onclick="setJenis('Pujian')" id="j-Pujian" class="jenis bg-gray-100 rounded-xl py-2.5 text-sm font-bold">⭐ Pujian</button>
    </div>
    <textarea id="pesan" rows="4" placeholder="Tulis masukan Anda…" class="w-full border border-gray-200 rounded-xl p-3 mb-3"></textarea>
    <button id="btn-kirim" class="w-full bg-wine-800 hover:bg-wine-900 text-white font-bold rounded-xl p-3 flex items-center justify-center gap-2"><i data-lucide="send" class="w-4 h-4"></i> Kirim</button>
  </div>

  <!-- RIWAYAT SAYA -->
  <div class="bg-white rounded-2xl shadow-card p-5">
    <p class="font-bold mb-3 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-wine-700"></i> Riwayat Saya</p>
    <div id="mine" class="space-y-2 text-sm"></div>
  </div>

  <!-- ADMIN -->
  <div id="admin-box" class="hidden bg-white rounded-2xl shadow-card p-5 border-l-4 border-wine-700">
    <p class="font-bold mb-3 flex items-center gap-2"><i data-lucide="inbox" class="w-4 h-4 text-wine-700"></i> Semua Masukan <span id="cnt-baru" class="ml-1 bg-amber-400 text-amber-950 text-[10px] font-extrabold px-2 py-0.5 rounded-full hidden">0</span></p>
    <div id="all" class="space-y-2 text-sm"></div>
  </div>
</main>

<!-- CONFIRM -->
<div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center">
    <i data-lucide="help-circle" class="w-10 h-10 mx-auto text-wine-700 mb-2"></i>
    <p class="font-extrabold mb-1">Kirim Masukan?</p>
    <p class="text-sm text-gray-500 mb-4">Masukan Anda akan diterima admin.</p>
    <div class="flex gap-2"><button id="m-batal" class="flex-1 bg-gray-100 rounded-xl p-2.5 font-bold">Batal</button><button id="m-ya" class="flex-1 bg-wine-800 text-white rounded-xl p-2.5 font-bold">Ya, Kirim</button></div>
  </div>
</div>

<script>
const DEMO = location.protocol==='file:' || location.hostname==='localhost' || location.hostname==='127.0.0.1' || location.search.includes('demo=1');
const firebaseConfig={apiKey:"AIzaSyDaTXg2_oaKNYjJ0HxSGa9qXPQQ7VK0uDs",authDomain:"nakulaku-ekosistem.firebaseapp.com",projectId:"nakulaku-ekosistem",storageBucket:"nakulaku-ekosistem.firebasestorage.app",messagingSenderId:"672296906494",appId:"1:672296906494:web:2e90334b9d3136a4917faf"};
let auth=null, db=null;
if(!DEMO){ firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore(); }
const $=id=>document.getElementById(id);
let ME=null, jenis='Saran';

function showToast(m,t='success'){const ic={success:'check-circle-2',error:'x-circle',info:'info'};const bg={success:'bg-emerald-600',error:'bg-red-600',info:'bg-wine-800'};const e=document.createElement('div');e.className=`${bg[t]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 fixed bottom-5 left-1/2 -translate-x-1/2 z-50`;e.innerHTML=`<i data-lucide="${ic[t]}" class="w-5 h-5"></i><span class="text-sm font-bold">${m}</span>`;document.body.appendChild(e);lucide.createIcons();setTimeout(()=>{e.style.opacity='0';e.style.transition='.4s';setTimeout(()=>e.remove(),400)},2600);}
function setJenis(j){jenis=j;document.querySelectorAll('.jenis').forEach(b=>{b.classList.remove('bg-wine-800','text-white');b.classList.add('bg-gray-100');});const el=$('j-'+j);el.classList.add('bg-wine-800','text-white');el.classList.remove('bg-gray-100');}
function pill(s){return s==='selesai'?'<span class="text-[10px] font-extrabold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">SELESAI</span>':'<span class="text-[10px] font-extrabold px-2 py-1 rounded-full bg-amber-100 text-amber-700">BARU</span>';}
function iconJenis(j){return j==='Bug'?'🐞':j==='Pujian'?'⭐':'💡';}
function fmt(iso){const d=new Date(iso);return d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function row(f,admin){return `<div class="border-b border-gray-50 pb-2"><div class="flex justify-between items-start"><p class="font-semibold">${iconJenis(f.jenis)} ${f.jenis} <span class="text-xs text-gray-400 font-normal">• ${admin?(f.nama||f.email):fmt(f.waktu)}</span></p>${pill(f.status)}</div><p class="text-gray-600 mt-1">${f.pesan}</p>${admin?`<div class="flex justify-between items-center mt-1"><span class="text-xs text-gray-400">${fmt(f.waktu)}</span>${f.status==='baru'?`<button onclick="selesai('${f.id}')" class="text-emerald-600 text-xs font-bold">Tandai selesai</button>`:''}</div>`:''}</div>`;}

if(DEMO){
  $('demo-badge').classList.remove('hidden');
  ME={email:'iwan4943@gmail.com',nama:'Ekwan Nugroho, S.Pd.I.',role:'admin,narasumber'};
  const D=[{id:'1',jenis:'Bug',pesan:'Tombol presensi tidak muncul di HP lama.',status:'baru',nama:'Arvi Dwi Utami',email:'arvipermana1409@gmail.com',waktu:new Date().toISOString()},{id:'2',jenis:'Pujian',pesan:'Aplikasinya makin cepat, terima kasih!',status:'selesai',nama:'Triyanti',email:'triyanti612@admin.sd.belajar.id',waktu:new Date().toISOString()}];
  $('mine').innerHTML=row(D[1],false);
  $('admin-box').classList.remove('hidden');
  $('all').innerHTML=D.map(f=>row(f,true)).join('');
  window.selesai=id=>showToast('(Demo) Ditandai selesai ✅');
  $('btn-kirim').onclick=()=>showToast('(Demo) Masukan terkirim ✅');
  lucide.createIcons();
}else{
  auth.onAuthStateChanged(async u=>{
    if(!u){location.href='../index.html';return;}
    const d=await db.collection('users').doc(u.email).get();
    ME=d.exists?d.data():{email:u.email,nama:u.displayName};
    loadMine();
    if((ME.role||'').includes('admin')){$('admin-box').classList.remove('hidden');loadAll();}
    lucide.createIcons();
  });
}

async function loadMine(){
  const s=await db.collection('feedback').where('email','==',ME.email).get();
  const L=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.waktu.localeCompare(a.waktu)).slice(0,10);
  $('mine').innerHTML=L.length?L.map(f=>row(f,false)).join(''):'<p class="text-gray-400">Belum ada masukan.</p>';
}
async function loadAll(){
  const s=await db.collection('feedback').orderBy('waktu','desc').limit(50).get();
  const L=s.docs.map(x=>({id:x.id,...x.data()}));
  const baru=L.filter(f=>f.status==='baru').length;
  $('cnt-baru').textContent=baru; $('cnt-baru').classList.toggle('hidden',baru===0);
  $('all').innerHTML=L.length?L.map(f=>row(f,true)).join(''):'<p class="text-gray-400">Tidak ada masukan.</p>';
  lucide.createIcons();
}
async function selesai(id){await db.collection('feedback').doc(id).update({status:'selesai'});showToast('Ditandai selesai ✅');loadAll();}

$('btn-kirim').onclick=()=>{ if(!$('pesan').value.trim())return showToast('Tulis masukan dulu','error'); $('modal').classList.remove('hidden');$('modal').classList.add('flex'); };
$('m-batal').onclick=()=>{$('modal').classList.add('hidden');$('modal').classList.remove('flex');};
$('m-ya').onclick=async()=>{
  $('m-batal').onclick();
  try{
    await db.collection('feedback').add({waktu:new Date().toISOString(),email:ME.email,nama:ME.nama||'',jenis,pesan:$('pesan').value.trim(),status:'baru'});
    $('pesan').value=''; showToast('Masukan terkirim ✅'); loadMine();
  }catch(e){showToast('Gagal: '+e.message,'error');}
};
lucide.createIcons();
</script>
</body>
</html>
