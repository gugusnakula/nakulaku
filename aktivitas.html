<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Aktivitas Saya — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  .app-header-brand { flex: 1; justify-content: flex-start; }
  .app-header-text { text-align: left; }

  .aktivitas-stage { max-width: 800px; margin: 0 auto; padding: 20px 16px 40px; }

  /* HERO RAPOR */
  .hero-rapor {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white; border-radius: 24px; padding: 24px 20px;
    margin-bottom: 20px; position: relative; overflow: hidden;
    box-shadow: 0 12px 32px rgba(97,19,41,.28); animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-rapor::before {
    content: ''; position: absolute; top: -80px; right: -60px;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.22) 0%, transparent 70%);
  }
  .hero-label {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.5); border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 14px;
  }
  .hero-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding-top: 16px; border-top: 1px solid rgba(255,255,255,.15);
  }
  .hero-stat { text-align: center; }
  .hero-stat .n { font-size: 24px; font-weight: 800; line-height: 1; }
  .hero-stat .l { font-size: 10px; opacity: 0.8; font-weight: 700; letter-spacing: 0.3px; margin-top: 6px; text-transform: uppercase; }

  /* TAB SWITCH */
  .tab-switch {
    display: flex; gap: 4px; background: var(--bg); padding: 4px;
    border-radius: 14px; margin-bottom: 16px; border: 1.5px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .tab-switch::-webkit-scrollbar { display: none; }
  .tsw {
    flex: 1; min-width: 90px; padding: 12px 10px; text-align: center;
    font-size: 12.5px; font-weight: 700; color: var(--muted);
    border-radius: 10px; cursor: pointer; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap; transition: all .15s; font-family: inherit;
  }
  .tsw.active { background: var(--surface); color: var(--maroon); box-shadow: 0 2px 8px rgba(125,29,58,.08); }
  .panel { display: none; }
  .panel.active { display: block; animation: fade-in .25s var(--ease-out) both; }

  /* ITEM AKTIVITAS */
  .item-aktivitas {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 10px;
    transition: all .2s var(--ease-out); animation: fade-in-up .4s var(--ease-out) both;
  }
  .item-aktivitas:hover { border-color: var(--maroon-light); box-shadow: var(--sh-sm); }
  
  .item-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .item-num {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--maroon-soft); color: var(--maroon);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; flex-shrink: 0;
  }
  .item-num.gold { background: var(--gold-soft); color: var(--gold-dark); }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-weight: 800; font-size: 14px; margin-bottom: 3px; color: var(--ink); }
  .item-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  .status-pill {
    font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0;
  }
  .st-tepat { background: var(--success-soft); color: var(--success); }
  .st-terlambat { background: var(--warning-soft); color: var(--warning); }
  .st-izin { background: var(--info-soft); color: var(--info); }
  .st-alfa { background: var(--danger-soft); color: var(--danger); }
  .st-belum { background: var(--border); color: var(--muted); }

  .stat-baris {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-top: 1px solid var(--border); font-size: 12.5px; font-weight: 600;
  }
  .stat-baris .lbl { flex: 1; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .stat-baris .val { font-weight: 800; color: var(--ink); }

  /* SERTIFIKAT CARD */
  .sert-card {
    background: linear-gradient(135deg, #FFFFFF 0%, #FBF4E0 100%);
    border: 1.5px solid var(--gold); border-radius: 18px; padding: 18px;
    margin-bottom: 12px; position: relative; overflow: hidden; animation: fade-in-up .4s var(--ease-out) both;
  }
  .sert-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sert-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 11px 14px; background: var(--maroon); color: white;
    border-radius: 12px; font-size: 13px; font-weight: 800; text-decoration: none; margin-top: 12px;
  }

  .empty-state { text-align: center; padding: 40px 20px; }
  .empty-state .big-icon { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%); color: var(--maroon); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .empty-state .big-icon svg { width: 40px; height: 40px; }
  .empty-state .title { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
  .empty-state .desc { font-size: 13px; color: var(--muted); line-height: 1.55; max-width: 320px; margin: 0 auto; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand" style="display:flex; align-items:center; gap:10px;">
    <div class="app-header-text" style="text-align:left;">
      <div class="app-header-title">Aktivitas Saya</div>
      <div class="app-header-sub">Rapor Digital</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar"><span data-icon="logOut"></span></button>
</header>

<div class="desktop-layout">
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo"><img src="assets/img/logo-mark.svg" alt="Nakula" /></div>
      <div class="sidebar-brand-text"><div class="name">NAKULAKU</div><div class="sub">KKG Gugus Nakula</div></div>
    </div>
    <nav class="sidebar-menu">
      <a class="sidebar-item" data-nav="beranda" href="beranda.html"><span data-icon="home"></span> Beranda</a>
      <a class="sidebar-item" data-nav="pertemuan" href="beranda.html#sectionPertemuan"><span data-icon="calendar"></span> Pertemuan</a>
      <a class="sidebar-item galeri-menu" data-nav="galeri" href="galeri.html"><span data-icon="grid"></span> Galeri Sekolah</a>
      <a class="sidebar-item active" data-nav="aktivitas" href="aktivitas.html"><span data-icon="activity"></span> Aktivitas Saya</a>
      <a class="sidebar-item" data-nav="profil" href="profil.html"><span data-icon="user"></span> Profil</a>
    </nav>
  </aside>

  <main class="desktop-main">
    <div class="desktop-topbar">
      <h2>Aktivitas Saya</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-icon" data-act="logout"><span data-icon="logOut"></span></button>
      </div>
    </div>

    <div class="aktivitas-stage">
      <div id="loading">
        <div class="skeleton" style="height:160px;border-radius:24px;margin-bottom:20px;"></div>
        <div class="skeleton" style="height:200px;border-radius:16px;"></div>
      </div>

      <div id="content" class="hidden">
        <!-- HERO RAPOR (Tanpa Poin) -->
        <section class="hero-rapor">
          <div class="hero-label"><span data-icon="activity" class="icon-sm"></span> RAPOR DIGITAL</div>
          <div style="font-size:18px;font-weight:800;margin-bottom:4px;" id="heroNama">Memuat…</div>
          <div style="font-size:12.5px;opacity:0.85;font-weight:600;" id="heroSekolah">—</div>

          <div class="hero-stats">
            <div class="hero-stat">
              <div class="n" id="statHadir">—</div>
              <div class="l">Hadir</div>
            </div>
            <div class="hero-stat">
              <div class="n" id="statIzin">—</div>
              <div class="l">Izin/Sakit</div>
            </div>
            <div class="hero-stat">
              <div class="n" id="statTugas">—</div>
              <div class="l">Tugas Selesai</div>
            </div>
          </div>
        </section>

        <!-- TABS -->
        <div class="tab-switch">
          <button class="tsw active" data-tab="presensi"><span data-icon="mapPin" class="icon-sm"></span> Presensi</button>
          <button class="tsw" data-tab="tugas"><span data-icon="clipboard" class="icon-sm"></span> Tugas</button>
          <button class="tsw" data-tab="sertifikat"><span data-icon="fileText" class="icon-sm"></span> Sertifikat</button>
        </div>

        <div class="panel active" data-panel="presensi" id="panelPresensi"></div>
        <div class="panel" data-panel="tugas" id="panelTugas"></div>
        <div class="panel" data-panel="sertifikat" id="panelSertifikat"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app-nav.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

let profile = null;
let data = null;

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  const chip = document.getElementById('userChip');
  if (chip) {
    const init = (profile.nama || 'A').charAt(0).toUpperCase();
    const fotoUrl = Api.fotoSayaUrl('t');
    chip.innerHTML = `<div class="avatar">${fotoUrl ? `<img src="${fotoUrl}" onerror="this.parentElement.textContent='${init}'">` : init}</div><span>${UI.escapeHtml(profile.nama || '-')}</span>`;
  }

  const isAdmin = (profile.peran || []).includes('pengurus') || (profile.peran || []).includes('super_admin');
  if (!isAdmin) document.querySelectorAll('.galeri-menu').forEach(el => el.style.display = 'none');

  const res = await Api.call('aktivitas.saya');
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');

  if (!res.ok) {
    document.getElementById('content').innerHTML = UI.errorHtml(res.error || 'Gagal memuat.');
    return;
  }

  data = res.data;
  renderAll();

  document.querySelectorAll('.tsw').forEach(t => {
    t.addEventListener('click', () => {
      const nama = t.dataset.tab;
      document.querySelectorAll('.tsw').forEach(x => x.classList.toggle('active', x === t));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === nama));
    });
  });
})();

function renderAll() {
  const r = data.ringkasan;

  document.getElementById('heroNama').textContent = profile.nama || '-';
  document.getElementById('heroSekolah').textContent = profile.sekolah?.nama || '-';

  document.getElementById('statHadir').textContent = r.jml_hadir;
  document.getElementById('statIzin').textContent = r.jml_izin;
  document.getElementById('statTugas').textContent = `${r.jml_kumpul}/${r.total_tugas}`;

  renderPresensi();
  renderTugas();
  renderSertifikat();
}

function renderPresensi() {
  const el = document.getElementById('panelPresensi');
  const list = data.per_pertemuan || [];

  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="big-icon">${Icons.get('calendar', { class: 'icon-xl' })}</div><div class="title">Belum Ada Pertemuan</div><div class="desc">Jadwal akan muncul setelah admin menambahkannya.</div></div>`;
    return;
  }

  const statusMap = {
    tepat_waktu: { label: 'Tepat Waktu', cls: 'st-tepat', icon: 'checkCircle' },
    terlambat: { label: 'Terlambat', cls: 'st-terlambat', icon: 'clock' },
    luar_radius: { label: 'Luar Radius', cls: 'st-terlambat', icon: 'alertTriangle' },
    izin_pribadi: { label: 'Izin Pribadi', cls: 'st-izin', icon: 'fileText' },
    sakit: { label: 'Sakit', cls: 'st-izin', icon: 'fileText' },
    sakit_tanpa_surat: { label: 'Sakit', cls: 'st-izin', icon: 'fileText' },
    dinas_luar: { label: 'Dinas Luar', cls: 'st-tepat', icon: 'briefcase' },
    cuti_melahirkan: { label: 'Cuti', cls: 'st-izin', icon: 'heart' },
    ijin: { label: 'Ijin', cls: 'st-izin', icon: 'fileText' },
    cuti: { label: 'Cuti', cls: 'st-izin', icon: 'fileText' },
    alfa: { label: 'Alfa', cls: 'st-alfa', icon: 'x' },
  };

  el.innerHTML = list.map((item, idx) => {
    const p = item.pertemuan;
    const pres = item.presensi;
    const izin = item.izin;

    let statusHtml = '<span class="status-pill st-belum">Belum</span>';
    
    if (pres) {
      const sm = statusMap[pres.status] || statusMap.alfa;
      statusHtml = `<span class="status-pill ${sm.cls}">${sm.label}</span>`;
    } else if (izin && izin.status_ks === 'menunggu') {
      statusHtml = `<span class="status-pill st-belum">Menunggu KS</span>`;
    }

    return `
      <div class="item-aktivitas" style="animation-delay:${idx * 0.03}s">
        <div class="item-head">
          <div class="item-num">${p.urutan}</div>
          <div class="item-info">
            <div class="item-title">${UI.escapeHtml(p.judul)}</div>
            <div class="item-sub">${Icons.get('calendar', { class: 'icon-sm' })} ${UI.formatTanggal(p.tanggal)}</div>
          </div>
          ${statusHtml}
        </div>
      </div>
    `;
  }).join('');
}

function renderTugas() {
  const el = document.getElementById('panelTugas');
  const list = data.per_pertemuan || [];

  const semuaTugas = [];
  list.forEach(item => {
    (item.tugas || []).forEach(t => {
      semuaTugas.push({
        ...t,
        pertemuan_urutan: item.pertemuan.urutan,
        pertemuan_judul: item.pertemuan.judul,
      });
    });
  });

  if (semuaTugas.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="big-icon">${Icons.get('clipboard', { class: 'icon-xl' })}</div><div class="title">Belum Ada Tugas</div><div class="desc">Tugas dari narasumber akan muncul di sini.</div></div>`;
    return;
  }

  const statusMap = {
    belum: { label: 'Belum Kumpul', cls: 'st-belum' },
    menunggu: { label: 'Menunggu Dinilai', cls: 'st-terlambat' },
    diterima: { label: 'Diterima', cls: 'st-tepat' },
    revisi: { label: 'Perlu Revisi', cls: 'st-izin' },
    ditolak: { label: 'Ditolak', cls: 'st-alfa' },
  };

  el.innerHTML = semuaTugas.map((t, idx) => {
    const sm = statusMap[t.status] || statusMap.belum;
    return `
      <div class="item-aktivitas" style="animation-delay:${idx * 0.03}s">
        <div class="item-head">
          <div class="item-num gold">${t.pertemuan_urutan}</div>
          <div class="item-info">
            <div class="item-title">${UI.escapeHtml(t.judul)}</div>
            <div class="item-sub">Pertemuan #${t.pertemuan_urutan}</div>
          </div>
          <span class="status-pill ${sm.cls}">${sm.label}</span>
        </div>
        ${t.nilai !== null ? `<div class="stat-baris"><span class="lbl">Nilai</span><span class="val">${t.nilai}</span></div>` : ''}
      </div>
    `;
  }).join('');
}

function renderSertifikat() {
  const el = document.getElementById('panelSertifikat');
  const list = data.sertifikat || [];

  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="big-icon">${Icons.get('award', { class: 'icon-xl' })}</div><div class="title">Belum Ada Sertifikat</div><div class="desc">Sertifikat akan muncul setelah periode pelatihan selesai.</div></div>`;
    return;
  }

  el.innerHTML = list.map((s, idx) => `
    <div class="sert-card" style="animation-delay:${idx * 0.05}s">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="sert-icon">${Icons.get('award', { class: 'icon-sm' })}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:14.5px;color:var(--ink);">${UI.escapeHtml(s.nomor || 'Sertifikat')}</div>
          <div style="font-size:11px;color:var(--gold-dark);font-weight:700;margin-top:2px;">Terbit ${UI.formatTanggal(s.tanggal_terbit)}</div>
        </div>
      </div>
      <a href="${UI.escapeHtml(s.url_pdf)}" target="_blank" rel="noopener" class="sert-btn">
        ${Icons.get('download', { class: 'icon-sm' })} Buka / Unduh PDF
      </a>
    </div>
  `).join('');
}
</script>
</body>
</html>
