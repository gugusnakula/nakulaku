<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS — Nakulaku Ekosistem</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
tailwind.config={theme:{extend:{
colors:{wine:{50:'#FBF2F5',100:'#F7E1E8',200:'#EFC3D1',300:'#E19AB1',400:'#D06A8C',500:'#B9446C',600:'#A62C57',700:'#8C1D3C',800:'#771731',900:'#64142B',950:'#400A1B'},accent:{500:'#C9A227'},ink:'#202024'},
fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},
boxShadow:{card:'0 1px 2px rgba(32,32,36,.05),0 8px 24px rgba(32,32,36,.06)'}
}}}
</script>
</head>
<body class="bg-[#F7F4F5] font-sans text-ink">

<header class="bg-gradient-to-b from-wine-800 to-wine-700 rounded-b-[28px] px-4 md:px-6 pt-5 pb-6 relative overflow-hidden">
  <svg class="absolute inset-0 w-full h-full opacity-10" viewBox="0 0 400 300" fill="none"><path d="M-20 220 C120 140,260 260,420 120" stroke="white" stroke-width="1.5"/></svg>
  <div class="relative max-w-5xl mx-auto flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center"><i data-lucide="graduation-cap" class="w-5 h-5 text-white"></i></div>
    <div class="flex-1"><h1 class="text-white font-extrabold text-lg">LMS KKG</h1><p class="text-white/60 text-xs">Nakulaku Ekosistem</p></div>
    <button onclick="openNotif()" class="relative text-white/80 bg-white/10 rounded-full w-10 h-10 flex items-center justify-center"><i data-lucide="bell" class="w-5 h-5"></i><span id="bell-count" class="hidden absolute -top-1 -right-1 bg-amber-400 text-amber-950 text-[9px] font-extrabold w-4 h-4 rounded-full flex items-center justify-center">0</span></button>
    <span id="demo-badge" class="hidden bg-amber-400 text-amber-950 text-[9px] font-extrabold px-1.5 py-0.5 rounded">DEMO</span>
    <a href="../home.html" class="text-white/80 text-xs font-bold flex items-center gap-1 bg-white/10 px-3 py-1.5 rounded-full"><i data-lucide="home" class="w-3.5 h-3.5"></i> Beranda</a>
  </div>
</header>

<main class="max-w-5xl mx-auto p-4 md:p-6 space-y-5 pb-24">
  <div id="gate" class="hidden bg-amber-50 border border-amber-200 text-amber-700 rounded-2xl p-4 text-sm font-semibold flex items-start gap-2"><i data-lucide="shield-alert" class="w-4 h-4 mt-0.5"></i><span>Akun Anda belum aktif.</span></div>

  <div id="reminder-banner" class="hidden bg-gradient-to-r from-amber-500 to-red-500 text-white rounded-2xl shadow-card p-4 flex items-center gap-3">
    <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0"></i>
    <div class="flex-1"><p class="font-extrabold text-sm">Deadline Mendekat</p><p class="text-xs opacity-90" id="reminder-text">-</p></div>
  </div>

  <div class="bg-white rounded-2xl shadow-card p-4">
    <div class="flex items-center justify-between">
      <div><p class="font-extrabold" id="u-nama">-</p><p class="text-xs text-gray-400" id="u-info">-</p></div>
      <div class="text-right"><p class="text-xs text-gray-400">Capaian</p><p class="text-xl font-extrabold text-wine-700" id="u-pct">0%</p></div>
    </div>
    <div class="mt-3 bg-gray-100 rounded-full h-2 overflow-hidden"><div id="u-bar" class="h-full bg-wine-700 transition-all" style="width:0%"></div></div>
  </div>

  <div class="bg-white rounded-2xl shadow-card p-1 flex text-sm font-bold">
    <button onclick="showTab('tagihan')" id="t-tagihan" class="flex-1 py-2.5 rounded-xl bg-wine-800 text-white flex items-center justify-center gap-1"><i data-lucide="book-open" class="w-3.5 h-3.5"></i> Tagihan Saya</button>
    <button onclick="showTab('riwayat')" id="t-riwayat" class="flex-1 py-2.5 rounded-xl text-gray-500 flex items-center justify-center gap-1"><i data-lucide="history" class="w-3.5 h-3.5"></i> Riwayat</button>
    <button onclick="showTab('validasi')" id="t-validasi" class="flex-1 py-2.5 rounded-xl text-gray-500 flex items-center justify-center gap-1"><i data-lucide="check-square" class="w-3.5 h-3.5"></i> Validasi</button>
  </div>

  <section id="tab-tagihan" class="space-y-4">
    <div id="tagihan-list" class="space-y-3"></div>
  </section>

  <section id="tab-riwayat" class="hidden space-y-3">
    <div id="riwayat-list" class="space-y-3"></div>
  </section>

  <section id="tab-validasi" class="hidden space-y-3">
    <div id="no-validasi" class="hidden bg-white rounded-2xl shadow-card p-8 text-center text-gray-400"><i data-lucide="shield-x" class="w-8 h-8 mx-auto mb-2"></i>Hanya untuk Narasumber / Admin</div>
    <div id="validasi-box" class="space-y-3">
      <select id="v-tugas" onchange="loadValidasi()" class="w-full border rounded-xl p-3 bg-white"></select>
      <div id="v-list" class="space-y-3"></div>
    </div>
  </section>
</main>

<div id="mKirim" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-3xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <p class="font-extrabold mb-1" id="km-judul">-</p>
    <p class="text-xs text-gray-400 mb-3" id="km-info">-</p>
    <div id="km-rubrik" class="hidden bg-wine-50 rounded-xl p-3 mb-3">
      <p class="text-xs font-extrabold text-wine-700 mb-2 flex items-center gap-1"><i data-lucide="scale" class="w-3.5 h-3.5"></i> Rubrik Penilaian (targetkan grade A)</p>
      <div id="km-rubrik-list" class="text-xs space-y-1"></div>
    </div>
    <input id="km-link" placeholder="Link Drive (wajib)" class="w-full border rounded-xl p-3 mb-2">
    <textarea id="km-desk" rows="3" placeholder="Deskripsi singkat karya/implementasi" class="w-full border rounded-xl p-3 mb-3"></textarea>
    <div class="flex gap-2">
      <button onclick="submitKarya()" class="flex-1 bg-wine-800 text-white rounded-xl py-2.5 font-bold flex items-center justify-center gap-1"><i data-lucide="send" class="w-4 h-4"></i> Kirim</button>
      <button onclick="closeM('mKirim')" class="flex-1 bg-gray-100 rounded-xl py-2.5 font-bold">Batal</button>
    </div>
  </div>
</div>

<div id="mNotif" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-3xl p-6 w-full max-w-md max-h-[80vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-3"><p class="font-extrabold flex items-center gap-2"><i data-lucide="bell" class="w-4 h-4 text-wine-700"></i> Notifikasi</p><button onclick="closeM('mNotif')"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div id="notif-list" class="space-y-2"></div>
  </div>
</div>

<div id="mValidasi" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-3xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <p class="font-extrabold mb-3 flex items-center gap-2"><i data-lucide="check-square" class="w-4 h-4 text-wine-700"></i> Validasi Karya</p>
    <p class="font-bold" id="v-judul">-</p>
    <p class="text-xs text-gray-400 mb-2" id="v-info">-</p>
    <div class="bg-gray-50 rounded-xl p-3 mb-3">
      <p class="text-xs font-bold text-gray-500 mb-1">CATATAN PESERTA</p>
      <p class="text-sm" id="v-desk">-</p>
      <a id="v-link" target="_blank" class="text-sm text-wine-700 font-bold inline-flex items-center gap-1 mt-2"><i data-lucide="external-link" class="w-3.5 h-3.5"></i> Buka Link Karya</a>
    </div>
    <p class="text-xs font-bold text-gray-500 mb-2">STATUS KELULUSAN</p>
    <div class="grid grid-cols-2 gap-2 mb-3" id="v-grades"></div>
    <textarea id="v-fb" rows="3" placeholder="Umpan balik (wajib jika D/E — memicu revisi)" class="w-full border rounded-xl p-3 mb-3"></textarea>
    <div class="flex gap-2">
      <button onclick="saveValidasi()" class="flex-1 bg-wine-800 text-white rounded-xl py-2.5 font-bold flex items-center justify-center gap-1"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
      <button onclick="closeM('mValidasi')" class="flex-1 bg-gray-100 rounded-xl py-2.5 font-bold">Batal</button>
    </div>
  </div>
</div>

<script>
const DEMO=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.search.includes('demo=1');
const firebaseConfig={apiKey:"AIzaSyDaTXg2_oaKNYjJ0HxSGa9qXPQQ7VK0uDs",authDomain:"nakulaku-ekosistem.firebaseapp.com",projectId:"nakulaku-ekosistem",storageBucket:"nakulaku-ekosistem.firebasestorage.app",messagingSenderId:"672296906494",appId:"1:672296906494:web:2e90334b9d3136a4917faf"};
let auth=null,db=null;
if(!DEMO){firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();}
const $=id=>document.getElementById(id);
let ME=null,LEVEL=4,TUGAS=[],KARYA=[],NOTIF=[],curKirim=null,curVal=null,selGrade=null;
function levelOf(u){const r=(u.role||'').toLowerCase(),j=(u.jabatan||'').toLowerCase();if(r.includes('admin'))return 1;if(r.includes('narasumber'))return 2;if(r.includes('kepala')||j.includes('kepala'))return 3;return 4;}
function showToast(m,t='success'){const ic={success:'check-circle-2',error:'x-circle',info:'info'};const bg={success:'bg-emerald-600',error:'bg-red-600',info:'bg-wine-800'};const e=document.createElement('div');e.className=`${bg[t]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 fixed bottom-20 left-1/2 -translate-x-1/2 z-[60]`;e.innerHTML=`<i data-lucide="${ic[t]}" class="w-5 h-5"></i><span class="text-sm font-bold">${m}</span>`;document.body.appendChild(e);lucide.createIcons();setTimeout(()=>{e.style.opacity='0';e.style.transition='.4s';setTimeout(()=>e.remove(),400)},2600);}
function openM(id){$(id).classList.remove('hidden');$(id).classList.add('flex');}
function closeM(id){$(id).classList.add('hidden');$(id).classList.remove('flex');}
function showTab(n){['tagihan','riwayat','validasi'].forEach(x=>{$('tab-'+x).classList.toggle('hidden',x!==n);$('t-'+x).classList.toggle('bg-wine-800',x===n);$('t-'+x).classList.toggle('text-white',x===n);$('t-'+x).classList.toggle('text-gray-500',x!==n);});if(n==='riwayat')renderRiwayat();if(n==='validasi')loadValidasiOpts();lucide.createIcons();}
function daysUntil(tgl){if(!tgl)return null;const d=new Date(tgl);const t=new Date();t.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-t)/86400000);}

const D_TUGAS=[{id:'t1',judul:'Implementasi Kurikulum Merdeka',jenis:'Materi KKG',sasaran:'guru',wajib:true,urutan:1,blind:true,deadline:'2026-10-15',rubrik:{A:'Implementasi di kelas + foto + refleksi tertulis',B:'Implementasi di kelas + foto',C:'Belum implementasi, rencana tertulis',D:'Belum layak',E:'Belum lengkap'},status:'ON'}];
const D_KARYA=[{id:'k1',tugas_id:'t1',email:'guru@sd.id',link:'https://drive.google.com/...',deskripsi:'Implementasi di kelas 5.',status:'menunggu'}];
const D_NOTIF=[{id:'n1',jenis:'karya_dinilai',judul:'Karya Anda dinilai A',pesan:'Implementasi Kurikulum Merdeka',waktu:new Date().toISOString(),unread:true}];

if(DEMO){
  $('demo-badge').classList.remove('hidden');
  ME={email:'guru@sd.id',nama:'Arvi Dwi Utami, S.Pd.',jabatan:'Guru Kelas',instansi:'SD Negeri 1 Krisak',role:'guru',status:'active'};
  LEVEL=4;TUGAS=D_TUGAS;KARYA=D_KARYA;NOTIF=D_NOTIF;
  initUI();
}else{
  auth.onAuthStateChanged(async u=>{
    if(!u){location.href='../index.html';return;}
    const d=await db.collection('users').doc(u.email).get();
    ME=d.exists?d.data():{email:u.email,nama:u.displayName};
    LEVEL=levelOf(ME);
    if((ME.status||'active')!=='active')$('gate').classList.remove('hidden');
    await loadTugas();await loadKarya();await loadNotif();
    initUI();
  });
}

async function loadTugas(){
  if(DEMO)return;
  const raw=(await db.collection('tugas').get()).docs.map(x=>({id:x.id,...x.data()}));
  TUGAS=raw.filter(d=>!d.arsip&&(d.sumber==='bank'||d.sasaran)).filter(t=>(t.status||'ON')==='ON');
}
async function loadKarya(){
  if(DEMO)return;
  const s=await db.collection('karya').where('email','==',ME.email).get();
  KARYA=s.docs.map(x=>({id:x.id,...x.data()}));
}
async function loadNotif(){
  if(DEMO)return;
  try{const s=await db.collection('notifikasi').where('email','==',ME.email).orderBy('waktu','desc').limit(30).get();NOTIF=s.docs.map(x=>({id:x.id,...x.data()}));}catch(e){NOTIF=[];}
}

function initUI(){
  $('u-nama').textContent=ME.nama||ME.email;
  $('u-info').textContent=(ME.jabatan||'')+' • '+(ME.instansi||'');
  renderCapaian();renderTagihan();renderBell();renderReminder();lucide.createIcons();
}

function renderCapaian(){
  const wajib=TUGAS.filter(t=>t.wajib);
  const selesai=KARYA.filter(k=>{const t=TUGAS.find(x=>x.id===k.tugas_id);return t&&t.wajib&&(k.status==='diterima'||k.status==='A'||k.status==='B'||k.status==='C');}).length;
  const pct=wajib.length?Math.round(selesai/wajib.length*100):0;
  $('u-pct').textContent=pct+'%';$('u-bar').style.width=pct+'%';
}

function renderTagihan(){
  const myTugas=TUGAS.filter(t=>(t.sasaran||'guru')==='guru'||t.sasaran==='all').sort((a,b)=>(a.urutan||99)-(b.urutan||99));
  $('tagihan-list').innerHTML=myTugas.length?myTugas.map(t=>{
    const k=KARYA.find(x=>x.tugas_id===t.id);
    let status='BELUM DIKERJAKAN',cls='bg-gray-100 text-gray-500',ic='circle';
    if(k){
      if(k.status==='revisi'){status='PERLU REVISI';cls='bg-amber-100 text-amber-700';ic='alert-circle';}
      else if(k.status==='menunggu'){status='MENUNGGU VALIDASI';cls='bg-sky-100 text-sky-700';ic='clock';}
      else{status='DITERIMA ('+k.status+')';cls='bg-emerald-100 text-emerald-700';ic='check-circle-2';}
    }
    const dd=daysUntil(t.deadline);
    let deadlineChip='';
    if(dd!==null){
      if(dd<0)deadlineChip=`<span class="text-[10px] font-extrabold bg-red-100 text-red-600 px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i>Terlambat ${-dd} hari</span>`;
      else if(dd<=3)deadlineChip=`<span class="text-[10px] font-extrabold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>Sisa ${dd} hari</span>`;
      else deadlineChip=`<span class="text-[10px] font-extrabold bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full inline-flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>Sisa ${dd} hari</span>`;
    }
    const lock=t.urutan>1&&!KARYA.some(x=>{const tt=TUGAS.find(z=>z.id===x.tugas_id);return tt&&tt.urutan<t.urutan&&(x.status==='diterima'||x.status==='A'||x.status==='B'||x.status==='C');});
    const rubrikBadge=t.rubrik?.A?'<span class="text-[9px] font-extrabold bg-wine-100 text-wine-700 px-1.5 py-0.5 rounded inline-flex items-center gap-0.5"><i data-lucide="scale" class="w-2.5 h-2.5"></i>RUBRIK</span>':'';
    return `<div class="bg-white rounded-2xl shadow-card p-4 ${lock?'opacity-60':''}">
      <div class="flex justify-between items-start mb-2">
        <div class="flex-1 min-w-0">
          <p class="font-bold text-sm truncate">${t.judul} <span class="text-[9px] font-extrabold ${t.wajib?'bg-red-100 text-red-600':'bg-gray-100 text-gray-500'} px-1.5 py-0.5 rounded">${t.wajib?'WAJIB':'OPSIONAL'}</span> ${rubrikBadge}</p>
          <p class="text-xs text-gray-400 truncate">${t.jenis||'-'} • urutan #${t.urutan||'-'} • ${t.blind?'BLIND':'NON-BLIND'}</p>
        </div>
        <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full ${cls}">${status}</span>
      </div>
      ${deadlineChip?'<div class="mb-2">'+deadlineChip+'</div>':''}
      <div class="flex gap-2">
        ${k&&k.status==='revisi'?`<button onclick="openKirim('${t.id}')" class="flex-1 bg-amber-500 text-white rounded-xl py-2 text-xs font-bold inline-flex items-center justify-center gap-1"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Kirim Revisi</button>`
        :lock?'<button disabled class="flex-1 bg-gray-100 text-gray-400 rounded-xl py-2 text-xs font-bold inline-flex items-center justify-center gap-1"><i data-lucide="lock" class="w-3.5 h-3.5"></i> Terkunci (selesaikan urutan sebelumnya)</button>'
        :!k?`<button onclick="openKirim('${t.id}')" class="flex-1 bg-wine-800 text-white rounded-xl py-2 text-xs font-bold inline-flex items-center justify-center gap-1"><i data-lucide="upload" class="w-3.5 h-3.5"></i> Kirim Karya</button>`
        :`<button disabled class="flex-1 bg-gray-100 text-gray-500 rounded-xl py-2 text-xs font-bold inline-flex items-center justify-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i> Sudah Dikirim</button>`}
      </div>
    </div>`;
  }).join(''):'<div class="bg-white rounded-2xl shadow-card p-8 text-center text-gray-400"><i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2"></i><p>Belum ada tagihan.</p></div>';
  lucide.createIcons();
}

function renderBell(){
  const unread=NOTIF.filter(n=>!n.dibaca).length;
  $('bell-count').textContent=unread;
  $('bell-count').classList.toggle('hidden',unread===0);$('bell-count').classList.toggle('flex',unread>0);
}

function renderReminder(){
  const dekat=TUGAS.filter(t=>{const d=daysUntil(t.deadline);return d!==null&&d>=0&&d<=3&&!KARYA.some(k=>k.tugas_id===t.id);});
  if(dekat.length){$('reminder-banner').classList.remove('hidden');$('reminder-text').textContent=dekat.length+' tugas mendekati deadline (3 hari ke depan).';}
}

function openKirim(tid){
  const t=TUGAS.find(x=>x.id===tid);if(!t)return;
  curKirim=t;
  $('km-judul').textContent=t.judul;
  $('km-info').textContent=`${t.jenis||'-'} • deadline ${t.deadline||'-'}`;
  const rb=$('km-rubrik');const rl=$('km-rubrik-list');
  if(t.rubrik&&(t.rubrik.A||t.rubrik.B||t.rubrik.C||t.rubrik.D||t.rubrik.E)){
    rb.classList.remove('hidden');
    const items=[['A','bg-emerald-100 text-emerald-700'],['B','bg-sky-100 text-sky-700'],['C','bg-amber-100 text-amber-700'],['D','bg-red-100 text-red-600'],['E','bg-gray-200 text-gray-600']];
    rl.innerHTML=items.map(([g,cls])=>t.rubrik[g]?`<div class="flex gap-2 ${cls} rounded-lg px-2 py-1"><span class="font-extrabold w-4">${g}</span><span>${t.rubrik[g]}</span></div>`:'').join('');
  }else rb.classList.add('hidden');
  const eks=KARYA.find(k=>k.tugas_id===tid);
  $('km-link').value=eks?.link||'';$('km-desk').value=eks?.deskripsi||'';
  openM('mKirim');lucide.createIcons();
}

async function submitKarya(){
  if(!curKirim)return;
  const link=$('km-link').value.trim();if(!link)return showToast('Link Drive wajib','error');
  const data={tugas_id:curKirim.id,tugas_judul:curKirim.judul,email:ME.email,nama:ME.nama||'',unit_kerja:ME.instansi||'',link,deskripsi:$('km-desk').value.trim(),status:'menunggu',waktu_submit:new Date().toISOString(),validator:curKirim.validator||''};
  if(DEMO){const eks=KARYA.find(k=>k.tugas_id===curKirim.id);if(eks){eks.link=link;eks.deskripsi=data.deskripsi;eks.status='menunggu';}else KARYA.push({id:'k'+Date.now(),...data});closeM('mKirim');renderCapaian();renderTagihan();showToast('Karya terkirim (demo)');return;}
  try{
    const eks=KARYA.find(k=>k.tugas_id===curKirim.id);
    if(eks)await db.collection('karya').doc(eks.id).update(data);
    else await db.collection('karya').add(data);
    closeM('mKirim');await loadKarya();renderCapaian();renderTagihan();showToast('Karya terkirim');
  }catch(e){showToast('Gagal: '+e.message,'error');}
}

function renderRiwayat(){
  const list=KARYA.slice().sort((a,b)=>(b.waktu_submit||'').localeCompare(a.waktu_submit||''));
  $('riwayat-list').innerHTML=list.length?list.map(k=>{const t=TUGAS.find(x=>x.id===k.tugas_id);
    const st={diterima:['bg-emerald-100 text-emerald-700','DITERIMA'],menunggu:['bg-sky-100 text-sky-700','MENUNGGU'],revisi:['bg-amber-100 text-amber-700','REVISI']}[k.status]||['bg-gray-100 text-gray-500',k.status||'-'];
    return `<div class="bg-white rounded-2xl shadow-card p-4">
      <div class="flex justify-between items-start">
        <div class="flex-1 min-w-0">
          <p class="font-bold text-sm truncate">${t?.judul||k.tugas_judul||'-'}</p>
          <p class="text-xs text-gray-400 truncate">${(k.waktu_submit||'').slice(0,10)} • ${t?.jenis||'-'}</p>
        </div>
        <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full ${st[0]}">${st[1]}</span>
      </div>
      ${k.feedback?`<div class="mt-2 bg-gray-50 rounded-xl p-2 text-xs"><p class="font-bold text-gray-500 mb-0.5">UMPN BALIK VALIDATOR</p><p>${k.feedback}</p></div>`:''}
    </div>`;
  }).join(''):'<div class="bg-white rounded-2xl shadow-card p-8 text-center text-gray-400"><i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2"></i><p>Belum ada riwayat karya.</p></div>';
  lucide.createIcons();
}

async function loadValidasiOpts(){
  if(LEVEL>2){$('no-validasi').classList.remove('hidden');$('validasi-box').classList.add('hidden');return;}
  $('no-validasi').classList.add('hidden');$('validasi-box').classList.remove('hidden');
  const list=TUGAS.filter(t=>!t.validator||t.validator===ME.email||(t.validator||'').split(/[,;]/).includes(ME.email));
  $('v-tugas').innerHTML=list.length?list.map(t=>`<option value="${t.id}">${t.judul} (${t.jenis||'-'})</option>`).join(''):'<option>Belum ada tugas untuk divalidasi</option>';
  loadValidasi();
}
async function loadValidasi(){
  const tid=$('v-tugas').value;if(!tid||tid.includes('Belum'))return;
  let list;
  if(DEMO){list=D_KARYA.filter(k=>k.tugas_id===tid);}
  else{const s=await db.collection('karya').where('tugas_id','==',tid).get();list=s.docs.map(x=>({id:x.id,...x.data()}));}
  $('v-list').innerHTML=list.length?list.map(k=>{const st={menunggu:['bg-sky-100 text-sky-700','MENUNGGU'],revisi:['bg-amber-100 text-amber-700','REVISI'],diterima:['bg-emerald-100 text-emerald-700','DITERIMA']}[k.status]||['bg-gray-100',k.status||'-'];
    return `<div class="bg-white rounded-2xl shadow-card p-4 flex justify-between items-center"><div class="min-w-0 flex-1"><p class="font-bold text-sm truncate">${k.nama||k.email}</p><p class="text-xs text-gray-400 truncate">${k.unit_kerja||'-'} • ${(k.waktu_submit||'').slice(0,10)}</p></div><span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full ${st[0]} mr-2">${st[1]}</span><button onclick="openValidasi('${k.id}')" class="bg-wine-800 text-white rounded-xl px-3 py-1.5 text-xs font-bold inline-flex items-center gap-1"><i data-lucide="pen-line" class="w-3.5 h-3.5"></i> Nilai</button></div>`;
  }).join(''):'<div class="bg-white rounded-2xl shadow-card p-8 text-center text-gray-400">Belum ada karya menunggu untuk tugas ini.</div>';
  lucide.createIcons();
}
function openValidasi(kid){
  const k=KARYA.concat(DEMO?D_KARYA:[]).find(x=>x.id===kid);if(!k)return;
  const t=TUGAS.find(x=>x.id===k.tugas_id);curVal=k;selGrade=k.status==='diterima'||['A','B','C','D','E'].includes(k.status)?k.status:null;
  $('v-judul').textContent=t?.judul||'-';
  $('v-info').textContent=`${k.nama||k.email} • ${k.unit_kerja||'-'}`;
  $('v-desk').textContent=k.deskripsi||'-';
  $('v-link').href=k.link||'#';
  const grades=[['A','Sangat Baik','bg-emerald-100 text-emerald-700'],['B','Baik','bg-sky-100 text-sky-700'],['C','Cukup','bg-amber-100 text-amber-700'],['D','Revisi','bg-red-100 text-red-600'],['E','Belum Lengkap','bg-gray-200 text-gray-600']];
  $('v-grades').innerHTML=grades.map(([g,l,cls])=>`<button onclick="setGrade('${g}')" id="vg-${g}" class="${cls} rounded-xl py-2 text-xs font-bold inline-flex items-center justify-center gap-1 ${selGrade===g?'ring-2 ring-wine-700':''}"><span class="font-extrabold">${g}</span><span>${l}</span></button>`).join('');
  $('v-fb').value=k.feedback||'';
  openM('mValidasi');lucide.createIcons();
}
function setGrade(g){selGrade=g;['A','B','C','D','E'].forEach(x=>{$('vg-'+x).classList.toggle('ring-2',x===g);$('vg-'+x).classList.toggle('ring-wine-700',x===g);});}
async function saveValidasi(){
  if(!curVal)return;
  if(!selGrade)return showToast('Pilih grade dulu','error');
  const fb=$('v-fb').value.trim();
  if((selGrade==='D'||selGrade==='E')&&!fb)return showToast('Umpan balik wajib untuk D/E','error');
  const data={status:selGrade==='diterima'?'diterima':(selGrade==='D'||selGrade==='E'?'revisi':'diterima'),grade:selGrade,feedback:fb,validator:ME.email,waktu_validasi:new Date().toISOString()};
  if(DEMO){curVal.status=data.status;curVal.grade=selGrade;curVal.feedback=fb;closeM('mValidasi');loadValidasi();showToast('Validasi disimpan (demo)');return;}
  try{
    await db.collection('karya').doc(curVal.id).update(data);
    await db.collection('notifikasi').add({email:curVal.email,jenis:'karya_dinilai',judul:`Karya Anda dinilai ${selGrade}`,pesan:curVal.tugas_judul||'Tugas LMS',waktu:new Date().toISOString(),dibaca:false});
    closeM('mValidasi');showToast('Validasi disimpan');loadValidasi();
  }catch(e){showToast('Gagal: '+e.message,'error');}
}

function openNotif(){
  $('notif-list').innerHTML=NOTIF.length?NOTIF.map(n=>`<div class="border-b border-gray-50 pb-2 ${!n.dibaca?'bg-wine-50 -mx-2 px-2 rounded-lg':''}"><div class="flex justify-between items-start"><div class="flex-1"><p class="font-bold text-sm">${n.judul||'-'}</p><p class="text-xs text-gray-500">${n.pesan||''}</p><p class="text-[10px] text-gray-400 mt-0.5">${(n.waktu||'').slice(0,16).replace('T',' ')}</p></div>${!n.dibaca?'<span class="w-2 h-2 bg-wine-700 rounded-full shrink-0 mt-2"></span>':''}</div></div>`).join(''):'<p class="text-gray-400 text-sm text-center py-4">Tidak ada notifikasi.</p>';
  const unread=NOTIF.filter(n=>!n.dibaca);
  if(!DEMO&&unread.length){unread.forEach(n=>{try{db.collection('notifikasi').doc(n.id).update({dibaca:true});}catch(e){}});}
  openM('mNotif');lucide.createIcons();
}
lucide.createIcons();
</script>
</body>
</html>
