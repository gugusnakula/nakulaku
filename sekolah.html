<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Profil Sekolah — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  .public-header {
    background: linear-gradient(135deg, var(--maroon-dark) 0%, var(--maroon) 100%);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(97,19,41,.15);
  }
  .public-header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: white;
  }
  .public-header-logo {
    width: 40px; height: 40px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--gold);
    padding: 3px;
    flex-shrink: 0;
  }
  .public-header-logo img { width: 100%; height: 100%; object-fit: contain; }

  .hero-sekolah {
    background: linear-gradient(135deg, var(--maroon-dark) 0%, var(--maroon-mid) 100%);
    color: white;
    border-radius: var(--r-xl);
    padding: 24px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.3);
  }
  .hero-sekolah::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.12;
  }
  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.5);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    position: relative;
  }
  .hero-nama {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
    position: relative;
    line-height: 1.3;
  }
  .hero-npsn {
    font-size: 12.5px;
    opacity: 0.85;
    position: relative;
  }
  .hero-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    position: relative;
  }
  .hero-logo-wrap {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    background: white;
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 12px 28px rgba(0,0,0,.25),
      0 0 0 6px rgba(201,169,97,.12);
  }
  .hero-logo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hero-logo-wrap .fallback {
    font-size: 30px;
    font-weight: 800;
    color: var(--maroon);
    letter-spacing: 1.5px;
  }
  .hero-info-wrap { flex: 1; min-width: 0; }

    gap: 8px;
    padding-top: 16px;
    margin-top: 16px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
  }
  .hero-stat { text-align: center; }
  .hero-stat .n { font-size: 22px; font-weight: 800; line-height: 1; }
  .hero-stat .l {
    font-size: 9px; opacity: 0.8; font-weight: 700;
    margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px;
  }

  .stat-poin {
    background: linear-gradient(135deg, var(--gold-soft) 0%, #FBF3D0 100%);
    border: 1.5px solid var(--gold);
    border-radius: var(--r-lg);
    padding: 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .stat-poin .l {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--gold-dark);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat-poin .n {
    font-size: 36px;
    font-weight: 800;
    color: var(--maroon);
    line-height: 1;
  }
  .stat-poin .sub {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
    font-weight: 600;
  }

  .tab-row {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab-p {
    flex: 1;
    min-width: 90px;
    padding: 10px 6px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab-p.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: var(--sh-sm);
  }

  .item-publik {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px;
    margin-bottom: 10px;
    transition: all .15s;
  }
  .item-publik:hover {
    border-color: var(--maroon);
    box-shadow: var(--sh-md);
    transform: translateY(-1px);
  }
  .item-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--gold-soft);
    color: var(--gold-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .item-icon.prestasi { background: var(--gold-soft); color: var(--gold-dark); }
  .item-icon.pembiasaan { background: var(--success-soft); color: var(--success); }
  .item-icon.kegiatan { background: var(--info-soft); color: var(--info); }
  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-weight: 800; font-size: 14px; margin-bottom: 3px; line-height: 1.4; }
  .item-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  .link-bukti {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--maroon);
    margin-top: 8px;
  }

  .badge-tingkat {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .badge-tingkat.sekolah { background: var(--border); color: var(--muted); }
  .badge-tingkat.kecamatan { background: var(--info-soft); color: var(--info); }
  .badge-tingkat.kabupaten { background: var(--warning-soft); color: var(--warning); }
  .badge-tingkat.provinsi { background: var(--gold-soft); color: var(--gold-dark); }
  .badge-tingkat.nasional { background: var(--maroon-soft); color: var(--maroon); }
  .badge-tingkat.internasional { background: linear-gradient(135deg, var(--gold), var(--maroon)); color: white; }

  .select-sekolah {
    padding: 12px 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    background: var(--surface);
    font-size: 13.5px;
    font-weight: 700;
    width: 100%;
    margin-bottom: 16px;
  }
  .select-sekolah:focus {
    outline: none;
    border-color: var(--maroon);
    box-shadow: 0 0 0 4px rgba(125,29,58,.08);
  }
</style>
</head>
<body>

<header class="public-header">
  <a href="beranda.html" class="public-header-brand">
    <div class="public-header-logo">
      <img src="assets/img/logo-mark.svg" alt="Nakula" />
    </div>
    <div>
      <div style="font-weight:800;font-size:14px;letter-spacing:.5px;">NAKULAKU</div>
      <div style="font-size:10px;opacity:.8;">KKG Gugus Nakula</div>
    </div>
  </a>
  <a href="galeri.html" style="color:white;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:8px 12px;border-radius:10px;">
    <span data-icon="grid" class="icon-sm"></span> Galeri
  </a>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;">

  <select id="pilihSekolah" class="select-sekolah">
    <option value="">— Pilih Sekolah —</option>
  </select>

  <div id="loading">
    <div class="skeleton" style="height:180px;border-radius:24px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:60px;border-radius:12px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:120px;border-radius:16px;"></div>
  </div>

  <div id="content" class="hidden">
    <div class="hero-sekolah">
      <div class="hero-top">
        <div class="hero-logo-wrap" id="heroLogoWrap"></div>
        <div class="hero-info-wrap">
          <div class="hero-label">
            <span data-icon="home" class="icon-sm"></span>
            PROFIL SEKOLAH
          </div>
          <div class="hero-nama" id="heroNama">—</div>
          <div class="hero-npsn" id="heroNpsn">NPSN —</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="n" id="hPrestasi">—</div><div class="l">Prestasi</div></div>
        <div class="hero-stat"><div class="n" id="hPembiasaan">—</div><div class="l">Pembiasaan</div></div>
        <div class="hero-stat"><div class="n" id="hKegiatan">—</div><div class="l">Kegiatan</div></div>
        <div class="hero-stat"><div class="n" id="hGuru">—</div><div class="l">Guru</div></div>
      </div>
    </div>

    <div class="stat-poin">
      <div class="l">Total Poin Sekolah</div>
      <div class="n" id="heroPoin">—</div>
      <div class="sub" id="heroPoinSub">Prestasi + Pembiasaan + Kegiatan</div>
    </div>

    <div class="tab-row">
      <button class="tab-p active" data-tab="prestasi">
        <span data-icon="award" class="icon-sm"></span> Prestasi
      </button>
      <button class="tab-p" data-tab="kegiatan">
        <span data-icon="calendar" class="icon-sm"></span> Kegiatan
      </button>
      <button class="tab-p" data-tab="pembiasaan">
        <span data-icon="sparkles" class="icon-sm"></span> Pembiasaan
      </button>
    </div>

    <div id="listItem"></div>
  </div>

</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let semuaSekolah = [];
let sekolahAktif = null;
let tabAktif = 'prestasi';
let cacheItems = {};

(async () => {
  // Load daftar sekolah
  const res = await Api.callSekolahPublik('ping'); // Pastikan function hidup

  const resS = await Api.call('sekolah.list');
  if (resS.ok && resS.data) {
    semuaSekolah = resS.data;
    const sel = document.getElementById('pilihSekolah');
    sel.innerHTML = '<option value="">— Pilih Sekolah —</option>' +
      semuaSekolah.map(s => `<option value="${s.id}">${UI.escapeHtml(s.nama)}</option>`).join('');
  }

  document.getElementById('loading').classList.add('hidden');

  // Cek query string
  const params = new URLSearchParams(window.location.search);
  const sid = Number(params.get('id'));

  if (sid && semuaSekolah.find(s => s.id === sid)) {
    document.getElementById('pilihSekolah').value = sid;
    await pilihSekolah(sid);
  } else if (semuaSekolah.length > 0) {
    // Pilih otomatis sekolah pertama
    const first = semuaSekolah[0];
    document.getElementById('pilihSekolah').value = first.id;
    await pilihSekolah(first.id);
  }

  // Event
  document.getElementById('pilihSekolah').addEventListener('change', (e) => {
    const id = Number(e.target.value);
    if (id) pilihSekolah(id);
    else document.getElementById('content').classList.add('hidden');
  });

  document.querySelectorAll('.tab-p').forEach(t => {
    t.addEventListener('click', () => {
      tabAktif = t.dataset.tab;
      document.querySelectorAll('.tab-p').forEach(x => x.classList.toggle('active', x === t));
      renderTab();
    });
  });
})();

async function pilihSekolah(id) {
  sekolahAktif = semuaSekolah.find(s => s.id === id);
  if (!sekolahAktif) return;

  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('content').classList.add('hidden');

  // Load profil
  const res = await Api.callSekolahPublik('sekolah.profil', { sekolah_id: id });

  document.getElementById('loading').classList.add('hidden');

  if (!res.ok || !res.data) {
    document.getElementById('content').innerHTML = UI.errorHtml(res.error || 'Gagal memuat.');
    return;
  }

  const d = res.data;
  const r = d.ringkasan;

  document.getElementById('heroNama').textContent = d.sekolah.nama;
  document.getElementById('heroNpsn').textContent = 'NPSN ' + (d.sekolah.npsn || '-') +
    (d.sekolah.kecamatan ? ' · ' + d.sekolah.kecamatan : '');

  // Render logo hero
  renderLogoHero(d.sekolah);
  document.getElementById('hPrestasi').textContent = r.jumlah_prestasi;
  document.getElementById('hPembiasaan').textContent = r.jumlah_pembiasaan;
  document.getElementById('hKegiatan').textContent = r.jumlah_kegiatan;
  document.getElementById('hGuru').textContent = r.jumlah_guru;
  document.getElementById('heroPoin').textContent = r.total_poin;
  document.getElementById('heroPoinSub').textContent =
    `Prestasi ${r.poin_prestasi} · Pembiasaan ${r.poin_pembiasaan} · Kegiatan ${r.poin_kegiatan}`;

  document.getElementById('content').classList.remove('hidden');

  // Reset cache saat ganti sekolah
  cacheItems = {};
  await renderTab();
}

// ============================================================
// RENDER LOGO HERO
// ============================================================
function renderLogoHero(sekolah) {
  const wrap = document.getElementById('heroLogoWrap');
  if (!wrap) return;

  const url = Api.logoUrl(sekolah.id, sekolah.logo_updated_at);
  const init = Api.inisialSekolah(sekolah.nama);

  wrap.innerHTML = `
    ${url
      ? `<img src="${url}" alt="${UI.escapeHtml(sekolah.nama)}"
           onerror="this.remove(); this.parentElement.querySelector('.fallback').style.display='flex';" />`
      : ''}
    <div class="fallback" style="${url ? 'display:none;' : ''}">${init}</div>
  `;
}

  if (!sekolahAktif) return;

  const el = document.getElementById('listItem');

  // Cek cache
  const cacheKey = `${tabAktif}_${sekolahAktif.id}`;
  if (cacheItems[cacheKey]) {
    renderList(cacheItems[cacheKey]);
    return;
  }

  el.innerHTML = '<div class="skeleton" style="height:120px;border-radius:16px;"></div>';

  const res = await Api.callSekolahPublik('sekolah.galeri', {
    jenis: tabAktif,
    sekolah_id: sekolahAktif.id,
    limit: 100,
  });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error);
    return;
  }

  const data = res.data.data || [];
  cacheItems[cacheKey] = data;
  renderList(data);
}

function renderList(list) {
  const el = document.getElementById('listItem');

  if (list.length === 0) {
    const label = { prestasi: 'prestasi', pembiasaan: 'pembiasaan', kegiatan: 'kegiatan' }[tabAktif] || 'data';
    el.innerHTML = UI.emptyHtml('inbox', 'Belum ada ' + label, 'Data akan muncul setelah diverifikasi panitia.');
    return;
  }

  el.innerHTML = list.map(it => renderItem(it)).join('');
}

function renderItem(it) {
  const jenis = it._jenis;

  let judul = '';
  let sub = '';
  let extra = '';

  if (jenis === 'prestasi') {
    judul = it.nama_lomba;
    const tingkatLabel = {
      sekolah: 'Sekolah', kecamatan: 'Kecamatan', kabupaten: 'Kabupaten',
      provinsi: 'Provinsi', nasional: 'Nasional', internasional: 'Internasional',
    }[it.tingkat] || it.tingkat;
    const peringkatLabel = {
      juara_1: 'Juara 1', juara_2: 'Juara 2', juara_3: 'Juara 3', harapan: 'Harapan',
    }[it.peringkat] || it.peringkat;
    sub = `${it.nama_siswa}${it.kelas ? ' (' + it.kelas + ')' : ''} · ${UI.formatTanggalPendek(it.tanggal)}`;
    extra = `
      <div style="margin-top:6px;">
        <span class="badge-tingkat ${it.tingkat}">${tingkatLabel}</span>
        <span class="badge-tingkat" style="background:var(--maroon);color:white;">${peringkatLabel}</span>
      </div>
    `;
  } else if (jenis === 'kegiatan') {
    judul = it.nama;
    const skalaLabel = {
      internal: 'Internal', orang_tua: 'Orang Tua',
      komunitas: 'Komunitas', kecamatan: 'Kecamatan', kabupaten_plus: 'Kabupaten+',
    }[it.skala] || it.skala;
    sub = `${UI.formatTanggalPendek(it.tanggal)}${it.tempat ? ' · ' + it.tempat : ''}`;
    extra = `<div style="margin-top:6px;"><span class="badge-tingkat kecamatan">${skalaLabel}</span></div>`;
  } else if (jenis === 'pembiasaan') {
    judul = it.nama;
    sub = `${it.frekuensi || '-'}${it.bulan ? ' · Bulan ' + it.bulan : ''} ${it.tahun}`;
    extra = it.deskripsi ? `<div style="margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.5;">${UI.escapeHtml(it.deskripsi)}</div>` : '';
  }

  const buktiHtml = it.bukti_url
    ? `<a href="${UI.escapeHtml(it.bukti_url)}" target="_blank" rel="noopener" class="link-bukti">
         ${Icons.get('externalLink', { class: 'icon-sm' })} Lihat Bukti
       </a>`
    : '';

  return `
    <div class="item-publik">
      <div class="item-head">
        <div class="item-icon ${jenis}">${Icons.get(jenis === 'prestasi' ? 'award' : jenis === 'kegiatan' ? 'calendar' : 'sparkles', { class: 'icon-sm' })}</div>
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(judul)}</div>
          <div class="item-sub">${UI.escapeHtml(sub)}</div>
          ${extra}
        </div>
      </div>
      ${buktiHtml}
    </div>
  `;
}
</script>

</body>
</html>
