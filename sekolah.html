<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<meta name="robots" content="noindex, nofollow" />
<title>Profil Sekolah — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* PUBLIC HEADER */
  .public-header {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 100%);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(97,19,41,.15);
  }
  .public-header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: white;
  }
  .public-header-logo {
    width: 40px; height: 40px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--gold);
    flex-shrink: 0;
    overflow: hidden;
  }
  .public-header-logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.25);
  }
  .public-header-btn {
    color: white;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.12);
    padding: 8px 14px;
    border-radius: 10px;
    transition: all .15s;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .public-header-btn:hover {
    background: rgba(255,255,255,.22);
    color: white;
    text-decoration: none;
  }

  /* HERO SEKOLAH */
  .hero-sekolah {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 24px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.28);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-sekolah::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-sekolah::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .hero-logo-wrap {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    background: white;
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 12px 28px rgba(0,0,0,.25),
      0 0 0 6px rgba(201,169,97,.12);
  }
  .hero-logo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hero-logo-wrap .fallback {
    font-size: 30px;
    font-weight: 800;
    color: var(--maroon);
    letter-spacing: 1.5px;
  }
  .hero-info-wrap { flex: 1; min-width: 0; }
  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.5);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .hero-nama {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 5px;
    line-height: 1.25;
    letter-spacing: 0.2px;
  }
  .hero-npsn {
    font-size: 12.5px;
    opacity: 0.85;
    font-weight: 600;
  }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
    z-index: 1;
  }
  .hero-stat { text-align: center; }
  .hero-stat .n {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .hero-stat .l {
    font-size: 9px;
    opacity: 0.8;
    font-weight: 700;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  /* KARTU TOTAL KONTRIBUSI (tanpa poin) */
  .kontribusi-card {
    background: linear-gradient(135deg, #FFFFFF 0%, #FBF4E0 100%);
    border: 1.5px solid var(--gold);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: fade-in-up .5s var(--ease-out) .05s both;
    box-shadow: 0 6px 20px rgba(201,169,97,.15);
  }
  .kontribusi-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
  }
  .kontribusi-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 800;
    color: var(--gold-dark);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    position: relative;
  }
  .kontribusi-value {
    font-size: 38px;
    font-weight: 800;
    line-height: 1;
    color: var(--maroon);
    letter-spacing: -1px;
    position: relative;
    margin-bottom: 4px;
  }
  .kontribusi-sub {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 600;
    position: relative;
    line-height: 1.5;
  }
  .kontribusi-sub strong {
    color: var(--maroon);
    font-weight: 800;
  }

  /* TOMBOL SHARE */
  .share-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    animation: fade-in-up .5s var(--ease-out) .08s both;
  }
  .share-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 12px;
    border-radius: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--ink);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .share-btn:hover {
    border-color: var(--maroon);
    color: var(--maroon);
    transform: translateY(-2px);
    text-decoration: none;
  }
  .share-btn.primary {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    border-color: var(--maroon);
  }
  .share-btn.primary:hover {
    color: white;
    box-shadow: 0 8px 20px rgba(125,29,58,.3);
  }
  .share-btn svg { width: 14px; height: 14px; }

  /* TAB */
  .tab-row {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 14px;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    animation: fade-in-up .5s var(--ease-out) .1s both;
  }
  .tab-row::-webkit-scrollbar { display: none; }
  .tab-p {
    flex: 1;
    min-width: 90px;
    padding: 11px 8px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: all .15s;
    font-family: inherit;
  }
  .tab-p.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: 0 2px 8px rgba(125,29,58,.08);
  }

  /* ITEM DENGAN THUMBNAIL */
  .item-publik {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    position: relative;
    overflow: hidden;
  }
  .item-publik:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 8px 20px rgba(125,29,58,.08);
    transform: translateY(-2px);
  }

  .item-publik.prestasi::after,
  .item-publik.kegiatan::after,
  .item-publik.pembiasaan::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.5;
  }
  .item-publik.prestasi::after {
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
  }
  .item-publik.kegiatan::after {
    background: radial-gradient(circle, rgba(30,64,175,.12) 0%, transparent 70%);
  }
  .item-publik.pembiasaan::after {
    background: radial-gradient(circle, rgba(21,128,61,.12) 0%, transparent 70%);
  }

  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }

  /* THUMBNAIL */
  .item-thumb {
    width: 88px;
    height: 88px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--bg);
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s var(--ease-out);
  }
  .item-thumb:hover { transform: scale(1.02); }
  .item-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .item-thumb .fallback-icon {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .item-thumb .fallback-icon svg {
    width: 28px; height: 28px;
  }
  .item-thumb.prestasi .fallback-icon {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
  }
  .item-thumb.pembiasaan .fallback-icon {
    background: linear-gradient(135deg, #22C55E 0%, #15803D 100%);
  }
  .item-thumb.kegiatan .fallback-icon {
    background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
  }
  .item-thumb .play-badge {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .item-thumb .play-badge svg { width: 12px; height: 12px; }

  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 3px;
    line-height: 1.4;
    color: var(--ink);
  }
  .item-sub {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }

  .item-extra {
    margin-top: 8px;
    position: relative;
    z-index: 1;
  }
  .badge-tingkat {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-right: 5px;
    margin-bottom: 4px;
  }
  .badge-tingkat.sekolah { background: #E5E7EB; color: #4B5563; }
  .badge-tingkat.kecamatan { background: #DBEAFE; color: #1E40AF; }
  .badge-tingkat.kabupaten { background: #FEF3C7; color: #B45309; }
  .badge-tingkat.provinsi { background: #FBF3D0; color: #A37E2E; }
  .badge-tingkat.nasional { background: var(--maroon-soft); color: var(--maroon); }
  .badge-tingkat.internasional {
    background: linear-gradient(135deg, var(--gold) 0%, var(--maroon) 100%);
    color: white;
  }
  .badge-peringkat {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: inline-block;
  }

  .link-bukti {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--maroon);
    text-decoration: none;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--maroon-soft);
    background: transparent;
    transition: all .15s;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  .link-bukti:hover {
    background: var(--maroon-soft);
    text-decoration: none;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
  }
  .empty-state .big-icon {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    position: relative;
  }
  .empty-state .big-icon svg { width: 40px; height: 40px; }
  .empty-state .title {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-state .desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    max-width: 320px;
    margin: 0 auto;
  }

  /* LIGHTBOX */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fade-in .2s both;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<header class="public-header">
  <a href="beranda.html" class="public-header-brand">
    <div class="public-header-logo">
      <img src="assets/img/logo-mark.svg" alt="Nakula" />
    </div>
    <div>
      <div style="font-weight:800;font-size:14px;letter-spacing:.5px;">NAKULAKU</div>
      <div style="font-size:10px;opacity:.8;">KKG Gugus Nakula</div>
    </div>
  </a>
  <a href="galeri.html" class="public-header-btn">
    <span data-icon="grid" class="icon-sm"></span>
    Galeri
  </a>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;padding-bottom:40px;">

  <div id="loading">
    <div class="skeleton" style="height:220px;border-radius:24px;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:140px;border-radius:20px;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:60px;border-radius:14px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:120px;border-radius:16px;"></div>
  </div>

  <div id="content" class="hidden">

    <!-- HERO -->
    <div class="hero-sekolah">
      <div class="hero-top">
        <div class="hero-logo-wrap" id="heroLogoWrap"></div>
        <div class="hero-info-wrap">
          <div class="hero-label">
            <span data-icon="home" class="icon-sm"></span>
            PROFIL SEKOLAH
          </div>
          <div class="hero-nama" id="heroNama">—</div>
          <div class="hero-npsn" id="heroNpsn">NPSN —</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="n" id="hPrestasi">—</div>
          <div class="l">Prestasi</div>
        </div>
        <div class="hero-stat">
          <div class="n" id="hPembiasaan">—</div>
          <div class="l">Pembiasaan</div>
        </div>
        <div class="hero-stat">
          <div class="n" id="hKegiatan">—</div>
          <div class="l">Kegiatan</div>
        </div>
        <div class="hero-stat">
          <div class="n" id="hGuru">—</div>
          <div class="l">Guru</div>
        </div>
      </div>
    </div>

    <!-- KARTU TOTAL KONTRIBUSI (tanpa poin) -->
    <div class="kontribusi-card">
      <div class="kontribusi-head">
        <span data-icon="sparkles" class="icon-sm"></span>
        Total Kontribusi Sekolah
      </div>
      <div class="kontribusi-value" id="heroTotal">—</div>
      <div class="kontribusi-sub" id="heroTotalSub">
        Prestasi · Pembiasaan · Kegiatan
      </div>
    </div>

    <!-- TOMBOL SHARE -->
    <div class="share-row">
      <button class="share-btn primary" id="btnShareWA">
        <span data-icon="send"></span>
        Share
      </button>
      <button class="share-btn" id="btnCopyLink">
        <span data-icon="link"></span>
        Salin Link
      </button>
    </div>

    <!-- TABS -->
    <div class="tab-row">
      <button class="tab-p active" data-tab="prestasi">
        <span data-icon="award" class="icon-sm"></span> Prestasi
      </button>
      <button class="tab-p" data-tab="kegiatan">
        <span data-icon="calendar" class="icon-sm"></span> Kegiatan
      </button>
      <button class="tab-p" data-tab="pembiasaan">
        <span data-icon="sparkles" class="icon-sm"></span> Pembiasaan
      </button>
    </div>

    <div id="listItem"></div>
  </div>

</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let sekolahAktif = null;
let tabAktif = 'prestasi';
let cacheItems = {};

(async () => {
  await Api.callSekolahPublik('ping');

  const params = new URLSearchParams(window.location.search);
  const sid = Number(params.get('id'));

  if (!sid) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('content').innerHTML = UI.errorHtml(
      'Link tidak lengkap. Minta link profil ke pengurus sekolah Anda.',
      '<a href="galeri.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Lihat Galeri Sekolah</a>'
    );
    document.getElementById('content').classList.remove('hidden');
    return;
  }

  await pilihSekolah(sid);

  document.querySelectorAll('.tab-p').forEach(t => {
    t.addEventListener('click', () => {
      tabAktif = t.dataset.tab;
      document.querySelectorAll('.tab-p').forEach(x => x.classList.toggle('active', x === t));
      renderTab();
    });
  });

  // Share WA
  document.getElementById('btnShareWA').addEventListener('click', () => {
    if (!sekolahAktif) return;
    const url = window.location.href;
    const text = `Profil Digital ${sekolahAktif.nama} — KKG Gugus Nakula\n${url}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  });

  // Copy Link
  document.getElementById('btnCopyLink').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      UI.sukses('Link disalin ke clipboard');
    } catch {
      UI.gagal('Gagal menyalin. Coba salin manual.');
    }
  });
})();

async function pilihSekolah(id) {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('content').classList.add('hidden');

  const res = await Api.callSekolahPublik('sekolah.profil', { sekolah_id: id });

  document.getElementById('loading').classList.add('hidden');

  if (!res.ok || !res.data) {
    document.getElementById('content').innerHTML = UI.errorHtml(
      res.error || 'Sekolah tidak ditemukan.',
      '<a href="galeri.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Lihat Galeri</a>'
    );
    document.getElementById('content').classList.remove('hidden');
    return;
  }

  const d = res.data;
  const r = d.ringkasan;

  sekolahAktif = d.sekolah;

  document.getElementById('heroNama').textContent = d.sekolah.nama;
  document.getElementById('heroNpsn').textContent = 'NPSN ' + (d.sekolah.npsn || '-') +
    (d.sekolah.kecamatan ? ' · ' + d.sekolah.kecamatan : '');
  document.getElementById('hPrestasi').textContent = r.jumlah_prestasi;
  document.getElementById('hPembiasaan').textContent = r.jumlah_pembiasaan;
  document.getElementById('hKegiatan').textContent = r.jumlah_kegiatan;
  document.getElementById('hGuru').textContent = r.jumlah_guru;

  // Total kontribusi (bukan poin) — rahasia poin hanya admin
  const totalItem = r.jumlah_prestasi + r.jumlah_pembiasaan + r.jumlah_kegiatan;
  document.getElementById('heroTotal').textContent = totalItem;
  document.getElementById('heroTotalSub').innerHTML =
    `<strong>${r.jumlah_prestasi}</strong> prestasi · <strong>${r.jumlah_pembiasaan}</strong> pembiasaan · <strong>${r.jumlah_kegiatan}</strong> kegiatan`;

  // Title dinamis
  document.title = d.sekolah.nama + ' — NAKULAKU';

  renderLogoHero(d.sekolah);

  document.getElementById('content').classList.remove('hidden');

  cacheItems = {};
  await renderTab();
}

function renderLogoHero(sekolah) {
  const wrap = document.getElementById('heroLogoWrap');
  if (!wrap) return;

  const url = Api.logoUrl(sekolah.id, sekolah.logo_updated_at);
  const init = Api.inisialSekolah(sekolah.nama);

  wrap.innerHTML = `
    ${url
      ? `<img src="${url}" alt="${UI.escapeHtml(sekolah.nama)}"
           onerror="this.remove(); this.parentElement.querySelector('.fallback').style.display='flex';" />`
      : ''}
    <div class="fallback" style="${url ? 'display:none;' : ''}">${init}</div>
  `;
}

async function renderTab() {
  if (!sekolahAktif) return;

  const el = document.getElementById('listItem');
  const cacheKey = `${tabAktif}_${sekolahAktif.id}`;

  if (cacheItems[cacheKey]) {
    renderList(cacheItems[cacheKey]);
    return;
  }

  el.innerHTML = `
    <div class="skeleton" style="height:120px;border-radius:16px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:120px;border-radius:16px;"></div>
  `;

  const res = await Api.callSekolahPublik('sekolah.galeri', {
    jenis: tabAktif,
    sekolah_id: sekolahAktif.id,
    limit: 100,
  });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error);
    return;
  }

  const data = res.data.data || [];
  cacheItems[cacheKey] = data;
  renderList(data);
}

function renderList(list) {
  const el = document.getElementById('listItem');

  if (list.length === 0) {
    const label = { prestasi: 'prestasi', pembiasaan: 'pembiasaan', kegiatan: 'kegiatan' }[tabAktif] || 'data';
    el.innerHTML = `
      <div class="empty-state">
        <div class="big-icon">${Icons.get('inbox', { class: 'icon-xl' })}</div>
        <div class="title">Belum Ada ${label.charAt(0).toUpperCase() + label.slice(1)}</div>
        <div class="desc">Data akan muncul setelah panitia verifikasi.</div>
      </div>
    `;
    return;
  }

  el.innerHTML = list.map((it, idx) => renderItem(it, idx)).join('');

  // Bind lightbox thumbnail
  el.querySelectorAll('[data-thumb]').forEach(thumb => {
    thumb.addEventListener('click', () => {
      const url = thumb.dataset.fullurl;
      if (url) showLightbox(url);
    });
  });
}

function renderItem(it, idx) {
  const jenis = it._jenis;

  let judul = '';
  let sub = '';
  let extra = '';

  if (jenis === 'prestasi') {
    judul = it.nama_lomba;
    const tingkatLabel = {
      sekolah: 'Sekolah', kecamatan: 'Kecamatan', kabupaten: 'Kabupaten',
      provinsi: 'Provinsi', nasional: 'Nasional', internasional: 'Internasional',
    }[it.tingkat] || it.tingkat;
    const peringkatLabel = {
      juara_1: 'Juara 1', juara_2: 'Juara 2', juara_3: 'Juara 3', harapan: 'Harapan',
    }[it.peringkat] || it.peringkat;
    sub = `${it.nama_siswa}${it.kelas ? ' (' + it.kelas + ')' : ''} · ${UI.formatTanggalPendek(it.tanggal)}`;
    extra = `
      <div class="item-extra">
        <span class="badge-tingkat ${it.tingkat}">${tingkatLabel}</span>
        <span class="badge-peringkat">${peringkatLabel}</span>
      </div>
    `;
  } else if (jenis === 'kegiatan') {
    judul = it.nama;
    const skalaLabel = {
      internal: 'Internal', orang_tua: 'Orang Tua',
      komunitas: 'Komunitas', kecamatan: 'Kecamatan', kabupaten_plus: 'Kabupaten+',
    }[it.skala] || it.skala;
    sub = `${UI.formatTanggalPendek(it.tanggal)}${it.tempat ? ' · ' + it.tempat : ''}`;
    extra = `<div class="item-extra"><span class="badge-tingkat kecamatan">${skalaLabel}</span></div>`;
  } else if (jenis === 'pembiasaan') {
    judul = it.nama;
    sub = `${it.frekuensi || '-'}${it.bulan ? ' · Bulan ' + it.bulan : ''} ${it.tahun}`;
    extra = it.deskripsi
      ? `<div class="item-extra" style="font-size:12.5px;color:var(--muted);line-height:1.5;">${UI.escapeHtml(it.deskripsi)}</div>`
      : '';
  }

  // Thumbnail dari bukti_url
  const thumbUrl = UI.thumbnail(it.bukti_url);
  const iconName = jenis === 'prestasi' ? 'award' : jenis === 'kegiatan' ? 'calendar' : 'sparkles';
  const isYT = it.bukti_url && /youtube\.com|youtu\.be/.test(it.bukti_url);

  const thumbHtml = `
    <div class="item-thumb ${jenis}"
         ${thumbUrl ? `data-thumb data-fullurl="${UI.escapeHtml(it.bukti_url)}"` : ''}>
      ${thumbUrl
        ? `<img src="${thumbUrl}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
           <div class="fallback-icon" style="display:none;">${Icons.get(iconName)}</div>
           ${isYT ? `<div class="play-badge">${Icons.get('play')}</div>` : ''}`
        : `<div class="fallback-icon">${Icons.get(iconName)}</div>`}
    </div>
  `;

  const buktiHtml = it.bukti_url
    ? `<a href="${UI.escapeHtml(it.bukti_url)}" target="_blank" rel="noopener" class="link-bukti">
         ${Icons.get('externalLink', { class: 'icon-sm' })} Lihat Bukti
       </a>`
    : '';

  return `
    <div class="item-publik ${jenis}" style="animation-delay:${idx * 0.04}s">
      <div class="item-head">
        ${thumbHtml}
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(judul)}</div>
          <div class="item-sub">${UI.escapeHtml(sub)}</div>
          ${extra}
        </div>
      </div>
      ${buktiHtml}
    </div>
  `;
}

function showLightbox(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${UI.escapeHtml(url)}" alt="">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}
</script>

</body>
