<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#611329" />
<title>Detail Pertemuan — NAKULAKU Admin</title>

<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/nakula.css" />

<style>
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: var(--r-md);
    margin: 20px 0 16px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    border-radius: var(--r-sm);
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: var(--sh-sm);
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .hero-card {
    background: linear-gradient(135deg, var(--maroon-dark), var(--maroon));
    color: white;
    border-radius: var(--r-xl);
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(125,29,58,.25);
    margin-bottom: 16px;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.08;
  }
  .hero-num {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.4);
    border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    margin-bottom: 10px;
  }
  .hero-title {
    font-size: 18px; font-weight: 800; line-height: 1.3;
    margin-bottom: 10px;
  }
  .hero-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; opacity: .9; margin-bottom: 4px;
  }

  .mini-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px;
    margin-bottom: 10px;
  }
  .mini-item-head {
    display: flex; align-items: start; gap: 10px; margin-bottom: 10px;
  }
  .mini-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mini-body { flex: 1; min-width: 0; }
  .mini-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
  .mini-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; white-space: pre-line; }
  .mini-meta {
    font-size: 11px; color: var(--muted); font-weight: 600;
    margin-top: 4px;
    display: flex; align-items: center; gap: 4px;
  }
  .mini-actions {
    display: flex; gap: 6px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="pertemuan.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Detail Pertemuan</div>
      <div class="app-header-sub">Admin NAKULAKU</div>
    </div>
  </div>
</header>

<main class="container page" style="max-width:820px;padding-top:16px;">

  <div id="loading">
    <div class="skeleton" style="height:160px;border-radius:24px;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:200px;border-radius:16px;"></div>
  </div>

  <div id="content" class="hidden">
    <div class="hero-card" id="hero"></div>

    <div class="tabs">
      <button class="tab active" data-tab="materi"><span data-icon="book"></span> Materi</button>
      <button class="tab" data-tab="tugas"><span data-icon="clipboard"></span> Tugas</button>
      <button class="tab" data-tab="pengamat"><span data-icon="users"></span> Pengamat</button>
    </div>

    <div class="panel active" data-panel="materi">
      <button class="btn btn-primary btn-full" id="btnTambahMateri" style="margin-bottom:12px;">
        <span data-icon="plus"></span> Tambah Materi
      </button>
      <div id="listMateri"></div>
    </div>

    <div class="panel" data-panel="tugas">
      <button class="btn btn-primary btn-full" id="btnTambahTugas" style="margin-bottom:12px;">
        <span data-icon="plus"></span> Tambah Tugas
      </button>
      <div id="listTugas"></div>
    </div>

    <div class="panel" data-panel="pengamat">
      <div class="card" style="margin-bottom:12px;font-size:12.5px;color:var(--muted);line-height:1.5;">
        Pengamat adalah guru yang ditunjuk untuk mengamati jalannya pertemuan. Mereka akan mencatat keaktifan peserta dan kekompakan sekolah, yang nanti dipakai untuk penilaian NAKULAKU AWARD.
      </div>
      <button class="btn btn-primary btn-full" id="btnTunjukPengamat" style="margin-bottom:12px;">
        <span data-icon="users"></span> Tunjuk Pengamat
      </button>
      <div id="listPengamat"></div>
    </div>
  </div>

</main>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

const params = new URLSearchParams(window.location.search);
const pertemuanId = Number(params.get('id'));

let data = { pertemuan: null, materi: [], tugas: [] };

(async () => {
  const profile = await Api.requireLogin();
  if (!profile) return;

  if (!profile.peran.includes('pengurus') && !profile.peran.includes('super_admin')) {
    document.querySelector('main').innerHTML = UI.errorHtml('Halaman ini hanya untuk pengurus.');
    return;
  }

  if (!pertemuanId) { UI.gagal('Pertemuan tidak ditentukan.'); return; }

  await load();

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const nama = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === nama));
    });
  });

  document.getElementById('btnTambahMateri').addEventListener('click', () => formMateri(null));
  document.getElementById('btnTambahTugas').addEventListener('click', () => formTugas(null));
})();

async function load() {
  const res = await Api.call('admin.pertemuan.detail', { pertemuan_id: pertemuanId });
  document.getElementById('loading').classList.add('hidden');

  if (!res.ok || !res.data) {
    UI.gagal(res.error || 'Gagal memuat.');
    return;
  }

  data = res.data;
  document.getElementById('content').classList.remove('hidden');
  render();
}

function render() {
  const p = data.pertemuan;
  document.title = p.judul + ' — Admin NAKULAKU';

  document.getElementById('hero').innerHTML = `
    <div class="hero-num">
      ${Icons.get('calendar', { class: 'icon-sm' })}
      PERTEMUAN #${p.urutan} · ${p.status.toUpperCase()}
    </div>
    <div class="hero-title">${UI.escapeHtml(p.judul)}</div>
    <div class="hero-meta">
      ${Icons.get('calendar', { class: 'icon-sm' })}
      ${UI.formatTanggal(p.tanggal)}${p.jam_mulai ? ' · ' + UI.formatJam(p.jam_mulai) : ''}
    </div>
    ${p.lokasi_nama ? `
      <div class="hero-meta">
        ${Icons.get('mapPin', { class: 'icon-sm' })}
        ${UI.escapeHtml(p.lokasi_nama)}
      </div>` : ''}
    <div class="hero-meta">
      ${Icons.get('users', { class: 'icon-sm' })}
      ${data.jumlah_presensi} presensi tercatat
    </div>
  `;

  renderMateri();
  renderTugas();
  loadPengamat();
}

function renderMateri() {
  const el = document.getElementById('listMateri');
  if (!data.materi || data.materi.length === 0) {
    el.innerHTML = UI.emptyHtml('book', 'Belum ada materi');
    return;
  }
  el.innerHTML = data.materi.map(m => `
    <div class="mini-item">
      <div class="mini-item-head">
        <div class="mini-icon">${Icons.get('book', { class: 'icon-sm' })}</div>
        <div class="mini-body">
          <div class="mini-title">${UI.escapeHtml(m.judul)}</div>
          ${m.deskripsi ? `<div class="mini-desc">${UI.escapeHtml(m.deskripsi)}</div>` : ''}
          ${m.link_url ? `<div class="mini-meta">${Icons.get('link', { class: 'icon-sm' })} ${UI.escapeHtml(m.link_url)}</div>` : ''}
        </div>
      </div>
      <div class="mini-actions">
        <button class="btn btn-ghost btn-sm" data-edit="${m.id}" style="flex:1;">${Icons.get('edit', { class: 'icon-sm' })} Edit</button>
        <button class="btn btn-ghost btn-sm" data-del="${m.id}" style="flex:1;color:var(--danger);">${Icons.get('trash', { class: 'icon-sm' })} Hapus</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('[data-edit]').forEach(b => {
    const id = Number(b.dataset.edit);
    b.addEventListener('click', () => formMateri(data.materi.find(x => x.id === id)));
  });
  el.querySelectorAll('[data-del]').forEach(b => {
    const id = Number(b.dataset.del);
    b.addEventListener('click', () => hapusMateri(id));
  });
}

function renderTugas() {
  const el = document.getElementById('listTugas');
  if (!data.tugas || data.tugas.length === 0) {
    el.innerHTML = UI.emptyHtml('clipboard', 'Belum ada tugas');
    return;
  }
  el.innerHTML = data.tugas.map(t => `
    <div class="mini-item">
      <div class="mini-item-head">
        <div class="mini-icon">${Icons.get('clipboard', { class: 'icon-sm' })}</div>
        <div class="mini-body">
          <div class="mini-title">${UI.escapeHtml(t.judul)}</div>
          ${t.deskripsi ? `<div class="mini-desc">${UI.escapeHtml(t.deskripsi)}</div>` : ''}
          ${t.deadline ? `<div class="mini-meta">${Icons.get('clock', { class: 'icon-sm' })} Deadline: ${UI.formatTanggalJam(t.deadline)}</div>` : ''}
          <div class="mini-meta">
            ${t.aktif ? '<span class="badge badge-success">Aktif</span>' : '<span class="badge badge-danger">Non-aktif</span>'}
          </div>
        </div>
      </div>
      <div class="mini-actions">
        <button class="btn btn-ghost btn-sm" data-edit="${t.id}" style="flex:1;">${Icons.get('edit', { class: 'icon-sm' })} Edit</button>
        <button class="btn btn-ghost btn-sm" data-del="${t.id}" style="flex:1;color:var(--danger);">${Icons.get('trash', { class: 'icon-sm' })} Hapus</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('[data-edit]').forEach(b => {
    const id = Number(b.dataset.edit);
    b.addEventListener('click', () => formTugas(data.tugas.find(x => x.id === id)));
  });
  el.querySelectorAll('[data-del]').forEach(b => {
    const id = Number(b.dataset.del);
    b.addEventListener('click', () => hapusTugas(id));
  });
}

// ============================================================
// FORM MATERI
// ============================================================
function formMateri(materi) {
  const isEdit = !!materi;
  const m = materi || {};

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div style="background:white;border-radius:20px;padding:24px;max-width:480px;width:100%;box-shadow:var(--sh-xl);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">${isEdit ? 'Edit' : 'Tambah'} Materi</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="field">
          <label class="label">Judul *</label>
          <input type="text" id="mJudul" class="input" value="${UI.escapeHtml(m.judul || '')}" />
        </div>
        <div class="field">
          <label class="label">Deskripsi</label>
          <textarea id="mDeskripsi" class="input" rows="3" style="resize:vertical;">${UI.escapeHtml(m.deskripsi || '')}</textarea>
        </div>
        <div class="field">
          <label class="label">Link Materi (opsional)</label>
          <input type="url" id="mLink" class="input" value="${UI.escapeHtml(m.link_url || '')}" placeholder="https://drive.google.com/…" />
        </div>
        <div class="field">
          <label class="label">Urutan</label>
          <input type="number" id="mUrutan" class="input" value="${m.urutan || 1}" />
        </div>
      </div>

      <div id="alertBox" class="alert alert-error" style="margin-top:14px;"></div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="btn btn-secondary" id="btnBatal" style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpan" style="flex:2;">Simpan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.querySelector('#btnBatal').addEventListener('click', close);

  overlay.querySelector('#btnSimpan').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnSimpan');
    const alertBox = overlay.querySelector('#alertBox');
    alertBox.classList.remove('show');

    const payload = {
      id: m.id || null,
      pertemuan_id: pertemuanId,
      judul: overlay.querySelector('#mJudul').value.trim(),
      deskripsi: overlay.querySelector('#mDeskripsi').value.trim(),
      link_url: overlay.querySelector('#mLink').value.trim(),
      urutan: Number(overlay.querySelector('#mUrutan').value) || 1,
    };

    if (!payload.judul) { alertBox.textContent = 'Judul wajib.'; alertBox.classList.add('show'); return; }

    UI.btnLoading(btn, 'Menyimpan…');
    const res = await Api.call('admin.materi.simpan', { materi: payload });
    UI.btnReset(btn);

    if (!res.ok) { alertBox.textContent = res.error; alertBox.classList.add('show'); return; }

    UI.sukses('Tersimpan.');
    close();
    await load();
  });
}

async function hapusMateri(id) {
  const ok = await UI.konfirmasi('Hapus Materi', 'Hapus materi ini?', { danger: true, okText: 'Hapus' });
  if (!ok) return;
  const res = await Api.call('admin.materi.hapus', { materi_id: id });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses('Materi dihapus.');
  await load();
}

// ============================================================
// FORM TUGAS
// ============================================================
function formTugas(tugas) {
  const isEdit = !!tugas;
  const t = tugas || {};

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div style="background:white;border-radius:20px;padding:24px;max-width:480px;width:100%;box-shadow:var(--sh-xl);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">${isEdit ? 'Edit' : 'Tambah'} Tugas</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="field">
          <label class="label">Judul *</label>
          <input type="text" id="tJudul" class="input" value="${UI.escapeHtml(t.judul || '')}" />
        </div>
        <div class="field">
          <label class="label">Deskripsi / Instruksi</label>
          <textarea id="tDeskripsi" class="input" rows="4" style="resize:vertical;">${UI.escapeHtml(t.deskripsi || '')}</textarea>
        </div>
        <div class="field">
          <label class="label">Deadline (opsional)</label>
          <input type="datetime-local" id="tDeadline" class="input" value="${t.deadline ? t.deadline.slice(0, 16) : ''}" />
        </div>
        <div class="field">
          <label class="label">
            <input type="checkbox" id="tAktif" ${t.aktif !== false ? 'checked' : ''} />
            Tugas aktif
          </label>
        </div>
      </div>

      <div id="alertBox" class="alert alert-error" style="margin-top:14px;"></div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="btn btn-secondary" id="btnBatal" style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpan" style="flex:2;">Simpan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.querySelector('#btnBatal').addEventListener('click', close);

  overlay.querySelector('#btnSimpan').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnSimpan');
    const alertBox = overlay.querySelector('#alertBox');
    alertBox.classList.remove('show');

    const deadlineVal = overlay.querySelector('#tDeadline').value;
    const payload = {
      id: t.id || null,
      pertemuan_id: pertemuanId,
      judul: overlay.querySelector('#tJudul').value.trim(),
      deskripsi: overlay.querySelector('#tDeskripsi').value.trim(),
      deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null,
      aktif: overlay.querySelector('#tAktif').checked,
    };

    if (!payload.judul) { alertBox.textContent = 'Judul wajib.'; alertBox.classList.add('show'); return; }

    UI.btnLoading(btn, 'Menyimpan…');
    const res = await Api.call('admin.tugas.simpan', { tugas: payload });
    UI.btnReset(btn);

    if (!res.ok) { alertBox.textContent = res.error; alertBox.classList.add('show'); return; }

    UI.sukses('Tersimpan.');
    close();
    await load();
  });
}

async function hapusTugas(id) {
  const ok = await UI.konfirmasi('Hapus Tugas', 'Hapus tugas ini? Semua pengumpulan & komentar juga terhapus.', { danger: true, okText: 'Hapus' });
  if (!ok) return;
  const res = await Api.call('admin.tugas.hapus', { tugas_id: id });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses('Tugas dihapus.');
  await load();
}

// ============================================================
// PENGAMAT
// ============================================================
let daftarPengamatSaatIni = [];

async function loadPengamat() {
  const el = document.getElementById('listPengamat');
  el.innerHTML = '<div class="skeleton" style="height:72px;border-radius:16px;"></div>';

  const res = await Api.call('admin.pengamat.list', { pertemuan_id: pertemuanId });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat.');
    return;
  }

  daftarPengamatSaatIni = res.data || [];

  if (daftarPengamatSaatIni.length === 0) {
    el.innerHTML = UI.emptyHtml('users', 'Belum ada pengamat', 'Klik tombol di atas untuk menunjuk pengamat.');
    return;
  }

  el.innerHTML = daftarPengamatSaatIni.map(p => {
    const init = (p.user?.nama_lengkap || '?').charAt(0).toUpperCase();
    const fotoUrl = p.user?.foto_thumb_url || (p.user?.id ? Api.fotoUrl(p.user.id, 't') : null);
    return `
      <div class="mini-item">
        <div class="mini-item-head">
          <div class="mini-icon" style="overflow:hidden;position:relative;">
            <span>${init}</span>
            ${fotoUrl ? `<img src="${fotoUrl}" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : ''}
          </div>
          <div class="mini-body">
            <div class="mini-title">${UI.escapeHtml(p.user?.nama_lengkap || '-')}</div>
            <div class="mini-desc">${UI.escapeHtml(p.user?.sekolah?.nama || '-')}</div>
            <div class="mini-meta">${UI.escapeHtml(p.user?.jabatan || '-')}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('btnTunjukPengamat').addEventListener('click', formTunjukPengamat);

async function formTunjukPengamat() {
  // Ambil semua guru aktif
  const res = await Api.call('users.list', { limit: 500 });
  if (!res.ok) { UI.gagal(res.error); return; }

  const semuaGuru = res.data.hasil || [];
  const terpilih = new Set(daftarPengamatSaatIni.map(p => p.user_id));

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div style="background:white;border-radius:20px;padding:24px;max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--sh-xl);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">Tunjuk Pengamat</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <input type="text" id="cariGuru" class="input" placeholder="Cari nama guru…" style="margin-bottom:10px;" />

      <div id="daftarGuru" style="flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:6px;margin-bottom:14px;min-height:200px;">
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpanPengamat" style="flex:2;">Simpan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const daftarEl = overlay.querySelector('#daftarGuru');
  const cariEl = overlay.querySelector('#cariGuru');

  function renderGuru(filter = '') {
    const f = filter.toLowerCase();
    const list = semuaGuru.filter(g =>
      !f || (g.nama_lengkap || '').toLowerCase().includes(f) || (g.sekolah?.nama || '').toLowerCase().includes(f)
    );
    if (list.length === 0) {
      daftarEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">Tidak ada guru ditemukan.</div>';
      return;
    }
    daftarEl.innerHTML = list.map(g => {
      const checked = terpilih.has(g.id) ? 'checked' : '';
      return `
        <label style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;transition:background .15s;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">
          <input type="checkbox" data-uid="${g.id}" ${checked} style="width:18px;height:18px;accent-color:var(--maroon);" />
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:13px;">${UI.escapeHtml(g.nama_lengkap)}</div>
            <div style="font-size:11px;color:var(--muted);">${UI.escapeHtml(g.sekolah?.nama || '-')}</div>
          </div>
        </label>
      `;
    }).join('');

    daftarEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const uid = Number(e.target.dataset.uid);
        if (e.target.checked) terpilih.add(uid);
        else terpilih.delete(uid);
      });
    });
  }

  renderGuru();
  cariEl.addEventListener('input', () => renderGuru(cariEl.value));

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnSimpanPengamat').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnSimpanPengamat');
    UI.btnLoading(btn, 'Menyimpan…');

    const res = await Api.call('admin.pengamat.simpan', {
      pertemuan_id: pertemuanId,
      user_ids: Array.from(terpilih),
    });

    UI.btnReset(btn);

    if (!res.ok) { UI.gagal(res.error); return; }

    UI.sukses('Pengamat disimpan.');
    close();
    await loadPengamat();
  });
}

</script>

</body>
</html>
