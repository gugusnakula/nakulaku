<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#611329" />
<title>Data Guru — NAKULAKU Admin</title>

<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/nakula.css" />

<style>
  .admin-header {
    background: linear-gradient(135deg, var(--maroon-dark) 0%, var(--maroon) 100%);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .admin-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: rgba(255,255,255,.12);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    flex-shrink: 0;
  }
  .back-btn:hover { background: rgba(255,255,255,.2); }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-input input {
    padding-left: 40px;
  }
  .search-input .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-mini {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px;
    text-align: center;
  }
  .stat-mini .n {
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
    color: var(--maroon);
  }
  .stat-mini .l {
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 4px;
  }

  .guru-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .15s;
  }
  .guru-item:hover {
    border-color: var(--maroon);
    transform: translateY(-1px);
    box-shadow: var(--sh-md);
  }
  .guru-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .guru-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .guru-info { flex: 1; min-width: 0; }
  .guru-name {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .guru-meta {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .guru-status {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .3px;
    flex-shrink: 0;
  }
  .guru-status.aktif { background: var(--success-soft); color: var(--success); }
  .guru-status.nonaktif { background: var(--danger-soft); color: var(--danger); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,20,20,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-box {
    background: white;
    border-radius: 20px;
    padding: 24px;
    max-width: 520px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--sh-xl);
  }
</style>
</head>
<body>

<header class="admin-header">
  <div class="admin-header-left">
    <a href="../beranda.html" class="back-btn" aria-label="Kembali">
      <span data-icon="chevronLeft"></span>
    </a>
    <div>
      <div style="font-weight:800;font-size:15px;letter-spacing:.5px;">DATA GURU</div>
      <div style="font-size:10px;opacity:.75;font-weight:500;">KKG Gugus Nakula</div>
    </div>
  </div>
</header>

<main class="container page" style="max-width:900px;padding-top:16px;">

  <div class="stat-row">
    <div class="stat-mini">
      <div class="n" id="statTotal">—</div>
      <div class="l">Total Guru</div>
    </div>
    <div class="stat-mini">
      <div class="n" id="statSekolah">—</div>
      <div class="l">Sekolah</div>
    </div>
    <div class="stat-mini">
      <div class="n" id="statKS">—</div>
      <div class="l">Kepala Sekolah</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-input">
      <span data-icon="search"></span>
      <input
        type="text"
        id="inputCari"
        class="input"
        placeholder="Cari nama, email, atau NIP…"
      />
    </div>
  </div>

  <div id="infoHasil" style="font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600;">
    Memuat…
  </div>

  <div id="listGuru">
    <div class="skeleton" style="height:72px;border-radius:16px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:72px;border-radius:16px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:72px;border-radius:16px;margin-bottom:10px;"></div>
  </div>

</main>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
// ============================================================
// INIT
// ============================================================
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let profile;
let debounceTimer;

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  if (!profile.peran.includes('super_admin') && !profile.peran.includes('pengurus') && !profile.peran.includes('ks')) {
    document.querySelector('main').innerHTML = UI.errorHtml('Halaman ini hanya untuk pengurus dan kepala sekolah.');
    return;
  }

  // Catatan: KS diizinkan masuk, backend akan otomatis memfilter hanya guru dari sekolahnya.
  await loadGuru();
})();

// ============================================================
// LOAD GURU
// ============================================================
async function loadGuru() {
  const q = document.getElementById('inputCari').value.trim();

  const el = document.getElementById('listGuru');
  el.innerHTML = `
    <div class="skeleton" style="height:72px;border-radius:16px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:72px;border-radius:16px;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:72px;border-radius:16px;margin-bottom:10px;"></div>
  `;

  const res = await Api.call('users.list', {
    q,
    limit: 200,
  });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat data.');
    document.getElementById('infoHasil').textContent = '';
    return;
  }

  const list = res.data.hasil || [];
  const total = res.data.total || 0;

  document.getElementById('statTotal').textContent = total;

  // Hitung KS dari list
  document.getElementById('statKS').textContent =
    list.filter(g => (g.jabatan || '').toLowerCase() === 'kepala sekolah').length;

  // Hitung sekolah unik dari list
  const sekolahSet = new Set();
  list.forEach(g => { if (g.sekolah?.id) sekolahSet.add(g.sekolah.id); });
  document.getElementById('statSekolah').textContent = sekolahSet.size;

  document.getElementById('infoHasil').textContent =
    `Menampilkan ${list.length} dari ${total} guru`;

  if (list.length === 0) {
    el.innerHTML = UI.emptyHtml('users', 'Tidak ada guru ditemukan', 'Coba ubah kata kunci pencarian.');
    return;
  }

  el.innerHTML = list.map(g => renderGuruItem(g)).join('');

  el.querySelectorAll('.guru-item').forEach(item => {
    item.addEventListener('click', () => bukaDetail(Number(item.dataset.id)));
  });
}

function renderGuruItem(g) {
  const init = (g.nama_lengkap || 'G').charAt(0).toUpperCase();
  const fotoUrl = g.foto_thumb_url || Api.fotoUrl(g.id, 't');
  const isKS = (g.jabatan || '').toLowerCase().includes('kepala sekolah');

  const badgeKS = isKS ? '<span class="badge badge-gold" style="margin-left:6px;">KS</span>' : '';

  return `
    <div class="guru-item" data-id="${g.id}">
      <div class="guru-avatar">
        <span>${init}</span>
        <img src="${fotoUrl}" loading="lazy" onerror="this.remove()" />
      </div>
      <div class="guru-info">
        <div class="guru-name">${UI.escapeHtml(g.nama_lengkap || '-')}${badgeKS}</div>
        <div class="guru-meta">${UI.escapeHtml(g.sekolah?.nama || '-')}</div>
        <div class="guru-meta">${UI.escapeHtml(g.jabatan || '-')}${g.nip ? ' · ' + UI.escapeHtml(g.nip) : ''}</div>
      </div>
      <span class="guru-status ${g.aktif ? 'aktif' : 'nonaktif'}">
        ${g.aktif ? 'Aktif' : 'Non-Aktif'}
      </span>
    </div>
  `;
}

// ============================================================
// EVENT
// ============================================================
document.getElementById('inputCari').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadGuru, 400);
});

// ============================================================
// DETAIL GURU
// ============================================================
async function bukaDetail(id) {
  const res = await Api.call('users.detail', { user_id: id });
  if (!res.ok) {
    UI.gagal(res.error || 'Gagal memuat detail.');
    return;
  }
  showDetailModal(res.data);
}

function showDetailModal(data) {
  const u = data.user;
  const init = (u.nama_lengkap || 'G').charAt(0).toUpperCase();
  const fotoUrl = u.foto_thumb_url || Api.fotoUrl(u.id, 't');

  const peranLabels = (data.peran || []).map(p => {
    const l = p.peran.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return `<span class="badge badge-maroon" style="margin:2px 4px 2px 0;">${UI.escapeHtml(l)}</span>`;
  }).join('');

  const ksInfo = (data.ks_sekolah || []).map(k =>
    `<div class="text-sm" style="margin-top:4px;">
      <span class="badge ${k.jenis === 'induk' ? 'badge-maroon' : 'badge-info'}" style="margin-right:6px;">
        ${k.jenis === 'induk' ? 'INDUK' : 'PLT'}
      </span>
      ${UI.escapeHtml(k.sekolah?.nama || '-')}
    </div>`
  ).join('');

  const isSuperAdmin = profile && profile.peran && profile.peran.includes('super_admin');
  const tombolHapusHtml = isSuperAdmin
    ? '<div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" id="btnHapusGuru" style="color:var(--danger);width:100%;">' + Icons.get('trash', { class: 'icon-sm' }) + ' Hapus Guru</button></div>'
    : '';

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">Detail Guru</h3>
        <button class="btn-icon" data-close>${Icons.get('x')}</button>
      </div>

      <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;overflow:hidden;position:relative;flex-shrink:0;">
          <span>${init}</span>
          <img src="${fotoUrl}" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" />
        </div>
        <div style="min-width:0;">
          <div style="font-weight:800;font-size:16px;">${UI.escapeHtml(u.nama_lengkap)}</div>
          <div class="text-sm text-muted">${UI.escapeHtml(u.sekolah?.nama || '-')}</div>
          <div class="text-sm text-muted">${UI.escapeHtml(u.jabatan || '-')}</div>
        </div>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:12px;">
        <div>
          <div class="text-xs text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Email</div>
          <div class="text-sm" style="font-weight:600;">${UI.escapeHtml(u.email)}</div>
        </div>
        <div>
          <div class="text-xs text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">NIP</div>
          <div class="text-sm" style="font-weight:600;">${UI.escapeHtml(u.nip || 'Non-ASN')}</div>
        </div>
        <div>
          <div class="text-xs text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Peran</div>
          <div>${peranLabels || '-'}</div>
        </div>
        ${ksInfo ? `
          <div>
            <div class="text-xs text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Penugasan KS</div>
            ${ksInfo}
          </div>` : ''}
        <div>
          <div class="text-xs text-muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Status Akun</div>
          <div class="text-sm" style="font-weight:600;color:${u.aktif ? 'var(--success)' : 'var(--danger)'};">
            ${u.aktif ? 'Aktif' : 'Non-Aktif'}
          </div>
        </div>
      </div>

      <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;">Riwayat Sekolah</div>
          <button class="btn btn-ghost btn-sm" id="btnMutasi" style="color:var(--maroon);font-weight:800;">
            ${Icons.get('arrowRight', { class: 'icon-sm' })} Mutasi
          </button>
        </div>
        <div id="riwayatSekolah" style="font-size:12px;color:var(--muted);">Memuat…</div>
      </div>

      <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px;display:flex;gap:8px;">
        <button class="btn btn-secondary btn-sm" id="btnResetPin" style="flex:1;">
          ${Icons.get('lock', { class: 'icon-sm' })} Reset PIN
        </button>
        <button class="btn btn-secondary btn-sm" id="btnKelolaPeran" style="flex:1;">
          ${Icons.get('users', { class: 'icon-sm' })} Kelola Peran
        </button>
      </div>

      ${tombolHapusHtml}
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.querySelector('[data-close]').addEventListener('click', close);

  // Handlers
  overlay.querySelector('#btnResetPin').addEventListener('click', () => {
    close();
    formResetPin(data.user);
  });

  overlay.querySelector('#btnKelolaPeran').addEventListener('click', () => {
    close();
    formKelolaPeran(data.user);
  });

  overlay.querySelector('#btnMutasi').addEventListener('click', () => {
    close();
    formMutasi(data.user);
  });

  const btnHapus = overlay.querySelector('#btnHapusGuru');
  if (btnHapus) {
    btnHapus.addEventListener('click', () => {
      close();
      formHapusGuru(data.user);
    });
  }

  // Load riwayat sekolah
  loadRiwayatSekolah(data.user.id, overlay.querySelector('#riwayatSekolah'));
}

// ============================================================
// RIWAYAT SEKOLAH
// ============================================================
async function loadRiwayatSekolah(userId, el) {
  const res = await Api.call('admin.riwayat_sekolah.list', { user_id: userId });
  if (!res.ok) { el.innerHTML = UI.errorHtml(res.error); return; }

  const list = res.data || [];
  if (list.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">Belum ada riwayat.</div>';
    return;
  }

  const jenisLabel = {
    induk: { text: 'Induk', cls: 'badge-maroon' },
    plt: { text: 'PLT', cls: 'badge-info' },
    pindah_masuk: { text: 'Pindah Masuk', cls: 'badge-success' },
    pindah_keluar: { text: 'Pindah Keluar', cls: 'badge-danger' },
  };

  el.innerHTML = list.map(r => {
    const j = jenisLabel[r.jenis] || { text: r.jenis, cls: 'badge-maroon' };
    const dari = UI.formatTanggalPendek(r.dari_tanggal);
    const sampai = r.sampai_tanggal ? UI.formatTanggalPendek(r.sampai_tanggal) : 'Sekarang';
    return `
      <div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;">
          <span class="badge ${j.cls}" style="font-size:9px;">${j.text}</span>
          <strong>${UI.escapeHtml(r.sekolah?.nama || '-')}</strong>
        </div>
        <div style="color:var(--muted);font-size:11px;">${dari} — ${sampai}</div>
        ${r.catatan ? `<div style="color:var(--muted);font-size:11px;font-style:italic;margin-top:2px;">${UI.escapeHtml(r.catatan)}</div>` : ''}
      </div>
    `;
  }).join('');
}

// ============================================================
// FORM RESET PIN
// ============================================================
function formResetPin(user) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">Reset PIN</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:16px;">
        <div style="font-weight:700;font-size:13.5px;">${UI.escapeHtml(user.nama_lengkap)}</div>
        <div style="font-size:12px;color:var(--muted);">${UI.escapeHtml(user.email || '')}</div>
      </div>

      <div class="field" style="margin-bottom:12px;">
        <label class="label">PIN Baru (opsional)</label>
        <input type="text" id="pinBaru" class="input" inputmode="numeric" maxlength="6" placeholder="Kosongkan untuk auto-generate" />
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">5–6 digit angka. Kalau kosong, sistem buat otomatis.</div>
      </div>

      <div id="resetAlert" class="alert alert-error" style="margin-bottom:12px;"></div>

      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnReset" style="flex:2;">Reset PIN</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnReset').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnReset');
    const pinBaru = overlay.querySelector('#pinBaru').value.trim();

    if (pinBaru && !/^\d{5,6}$/.test(pinBaru)) {
      UI.gagal('PIN harus 5–6 digit angka.');
      return;
    }

    const ok = await UI.konfirmasi(
      'Reset PIN',
      'Reset PIN ' + user.nama_lengkap + '? Sesi login guru ini akan otomatis logout.',
      { okText: 'Reset', danger: true }
    );
    if (!ok) return;

    UI.btnLoading(btn, 'Memproses…');
    const res = await Api.call('admin.reset_pin', {
      user_id: user.id,
      pin_baru: pinBaru || undefined,
    });
    UI.btnReset(btn);

    if (!res.ok) {
      overlay.querySelector('#resetAlert').textContent = res.error;
      overlay.querySelector('#resetAlert').classList.add('show');
      return;
    }

    close();
    showPinResult(res.data);
  });
}

function showPinResult(data) {
  const waText = encodeURIComponent(
    'Halo ' + data.nama + ',\n\nPIN NAKULAKU Anda telah direset.\n\nEmail: ' + data.email + '\nPIN baru: *' + data.pin_baru + '*\n\nSilakan login di:\nhttps://gugusnakula.github.io/nakulaku/login.html'
  );
  const waLink = 'https://wa.me/?text=' + waText;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="text-align:center;">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        ${Icons.get('checkCircle', { class: 'icon-xl' })}
      </div>
      <h3 style="font-size:18px;color:var(--maroon);margin-bottom:8px;">PIN Berhasil Direset</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Sampaikan PIN baru ini ke guru:</p>

      <div style="padding:16px;background:var(--bg);border-radius:12px;margin-bottom:16px;border:2px dashed var(--maroon-soft);">
        <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:6px;">PIN BARU</div>
        <div style="font-size:32px;font-weight:800;color:var(--maroon);letter-spacing:6px;font-family:monospace;">${UI.escapeHtml(data.pin_baru)}</div>
      </div>

      <div style="font-size:11.5px;color:var(--muted);margin-bottom:16px;">
        Nama: <strong>${UI.escapeHtml(data.nama)}</strong><br />
        Email: ${UI.escapeHtml(data.email || '-')}
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" id="btnTutup" style="flex:1;">Tutup</button>
        <a href="${waLink}" target="_blank" rel="noopener" class="btn btn-primary" style="flex:2;text-decoration:none;">
          ${Icons.get('send', { class: 'icon-sm' })} Kirim ke WhatsApp
        </a>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#btnTutup').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

// ============================================================
// FORM KELOLA PERAN
// ============================================================
async function formKelolaPeran(user) {
  const res = await Api.call('admin.peran.list', { user_id: user.id });
  if (!res.ok) { UI.gagal(res.error); return; }

  const peranSaat = res.data || [];

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">Kelola Peran</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:16px;">
        <div style="font-weight:700;font-size:13.5px;">${UI.escapeHtml(user.nama_lengkap)}</div>
        <div style="font-size:12px;color:var(--muted);">${UI.escapeHtml(user.email || '')}</div>
      </div>

      <div style="margin-bottom:16px;">
        <div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0.5px;margin-bottom:10px;">PERAN SAAT INI</div>
        <div id="listPeran">${renderPeranList(peranSaat)}</div>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:16px;">
        <div style="font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0.5px;margin-bottom:10px;">TAMBAH PERAN</div>
        <div style="display:flex;gap:8px;">
          <select id="pilihPeran" class="input" style="flex:1;">
            <option value="">— Pilih Peran —</option>
            <option value="pengurus">Pengurus (admin)</option>
            <option value="narasumber">Narasumber</option>
            <option value="pengamat">Pengamat</option>
            <option value="ks">Kepala Sekolah</option>
          </select>
          <button class="btn btn-primary" id="btnTambahPeran" style="flex:1;">
            ${Icons.get('plus', { class: 'icon-sm' })} Tambah
          </button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  function wireHapus() {
    overlay.querySelectorAll('[data-hapus-peran]').forEach(b => {
      b.addEventListener('click', async () => {
        const peran = b.dataset.hapusPeran;
        const ok = await UI.konfirmasi(
          'Hapus Peran',
          'Hapus peran "' + peran + '" dari ' + user.nama_lengkap + '?',
          { danger: true, okText: 'Hapus' }
        );
        if (!ok) return;
        const res2 = await Api.call('admin.peran.hapus', {
          user_id: user.id,
          peran,
        });
        if (!res2.ok) { UI.gagal(res2.error); return; }
        UI.sukses('Peran dihapus.');
        await reload();
      });
    });
  }
  wireHapus();

  async function reload() {
    const r = await Api.call('admin.peran.list', { user_id: user.id });
    if (!r.ok) return;
    overlay.querySelector('#listPeran').innerHTML = renderPeranList(r.data || []);
    wireHapus();
  }

  overlay.querySelector('#btnTambahPeran').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnTambahPeran');
    const peran = overlay.querySelector('#pilihPeran').value;
    if (!peran) { UI.gagal('Pilih peran.'); return; }

    UI.btnLoading(btn, 'Menambah…');
    const res2 = await Api.call('admin.peran.tambah', {
      user_id: user.id,
      peran,
    });
    UI.btnReset(btn);

    if (!res2.ok) { UI.gagal(res2.error); return; }
    UI.sukses('Peran ditambahkan.');
    overlay.querySelector('#pilihPeran').value = '';
    await reload();
  });
}

function renderPeranList(peranList) {
  if (!peranList || peranList.length === 0) {
    return '<div style="text-align:center;padding:14px;color:var(--muted);font-size:13px;">Belum punya peran khusus.</div>';
  }
  const peranLabel = {
    super_admin: 'Super Admin',
    pengurus: 'Pengurus',
    narasumber: 'Narasumber',
    pengamat: 'Pengamat',
    peserta: 'Peserta',
    ks: 'Kepala Sekolah',
  };
  return peranList.map(p => {
    const bisaHapus = p.peran !== 'super_admin' && p.peran !== 'peserta';
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;">
        <span class="badge badge-maroon" style="flex-shrink:0;">${UI.escapeHtml(peranLabel[p.peran] || p.peran)}</span>
        <div style="flex:1;"></div>
        ${bisaHapus ? '<button class="btn-icon" data-hapus-peran="' + p.peran + '" style="color:var(--danger);width:32px;height:32px;">' + Icons.get('trash', { class: 'icon-sm' }) + '</button>' : ''}
      </div>
    `;
  }).join('');
}

// ============================================================
// FORM MUTASI
// ============================================================
async function formMutasi(user) {
  const resS = await Api.call('sekolah.list');
  if (!resS.ok) { UI.gagal(resS.error); return; }
  const sekolahList = (resS.data || []).filter(s => s.id !== user.sekolah_id);

  const opsiSekolah = sekolahList.map(s => `<option value="${s.id}">${UI.escapeHtml(s.nama)}</option>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">Mutasi Guru</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:16px;">
        <div style="font-weight:700;font-size:13.5px;">${UI.escapeHtml(user.nama_lengkap)}</div>
        <div style="font-size:12px;color:var(--muted);">Sekolah saat ini: ${UI.escapeHtml(user.sekolah?.nama || '-')}</div>
      </div>

      <div style="padding:10px 12px;background:var(--info-soft);border-radius:10px;margin-bottom:16px;font-size:12px;line-height:1.5;color:var(--info);">
        <strong>ℹ️ Info:</strong> Mutasi tidak menghapus data historis. Presensi & tugas lama tetap tercatat di sekolah asal.
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="field">
          <label class="label">Jenis Mutasi *</label>
          <select id="mJenis" class="input">
            <option value="induk">Pindah Induk (ganti sekolah utama)</option>
            <option value="plt">PLT (tambah sekolah, tetap di sekolah asal)</option>
            <option value="pindah_masuk">Pindah Masuk (dari luar gugus)</option>
          </select>
        </div>

        <div class="field">
          <label class="label">Sekolah Baru *</label>
          <select id="mSekolah" class="input">
            <option value="">— Pilih Sekolah —</option>
            ${opsiSekolah}
          </select>
        </div>

        <div class="field">
          <label class="label">Tanggal Mulai *</label>
          <input type="date" id="mTanggal" class="input" value="${new Date().toISOString().slice(0, 10)}" />
          <div style="font-size:11px;color:var(--muted);margin-top:4px;">Riwayat sekolah lama akan ditutup H-1 dari tanggal ini.</div>
        </div>

        <div class="field">
          <label class="label">Catatan (opsional)</label>
          <textarea id="mCatatan" class="input" rows="2" style="resize:vertical;" placeholder="Mis: SK Mutasi No. 123/2026"></textarea>
        </div>
      </div>

      <div id="mAlert" class="alert alert-error" style="margin-top:14px;"></div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpanMutasi" style="flex:2;">Proses Mutasi</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnSimpanMutasi').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnSimpanMutasi');
    const alertBox = overlay.querySelector('#mAlert');
    alertBox.classList.remove('show');

    const jenis = overlay.querySelector('#mJenis').value;
    const sekolahBaru = Number(overlay.querySelector('#mSekolah').value);
    const tanggal = overlay.querySelector('#mTanggal').value;
    const catatan = overlay.querySelector('#mCatatan').value.trim();

    if (!sekolahBaru) { alertBox.textContent = 'Pilih sekolah baru.'; alertBox.classList.add('show'); return; }
    if (!tanggal) { alertBox.textContent = 'Tanggal wajib.'; alertBox.classList.add('show'); return; }

    const ok = await UI.konfirmasi(
      'Konfirmasi Mutasi',
      'Mutasi ' + user.nama_lengkap + ' ke sekolah baru?\n\nData historis (presensi, tugas) tetap tersimpan.',
      { okText: 'Ya, Mutasi' }
    );
    if (!ok) return;

    UI.btnLoading(btn, 'Memproses…');
    const res = await Api.call('admin.mutasi.simpan', {
      user_id: user.id,
      sekolah_baru_id: sekolahBaru,
      tanggal,
      jenis,
      catatan,
    });
    UI.btnReset(btn);

    if (!res.ok) { alertBox.textContent = res.error; alertBox.classList.add('show'); return; }

    UI.sukses(res.data.pesan);
    close();
    await loadGuru();
  });
}

// ============================================================
// FORM HAPUS GURU
// ============================================================
function formHapusGuru(user) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:17px;color:var(--danger);margin:0;">Hapus Guru</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="padding:12px;background:var(--danger-soft);border-radius:12px;margin-bottom:16px;font-size:12.5px;line-height:1.5;color:var(--danger);">
        <strong>⚠️ Perhatian</strong><br>
        Kalau guru ini <strong>sudah punya aktivitas</strong> (presensi, tugas, feedback, dll), akun akan <strong>dinonaktifkan</strong> saja — bukan dihapus permanen.<br>
        Kalau <strong>belum ada aktivitas</strong>, akun akan dihapus permanen.
      </div>

      <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:16px;">
        <div style="font-weight:700;font-size:13.5px;">${UI.escapeHtml(user.nama_lengkap)}</div>
        <div style="font-size:12px;color:var(--muted);">${UI.escapeHtml(user.email || '')}</div>
      </div>

      <div class="field" style="margin-bottom:14px;">
        <label class="label">Ketik nama lengkap guru untuk konfirmasi *</label>
        <input type="text" id="konfirmasiHapus" class="input" placeholder="Ketik nama persis…" />
      </div>

      <div id="hapusAlert" class="alert alert-error" style="margin-bottom:12px;"></div>

      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-danger" id="btnProsesHapus" disabled style="flex:2;">Hapus</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  const konfirmasiEl = overlay.querySelector('#konfirmasiHapus');
  const btnProses = overlay.querySelector('#btnProsesHapus');
  const alertBox = overlay.querySelector('#hapusAlert');

  konfirmasiEl.addEventListener('input', () => {
    const valid = konfirmasiEl.value.trim().toLowerCase() === (user.nama_lengkap || '').trim().toLowerCase();
    btnProses.disabled = !valid;
  });

  btnProses.addEventListener('click', async () => {
    if (btnProses.disabled) return;

    alertBox.classList.remove('show');
    UI.btnLoading(btnProses, 'Memproses…');

    const res = await Api.call('admin.users.hapus', {
      user_id: user.id,
      konfirmasi: konfirmasiEl.value.trim(),
    });

    UI.btnReset(btnProses);

    if (!res.ok) {
      alertBox.textContent = res.error;
      alertBox.classList.add('show');
      return;
    }

    close();
    UI.sukses(res.data.pesan);
    await loadGuru();
  });
}
</script>

</body>
</html>
