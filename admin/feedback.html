<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#611329" />
<title>Feedback — NAKULAKU Admin</title>

<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/nakula.css" />

<style>
  .rekap-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .rekap-item:hover {
    border-color: var(--maroon);
    box-shadow: var(--sh-md);
    transform: translateY(-1px);
  }
  .rekap-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .rekap-num {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    flex-shrink: 0;
  }
  .rekap-num .n { font-size: 16px; line-height: 1; }
  .rekap-num .l { font-size: 7px; letter-spacing: 0.5px; font-weight: 700; opacity: 0.7; }
  .rekap-info { flex: 1; min-width: 0; }
  .rekap-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .rekap-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  .skor-badge {
    text-align: center;
    flex-shrink: 0;
  }
  .skor-badge .skor {
    font-size: 24px;
    font-weight: 800;
    line-height: 1;
  }
  .skor-badge .label {
    font-size: 9px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .skor-hijau { color: var(--success); }
  .skor-kuning { color: var(--warning); }
  .skor-merah { color: var(--danger); }

  .kategori-bar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .kat-mini {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 4px 0;
  }
  .kat-mini .lbl { color: var(--muted); font-weight: 600; }
  .kat-mini .val { font-weight: 800; }

  /* Modal Detail */
  .modal-xl {
    background: white;
    border-radius: 20px;
    padding: 24px;
    max-width: 640px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--sh-xl);
  }
  .detail-kat-block {
    background: var(--bg);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .detail-kat-block h4 {
    font-size: 13px;
    color: var(--maroon);
    margin-bottom: 10px;
    font-weight: 800;
  }
  .aspek-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    font-size: 12.5px;
    gap: 8px;
  }
  .aspek-row .nama { flex: 1; }
  .aspek-row .bar {
    width: 100px;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    flex-shrink: 0;
  }
  .aspek-row .bar > div {
    height: 100%;
    background: var(--maroon);
    border-radius: 3px;
  }
  .aspek-row .val {
    width: 34px;
    text-align: right;
    font-weight: 800;
    color: var(--maroon);
    flex-shrink: 0;
  }

  .komentar-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .komentar-meta {
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
    margin-top: 6px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="../beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Rekap Feedback</div>
      <div class="app-header-sub">Admin NAKULAKU</div>
    </div>
  </div>
</header>

<main class="container page" style="max-width:820px;padding-top:16px;">

  <div id="infoPeriode" style="margin-bottom:16px;font-size:12px;color:var(--muted);font-weight:600;"></div>

  <div id="statTotal" class="card" style="margin-bottom:16px;text-align:center;">
    <div style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.5px;">TOTAL FEEDBACK MASUK</div>
    <div style="font-size:32px;font-weight:800;color:var(--maroon);line-height:1.1;margin-top:6px;">—</div>
  </div>

  <div id="listRekap">
    <div class="skeleton" style="height:120px;border-radius:16px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:120px;border-radius:16px;"></div>
  </div>

</main>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let profile;
let periodeAktif = null;
let rekapData = [];

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  if (!profile.peran.includes('pengurus') && !profile.peran.includes('super_admin')) {
    document.querySelector('main').innerHTML = UI.errorHtml('Halaman ini hanya untuk pengurus.');
    return;
  }

  const resP = await Api.call('periode.aktif');
  if (resP.ok && resP.data) {
    periodeAktif = resP.data;
    document.getElementById('infoPeriode').innerHTML =
      `<span style="color:var(--maroon);">${Icons.get('messageSquare', { class: 'icon-sm' })}</span> Periode: <strong>${UI.escapeHtml(periodeAktif.nama)}</strong>`;
  }

  await load();
})();

async function load() {
  const el = document.getElementById('listRekap');
  el.innerHTML = '<div class="skeleton" style="height:120px;border-radius:16px;"></div>';

  const res = await Api.call('feedback.rekap', { periode_id: periodeAktif?.id });
  if (!res.ok) { el.innerHTML = UI.errorHtml(res.error); return; }

  rekapData = res.data.rekap || [];
  document.querySelector('#statTotal div:nth-child(2)').textContent = res.data.total_feedback || 0;

  if (rekapData.length === 0) {
    el.innerHTML = UI.emptyHtml('messageSquare', 'Belum ada feedback', 'Feedback akan muncul setelah peserta mengisi.');
    return;
  }

  el.innerHTML = rekapData.map(r => renderItem(r)).join('');

  rekapData.forEach(r => {
    const el = document.getElementById('rekap-' + r.pertemuan.id);
    if (!el) return;
    el.addEventListener('click', () => bukaDetail(r.pertemuan.id));
  });
}

function renderItem(r) {
  const p = r.pertemuan;
  const skor = r.skor_rata;
  const skorCls = skor >= 4 ? 'skor-hijau' : skor >= 3 ? 'skor-kuning' : skor > 0 ? 'skor-merah' : '';

  const katLabel = {
    sekolah: 'Sekolah',
    penyelenggara: 'Penyelenggara',
    narasumber: 'Narasumber',
    materi: 'Materi',
  };

  return `
    <div class="rekap-item" id="rekap-${p.id}">
      <div class="rekap-head">
        <div class="rekap-num">
          <div class="n">${p.urutan}</div>
          <div class="l">PERT</div>
        </div>
        <div class="rekap-info">
          <div class="rekap-title">${UI.escapeHtml(p.judul)}</div>
          <div class="rekap-sub">${UI.formatTanggal(p.tanggal)}${p.lokasi_nama ? ' · ' + UI.escapeHtml(p.lokasi_nama) : ''}</div>
          <div class="rekap-sub">${r.jumlah_feedback} feedback masuk</div>
        </div>
        <div class="skor-badge">
          <div class="skor ${skorCls}">${skor > 0 ? skor : '—'}</div>
          <div class="label">RATA</div>
        </div>
      </div>

      ${r.jumlah_feedback > 0 ? `
        <div class="kategori-bar">
          ${Object.keys(katLabel).map(k => `
            <div class="kat-mini">
              <span class="lbl">${katLabel[k]}</span>
              <span class="val">${r.kategori[k] || '—'}</span>
            </div>
          `).join('')}
        </div>
      ` : `
        <div style="text-align:center;color:var(--muted);font-size:12px;padding:8px;">
          Belum ada feedback
        </div>
      `}
    </div>
  `;
}

async function bukaDetail(pertemuanId) {
  const res = await Api.call('feedback.detail', { pertemuan_id: pertemuanId });
  if (!res.ok) { UI.gagal(res.error); return; }

  const d = res.data;
  const p = d.pertemuan;

  const katLabel = {
    sekolah: 'Sekolah Tuan Rumah',
    penyelenggara: 'Penyelenggara',
    narasumber: 'Narasumber',
    materi: 'Materi',
    umum: 'Umum',
  };

  // Group aspek by kategori
  const aspekByKat = {};
  Object.keys(d.aspek_agregat).forEach(key => {
    const [kat, aspek] = key.split('_');
    if (!aspekByKat[kat]) aspekByKat[kat] = [];
    const ag = d.aspek_agregat[key];
    aspekByKat[kat].push({
      nama: aspek,
      rata: ag.jml > 0 ? Number((ag.total / ag.jml).toFixed(2)) : 0,
      jml: ag.jml,
    });
  });

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div class="modal-xl">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;">
        <div style="flex:1;min-width:0;">
          <h3 style="font-size:16px;color:var(--maroon);margin:0 0 4px;">Pertemuan #${p.urutan}</h3>
          <div style="font-size:13px;font-weight:700;">${UI.escapeHtml(p.judul)}</div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;">
            ${UI.formatTanggal(p.tanggal)} · ${d.feedback.length} feedback
          </div>
        </div>
        <button class="btn-icon" data-close>${Icons.get('x')}</button>
      </div>

      ${Object.keys(aspekByKat).length > 0 ? `
        <div style="margin-bottom:20px;">
          <h4 style="font-size:12px;color:var(--muted);font-weight:800;letter-spacing:0.5px;margin-bottom:10px;">RATA-RATA PER ASPEK</h4>
          ${Object.keys(aspekByKat).map(kat => `
            <div class="detail-kat-block">
              <h4>${katLabel[kat] || kat}</h4>
              ${aspekByKat[kat].map(a => `
                <div class="aspek-row">
                  <div class="nama">${UI.escapeHtml(a.nama)}</div>
                  <div class="bar"><div style="width: ${(a.rata / 5) * 100}%"></div></div>
                  <div class="val">${a.rata}</div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      ` : ''}

      ${d.feedback.some(f => f.saran) ? `
        <div style="margin-bottom:20px;">
          <h4 style="font-size:12px;color:var(--muted);font-weight:800;letter-spacing:0.5px;margin-bottom:10px;">SARAN</h4>
          ${d.feedback.filter(f => f.saran).map(f => `
            <div class="komentar-box">
              <div>${UI.escapeHtml(f.saran)}</div>
              <div class="komentar-meta">— ${UI.escapeHtml(f.user?.nama_lengkap || 'Anonim')}, ${UI.timeAgo(f.dibuat_pada)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}

      ${d.feedback.some(f => f.kritik) ? `
        <div>
          <h4 style="font-size:12px;color:var(--muted);font-weight:800;letter-spacing:0.5px;margin-bottom:10px;">KRITIK & MASUKAN</h4>
          ${d.feedback.filter(f => f.kritik).map(f => `
            <div class="komentar-box">
              <div>${UI.escapeHtml(f.kritik)}</div>
              <div class="komentar-meta">— ${UI.escapeHtml(f.user?.nama_lengkap || 'Anonim')}, ${UI.timeAgo(f.dibuat_pada)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
}
</script>

</body>
</html>
