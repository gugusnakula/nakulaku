<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#611329" />
<title>Verifikasi Sekolah — NAKULAKU Admin</title>

<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/nakula.css" />

<style>
  .tab-row {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab-p {
    flex: 1;
    min-width: 100px;
    padding: 10px 8px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab-p.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: var(--sh-sm);
  }
  .tab-p .badge-count {
    background: var(--danger);
    color: white;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 999px;
    font-weight: 800;
  }

  .item-verif {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px;
    margin-bottom: 12px;
    transition: all .15s;
  }
  .item-verif:hover { box-shadow: var(--sh-md); }

  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .item-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .item-icon.prestasi { background: var(--gold-soft); color: var(--gold-dark); }
  .item-icon.kegiatan { background: var(--info-soft); color: var(--info); }
  .item-icon.pembiasaan { background: var(--success-soft); color: var(--success); }

  .item-info { flex: 1; min-width: 0; }
  .item-title { font-weight: 800; font-size: 14px; margin-bottom: 2px; }
  .item-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }

  .detail-box {
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 12.5px;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    gap: 8px;
  }
  .detail-row .lbl { color: var(--muted); font-weight: 600; flex-shrink: 0; }
  .detail-row .val { font-weight: 700; text-align: right; }

  .item-actions {
    display: flex;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .item-actions .btn { flex: 1; }

  .link-bukti {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--maroon);
    margin-top: 6px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="../beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Verifikasi Sekolah</div>
      <div class="app-header-sub">Admin NAKULAKU</div>
    </div>
  </div>
</header>

<main class="container page" style="max-width:820px;padding-top:16px;">

  <div id="statBox" class="card" style="margin-bottom:16px;text-align:center;">
    <div style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.5px;">TOTAL MENUNGGU VERIFIKASI</div>
    <div style="font-size:32px;font-weight:800;color:var(--maroon);line-height:1.1;margin-top:6px;" id="statTotal">—</div>
  </div>

  <div class="tab-row">
    <button class="tab-p active" data-jenis="">
      <span data-icon="inbox" class="icon-sm"></span> Semua
    </button>
    <button class="tab-p" data-jenis="pembiasaan">
      <span data-icon="sparkles" class="icon-sm"></span> Pembiasaan
    </button>
    <button class="tab-p" data-jenis="prestasi">
      <span data-icon="award" class="icon-sm"></span> Prestasi
    </button>
    <button class="tab-p" data-jenis="kegiatan">
      <span data-icon="calendar" class="icon-sm"></span> Kegiatan
    </button>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:16px;">
    <select id="filterSekolah" class="input" style="flex:1;">
      <option value="">Semua Sekolah</option>
    </select>
    <button class="btn btn-secondary btn-sm" id="btnRefresh" style="flex-shrink:0;">
      <span data-icon="refreshCw" class="icon-sm"></span> Refresh
    </button>
  </div>

  <div id="listItem">
    <div class="skeleton" style="height:180px;border-radius:16px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:180px;border-radius:16px;"></div>
  </div>

</main>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let profile;
let jenisAktif = '';
let semuaItem = [];

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  if (!profile.peran.includes('pengurus') && !profile.peran.includes('super_admin')) {
    document.querySelector('main').innerHTML = UI.errorHtml('Halaman ini hanya untuk panitia/pengurus.');
    return;
  }

  await loadSekolah();
  await load();

  // Tab switching
  document.querySelectorAll('.tab-p').forEach(t => {
    t.addEventListener('click', () => {
      jenisAktif = t.dataset.jenis;
      document.querySelectorAll('.tab-p').forEach(x => x.classList.toggle('active', x === t));
      renderList();
    });
  });

  // Filter sekolah
  document.getElementById('filterSekolah').addEventListener('change', load);
  document.getElementById('btnRefresh').addEventListener('click', load);
})();

async function loadSekolah() {
  const res = await Api.call('sekolah.list');
  if (!res.ok) return;
  const sel = document.getElementById('filterSekolah');
  (res.data || []).forEach(s => {
    sel.innerHTML += `<option value="${s.id}">${UI.escapeHtml(s.nama)}</option>`;
  });
}

async function load() {
  const el = document.getElementById('listItem');
  el.innerHTML = '<div class="skeleton" style="height:180px;border-radius:16px;"></div>';

  const sid = document.getElementById('filterSekolah').value;
  const res = await Api.callSekolah('verifikasi.pending', {
    sekolah_id: sid ? Number(sid) : undefined,
    limit: 100,
  });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error);
    return;
  }

  semuaItem = res.data.data || [];
  document.getElementById('statTotal').textContent = semuaItem.length;
  renderList();
}

function renderList() {
  const el = document.getElementById('listItem');

  const list = jenisAktif
    ? semuaItem.filter(x => x._jenis === jenisAktif)
    : semuaItem;

  if (list.length === 0) {
    el.innerHTML = UI.emptyHtml('checkCircle', 'Tidak ada yang menunggu', 'Semua sudah diverifikasi.');
    return;
  }

  el.innerHTML = list.map(it => renderItem(it)).join('');

  // Wire tombol
  el.querySelectorAll('[data-act="approve"]').forEach(b => {
    b.addEventListener('click', () => approve(b.dataset.jenis, Number(b.dataset.id)));
  });
  el.querySelectorAll('[data-act="reject"]').forEach(b => {
    b.addEventListener('click', () => reject(b.dataset.jenis, Number(b.dataset.id)));
  });
}

function renderItem(it) {
  const jenis = it._jenis;
  const sekolah = it.sekolah?.nama || '-';
  const pelapor = it.pelapor?.nama_lengkap || '-';

  const jenisLabel = {
    pembiasaan: 'Pembiasaan',
    prestasi: 'Prestasi',
    kegiatan: 'Kegiatan',
  }[jenis] || jenis;

  const jenisIcon = {
    pembiasaan: 'sparkles',
    prestasi: 'award',
    kegiatan: 'calendar',
  }[jenis] || 'info';

  let judul = '';
  let detailRows = '';

  if (jenis === 'pembiasaan') {
    judul = it.nama;
    detailRows = `
      <div class="detail-row"><span class="lbl">Frekuensi</span><span class="val">${UI.escapeHtml(it.frekuensi || '-')}</span></div>
      <div class="detail-row"><span class="lbl">Periode</span><span class="val">${UI.escapeHtml((it.bulan ? it.bulan + '/' : '') + it.tahun)}</span></div>
      ${it.deskripsi ? `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:12px;line-height:1.5;">${UI.escapeHtml(it.deskripsi)}</div>` : ''}
    `;
  } else if (jenis === 'prestasi') {
    judul = it.nama_lomba;
    const tingkatLabel = {
      sekolah: 'Sekolah', kecamatan: 'Kecamatan', kabupaten: 'Kabupaten',
      provinsi: 'Provinsi', nasional: 'Nasional', internasional: 'Internasional',
    }[it.tingkat] || it.tingkat;
    const peringkatLabel = {
      juara_1: 'Juara 1', juara_2: 'Juara 2', juara_3: 'Juara 3', harapan: 'Harapan',
    }[it.peringkat] || it.peringkat;
    detailRows = `
      <div class="detail-row"><span class="lbl">Siswa</span><span class="val">${UI.escapeHtml(it.nama_siswa)}${it.kelas ? ' · ' + UI.escapeHtml(it.kelas) : ''}</span></div>
      <div class="detail-row"><span class="lbl">Tingkat</span><span class="val">${tingkatLabel}</span></div>
      <div class="detail-row"><span class="lbl">Peringkat</span><span class="val">${peringkatLabel}</span></div>
      <div class="detail-row"><span class="lbl">Tanggal</span><span class="val">${UI.formatTanggalPendek(it.tanggal)}</span></div>
      ${it.guru_pembina ? `<div class="detail-row"><span class="lbl">Pembina</span><span class="val">${UI.escapeHtml(it.guru_pembina)}</span></div>` : ''}
    `;
  } else if (jenis === 'kegiatan') {
    judul = it.nama;
    const skalaLabel = {
      internal: 'Internal Sekolah', orang_tua: 'Orang Tua',
      komunitas: 'Komunitas', kecamatan: 'Kecamatan', kabupaten_plus: 'Kabupaten+',
    }[it.skala] || it.skala;
    detailRows = `
      <div class="detail-row"><span class="lbl">Kategori</span><span class="val">${UI.escapeHtml(it.kategori || '-')}</span></div>
      <div class="detail-row"><span class="lbl">Tanggal</span><span class="val">${UI.formatTanggalPendek(it.tanggal)}</span></div>
      <div class="detail-row"><span class="lbl">Tempat</span><span class="val">${UI.escapeHtml(it.tempat || '-')}</span></div>
      <div class="detail-row"><span class="lbl">Skala</span><span class="val">${skalaLabel}</span></div>
      ${it.jumlah_peserta ? `<div class="detail-row"><span class="lbl">Peserta</span><span class="val">${it.jumlah_peserta} orang</span></div>` : ''}
      ${it.deskripsi ? `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:12px;line-height:1.5;">${UI.escapeHtml(it.deskripsi)}</div>` : ''}
    `;
  }

  const buktiHtml = it.bukti_url
    ? `<a href="${UI.escapeHtml(it.bukti_url)}" target="_blank" rel="noopener" class="link-bukti">
         ${Icons.get('externalLink', { class: 'icon-sm' })} Lihat Bukti
       </a>`
    : '';

  const logoSekolah = it.sekolah
    ? Api.logoHtml(it.sekolah_id, it.sekolah.nama, 22, it.sekolah.logo_updated_at, { rounded: 'md' })
    : '';

  return `
    <div class="item-verif">
      <div class="item-head">
        <div class="item-icon ${jenis}">${Icons.get(jenisIcon, { class: 'icon-sm' })}</div>
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(judul)}</div>
          <div class="item-sub" style="display:inline-flex;align-items:center;gap:6px;">
            ${logoSekolah}
            <span>${jenisLabel} · ${UI.escapeHtml(sekolah)}</span>
          </div>
          <div class="item-sub">Dilaporkan oleh: ${UI.escapeHtml(pelapor)}</div>
        </div>
      </div>

      <div class="detail-box">
        ${detailRows}
      </div>

      ${buktiHtml}

      <div class="item-actions">
        <button class="btn btn-secondary btn-sm" data-act="reject" data-jenis="${jenis}" data-id="${it.id}">
          ${Icons.get('x', { class: 'icon-sm' })} Tolak
        </button>
        <button class="btn btn-primary btn-sm" data-act="approve" data-jenis="${jenis}" data-id="${it.id}">
          ${Icons.get('check', { class: 'icon-sm' })} Setujui
        </button>
      </div>
    </div>
  `;
}

// ============================================================
// APPROVE
// ============================================================
async function approve(jenis, id) {
  const it = semuaItem.find(x => x.id === id && x._jenis === jenis);
  const nama = it ? (it.nama || it.nama_lomba || 'data ini') : 'data ini';

  const ok = await UI.konfirmasi(
    'Setujui',
    `Setujui "${nama}"? Poin akan otomatis ditambahkan.`,
    { okText: 'Setujui' }
  );
  if (!ok) return;

  const res = await Api.callSekolah('verifikasi.approve', { jenis, id });
  if (!res.ok) { UI.gagal(res.error); return; }

  UI.sukses(`Disetujui. Poin: +${res.data.poin}`);
  await load();
}

// ============================================================
// REJECT
// ============================================================
async function reject(jenis, id) {
  const it = semuaItem.find(x => x.id === id && x._jenis === jenis);
  const nama = it ? (it.nama || it.nama_lomba || 'data ini') : 'data ini';

  const catatan = await promptAlasan();
  if (catatan === null) return;

  const res = await Api.callSekolah('verifikasi.reject', { jenis, id, catatan });
  if (!res.ok) { UI.gagal(res.error); return; }

  UI.sukses('Ditolak.');
  await load();
}

// Modal alasan penolakan
function promptAlasan() {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
    overlay.innerHTML = `
      <div style="background:white;border-radius:20px;padding:24px;max-width:440px;width:100%;box-shadow:var(--sh-xl);">
        <h3 style="font-size:17px;color:var(--danger);margin:0 0 8px;">Tolak Submission</h3>
        <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">Berikan alasan penolakan. Pelapor akan melihat alasan ini.</p>
        <textarea id="alasan" class="input" rows="3" style="resize:vertical;width:100%;" placeholder="Mis: Bukti tidak jelas, data duplikat, dll."></textarea>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button class="btn btn-secondary" id="btnBatal" style="flex:1;">Batal</button>
          <button class="btn btn-danger" id="btnTolak" style="flex:2;">Tolak</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const close = (val) => {
      overlay.remove();
      resolve(val);
    };
    overlay.querySelector('#btnBatal').addEventListener('click', () => close(null));
    overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
    overlay.querySelector('#btnTolak').addEventListener('click', () => {
      const val = overlay.querySelector('#alasan').value.trim();
      if (!val) { UI.gagal('Alasan wajib diisi.'); return; }
      close(val);
    });
  });
}
</script>

</body>
</html>
