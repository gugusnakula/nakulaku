<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beranda — NAKULAKU EKOSISTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#0D9488',
          'primary-dark': '#0F766E',
          'primary-soft': '#CCFBF1',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      }
    }
  }
</script>
</head>
<body class="font-sans bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-primary-soft text-primary-dark flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        </div>
        <div class="leading-tight">
          <div class="font-extrabold text-gray-800">NAKULAKU</div>
          <div class="text-xs text-gray-500">Ekosistem KKG Nakula</div>
        </div>
      </div>
      <button id="btnLogout" class="text-sm text-gray-500 hover:text-red-600 flex items-center gap-1">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Keluar</span>
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-5 space-y-5">

    <!-- Kartu Profil -->
    <section class="bg-white rounded-2xl border border-gray-100 p-5 flex items-center gap-4">
      <div id="fotoProfil" class="w-14 h-14 rounded-2xl bg-primary-soft text-primary-dark flex items-center justify-center font-extrabold text-xl overflow-hidden relative">
      </div>
      <div class="flex-1 min-w-0">
        <div id="namaProfil" class="font-bold text-gray-800 truncate">Memuat…</div>
        <div id="sekolahProfil" class="text-sm text-gray-500 truncate">—</div>
        <div id="peranProfil" class="mt-1 flex flex-wrap gap-1"></div>
      </div>
    </section>

    <!-- Pengumuman -->
    <section>
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="megaphone" class="w-5 h-5 text-primary"></i>
        <h2 class="font-bold text-gray-800">Pengumuman</h2>
      </div>
      <div id="listPengumuman" class="space-y-3">
        <div class="text-sm text-gray-400">Memuat…</div>
      </div>
    </section>

    <!-- Pertemuan -->
    <section>
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="calendar-days" class="w-5 h-5 text-primary"></i>
        <h2 class="font-bold text-gray-800">Pertemuan</h2>
      </div>
      <div id="listPertemuan" class="space-y-3">
        <div class="text-sm text-gray-400">Memuat…</div>
      </div>
    </section>

  </main>

  <script src="assets/js/api.js"></script>
  <script>
    lucide.createIcons();

    // ---------- Cek sesi ----------
    (async () => {
      const token = NakulaApi.getToken();
      if (!token) return NakulaApi.logout();

      const v = await NakulaApi.verify(token);
      if (!v.valid) {
        alert('Sesi habis: ' + (v.error || 'Silakan login ulang.'));
        return NakulaApi.logout();
      }

      NakulaApi.setSession(token, v.profile);
      renderProfil(v.profile);
      loadPengumuman();
      loadPertemuan();
    })();

    // ---------- Tombol logout ----------
    document.getElementById('btnLogout').addEventListener('click', () => {
      if (confirm('Keluar dari akun?')) NakulaApi.logout();
    });

    // ---------- Render profil ----------
    function renderProfil(p) {
      document.getElementById('namaProfil').textContent = p.nama || '-';
      document.getElementById('sekolahProfil').textContent =
        p.sekolah ? `${p.sekolah.nama} • ${p.jabatan || '-'}` : (p.jabatan || '-');

      // Foto
      const wrap = document.getElementById('fotoProfil');
      const url = NakulaApi.fotoUrl('t');
      if (url) {
        wrap.innerHTML = `<img src="${url}" class="w-full h-full object-cover" onerror="this.remove()">`;
      } else {
        wrap.textContent = NakulaApi.inisial(p.nama);
      }

      // Peran
      const peranEl = document.getElementById('peranProfil');
      peranEl.innerHTML = (p.peran || []).map(r => {
        const label = r.replace('_', ' ');
        return `<span class="text-xs px-2 py-0.5 rounded-full bg-primary-soft text-primary-dark font-semibold">${label}</span>`;
      }).join('');
    }

    // ---------- Render pengumuman ----------
    async function loadPengumuman() {
      const el = document.getElementById('listPengumuman');
      const res = await NakulaApi.call('pengumuman.list');

      if (!res.ok || !res.data || res.data.length === 0) {
        el.innerHTML = '<div class="text-sm text-gray-400">Belum ada pengumuman.</div>';
        return;
      }

      el.innerHTML = res.data.map(u => `
        <div class="bg-white rounded-2xl border ${u.penting ? 'border-amber-200 bg-amber-50/50' : 'border-gray-100'} p-4">
          <div class="flex items-start gap-2">
            ${u.penting ? '<i data-lucide="pin" class="w-4 h-4 text-amber-500 mt-0.5 shrink-0"></i>' : ''}
            <div class="flex-1">
              <div class="font-semibold text-gray-800">${escapeHtml(u.judul)}</div>
              <div class="text-sm text-gray-600 mt-1 whitespace-pre-line">${escapeHtml(u.isi || '')}</div>
              <div class="text-xs text-gray-400 mt-2">${formatTanggal(u.dibuat_pada)}</div>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // ---------- Render pertemuan ----------
    async function loadPertemuan() {
      const el = document.getElementById('listPertemuan');
      const res = await NakulaApi.call('pertemuan.list');

      if (!res.ok || !res.data || res.data.length === 0) {
        el.innerHTML = '<div class="text-sm text-gray-400">Belum ada pertemuan.</div>';
        return;
      }

      el.innerHTML = res.data.map(p => `
        <div class="bg-white rounded-2xl border border-gray-100 p-4 flex items-start gap-3 hover:border-primary/40 transition cursor-pointer"
             onclick="bukaPertemuan(${p.id})">
          <div class="w-12 h-12 rounded-xl bg-primary-soft text-primary-dark flex flex-col items-center justify-center font-bold">
            <div class="text-lg leading-none">${p.urutan}</div>
            <div class="text-[10px] font-semibold">PERTEMUAN</div>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-gray-800 truncate">${escapeHtml(p.judul)}</div>
            <div class="text-sm text-gray-500 mt-0.5 flex items-center gap-1">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
              ${formatTanggal(p.tanggal)}
            </div>
            ${p.lokasi_nama ? `
              <div class="text-sm text-gray-500 mt-0.5 flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                ${escapeHtml(p.lokasi_nama)}
              </div>` : ''}
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 self-center"></i>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function bukaPertemuan(id) {
      // halaman detail belum dibuat — sementara alert
      alert('Detail pertemuan #' + id + ' akan tersedia di tahap berikutnya.');
    }

    // ---------- Helper ----------
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function formatTanggal(s) {
      if (!s) return '-';
      const d = new Date(s);
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }
  </script>
</body>
</html>
