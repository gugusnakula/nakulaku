<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Beranda — NAKULAKU EKOSISTEM</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* Kartu Progres */
  .progress-card {
    background: linear-gradient(135deg, var(--maroon-dark) 0%, var(--maroon-mid) 100%);
    color: white;
    border-radius: var(--r-xl);
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(125,29,58,.28);
  }
  .progress-card::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.1;
    pointer-events: none;
  }
  .progress-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    position: relative;
  }
  .progress-card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.95;
  }
  .progress-card-count {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.85;
  }
  .progress-card-bar {
    height: 10px;
    background: rgba(255,255,255,.2);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
    position: relative;
  }
  .progress-card-bar > div {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-light) 0%, var(--gold) 100%);
    border-radius: 999px;
    transition: width .6s var(--ease-out);
    position: relative;
  }
  .progress-card-percent {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    font-weight: 800;
  }
  .progress-card-info {
    font-size: 12.5px;
    opacity: 0.9;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }
  .progress-card-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.5);
    border-radius: var(--r-full);
    padding: 8px 14px 8px 12px;
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: none;
    color: white;
    margin-top: 12px;
    position: relative;
    transition: all .15s;
  }
  .progress-card-cta:hover {
    background: rgba(255,255,255,.25);
    transform: translateX(2px);
  }

  /* Kunci visual pada pertemuan */
  .pertemuan-item.locked {
    opacity: 0.55;
    cursor: not-allowed;
    background: #FAF6F6;
  }
  .pertemuan-item.locked:hover {
    border-color: var(--border);
    transform: none;
    box-shadow: var(--sh-xs);
  }
  .pertemuan-item.locked .pertemuan-number {
    background: var(--border);
    color: var(--muted);
  }
  .pertemuan-item.locked .chevron {
    color: var(--border-strong);
  }
  .pertemuan-lock-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
    margin-top: 4px;
  }
  .pertemuan-item.selesai .pertemuan-number {
    background: var(--success-soft);
    color: var(--success);
  }
  .pertemuan-done-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--success-soft);
    color: var(--success);
  }
</style>
</head>
<body>

<!-- ============================ MOBILE HEADER ============================ -->
<header class="app-header">
  <div class="app-header-brand">
    <div class="app-header-logo">
      <img src="assets/img/logo-mark.svg" alt="Nakula" />
    </div>
    <div class="app-header-text">
      <div class="app-header-title">NAKULAKU</div>
      <div class="app-header-sub">KKG Gugus Nakula</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<!-- ============================ LAYOUT ============================ -->
<div class="desktop-layout">

  <!-- SIDEBAR DESKTOP -->
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <img src="assets/img/logo-mark.svg" alt="Nakula" />
      </div>
      <div class="sidebar-brand-text">
        <div class="name">NAKULAKU</div>
        <div class="sub">KKG Gugus Nakula</div>
      </div>
    </div>

    <nav class="sidebar-menu">
      <a class="sidebar-item active" data-nav="beranda" href="beranda.html">
        <span data-icon="home"></span> Beranda
      </a>
      <a class="sidebar-item" data-nav="pengumuman" href="#sectionPengumuman">
        <span data-icon="megaphone"></span> Pengumuman
      </a>
      <a class="sidebar-item" data-nav="pertemuan" href="#sectionPertemuan">
        <span data-icon="calendar"></span> Pertemuan
      </a>
      <a class="sidebar-item" data-nav="award" href="award.html">
        <span data-icon="award"></span> Papan Juara
      </a>
      <a class="sidebar-item" data-nav="aktivitas" href="aktivitas.html">
        <span data-icon="activity"></span> Aktivitas Saya
      </a>
      <a class="sidebar-item" data-nav="profil" href="profil.html">
        <span data-icon="user"></span> Profil
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="desktop-main">

    <div class="desktop-topbar">
      <h2>Beranda</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-icon" data-act="logout" aria-label="Keluar" title="Keluar">
          <span data-icon="logOut"></span>
        </button>
      </div>
    </div>

    <div class="container page" style="padding-top:20px;">

      <!-- PROFIL CARD -->
      <section id="profilCard" class="profile-card" style="margin-bottom:20px;">
        <div class="profile-avatar" id="profilAvatar">?</div>
        <div class="profile-info">
          <div class="profile-name" id="profilNama">Memuat…</div>
          <div class="profile-school" id="profilSekolah">—</div>
          <div class="profile-badges" id="profilBadges"></div>
        </div>
      </section>

      <!-- KARTU PROGRES -->
      <section id="kartuProgres" class="progress-card hidden">
        <div class="progress-card-head">
          <div class="progress-card-title">
            <span data-icon="award" class="icon-sm"></span>
            Progres Anda
          </div>
          <div class="progress-card-count" id="progressCount">0/0</div>
        </div>
        <div class="progress-card-bar">
          <div id="progressFill" style="width:0%"></div>
          <div class="progress-card-percent" id="progressPercent">0%</div>
        </div>
        <div class="progress-card-info" id="progressInfo">
          Memuat…
        </div>
        <a href="#" id="progressCta" class="progress-card-cta hidden">
          <span data-icon="arrowRight" class="icon-sm"></span>
          <span id="progressCtaText">Lanjut</span>
        </a>
      </section>

      <!-- MENU KHUSUS -->
      <section id="panelKhusus" class="hidden" style="margin-bottom:24px;scroll-margin-top:80px;">
        <div class="section-head">
          <h3><span data-icon="award"></span> Menu Khusus</h3>
        </div>
        <div id="listMenuKhusus"></div>
      </section>

      <!-- PENGUMUMAN -->
      <section id="sectionPengumuman" style="margin-bottom:24px;scroll-margin-top:80px;">
        <div class="section-head">
          <h3><span data-icon="megaphone"></span> Pengumuman</h3>
          <a class="more" href="#">Lihat semua</a>
        </div>
        <div id="listPengumuman"></div>
      </section>

      <!-- PERTEMUAN -->
      <section id="sectionPertemuan" style="margin-bottom:24px;scroll-margin-top:80px;">
        <div class="section-head">
          <h3><span data-icon="calendar"></span> Pertemuan</h3>
          <a class="more" href="#">Semua</a>
        </div>
        <div id="listPertemuan"></div>
      </section>

    </div>
  </main>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item active" data-nav="beranda" href="beranda.html">
    <span data-icon="home"></span>
    Beranda
  </a>
  <a class="nav-item" data-nav="pertemuan" href="#sectionPertemuan">
    <span data-icon="calendar"></span>
    Pertemuan
  </a>
  <a class="nav-item" data-nav="award" href="award.html">
    <span data-icon="award"></span>
    Award
  </a>
  <a class="nav-item" data-nav="aktivitas" href="aktivitas.html">
    <span data-icon="activity"></span>
    Aktivitas
  </a>
  <a class="nav-item" data-nav="profil" href="profil.html">
    <span data-icon="user"></span>
    Profil
  </a>
</nav>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
// ============================================================
// PASANG IKON
// ============================================================
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

UI.bindLogout();

// ============================================================
// SMOOTH SCROLL
// ============================================================
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', (e) => {
    const targetId = a.getAttribute('href');
    if (targetId === '#') return;
    const target = document.querySelector(targetId);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });

    document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
    const parent = a.closest('.sidebar-item');
    if (parent) parent.classList.add('active');

    history.replaceState(null, '', targetId);
  });
});

// ============================================================
// STATE
// ============================================================
let daftarPertemuan = [];
let totalPertemuan = 0;

// ============================================================
// INIT
// ============================================================
(async () => {
  const profile = await Api.requireLogin();
  if (!profile) return;

  renderProfil(profile);
  UI.renderUserHeader(profile);
  renderMenuKhusus(profile);

  loadPengumuman();
  loadPertemuan();
})();

// ============================================================
// RENDER PROFIL
// ============================================================
function renderProfil(p) {
  const avatarEl = document.getElementById('profilAvatar');
  const fotoUrl = Api.fotoSayaUrl('t');
  if (fotoUrl) {
    const img = new Image();
    img.src = fotoUrl;
    img.alt = p.nama;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
    img.onerror = () => { avatarEl.textContent = (p.nama || 'G').charAt(0).toUpperCase(); };
    avatarEl.innerHTML = '';
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = (p.nama || 'G').charAt(0).toUpperCase();
  }

  document.getElementById('profilNama').textContent = p.nama || '-';
  document.getElementById('profilSekolah').textContent =
    p.sekolah ? `${p.sekolah.nama} · ${p.jabatan || '-'}` : (p.jabatan || '-');

  const badges = document.getElementById('profilBadges');
  const peran = p.peran || [];
  badges.innerHTML = peran.map(r => {
    const label = r.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return `<span class="badge">${UI.escapeHtml(label)}</span>`;
  }).join('');
}

// ============================================================
// MENU KHUSUS
// ============================================================
function renderMenuKhusus(p) {
  const menu = [];
  const peranList = p.peran || [];

  // Papan Juara — semua user
  menu.push({
    icon: 'award',
    title: 'Papan Juara',
    desc: 'Hasil NAKULAKU AWARD',
    href: 'award.html',
    warna: 'gold',
  });

  // Aktivitas Saya — semua user
  menu.push({
    icon: 'activity',
    title: 'Aktivitas Saya',
    desc: 'Rapor digital: presensi, tugas, sertifikat',
    href: 'aktivitas.html',
    warna: 'maroon',
  });
  // Galeri Sekolah — untuk SEMUA user
  menu.push({
    icon: 'grid',
    title: 'Galeri Sekolah',
    desc: 'Prestasi & kegiatan 10 sekolah',
    href: 'galeri.html',
    warna: 'gold',
  });
  // KS
  if (peranList.includes('ks')) {
    menu.push({
      icon: 'home',
      title: 'Sekolah Saya',
      desc: 'Input prestasi, kegiatan, pembiasaan',
      href: 'ks/sekolah.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'shield',
      title: 'Dashboard Admin',
      desc: 'Menu verifikasi & kelola',
      href: 'admin/index.html',
      warna: 'gold',
    });
  }

  // Pengurus/Admin
  if (peranList.includes('pengurus') || peranList.includes('super_admin')) {
    menu.push({
      icon: 'users',
      title: 'Data Guru',
      desc: 'Lihat & kelola data seluruh guru',
      href: 'admin/guru.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'upload',
      title: 'Impor Data',
      desc: 'Impor data guru dari file CSV',
      href: 'admin/impor.html',
      warna: 'gold',
    });
    menu.push({
      icon: 'calendar',
      title: 'Kelola Pertemuan',
      desc: 'Tambah/edit pertemuan, materi, dan tugas',
      href: 'admin/pertemuan.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'award',
      title: 'Kelola Award',
      desc: 'Nominasi & juara NAKULAKU AWARD',
      href: 'admin/award.html',
      warna: 'gold',
    });
    menu.push({
      icon: 'fileText',
      title: 'Kelola Sertifikat',
      desc: 'Kelola sertifikat peserta',
      href: 'admin/sertifikat.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'megaphone',
      title: 'Kelola Pengumuman',
      desc: 'Buat & kelola pengumuman',
      href: 'admin/pengumuman.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'messageSquare',
      title: 'Rekap Feedback',
      desc: 'Lihat penilaian peserta per pertemuan',
      href: 'admin/feedback.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'shield',
      title: 'Dashboard Admin',
      desc: 'Semua menu admin dalam satu tempat',
      href: 'admin/index.html',
      warna: 'gold',
    });

    if (peranList.includes('super_admin') && !peranList.includes('ks')) {
      menu.push({
        icon: 'checkCircle',
        title: 'Verifikasi Presensi',
        desc: 'Periksa presensi luar radius (semua sekolah)',
        href: 'ks/verifikasi.html',
        warna: 'maroon',
      });
    }
  }

  cekTugasPengamat();

  if (menu.length === 0) {
    const panel = document.getElementById('panelKhusus');
    if (!peranList.includes('ks') && !peranList.includes('pengurus') && !peranList.includes('super_admin')) {
      panel.classList.add('hidden');
    }
    return;
  }

  renderMenuList(menu);
}

function renderMenuList(menu) {
  const el = document.getElementById('listMenuKhusus');
  el.innerHTML = menu.map(m => `
    <a href="${m.href}" class="pertemuan-item" style="text-decoration:none;color:inherit;">
      <div class="pertemuan-number" style="background:${m.warna === 'gold' ? 'var(--gold-soft)' : 'var(--maroon-soft)'};color:${m.warna === 'gold' ? 'var(--gold-dark)' : 'var(--maroon)'};">
        ${Icons.get(m.icon, { class: 'icon' })}
      </div>
      <div class="pertemuan-body">
        <div class="pertemuan-title">${UI.escapeHtml(m.title)}</div>
        <div class="pertemuan-meta">${UI.escapeHtml(m.desc)}</div>
      </div>
      <span class="chevron">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </a>
  `).join('');

  document.getElementById('panelKhusus').classList.remove('hidden');
}

// ============================================================
// CEK TUGAS PENGAMAT
// ============================================================
async function cekTugasPengamat() {
  const res = await Api.call('pengamat.tugas_saya');
  if (!res.ok || !res.data || res.data.length === 0) return;

  const panel = document.getElementById('panelKhusus');
  const listEl = document.getElementById('listMenuKhusus');

  const menuBaru = `
    <a href="pengamat.html" class="pertemuan-item" style="text-decoration:none;color:inherit;">
      <div class="pertemuan-number" style="background:var(--gold-soft);color:var(--gold-dark);">
        ${Icons.get('users', { class: 'icon' })}
      </div>
      <div class="pertemuan-body">
        <div class="pertemuan-title">Tugas Pengamat</div>
        <div class="pertemuan-meta">${res.data.length} pertemuan ditugaskan</div>
      </div>
      <span class="chevron">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </a>
  `;

  listEl.innerHTML = menuBaru + listEl.innerHTML;

  if (panel.classList.contains('hidden')) panel.classList.remove('hidden');
  if (!panel.querySelector('.section-head')) {
    const headerDiv = document.createElement('div');
    headerDiv.className = 'section-head';
    headerDiv.innerHTML = '<h3><span data-icon="award"></span> Menu Khusus</h3>';
    panel.insertBefore(headerDiv, listEl);
    headerDiv.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = Icons.get(el.dataset.icon);
      el.style.display = 'contents';
    });
  }
}

// ============================================================
// PENGUMUMAN
// ============================================================
async function loadPengumuman() {
  const el = document.getElementById('listPengumuman');
  el.innerHTML = UI.skeletonList(2, 90);

  const res = await Api.call('pengumuman.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pengumuman.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml('megaphone', 'Belum ada pengumuman');
    return;
  }

  el.innerHTML = res.data.map(u => `
    <div class="announce">
      <div class="announce-head">
        ${u.penting ? `<span style="color:var(--gold);">${Icons.get('sparkles', { class: 'icon-sm' })}</span>` : ''}
        <div class="announce-title">${UI.escapeHtml(u.judul)}</div>
      </div>
      ${u.isi ? `<div class="announce-body">${UI.escapeHtml(u.isi)}</div>` : ''}
      <div class="announce-date">${UI.timeAgo(u.dibuat_pada)}</div>
    </div>
  `).join('');
}

// ============================================================
// PERTEMUAN + PROGRES
// ============================================================
async function loadPertemuan() {
  const el = document.getElementById('listPertemuan');
  el.innerHTML = UI.skeletonList(2, 72);

  const res = await Api.call('pertemuan.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pertemuan.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml('calendar', 'Belum ada pertemuan', 'Jadwal akan muncul di sini.');
    document.getElementById('kartuProgres').classList.add('hidden');
    return;
  }

  daftarPertemuan = res.data;
  totalPertemuan = daftarPertemuan.length;

  renderKartuProgres();
  renderListPertemuan();
}

function renderKartuProgres() {
  const selesai = daftarPertemuan.filter(p => p.selesai).length;
  const total = totalPertemuan;
  const persen = total > 0 ? Math.round((selesai / total) * 100) : 0;

  // Cari pertemuan lanjut (terbuka && !selesai)
  const lanjut = daftarPertemuan.find(p => p.terbuka && !p.selesai);
  const semuaSelesai = selesai === total && total > 0;

  const card = document.getElementById('kartuProgres');
  card.classList.remove('hidden');

  document.getElementById('progressCount').textContent = `${selesai}/${total}`;
  document.getElementById('progressPercent').textContent = persen + '%';
  document.getElementById('progressFill').style.width = persen + '%';

  const info = document.getElementById('progressInfo');
  const cta = document.getElementById('progressCta');
  const ctaText = document.getElementById('progressCtaText');

  if (semuaSelesai) {
    info.innerHTML = `${Icons.get('checkCircle', { class: 'icon-sm' })} <span>Selamat! Semua pertemuan telah selesai 🎉</span>`;
    cta.classList.add('hidden');
  } else if (lanjut) {
    info.innerHTML = `${Icons.get('arrowRight', { class: 'icon-sm' })} <span>Lanjut: Pertemuan #${lanjut.urutan} — ${UI.escapeHtml(lanjut.judul)}</span>`;
    cta.href = 'pertemuan.html?id=' + lanjut.id;
    ctaText.textContent = 'Buka Pertemuan #' + lanjut.urutan;
    cta.classList.remove('hidden');
  } else {
    info.innerHTML = `${Icons.get('clock', { class: 'icon-sm' })} <span>Menunggu pertemuan berikutnya dibuka</span>`;
    cta.classList.add('hidden');
  }
}

function renderListPertemuan() {
  const el = document.getElementById('listPertemuan');

  el.innerHTML = daftarPertemuan.map(p => {
    const locked = !p.terbuka;
    const done = p.selesai;
    const cls = locked ? 'locked' : (done ? 'selesai' : '');

    // Tentukan badge
    let badgeHtml = '';
    if (done) {
      badgeHtml = `
        <div class="pertemuan-done-badge">
          ${Icons.get('check', { class: 'icon-sm' })}
          Selesai
        </div>
      `;
    } else if (locked) {
      badgeHtml = `
        <div class="pertemuan-lock-badge">
          ${Icons.get('lock', { class: 'icon-sm' })}
          ${UI.escapeHtml(p.alasan || 'Terkunci')}
        </div>
      `;
    }

    return `
      <div class="pertemuan-item ${cls}" onclick="${locked ? 'showLocked(' + p.id + ')' : 'bukaPertemuan(' + p.id + ')'}">
        <div class="pertemuan-number">
          <div class="num">${locked ? Icons.get('lock', { class: 'icon-sm' }) : p.urutan}</div>
          ${!locked ? `<div class="lbl">PERTEMUAN</div>` : ''}
        </div>
        <div class="pertemuan-body">
          <div class="pertemuan-title">${UI.escapeHtml(p.judul)}</div>
          <div class="pertemuan-meta">
            ${Icons.get('calendar', { class: 'icon-sm' })}
            ${UI.formatTanggal(p.tanggal)}
          </div>
          ${p.lokasi_nama ? `
            <div class="pertemuan-meta">
              ${Icons.get('mapPin', { class: 'icon-sm' })}
              ${UI.escapeHtml(p.lokasi_nama)}
            </div>` : ''}
          ${badgeHtml}
        </div>
        <span class="chevron">${Icons.get(locked ? 'lock' : 'chevronRight', { class: 'icon' })}</span>
      </div>
    `;
  }).join('');
}

// ============================================================
// NAVIGASI
// ============================================================
function bukaPertemuan(id) {
  window.location.href = 'pertemuan.html?id=' + id;
}

function showLocked(id) {
  const p = daftarPertemuan.find(x => x.id === id);
  if (!p) return;
  UI.toast(p.alasan || 'Pertemuan ini masih terkunci', 'warning', 3500);
}
</script>
