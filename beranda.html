<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Beranda — NAKULAKU EKOSISTEM</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* HEADER RATA KIRI */
  .app-header-brand { flex: 1; justify-content: flex-start; }
  .app-header-text { text-align: left; }

  /* ═══════════════════════════════════════════════
     FIX AVATAR OVERLAP — foto harus menutupi initial
     ═══════════════════════════════════════════════ */
  .hero-avatar,
  .user-chip .avatar,
  .drawer-user-avatar,
  .sub-avatar,
  .profile-avatar {
    position: relative;
  }
  .hero-avatar img,
  .user-chip .avatar img,
  .drawer-user-avatar img,
  .sub-avatar img,
  .profile-avatar img {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
    z-index: 1;
    border-radius: inherit;
  }

  /* ═══════════════════════════════════════════════
     HERO PROFIL PREMIUM
     ═══════════════════════════════════════════════ */
  .hero-profil {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 28px;
    padding: 26px 22px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(97,19,41,.3);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-profil::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-profil-inner {
    display: flex; align-items: center; gap: 16px;
    position: relative; z-index: 1;
  }
  .hero-avatar {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: rgba(255,255,255,.15);
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: white;
    flex-shrink: 0; overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
  }
  .hero-info { flex: 1; min-width: 0; }
  .hero-greeting {
    font-size: 12px; opacity: 0.85;
    font-weight: 600; margin-bottom: 4px;
    letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 4px;
  }
  .hero-nama {
    font-size: 18px; font-weight: 800;
    margin-bottom: 4px; letter-spacing: 0.2px;
    line-height: 1.3;
  }
  .hero-sekolah {
    font-size: 12px; opacity: 0.85;
    margin-bottom: 8px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hero-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .hero-badges .badge {
    background: rgba(255,255,255,.15);
    color: white;
    border: 1px solid rgba(201,169,97,.4);
    font-size: 10px;
    padding: 3px 10px;
  }

  /* ═══════════════════════════════════════════════
     QUICK STATS (dalam hero)
     ═══════════════════════════════════════════════ */
  .hero-stats-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
    z-index: 1;
  }
  .hero-stat { text-align: center; }
  .hero-stat-val {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.3px;
  }
  .hero-stat-of {
    font-size: 12px;
    opacity: 0.7;
    font-weight: 700;
  }
  .hero-stat-label {
    font-size: 9.5px;
    font-weight: 700;
    opacity: 0.75;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 2px;
  }
  .hero-stat-divider {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,.2);
  }

  /* ═══════════════════════════════════════════════
     STREAK BADGE (opsional, di hero)
     ═══════════════════════════════════════════════ */
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
    color: white;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.3px;
    margin-top: 8px;
    box-shadow: 0 4px 12px rgba(255,107,53,.3);
    animation: fade-in-up .5s var(--ease-out) .3s both;
  }

  /* ═══════════════════════════════════════════════
     KARTU PROGRES
     ═══════════════════════════════════════════════ */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--sh-sm);
    animation: fade-in-up .5s var(--ease-out) .05s both;
  }
  .progress-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; gap: 12px;
  }
  .progress-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 800; color: var(--maroon);
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .progress-count {
    font-size: 12.5px; font-weight: 800;
    color: var(--maroon); background: var(--maroon-soft);
    padding: 5px 12px; border-radius: 999px;
  }
  .progress-bar-wrap {
    height: 10px; background: var(--bg);
    border-radius: 999px; overflow: hidden;
    margin-bottom: 14px; position: relative;
  }
  .progress-bar-wrap > div {
    height: 100%;
    background: linear-gradient(90deg, var(--maroon) 0%, var(--maroon-light) 50%, var(--gold) 100%);
    border-radius: 999px;
    transition: width 1s var(--ease-out);
  }
  .progress-info {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700; color: var(--ink);
  }
  .progress-info-icon {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .progress-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    width: 100%;
    box-shadow: 0 6px 16px rgba(125,29,58,.25);
    transition: all .2s var(--ease-out);
  }
  .progress-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(125,29,58,.35);
    text-decoration: none;
    color: white;
  }

  /* ═══════════════════════════════════════════════
     COUNTDOWN CARD
     ═══════════════════════════════════════════════ */
  .countdown-card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
    border: 1.5px solid rgba(180,83,9,.2);
    border-radius: 16px;
    margin-bottom: 16px;
    text-decoration: none;
    color: inherit;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .countdown-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(180,83,9,.15);
    border-color: var(--warning);
    text-decoration: none;
  }
  .countdown-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: white;
    color: var(--warning);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  .countdown-body { flex: 1; min-width: 0; }
  .countdown-title {
    font-size: 13px; font-weight: 800;
    color: #78350F;
    margin-bottom: 3px;
  }
  .countdown-desc {
    font-size: 11.5px;
    color: #92400E;
    font-weight: 600;
    line-height: 1.4;
  }
  .countdown-chevron { color: #B45309; opacity: 0.7; flex-shrink: 0; }

  /* ═══════════════════════════════════════════════
     MENU KHUSUS GRID
     ═══════════════════════════════════════════════ */
  .menu-khusus-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .menu-khusus-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 14px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: all .2s var(--ease-out);
    -webkit-tap-highlight-color: transparent;
    box-shadow: var(--sh-xs);
    position: relative;
  }
  .menu-khusus-card:hover {
    border-color: var(--maroon-light);
    box-shadow: var(--sh-md);
    transform: translateY(-3px);
  }
  .menu-khusus-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: var(--maroon-soft);
    color: var(--maroon);
    transition: transform .2s var(--ease-out);
  }
  .menu-khusus-card:hover .menu-khusus-icon { transform: scale(1.08); }
  .menu-khusus-card.gold .menu-khusus-icon {
    background: var(--gold-soft);
    color: var(--gold-dark);
  }
  .menu-khusus-title {
    font-weight: 800; font-size: 14px;
    line-height: 1.3; color: var(--ink);
  }
  .menu-khusus-desc {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.4;
    margin-top: 3px;
  }
  /* Badge notifikasi kecil di pojok menu */
  .menu-khusus-badge {
    position: absolute;
    top: 10px; right: 10px;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    background: var(--danger);
    color: white;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(185,28,28,.4);
    animation: pulse 2s infinite;
  }

  /* ═══════════════════════════════════════════════
     SECTION HEAD
     ═══════════════════════════════════════════════ */
  .section-head-premium {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-head-premium h3 {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 800;
    color: var(--maroon);
    letter-spacing: 0.3px;
  }
  .section-head-premium h3 .icon-wrap {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--maroon-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--maroon);
  }

  /* ═══════════════════════════════════════════════
     PENGUMUMAN
     ═══════════════════════════════════════════════ */
  .announce-premium {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--sh-xs);
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .announce-premium:hover {
    border-color: var(--maroon-light);
    transform: translateY(-1px);
    box-shadow: var(--sh-sm);
  }
  .announce-premium.penting {
    border-color: var(--gold);
    background: linear-gradient(135deg, #FFFFFF 0%, #FBF4E0 100%);
  }
  .announce-head-premium {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .announce-title-premium {
    font-size: 14px; font-weight: 800;
    color: var(--ink); line-height: 1.4;
  }
  .announce-body-premium {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    white-space: pre-line;
  }
  .announce-date-premium {
    font-size: 10.5px;
    color: var(--muted-soft);
    margin-top: 10px;
    font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* ═══════════════════════════════════════════════
     MOTIVASI HARIAN (kalau pengumuman kosong)
     ═══════════════════════════════════════════════ */
  .motivasi-card {
    background: linear-gradient(135deg, #FDF4F7 0%, #FCE7F3 100%);
    border: 1.5px solid rgba(125,29,58,.12);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .motivasi-icon {
    font-size: 28px;
    line-height: 1;
    flex-shrink: 0;
  }
  .motivasi-body { flex: 1; min-width: 0; }
  .motivasi-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--maroon);
    margin-bottom: 4px;
  }
  .motivasi-text {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.6;
    font-style: italic;
    font-weight: 500;
  }

  /* ═══════════════════════════════════════════════
     PERTEMUAN ITEM
     ═══════════════════════════════════════════════ */
  .pertemuan-premium {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    display: flex; align-items: center; gap: 14px;
    border: 1px solid var(--border);
    box-shadow: var(--sh-xs);
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .pertemuan-premium:hover {
    border-color: var(--maroon-light);
    transform: translateY(-2px);
    box-shadow: var(--sh-md);
  }
  .pertemuan-premium.locked {
    opacity: 0.6;
    cursor: not-allowed;
    background: var(--bg);
  }
  .pertemuan-num-premium {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 800; flex-shrink: 0;
    border: 1.5px solid rgba(125,29,58,.1);
  }
  .pertemuan-premium.selesai .pertemuan-num-premium {
    background: linear-gradient(135deg, var(--success-soft) 0%, #D1FAE5 100%);
    color: var(--success);
  }
  .pertemuan-num-premium .n { font-size: 22px; line-height: 1; }

  .pertemuan-body-premium { flex: 1; min-width: 0; }
  .pertemuan-title-premium {
    font-size: 14px; font-weight: 800;
    color: var(--ink); margin-bottom: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pertemuan-meta-premium {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--muted); font-weight: 700;
  }
  .chevron-premium {
    color: #C8BFC3;
    transition: all .2s var(--ease-out);
  }
  .pertemuan-premium:hover .chevron-premium {
    color: var(--maroon);
    transform: translateX(4px);
  }

  .content-section { margin-bottom: 28px; }

  @media (min-width: 900px) {
    .menu-khusus-grid { grid-template-columns: repeat(3, 1fr); }
    .hero-profil { padding: 32px 28px; }
    .hero-nama { font-size: 20px; }
    .hero-avatar { width: 76px; height: 76px; font-size: 30px; }
    .hero-stat-val { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- HEADER MOBILE -->
<header class="app-header">
  <div class="app-header-brand" style="display:flex; align-items:center; gap:10px;">
    <div class="app-header-text" style="text-align:left;">
      <div class="app-header-title">Beranda</div>
      <div class="app-header-sub">KKG Gugus Nakula</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<div class="desktop-layout">

  <!-- SIDEBAR DESKTOP -->
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <img src="assets/img/logo-mark.svg" alt="Nakula" />
      </div>
      <div class="sidebar-brand-text">
        <div class="name">NAKULAKU</div>
        <div class="sub">KKG Gugus Nakula</div>
      </div>
    </div>

    <nav class="sidebar-menu">
      <a class="sidebar-item active" data-nav="beranda" href="beranda.html">
        <span data-icon="home"></span> Beranda
      </a>
      <a class="sidebar-item" data-nav="pertemuan" href="#sectionPertemuan">
        <span data-icon="calendar"></span> Pertemuan
      </a>
      <a class="sidebar-item galeri-menu" data-nav="galeri" href="galeri.html">
        <span data-icon="grid"></span> Galeri Sekolah
      </a>
      <a class="sidebar-item" data-nav="aktivitas" href="aktivitas.html">
        <span data-icon="activity"></span> Aktivitas Saya
      </a>
      <a class="sidebar-item" data-nav="profil" href="profil.html">
        <span data-icon="user"></span> Profil
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="desktop-main">
    <div class="desktop-topbar">
      <h2>Beranda</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-icon" data-act="logout" aria-label="Keluar" title="Keluar">
          <span data-icon="logOut"></span>
        </button>
      </div>
    </div>

    <div class="container page" style="padding-top:20px; max-width: 900px; margin: 0 auto;">

      <!-- HERO PROFIL -->
      <section class="hero-profil">
        <div class="hero-profil-inner">
          <div class="hero-avatar" id="heroAvatarEl"></div>
          <div class="hero-info">
            <div class="hero-greeting" id="heroGreeting">Selamat Datang</div>
            <div class="hero-nama" id="heroNama">Memuat…</div>
            <div class="hero-sekolah" id="heroSekolah">—</div>
            <div class="hero-badges" id="heroBadges"></div>
            <div id="streakWrap"></div>
          </div>
        </div>
        <!-- QUICK STATS (diisi via JS) -->
        <div class="hero-stats-row" id="heroStatsRow">
          <div class="hero-stat">
            <div class="hero-stat-val">—</div>
            <div class="hero-stat-label">Presensi</div>
          </div>
          <div class="hero-stat-divider"></div>
          <div class="hero-stat">
            <div class="hero-stat-val">—</div>
            <div class="hero-stat-label">Tugas</div>
          </div>
          <div class="hero-stat-divider"></div>
          <div class="hero-stat">
            <div class="hero-stat-val">—</div>
            <div class="hero-stat-label">Selesai</div>
          </div>
        </div>
      </section>

      <!-- KARTU PROGRES -->
      <section id="kartuProgres" class="progress-card hidden">
        <div class="progress-head">
          <div class="progress-title">
            <span data-icon="award" class="icon-sm"></span>
            Progres Belajar
          </div>
          <div class="progress-count" id="progressCount">0/0</div>
        </div>
        <div class="progress-bar-wrap">
          <div id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-info" id="progressInfo">
          <div class="progress-info-icon" id="progressIconWrap">
            <span data-icon="arrowRight" class="icon-sm"></span>
          </div>
          <span id="progressText">Memuat…</span>
        </div>
        <a href="#" id="progressCta" class="progress-cta hidden">
          <span data-icon="arrowRight" class="icon-sm"></span>
          <span id="progressCtaText">Lanjut</span>
        </a>
      </section>

      <!-- COUNTDOWN NEXT PERTEMUAN -->
      <div id="countdownNext" class="hidden"></div>

      <!-- MENU KHUSUS -->
      <section id="panelKhusus" class="hidden content-section">
        <div class="section-head-premium">
          <h3>
            <span class="icon-wrap"><span data-icon="sparkles" class="icon-sm"></span></span>
            Menu Khusus
          </h3>
        </div>
        <div id="listMenuKhusus" class="menu-khusus-grid"></div>
      </section>

      <!-- PENGUMUMAN -->
      <section id="sectionPengumuman" class="content-section">
        <div class="section-head-premium">
          <h3>
            <span class="icon-wrap"><span data-icon="megaphone" class="icon-sm"></span></span>
            Pengumuman
          </h3>
        </div>
        <div id="listPengumuman"></div>
      </section>

      <!-- PERTEMUAN -->
      <section id="sectionPertemuan" class="content-section">
        <div class="section-head-premium">
          <h3>
            <span class="icon-wrap"><span data-icon="calendar" class="icon-sm"></span></span>
            Pertemuan Terbaru
          </h3>
        </div>
        <div id="listPertemuan"></div>
      </section>

    </div>
  </main>
</div>

<script src="assets/js/icons.js"></script>

<script>
// ═══════════════════════════════════════════════
// INIT ICONS
// ═══════════════════════════════════════════════
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

UI.bindLogout();

// Smooth scroll untuk anchor link
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', (e) => {
    const targetId = a.getAttribute('href');
    if (targetId === '#') return;
    const target = document.querySelector(targetId);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
    const parent = a.closest('.sidebar-item');
    if (parent) parent.classList.add('active');
    history.replaceState(null, '', targetId);
  });
});

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let daftarPertemuan = [];
let totalPertemuan = 0;
let profileGlobal = null;

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
(async () => {
  const profile = await Api.requireLogin();
  if (!profile) return;
  profileGlobal = profile;

  const peranList = profile.peran || [];
  const isAdmin = peranList.includes('pengurus') || peranList.includes('super_admin');

  if (!isAdmin) {
    document.querySelectorAll('.galeri-menu').forEach(el => el.style.display = 'none');
  }

  renderProfil(profile);
  UI.renderUserHeader(profile);
  await renderMenuKhusus(profile);

  loadPengumuman();
  loadPertemuan();
})();

// ═══════════════════════════════════════════════
// RENDER PROFIL + GREETING + STATS
// ═══════════════════════════════════════════════
function renderProfil(p) {
  // 1. Sapaan Dinamis + Emoji
  const jam = new Date().getHours();
  let sapaan = 'Selamat Pagi';
  let emoji = '🌅';
  if (jam >= 11 && jam < 15) { sapaan = 'Selamat Siang'; emoji = '🌤️'; }
  else if (jam >= 15 && jam < 19) { sapaan = 'Selamat Sore'; emoji = '🌇'; }
  else if (jam >= 19 || jam < 4) { sapaan = 'Selamat Malam'; emoji = '🌙'; }

  const greetEl = document.getElementById('heroGreeting');
  greetEl.innerHTML = `${sapaan}, Bapak/Ibu <span style="font-size:14px;opacity:0.9;margin-left:2px;">${emoji}</span>`;

  // 2. Foto (bersih, satu elemen — no overlap)
  const avatarEl = document.getElementById('heroAvatarEl');
  avatarEl.innerHTML = '';
  const fotoUrl = Api.fotoSayaUrl('t');
  const init = (p.nama || 'G').charAt(0).toUpperCase();

  if (fotoUrl) {
    const img = document.createElement('img');
    img.src = fotoUrl;
    img.alt = p.nama || 'Foto';
    img.onerror = () => {
      avatarEl.innerHTML = '';
      avatarEl.textContent = init;
    };
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = init;
  }

  // 3. Text Info
  document.getElementById('heroNama').textContent = p.nama || '-';
  document.getElementById('heroSekolah').textContent = p.sekolah ? p.sekolah.nama : (p.jabatan || '-');

  // 4. Badges
  const badges = document.getElementById('heroBadges');
  badges.innerHTML = (p.peran || []).map(r => {
    let label = r.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    if (r === 'peserta') label = 'Guru';
    if (r === 'ks') label = 'Kepala Sekolah';
    return `<span class="badge">${UI.escapeHtml(label)}</span>`;
  }).join('');
}

// ═══════════════════════════════════════════════
// RENDER MENU KHUSUS (dengan FIX narasumber)
// ═══════════════════════════════════════════════
async function renderMenuKhusus(p) {
  const menu = [];
  const peranList = p.peran || [];
  const isAdmin = peranList.includes('pengurus') || peranList.includes('super_admin');
  const isKS = peranList.includes('ks');

  // 1. MENU ADMIN
  if (isAdmin) {
    menu.push({ icon: 'award', title: 'Papan Juara', desc: 'Hasil NAKULAKU AWARD', href: 'award.html', warna: 'gold' });
    menu.push({ icon: 'grid', title: 'Galeri Sekolah', desc: 'Prestasi & kegiatan', href: 'galeri.html', warna: 'gold' });
    menu.push({ icon: 'shield', title: 'Dashboard Admin', desc: 'Kelola seluruh sistem', href: 'admin/index.html', warna: 'maroon' });
  }

  // 2. MENU KS
  if (isKS && !isAdmin) {
    const ksSekolah = p.ks_sekolah || [];
const indukId = ksSekolah.find(k => k.jenis === 'induk')?.sekolah_id || p.sekolah?.id;
if (indukId) {
  menu.push({ icon: 'home', title: 'Sekolahku', desc: 'Kelola profil & data sekolah', href: `sekolah.html?id=${indukId}`, warna: 'maroon' });
}
    menu.push({ icon: 'checkCircle', title: 'Verifikasi Izin', desc: 'Verifikasi Izin & Sakit', href: 'ks/verifikasi.html', warna: 'gold' });
  }

  // 3. MENU GURU BIASA
  if (!isKS && !isAdmin) {
    if (p.sekolah && p.sekolah.id) {
      menu.push({ icon: 'home', title: 'Sekolahku', desc: 'Profil & portofolio sekolah', href: `sekolah.html?id=${p.sekolah.id}`, warna: 'maroon' });
    }
  }

  // 4. MENU NARASUMBER (FIX: sebelumnya di luar fungsi)
  if (peranList.includes('narasumber') && !isAdmin) {
    menu.push({
      icon: 'edit',
      title: 'Penilaian Tugas',
      desc: 'Koreksi tugas peserta didik',
      href: 'narsum.html',
      warna: 'gold',
    });
  }

  // 5. MENU UMUM
  menu.push({ icon: 'activity', title: 'Aktivitas Saya', desc: 'Rapor digital Anda', href: 'aktivitas.html', warna: 'maroon' });
  menu.push({ icon: 'sparkles', title: 'Karya Saya', desc: 'Inovasi & aksi nyata', href: 'karya.html', warna: 'gold' });

  // 6. Render dulu menu dasar
  if (menu.length > 0) {
    renderMenuList(menu);
  }

  // 7. Tambah kartu pengamat (async, setelah menu dasar tampil)
  await cekTugasPengamat();
}

function renderMenuList(menu) {
  const el = document.getElementById('listMenuKhusus');
  el.innerHTML = menu.map(m => `
    <a href="${m.href}" class="menu-khusus-card ${m.warna === 'gold' ? 'gold' : ''}">
      <div class="menu-khusus-icon">
        ${Icons.get(m.icon, { class: 'icon' })}
      </div>
      <div>
        <div class="menu-khusus-title">${UI.escapeHtml(m.title)}</div>
        <div class="menu-khusus-desc">${UI.escapeHtml(m.desc)}</div>
      </div>
    </a>
  `).join('');

  document.getElementById('panelKhusus').classList.remove('hidden');
}

async function cekTugasPengamat() {
  const res = await Api.call('pengamat.tugas_saya');
  if (!res.ok || !res.data || res.data.length === 0) return;

  const listEl = document.getElementById('listMenuKhusus');
  if (!listEl) return;

  const menuBaru = `
    <a href="pengamat.html" class="menu-khusus-card gold" style="position:relative;">
      <div class="menu-khusus-badge">${res.data.length}</div>
      <div class="menu-khusus-icon">${Icons.get('eye', { class: 'icon' })}</div>
      <div>
        <div class="menu-khusus-title">Tugas Pengamat</div>
        <div class="menu-khusus-desc">${res.data.length} pertemuan ditugaskan</div>
      </div>
    </a>
  `;

  listEl.innerHTML = menuBaru + listEl.innerHTML;
  document.getElementById('panelKhusus').classList.remove('hidden');
}

// ═══════════════════════════════════════════════
// PENGUMUMAN + MOTIVASI
// ═══════════════════════════════════════════════
const MOTIVASI_HARIAN = [
  { icon: '✨', text: 'Guru yang hebat adalah guru yang terus belajar.' },
  { icon: '🌟', text: 'Setiap pertemuan adalah kesempatan untuk tumbuh bersama.' },
  { icon: '💡', text: 'Ilmu yang dibagikan akan terus bertumbuh dan berbuah.' },
  { icon: '🌱', text: 'Pendidikan adalah investasi paling berharga untuk generasi.' },
  { icon: '🚀', text: 'Mulai dari hal kecil, lakukan dengan luar biasa.' },
  { icon: '🎯', text: 'Fokus pada proses, hasil akan mengikuti.' },
  { icon: '📚', text: 'Membaca adalah jendela dunia, mengajar adalah kuncinya.' },
];

function getMotivasiHariIni() {
  const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  return MOTIVASI_HARIAN[dayOfYear % MOTIVASI_HARIAN.length];
}

async function loadPengumuman() {
  const el = document.getElementById('listPengumuman');
  el.innerHTML = UI.skeletonList(2, 90);

  const res = await Api.call('pengumuman.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pengumuman.');
    return;
  }

  if (!res.data || res.data.length === 0) {
    // Tampilkan motivasi harian
    const m = getMotivasiHariIni();
    el.innerHTML = `
      <div class="motivasi-card">
        <div class="motivasi-icon">${m.icon}</div>
        <div class="motivasi-body">
          <div class="motivasi-title">Motivasi Hari Ini</div>
          <div class="motivasi-text">"${UI.escapeHtml(m.text)}"</div>
        </div>
      </div>
    `;
    return;
  }

  el.innerHTML = res.data.map((u, idx) => `
    <div class="announce-premium ${u.penting ? 'penting' : ''}" style="animation-delay:${idx * 0.05}s">
      <div class="announce-head-premium">
        ${u.penting ? `<span style="color:var(--gold);">${Icons.get('sparkles', { class: 'icon-sm' })}</span>` : ''}
        <div class="announce-title-premium">${UI.escapeHtml(u.judul)}</div>
      </div>
      ${u.isi ? `<div class="announce-body-premium">${UI.escapeHtml(u.isi)}</div>` : ''}
      <div class="announce-date-premium">
        ${Icons.get('clock', { class: 'icon-sm' })}
        ${UI.timeAgo(u.dibuat_pada)}
      </div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════
// PERTEMUAN + STATS + COUNTDOWN
// ═══════════════════════════════════════════════
async function loadPertemuan() {
  const el = document.getElementById('listPertemuan');
  el.innerHTML = UI.skeletonList(2, 72);

  const res = await Api.call('pertemuan.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pertemuan.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml(
      'calendar',
      'Belum ada pertemuan',
      'Jadwal pertemuan akan muncul di sini setelah panitia menambahkannya.'
    );
    document.getElementById('kartuProgres').classList.add('hidden');
    renderHeroStats();
    return;
  }

  daftarPertemuan = res.data;
  totalPertemuan = daftarPertemuan.length;

  renderHeroStats();
  renderStreak();
  renderKartuProgres();
  renderCountdownNext();
  renderListPertemuan();
}

// QUICK STATS di hero
function renderHeroStats() {
  const el = document.getElementById('heroStatsRow');
  if (!el) return;

  if (totalPertemuan === 0) {
    el.innerHTML = `
      <div class="hero-stat">
        <div class="hero-stat-val">—</div>
        <div class="hero-stat-label">Presensi</div>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val">—</div>
        <div class="hero-stat-label">Tugas</div>
      </div>
      <div class="hero-stat-divider"></div>
      <div class="hero-stat">
        <div class="hero-stat-val">—</div>
        <div class="hero-stat-label">Selesai</div>
      </div>
    `;
    return;
  }

  const hadir = daftarPertemuan.filter(p => p.progres?.ada_presensi).length;
  const selesai = daftarPertemuan.filter(p => p.selesai).length;

  let tugasTotal = 0, tugasKumpul = 0;
  daftarPertemuan.forEach(p => {
    if (p.progres) {
      tugasTotal += p.progres.tugas_total || 0;
      tugasKumpul += p.progres.tugas_kumpul || 0;
    }
  });

  el.innerHTML = `
    <div class="hero-stat">
      <div class="hero-stat-val">${hadir}<span class="hero-stat-of">/${totalPertemuan}</span></div>
      <div class="hero-stat-label">Presensi</div>
    </div>
    <div class="hero-stat-divider"></div>
    <div class="hero-stat">
      <div class="hero-stat-val">${tugasKumpul}<span class="hero-stat-of">/${tugasTotal}</span></div>
      <div class="hero-stat-label">Tugas</div>
    </div>
    <div class="hero-stat-divider"></div>
    <div class="hero-stat">
      <div class="hero-stat-val">${selesai}<span class="hero-stat-of">/${totalPertemuan}</span></div>
      <div class="hero-stat-label">Selesai</div>
    </div>
  `;
}

// STREAK — berapa pertemuan berturut-turut user hadir
function renderStreak() {
  const wrap = document.getElementById('streakWrap');
  if (!wrap) return;

  const sorted = [...daftarPertemuan]
    .filter(p => p.tanggal)
    .sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

  let streak = 0;
  const now = new Date();
  for (const p of sorted) {
    const sudahLewat = new Date(p.tanggal + 'T23:59:59') <= now;
    if (!sudahLewat) continue;
    if (p.progres?.ada_presensi) streak++;
    else break;
  }

  if (streak < 3) {
    wrap.innerHTML = '';
    return;
  }

  wrap.innerHTML = `
    <div class="streak-badge">
      🔥 ${streak}× berturut-turut hadir
    </div>
  `;
}

// PROGRESS CARD
function renderKartuProgres() {
  const selesai = daftarPertemuan.filter(p => p.selesai).length;
  const total = totalPertemuan;
  const persen = total > 0 ? Math.round((selesai / total) * 100) : 0;

  const lanjut = daftarPertemuan.find(p => p.terbuka && !p.selesai);
  const semuaSelesai = selesai === total && total > 0;

  const card = document.getElementById('kartuProgres');
  card.classList.remove('hidden');

  document.getElementById('progressCount').textContent = `${selesai}/${total} · ${persen}%`;

  setTimeout(() => {
    document.getElementById('progressFill').style.width = persen + '%';
  }, 100);

  const infoIcon = document.getElementById('progressIconWrap');
  const infoText = document.getElementById('progressText');
  const cta = document.getElementById('progressCta');
  const ctaText = document.getElementById('progressCtaText');

  if (semuaSelesai) {
    infoIcon.innerHTML = Icons.get('checkCircle', { class: 'icon-sm' });
    infoIcon.style.background = 'var(--success-soft)';
    infoIcon.style.color = 'var(--success)';
    infoText.innerHTML = '<span>Selamat! Semua pertemuan telah selesai 🎉</span>';
    cta.classList.add('hidden');
  } else if (lanjut) {
    infoIcon.innerHTML = Icons.get('arrowRight', { class: 'icon-sm' });
    infoIcon.style.background = 'var(--gold-soft)';
    infoIcon.style.color = 'var(--gold-dark)';
    infoText.innerHTML = `<span>Lanjut: <strong>Pertemuan #${lanjut.urutan}</strong> — ${UI.escapeHtml(lanjut.judul)}</span>`;
    cta.href = 'pertemuan.html?id=' + lanjut.id;
    ctaText.textContent = 'Buka Pertemuan #' + lanjut.urutan;
    cta.classList.remove('hidden');
  } else {
    infoIcon.innerHTML = Icons.get('clock', { class: 'icon-sm' });
    infoIcon.style.background = 'var(--info-soft)';
    infoIcon.style.color = 'var(--info)';
    infoText.innerHTML = '<span>Menunggu pertemuan berikutnya dibuka</span>';
    cta.classList.add('hidden');
  }
}

// COUNTDOWN NEXT PERTEMUAN (≤7 hari)
function renderCountdownNext() {
  const el = document.getElementById('countdownNext');
  if (!el) return;

  const now = new Date();
  now.setHours(0, 0, 0, 0);

  const upcoming = daftarPertemuan
    .filter(p => p.tanggal)
    .map(p => ({ ...p, _tgl: new Date(p.tanggal + 'T00:00:00') }))
    .filter(p => p._tgl >= now)
    .sort((a, b) => a._tgl - b._tgl)[0];

  if (!upcoming) { el.classList.add('hidden'); return; }

  const diffDays = Math.round((upcoming._tgl - now) / (1000 * 60 * 60 * 24));
  if (diffDays > 7) { el.classList.add('hidden'); return; }

  let text = '';
  if (diffDays === 0) text = 'Hari ini!';
  else if (diffDays === 1) text = 'Besok';
  else text = `${diffDays} hari lagi`;

  el.innerHTML = `
    <a href="pertemuan.html?id=${upcoming.id}" class="countdown-card">
      <div class="countdown-icon">
        ${Icons.get('calendar', { class: 'icon' })}
      </div>
      <div class="countdown-body">
        <div class="countdown-title">⏰ Pertemuan berikutnya ${text}</div>
        <div class="countdown-desc">
          #${upcoming.urutan} — ${UI.escapeHtml(upcoming.judul)}
          · ${UI.formatTanggalPendek(upcoming.tanggal)}
          ${upcoming.lokasi_nama ? '· ' + UI.escapeHtml(upcoming.lokasi_nama) : ''}
        </div>
      </div>
      <span class="countdown-chevron">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </a>
  `;
  el.classList.remove('hidden');
}

// LIST PERTEMUAN
function renderListPertemuan() {
  const el = document.getElementById('listPertemuan');

  el.innerHTML = daftarPertemuan.map((p, idx) => {
    const locked = !p.terbuka;
    const done = p.selesai;
    const cls = locked ? 'locked' : (done ? 'selesai' : '');

    let badgeHtml = '';
    if (done) {
      badgeHtml = `
        <div style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--success-soft);color:var(--success);margin-top:5px;">
          ${Icons.get('check', { class: 'icon-sm' })} Selesai
        </div>
      `;
    } else if (locked) {
      badgeHtml = `
        <div style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--border);color:var(--muted);margin-top:5px;">
          ${Icons.get('lock', { class: 'icon-sm' })} ${UI.escapeHtml(p.alasan || 'Terkunci')}
        </div>
      `;
    }

    return `
      <div class="pertemuan-premium ${cls}" style="animation-delay:${idx * 0.05}s"
           onclick="${locked ? 'showLocked(' + p.id + ')' : 'bukaPertemuan(' + p.id + ')'}">
        <div class="pertemuan-num-premium">
          <div class="n">${locked ? Icons.get('lock', { class: 'icon-sm' }) : p.urutan}</div>
        </div>
        <div class="pertemuan-body-premium">
          <div class="pertemuan-title-premium">${UI.escapeHtml(p.judul)}</div>
          <div class="pertemuan-meta-premium">
            ${Icons.get('calendar', { class: 'icon-sm' })} ${UI.formatTanggal(p.tanggal)}
          </div>
          ${p.lokasi_nama ? `
            <div class="pertemuan-meta-premium">
              ${Icons.get('mapPin', { class: 'icon-sm' })} ${UI.escapeHtml(p.lokasi_nama)}
            </div>
          ` : ''}
          ${badgeHtml}
        </div>
        <span class="chevron-premium">${Icons.get(locked ? 'lock' : 'chevronRight', { class: 'icon' })}</span>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════
function bukaPertemuan(id) { window.location.href = 'pertemuan.html?id=' + id; }
function showLocked(id) {
  const p = daftarPertemuan.find(x => x.id === id);
  if (p) UI.toast(p.alasan || 'Pertemuan ini masih terkunci', 'warning', 3500);
}
</script>
