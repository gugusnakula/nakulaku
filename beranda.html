<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Beranda — NAKULAKU EKOSISTEM</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* HERO PROFIL PREMIUM */
  .hero-profil {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 28px;
    padding: 26px 22px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(97,19,41,.3);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-profil::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-profil-inner {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }
  .hero-avatar {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: rgba(255,255,255,.15);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
    color: white;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
  }
  .hero-avatar img {
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }
  .hero-info { flex: 1; min-width: 0; }
  .hero-greeting {
    font-size: 12px;
    opacity: 0.8;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .hero-nama {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
    line-height: 1.3;
  }
  .hero-sekolah {
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 8px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .hero-badges .badge {
    background: rgba(255,255,255,.15);
    color: white;
    border: 1px solid rgba(201,169,97,.4);
    font-size: 10px;
    padding: 3px 10px;
  }

  /* KARTU PROGRES */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--sh-sm);
    animation: fade-in-up .5s var(--ease-out) .05s both;
    position: relative;
  }
  .progress-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .progress-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    color: var(--maroon);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .progress-count {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--maroon);
    background: var(--maroon-soft);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .progress-bar-wrap {
    height: 10px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
    position: relative;
  }
  .progress-bar-wrap > div {
    height: 100%;
    background: linear-gradient(90deg, var(--maroon) 0%, var(--maroon-light) 50%, var(--gold) 100%);
    border-radius: 999px;
    transition: width 1s var(--ease-out);
    position: relative;
    overflow: hidden;
  }
  .progress-bar-wrap > div::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.35) 50%, transparent 100%);
    animation: shimmer 2s infinite;
    background-size: 200% 100%;
  }
  .progress-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .progress-info-icon {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--gold-soft);
    color: var(--gold-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .progress-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    width: 100%;
    box-shadow: 0 6px 16px rgba(125,29,58,.25);
    transition: all .2s var(--ease-out);
  }
  .progress-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(125,29,58,.35);
    text-decoration: none;
    color: white;
  }

  /* MENU KHUSUS GRID */
  .menu-khusus-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .menu-khusus-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 14px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: all .2s var(--ease-out);
    -webkit-tap-highlight-color: transparent;
    box-shadow: var(--sh-xs);
  }
  .menu-khusus-card:hover {
    border-color: var(--maroon-light);
    box-shadow: var(--sh-md);
    transform: translateY(-3px);
  }
  .menu-khusus-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--maroon-soft);
    color: var(--maroon);
    transition: transform .2s var(--ease-out);
  }
  .menu-khusus-card:hover .menu-khusus-icon {
    transform: scale(1.08);
  }
  .menu-khusus-card.gold .menu-khusus-icon {
    background: var(--gold-soft);
    color: var(--gold-dark);
  }
  .menu-khusus-title {
    font-weight: 800;
    font-size: 14px;
    line-height: 1.3;
    color: var(--ink);
  }
  .menu-khusus-desc {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.4;
    margin-top: 3px;
  }

  /* SECTION HEAD */
  .section-head-premium {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-head-premium h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 800;
    color: var(--maroon);
    letter-spacing: 0.3px;
  }
  .section-head-premium h3 .icon-wrap {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--maroon-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--maroon);
  }
  .section-head-premium .more {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--bg);
    transition: all .15s;
  }
  .section-head-premium .more:hover {
    background: var(--maroon-soft);
    color: var(--maroon);
  }

  /* PENGUMUMAN */
  .announce-premium {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--sh-xs);
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .announce-premium:hover {
    border-color: var(--maroon-light);
    transform: translateY(-1px);
    box-shadow: var(--sh-sm);
  }
  .announce-premium.penting {
    border-color: var(--gold);
    background: linear-gradient(135deg, #FFFFFF 0%, #FBF4E0 100%);
  }
  .announce-head-premium {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .announce-title-premium {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.4;
  }
  .announce-body-premium {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    white-space: pre-line;
  }
  .announce-date-premium {
    font-size: 10.5px;
    color: var(--muted-soft);
    margin-top: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* PERTEMUAN ITEM */
  .pertemuan-premium {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--border);
    box-shadow: var(--sh-xs);
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .pertemuan-premium:hover {
    border-color: var(--maroon-light);
    transform: translateY(-2px);
    box-shadow: var(--sh-md);
  }
  .pertemuan-premium.locked {
    opacity: 0.6;
    cursor: not-allowed;
    background: var(--bg);
  }
  .pertemuan-num-premium {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    flex-shrink: 0;
    border: 1.5px solid rgba(125,29,58,.1);
  }
  .pertemuan-premium.selesai .pertemuan-num-premium {
    background: linear-gradient(135deg, var(--success-soft) 0%, #D1FAE5 100%);
    color: var(--success);
  }
  .pertemuan-num-premium .n { font-size: 22px; line-height: 1; }

  .pertemuan-body-premium { flex: 1; min-width: 0; }
  .pertemuan-title-premium {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pertemuan-meta-premium {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 700;
  }
  .chevron-premium {
    color: #C8BFC3;
    transition: all .2s var(--ease-out);
  }
  .pertemuan-premium:hover .chevron-premium {
    color: var(--maroon);
    transform: translateX(4px);
  }

  .content-section { margin-bottom: 28px; }

  @media (min-width: 900px) {
    .menu-khusus-grid { grid-template-columns: repeat(3, 1fr); }
    .hero-profil { padding: 32px 28px; }
    .hero-nama { font-size: 20px; }
    .hero-avatar { width: 76px; height: 76px; font-size: 30px; }
  }
</style>
</head>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app-nav.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

UI.bindLogout();

document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', (e) => {
    const targetId = a.getAttribute('href');
    if (targetId === '#') return;
    const target = document.querySelector(targetId);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
    const parent = a.closest('.sidebar-item');
    if (parent) parent.classList.add('active');
    history.replaceState(null, '', targetId);
  });
});

let daftarPertemuan = [];
let totalPertemuan = 0;

(async () => {
  const profile = await Api.requireLogin();
  if (!profile) return;

  const peranList = profile.peran || [];
  const isAdmin = peranList.includes('pengurus') || peranList.includes('super_admin');

  // Sembunyikan menu Galeri & Admin di Sidebar jika bukan Admin
  if (!isAdmin) {
    document.querySelectorAll('.galeri-menu').forEach(el => el.style.display = 'none');
  }

  renderProfil(profile);
  UI.renderUserHeader(profile);
  renderMenuKhusus(profile);

  loadPengumuman();
  loadPertemuan();
})();

function renderProfil(p) {
  // Sapaan Dinamis
  const jam = new Date().getHours();
  let sapaan = 'Selamat Pagi';
  if (jam >= 11 && jam < 15) sapaan = 'Selamat Siang';
  else if (jam >= 15 && jam < 19) sapaan = 'Selamat Sore';
  else if (jam >= 19 || jam < 4) sapaan = 'Selamat Malam';
  document.getElementById('heroGreeting').textContent = sapaan + ', Bapak/Ibu';

  const avatarEl = document.getElementById('heroAvatar');
  const fotoUrl = Api.fotoSayaUrl('t');
  if (fotoUrl) {
    const img = new Image();
    img.src = fotoUrl;
    img.alt = p.nama;
    img.onerror = () => { avatarEl.textContent = (p.nama || 'G').charAt(0).toUpperCase(); };
    avatarEl.innerHTML = '';
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = (p.nama || 'G').charAt(0).toUpperCase();
  }

  document.getElementById('heroNama').textContent = p.nama || '-';
  document.getElementById('heroSekolah').textContent = p.sekolah ? p.sekolah.nama : (p.jabatan || '-');

  const badges = document.getElementById('heroBadges');
  badges.innerHTML = (p.peran || []).map(r => {
    const label = r.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return `<span class="badge">${UI.escapeHtml(label)}</span>`;
  }).join('');
}

function renderMenuKhusus(p) {
  const menu = [];
  const peranList = p.peran || [];
  const isAdmin = peranList.includes('pengurus') || peranList.includes('super_admin');
  const isKS = peranList.includes('ks');

  // 1. MENU ADMIN (Hanya untuk Admin)
  if (isAdmin) {
    menu.push({ icon: 'award', title: 'Papan Juara', desc: 'Hasil NAKULAKU AWARD', href: 'award.html', warna: 'gold' });
    menu.push({ icon: 'grid', title: 'Galeri Sekolah', desc: 'Prestasi & kegiatan', href: 'galeri.html', warna: 'gold' });
    menu.push({ icon: 'shield', title: 'Dashboard Admin', desc: 'Kelola seluruh sistem', href: 'admin/index.html', warna: 'maroon' });
  }

  // 2. MENU KS (Hanya Sekolahku & Verifikasi)
  if (isKS && !isAdmin) {
    menu.push({ icon: 'home', title: 'Sekolahku', desc: 'Input prestasi & kegiatan', href: 'ks/sekolah.html', warna: 'maroon' });
    menu.push({ icon: 'checkCircle', title: 'Verifikasi Izin', desc: 'Verifikasi Izin & Sakit', href: 'ks/verifikasi.html', warna: 'gold' });
  }

  // 3. MENU GURU BIASA (Sekolahku Portofolio)
  if (!isKS && !isAdmin) {
    if (p.sekolah && p.sekolah.id) {
      menu.push({ icon: 'home', title: 'Sekolahku', desc: 'Profil & portofolio sekolah', href: `sekolah.html?id=${p.sekolah.id}`, warna: 'maroon' });
    }
  }

  // 4. MENU UMUM (Semua role)
  menu.push({ icon: 'activity', title: 'Aktivitas Saya', desc: 'Rapor digital Anda', href: 'aktivitas.html', warna: 'maroon' });
  menu.push({ icon: 'sparkles', title: 'Karya Saya', desc: 'Inovasi & aksi nyata', href: 'karya.html', warna: 'gold' });

  cekTugasPengamat();

  if (menu.length === 0) return;

  renderMenuList(menu);
}

function renderMenuList(menu) {
  const el = document.getElementById('listMenuKhusus');
  el.innerHTML = menu.map(m => `
    <a href="${m.href}" class="menu-khusus-card ${m.warna === 'gold' ? 'gold' : ''}">
      <div class="menu-khusus-icon">
        ${Icons.get(m.icon, { class: 'icon' })}
      </div>
      <div>
        <div class="menu-khusus-title">${UI.escapeHtml(m.title)}</div>
        <div class="menu-khusus-desc">${UI.escapeHtml(m.desc)}</div>
      </div>
    </a>
  `).join('');

  document.getElementById('panelKhusus').classList.remove('hidden');
}

async function cekTugasPengamat() {
  const res = await Api.call('pengamat.tugas_saya');
  if (!res.ok || !res.data || res.data.length === 0) return;

  const panel = document.getElementById('panelKhusus');
  const listEl = document.getElementById('listMenuKhusus');

  const menuBaru = `
    <a href="pengamat.html" class="menu-khusus-card gold">
      <div class="menu-khusus-icon">${Icons.get('eye', { class: 'icon' })}</div>
      <div>
        <div class="menu-khusus-title">Tugas Pengamat</div>
        <div class="menu-khusus-desc">${res.data.length} pertemuan ditugaskan</div>
      </div>
    </a>
  `;

  listEl.innerHTML = menuBaru + listEl.innerHTML;
  panel.classList.remove('hidden');
}

async function loadPengumuman() {
  const el = document.getElementById('listPengumuman');
  el.innerHTML = UI.skeletonList(2, 90);

  const res = await Api.call('pengumuman.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pengumuman.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml('megaphone', 'Belum ada pengumuman');
    return;
  }

  el.innerHTML = res.data.map((u, idx) => `
    <div class="announce-premium ${u.penting ? 'penting' : ''}" style="animation-delay:${idx * 0.05}s">
      <div class="announce-head-premium">
        ${u.penting ? `<span style="color:var(--gold);">${Icons.get('sparkles', { class: 'icon-sm' })}</span>` : ''}
        <div class="announce-title-premium">${UI.escapeHtml(u.judul)}</div>
      </div>
      ${u.isi ? `<div class="announce-body-premium">${UI.escapeHtml(u.isi)}</div>` : ''}
      <div class="announce-date-premium">
        ${Icons.get('clock', { class: 'icon-sm' })}
        ${UI.timeAgo(u.dibuat_pada)}
      </div>
    </div>
  `).join('');
}

async function loadPertemuan() {
  const el = document.getElementById('listPertemuan');
  el.innerHTML = UI.skeletonList(2, 72);

  const res = await Api.call('pertemuan.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pertemuan.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml('calendar', 'Belum ada pertemuan', 'Jadwal akan muncul di sini.');
    document.getElementById('kartuProgres').classList.add('hidden');
    return;
  }

  daftarPertemuan = res.data;
  totalPertemuan = daftarPertemuan.length;

  renderKartuProgres();
  renderAksiDibutuhkan();
  renderListPertemuan();
}

function renderKartuProgres() {
  const selesai = daftarPertemuan.filter(p => p.selesai).length;
  const total = totalPertemuan;
  const persen = total > 0 ? Math.round((selesai / total) * 100) : 0;

  const lanjut = daftarPertemuan.find(p => p.terbuka && !p.selesai);
  const semuaSelesai = selesai === total && total > 0;

  const card = document.getElementById('kartuProgres');
  card.classList.remove('hidden');

  document.getElementById('progressCount').textContent = `${selesai}/${total} · ${persen}%`;

  setTimeout(() => {
    document.getElementById('progressFill').style.width = persen + '%';
  }, 100);

  const infoIcon = document.getElementById('progressIconWrap');
  const infoText = document.getElementById('progressText');
  const cta = document.getElementById('progressCta');
  const ctaText = document.getElementById('progressCtaText');

  if (semuaSelesai) {
    infoIcon.innerHTML = Icons.get('checkCircle', { class: 'icon-sm' });
    infoIcon.style.background = 'var(--success-soft)';
    infoIcon.style.color = 'var(--success)';
    infoText.innerHTML = '<span>Selamat! Semua pertemuan telah selesai 🎉</span>';
    cta.classList.add('hidden');
  } else if (lanjut) {
    infoIcon.innerHTML = Icons.get('arrowRight', { class: 'icon-sm' });
    infoIcon.style.background = 'var(--gold-soft)';
    infoIcon.style.color = 'var(--gold-dark)';
    infoText.innerHTML = `<span>Lanjut: <strong>Pertemuan #${lanjut.urutan}</strong> — ${UI.escapeHtml(lanjut.judul)}</span>`;
    cta.href = 'pertemuan.html?id=' + lanjut.id;
    ctaText.textContent = 'Buka Pertemuan #' + lanjut.urutan;
    cta.classList.remove('hidden');
  } else {
    infoIcon.innerHTML = Icons.get('clock', { class: 'icon-sm' });
    infoIcon.style.background = 'var(--info-soft)';
    infoIcon.style.color = 'var(--info)';
    infoText.innerHTML = '<span>Menunggu pertemuan berikutnya dibuka</span>';
    cta.classList.add('hidden');
  }
}

function renderAksiDibutuhkan() {
  const section = document.getElementById('sectionAksi');
  if (!section) return;
  const el = document.getElementById('listAksi');

  const perluPresensiBuka = daftarPertemuan.filter(p => p.presensi_status === 'buka' && !(p.progres?.ada_presensi));
  const perluPresensiTutup = daftarPertemuan.filter(p => p.presensi_status === 'tutup' && !(p.progres?.ada_presensi) && !p.selesai);

  const kartuList = [];

  perluPresensiBuka.forEach(p => {
    const tutupStr = p.presensi_tutup ? new Date(p.presensi_tutup).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
    kartuList.push(`
      <a href="presensi.html?id=${p.id}" class="aksi-card urgent">
        <div class="aksi-icon">${Icons.get('camera')}</div>
        <div class="aksi-body">
          <div class="aksi-title">Presensi Sedang Dibuka <span class="aksi-badge">!</span></div>
          <div class="aksi-desc">Pertemuan #${p.urutan} — ${UI.escapeHtml(p.judul)}${tutupStr ? ` · Tutup pukul ${tutupStr} WIB` : ''}</div>
        </div>
        <span class="aksi-chevron">${Icons.get('chevronRight')}</span>
      </a>
    `);
  });

  perluPresensiTutup.forEach(p => {
    kartuList.push(`
      <a href="ajukan.html?id=${p.id}" class="aksi-card danger">
        <div class="aksi-icon">${Icons.get('fileText')}</div>
        <div class="aksi-body">
          <div class="aksi-title">Presensi Terlewat</div>
          <div class="aksi-desc">Pertemuan #${p.urutan} — ${UI.escapeHtml(p.judul)} · Ajukan izin kalau berhalangan</div>
        </div>
        <span class="aksi-chevron">${Icons.get('chevronRight')}</span>
      </a>
    `);
  });

  if (kartuList.length === 0) {
    section.classList.add('hidden');
    el.innerHTML = '';
    return;
  }

  el.innerHTML = kartuList.join('');
  section.classList.remove('hidden');
}

function renderListPertemuan() {
  const el = document.getElementById('listPertemuan');

  el.innerHTML = daftarPertemuan.map((p, idx) => {
    const locked = !p.terbuka;
    const done = p.selesai;
    const cls = locked ? 'locked' : (done ? 'selesai' : '');

    let badgeHtml = '';
    if (done) {
      badgeHtml = `
        <div style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--success-soft);color:var(--success);margin-top:5px;">
          ${Icons.get('check', { class: 'icon-sm' })} Selesai
        </div>
      `;
    } else if (locked) {
      badgeHtml = `
        <div style="display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--border);color:var(--muted);margin-top:5px;">
          ${Icons.get('lock', { class: 'icon-sm' })} ${UI.escapeHtml(p.alasan || 'Terkunci')}
        </div>
      `;
    }

    return `
      <div class="pertemuan-premium ${cls}" style="animation-delay:${idx * 0.05}s"
           onclick="${locked ? 'showLocked(' + p.id + ')' : 'bukaPertemuan(' + p.id + ')'}">
        <div class="pertemuan-num-premium">
          <div class="n">${locked ? Icons.get('lock', { class: 'icon-sm' }) : p.urutan}</div>
        </div>
        <div class="pertemuan-body-premium">
          <div class="pertemuan-title-premium">${UI.escapeHtml(p.judul)}</div>
          <div class="pertemuan-meta-premium">
            ${Icons.get('calendar', { class: 'icon-sm' })} ${UI.formatTanggal(p.tanggal)}
          </div>
          ${p.lokasi_nama ? `
            <div class="pertemuan-meta-premium">
              ${Icons.get('mapPin', { class: 'icon-sm' })} ${UI.escapeHtml(p.lokasi_nama)}
            </div>
          ` : ''}
          ${badgeHtml}
        </div>
        <span class="chevron-premium">${Icons.get(locked ? 'lock' : 'chevronRight', { class: 'icon' })}</span>
      </div>
    `;
  }).join('');
}

function bukaPertemuan(id) { window.location.href = 'pertemuan.html?id=' + id; }
function showLocked(id) {
  const p = daftarPertemuan.find(x => x.id === id);
  if (p) UI.toast(p.alasan || 'Pertemuan ini masih terkunci', 'warning', 3500);
}
</script>
