<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Beranda — NAKULAKU EKOSISTEM</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/nakula.css" />
</head>
<body>

<!-- ============================ MOBILE HEADER ============================ -->
<header class="app-header">
  <div class="app-header-brand">
    <div class="app-header-logo">
      <img src="assets/img/logo-mark.svg" alt="Nakula" />
    </div>
    <div class="app-header-text">
      <div class="app-header-title">NAKULAKU</div>
      <div class="app-header-sub">KKG Gugus Nakula</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<!-- ============================ LAYOUT ============================ -->
<div class="desktop-layout">

  <!-- ============================ SIDEBAR DESKTOP ============================ -->
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <img src="assets/img/logo-mark.svg" alt="Nakula" />
      </div>
      <div class="sidebar-brand-text">
        <div class="name">NAKULAKU</div>
        <div class="sub">KKG Gugus Nakula</div>
      </div>
    </div>

    <nav class="sidebar-menu">
      <a class="sidebar-item active" data-nav="beranda" href="beranda.html">
        <span data-icon="home"></span> Beranda
      </a>
      <a class="sidebar-item" data-nav="pengumuman" href="#sectionPengumuman">
        <span data-icon="megaphone"></span> Pengumuman
      </a>
      <a class="sidebar-item" data-nav="pertemuan" href="#sectionPertemuan">
        <span data-icon="calendar"></span> Pertemuan
      </a>
      <a class="sidebar-item" data-nav="award" href="award.html">
        <span data-icon="award"></span> Papan Juara
      </a>
      <a class="sidebar-item" data-nav="profil" href="profil.html">
        <span data-icon="user"></span> Profil
      </a>
    </nav>
  </aside>

  <!-- ============================ MAIN CONTENT ============================ -->
  <main class="desktop-main">

    <!-- Topbar desktop -->
    <div class="desktop-topbar">
      <h2>Beranda</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-icon" data-act="logout" aria-label="Keluar" title="Keluar">
          <span data-icon="logOut"></span>
        </button>
      </div>
    </div>

    <div class="container page" style="padding-top:20px;">

      <!-- ============================ PROFIL CARD ============================ -->
      <section id="profilCard" class="profile-card" style="margin-bottom:24px;">
        <div class="profile-avatar" id="profilAvatar">?</div>
        <div class="profile-info">
          <div class="profile-name" id="profilNama">Memuat…</div>
          <div class="profile-school" id="profilSekolah">—</div>
          <div class="profile-badges" id="profilBadges"></div>
        </div>
      </section>

      <!-- ============================ MENU KHUSUS (KS/PENGURUS/ADMIN) ============================ -->
      <section id="panelKhusus" class="hidden" style="margin-bottom:24px;scroll-margin-top:80px;">
        <div class="section-head">
          <h3><span data-icon="award"></span> Menu Khusus</h3>
        </div>
        <div id="listMenuKhusus"></div>
      </section>

      <!-- ============================ PENGUMUMAN ============================ -->
      <section id="sectionPengumuman" style="margin-bottom:24px;scroll-margin-top:80px;">
        <div class="section-head">
          <h3><span data-icon="megaphone"></span> Pengumuman</h3>
          <a class="more" href="#">Lihat semua</a>
        </div>
        <div id="listPengumuman"></div>
      </section>

      <!-- ============================ PERTEMUAN ============================ -->
      <section id="sectionPertemuan" style="margin-bottom:24px;scroll-margin-top:80px;">
        <div class="section-head">
          <h3><span data-icon="calendar"></span> Pertemuan</h3>
          <a class="more" href="#">Semua</a>
        </div>
        <div id="listPertemuan"></div>
      </section>

    </div>
  </main>
</div>

<!-- ============================ BOTTOM NAV (MOBILE) ============================ -->
<nav class="bottom-nav">
  <a class="nav-item active" data-nav="beranda" href="beranda.html">
    <span data-icon="home"></span>
    Beranda
  </a>
  <a class="nav-item" data-nav="pertemuan" href="#sectionPertemuan">
    <span data-icon="calendar"></span>
    Pertemuan
  </a>
  <a class="nav-item" data-nav="award" href="award.html">
    <span data-icon="award"></span>
    Award
  </a>
  <a class="nav-item" data-nav="presensi" href="#">
    <span data-icon="mapPin"></span>
    Presensi
  </a>
  <a class="nav-item" data-nav="profil" href="profil.html">
    <span data-icon="user"></span>
    Profil
  </a>
</nav>

<!-- ============================ SCRIPTS ============================ -->
<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
// ============================================================
// PASANG IKON
// ============================================================
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

// ============================================================
// BIND LOGOUT
// ============================================================
UI.bindLogout();

// ============================================================
// SMOOTH SCROLL untuk anchor internal (#sectionXxx)
// ============================================================
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', (e) => {
    const targetId = a.getAttribute('href');
    if (targetId === '#') return;
    const target = document.querySelector(targetId);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });

    document.querySelectorAll('.sidebar-item').forEach(x => x.classList.remove('active'));
    const parent = a.closest('.sidebar-item');
    if (parent) parent.classList.add('active');

    history.replaceState(null, '', targetId);
  });
});

// ============================================================
// INIT — CEK SESI + LOAD DATA
// ============================================================
(async () => {
  const profile = await Api.requireLogin();
  if (!profile) return;

  renderProfil(profile);
  UI.renderUserHeader(profile);
  renderMenuKhusus(profile);

  loadPengumuman();
  loadPertemuan();
})();

// ============================================================
// RENDER PROFIL
// ============================================================
function renderProfil(p) {
  const avatarEl = document.getElementById('profilAvatar');
  const fotoUrl = Api.fotoSayaUrl('t');
  if (fotoUrl) {
    const img = new Image();
    img.src = fotoUrl;
    img.alt = p.nama;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
    img.onerror = () => { avatarEl.textContent = (p.nama || 'G').charAt(0).toUpperCase(); };
    avatarEl.innerHTML = '';
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = (p.nama || 'G').charAt(0).toUpperCase();
  }

  document.getElementById('profilNama').textContent = p.nama || '-';
  document.getElementById('profilSekolah').textContent =
    p.sekolah ? `${p.sekolah.nama} · ${p.jabatan || '-'}` : (p.jabatan || '-');

  const badges = document.getElementById('profilBadges');
  const peran = p.peran || [];
  badges.innerHTML = peran.map(r => {
    const label = r.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    return `<span class="badge">${UI.escapeHtml(label)}</span>`;
  }).join('');
}

// ============================================================
// MENU KHUSUS
// ============================================================
function renderMenuKhusus(p) {
  const menu = [];
  const peranList = p.peran || [];

  // Papan Juara — untuk SEMUA user
  menu.push({
    icon: 'award',
    title: 'Papan Juara',
    desc: 'Hasil NAKULAKU AWARD',
    href: 'award.html',
    warna: 'gold',
  });
  // Sertifikat Saya — untuk SEMUA user
  menu.push({
    icon: 'fileText',
    title: 'Sertifikat Saya',
    desc: 'Lihat & unduh sertifikat periode',
    href: 'sertifikat.html',
    warna: 'maroon',
  });
  // KS → Verifikasi Presensi
  if (peranList.includes('ks')) {
    menu.push({
      icon: 'mapPin',
      title: 'Verifikasi Presensi',
      desc: 'Periksa presensi guru di luar radius',
      href: 'ks/verifikasi.html',
      warna: 'maroon',
    });
  }

  // Pengurus/Admin → Data Guru, Impor, Kelola Pertemuan, Kelola Award
  if (peranList.includes('pengurus') || peranList.includes('super_admin')) {
    menu.push({
      icon: 'users',
      title: 'Data Guru',
      desc: 'Lihat & kelola data seluruh guru',
      href: 'admin/guru.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'upload',
      title: 'Impor Data',
      desc: 'Impor data guru dari file CSV',
      href: 'admin/impor.html',
      warna: 'gold',
    });
    menu.push({
      icon: 'calendar',
      title: 'Kelola Pertemuan',
      desc: 'Tambah/edit pertemuan, materi, dan tugas',
      href: 'admin/pertemuan.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'award',
      title: 'Kelola Award',
      desc: 'Nominasi & juara NAKULAKU AWARD',
      href: 'admin/award.html',
      warna: 'gold',
    });
    menu.push({
      icon: 'fileText',
      title: 'Kelola Sertifikat',
      desc: 'Kelola sertifikat peserta',
      href: 'admin/sertifikat.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'megaphone',
      title: 'Kelola Pengumuman',
      desc: 'Buat & kelola pengumuman',
      href: 'admin/pengumuman.html',
      warna: 'maroon',
    });
    menu.push({
      icon: 'messageSquare',
      title: 'Rekap Feedback',
      desc: 'Lihat penilaian peserta per pertemuan',
      href: 'admin/feedback.html',
      warna: 'maroon',
    });
    if (peranList.includes('super_admin') && !peranList.includes('ks')) {
      menu.push({
        icon: 'checkCircle',
        title: 'Verifikasi Presensi',
        desc: 'Periksa presensi luar radius (semua sekolah)',
        href: 'ks/verifikasi.html',
        warna: 'maroon',
      });
    }
  }

  // Cek tugas pengamat (async)
  cekTugasPengamat();

  if (menu.length === 0) {
    const panel = document.getElementById('panelKhusus');
    if (!peranList.includes('ks') && !peranList.includes('pengurus') && !peranList.includes('super_admin')) {
      panel.classList.add('hidden');
    }
    return;
  }

  renderMenuList(menu);
}

function renderMenuList(menu) {
  const el = document.getElementById('listMenuKhusus');
  el.innerHTML = menu.map(m => `
    <a href="${m.href}" class="pertemuan-item" style="text-decoration:none;color:inherit;">
      <div class="pertemuan-number" style="background:${m.warna === 'gold' ? 'var(--gold-soft)' : 'var(--maroon-soft)'};color:${m.warna === 'gold' ? 'var(--gold-dark)' : 'var(--maroon)'};">
        ${Icons.get(m.icon, { class: 'icon' })}
      </div>
      <div class="pertemuan-body">
        <div class="pertemuan-title">${UI.escapeHtml(m.title)}</div>
        <div class="pertemuan-meta">${UI.escapeHtml(m.desc)}</div>
      </div>
      <span class="chevron">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </a>
  `).join('');

  document.getElementById('panelKhusus').classList.remove('hidden');
}

// ============================================================
// CEK TUGAS PENGAMAT
// ============================================================
async function cekTugasPengamat() {
  const res = await Api.call('pengamat.tugas_saya');
  if (!res.ok || !res.data || res.data.length === 0) return;

  const panel = document.getElementById('panelKhusus');
  const listEl = document.getElementById('listMenuKhusus');

  const menuBaru = `
    <a href="pengamat.html" class="pertemuan-item" style="text-decoration:none;color:inherit;">
      <div class="pertemuan-number" style="background:var(--gold-soft);color:var(--gold-dark);">
        ${Icons.get('users', { class: 'icon' })}
      </div>
      <div class="pertemuan-body">
        <div class="pertemuan-title">Tugas Pengamat</div>
        <div class="pertemuan-meta">${res.data.length} pertemuan ditugaskan</div>
      </div>
      <span class="chevron">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </a>
  `;

  listEl.innerHTML = menuBaru + listEl.innerHTML;

  if (panel.classList.contains('hidden')) panel.classList.remove('hidden');
  if (!panel.querySelector('.section-head')) {
    const headerDiv = document.createElement('div');
    headerDiv.className = 'section-head';
    headerDiv.innerHTML = '<h3><span data-icon="award"></span> Menu Khusus</h3>';
    panel.insertBefore(headerDiv, listEl);
    headerDiv.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = Icons.get(el.dataset.icon);
      el.style.display = 'contents';
    });
  }
}

// ============================================================
// PENGUMUMAN
// ============================================================
async function loadPengumuman() {
  const el = document.getElementById('listPengumuman');
  el.innerHTML = UI.skeletonList(2, 90);

  const res = await Api.call('pengumuman.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pengumuman.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml('megaphone', 'Belum ada pengumuman');
    return;
  }

  el.innerHTML = res.data.map(u => `
    <div class="announce">
      <div class="announce-head">
        ${u.penting ? `<span style="color:var(--gold);">${Icons.get('sparkles', { class: 'icon-sm' })}</span>` : ''}
        <div class="announce-title">${UI.escapeHtml(u.judul)}</div>
      </div>
      ${u.isi ? `<div class="announce-body">${UI.escapeHtml(u.isi)}</div>` : ''}
      <div class="announce-date">${UI.timeAgo(u.dibuat_pada)}</div>
    </div>
  `).join('');
}

// ============================================================
// PERTEMUAN
// ============================================================
async function loadPertemuan() {
  const el = document.getElementById('listPertemuan');
  el.innerHTML = UI.skeletonList(2, 72);

  const res = await Api.call('pertemuan.list');

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat pertemuan.');
    return;
  }
  if (!res.data || res.data.length === 0) {
    el.innerHTML = UI.emptyHtml('calendar', 'Belum ada pertemuan', 'Jadwal akan muncul di sini.');
    return;
  }

  el.innerHTML = res.data.map(p => `
    <div class="pertemuan-item" onclick="bukaPertemuan(${p.id})">
      <div class="pertemuan-number">
        <div class="num">${p.urutan}</div>
        <div class="lbl">PERTEMUAN</div>
      </div>
      <div class="pertemuan-body">
        <div class="pertemuan-title">${UI.escapeHtml(p.judul)}</div>
        <div class="pertemuan-meta">
          ${Icons.get('calendar', { class: 'icon-sm' })}
          ${UI.formatTanggal(p.tanggal)}
        </div>
        ${p.lokasi_nama ? `
          <div class="pertemuan-meta">
            ${Icons.get('mapPin', { class: 'icon-sm' })}
            ${UI.escapeHtml(p.lokasi_nama)}
          </div>` : ''}
      </div>
      <span class="chevron">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </div>
  `).join('');
}

// ============================================================
// NAVIGASI
// ============================================================
function bukaPertemuan(id) {
  window.location.href = 'pertemuan.html?id=' + id;
}

function bukaPresensi(id) {
  window.location.href = 'presensi.html?id=' + id;
}
</script>

</body>
</html>
