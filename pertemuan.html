<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Detail Pertemuan — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  .hero-card {
    background: linear-gradient(135deg, var(--maroon-dark) 0%, var(--maroon) 100%);
    color: white;
    border-radius: var(--r-xl);
    padding: 24px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(125,29,58,.25);
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.08;
  }
  .hero-number {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.4);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 12px;
  }
  .hero-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 16px;
    position: relative;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 6px;
    position: relative;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: var(--r-md);
    margin: 20px 0 16px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    min-width: 80px;
    padding: 10px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: all .15s;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: var(--sh-sm);
  }
  .tab-badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--success-soft);
    color: var(--success);
    font-weight: 800;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .status-card {
    border-radius: var(--r-lg);
    padding: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .status-card.belum { border-left: 4px solid var(--warning); }
  .status-card.sudah { border-left: 4px solid var(--success); }
  .status-card.info { border-left: 4px solid var(--info); }

  /* Badge window presensi */
  .presensi-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    margin-top: 5px;
  }
  .presensi-badge.buka {
    background: var(--success-soft);
    color: var(--success);
  }
  .presensi-badge.belum {
    background: var(--border);
    color: var(--muted);
  }
  .presensi-badge.tutup {
    background: var(--danger-soft);
    color: var(--danger);
  }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="app-header-brand">
    <a href="beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Detail Pertemuan</div>
      <div class="app-header-sub">KKG Gugus Nakula</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;">

  <!-- Loading -->
  <div id="loading">
    <div class="skeleton" style="height:160px;border-radius:24px;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:44px;border-radius:12px;margin-bottom:20px;"></div>
    <div class="skeleton" style="height:120px;border-radius:16px;"></div>
  </div>

  <!-- Content -->
  <div id="content" class="hidden">

    <!-- Hero -->
    <div class="hero-card" id="hero"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="presensi">
        <span data-icon="mapPin"></span> Presensi
      </button>
      <button class="tab" data-tab="materi">
        <span data-icon="book"></span> Materi
      </button>
      <button class="tab" data-tab="tugas">
        <span data-icon="clipboard"></span> Tugas
      </button>
      <button class="tab hidden" data-tab="feedback" id="tabFeedback">
        <span data-icon="star"></span> Feedback
      </button>
    </div>

    <!-- Panel: Presensi -->
    <div class="panel active" data-panel="presensi" id="panelPresensi"></div>

    <!-- Panel: Materi -->
    <div class="panel" data-panel="materi" id="panelMateri"></div>

    <!-- Panel: Tugas -->
    <div class="panel" data-panel="tugas" id="panelTugas"></div>

    <!-- Panel: Feedback -->
    <div class="panel" data-panel="feedback" id="panelFeedback"></div>

  </div>

  <!-- Error -->
  <div id="error" class="hidden"></div>

</main>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a class="nav-item" data-nav="beranda" href="beranda.html">
    <span data-icon="home"></span> Beranda
  </a>
  <a class="nav-item active" data-nav="pertemuan" href="#">
    <span data-icon="calendar"></span> Pertemuan
  </a>
  <a class="nav-item" data-nav="galeri" href="galeri.html">
    <span data-icon="grid"></span> Galeri
  </a>
  <a class="nav-item" data-nav="aktivitas" href="aktivitas.html">
    <span data-icon="activity"></span> Aktivitas
  </a>
  <a class="nav-item" data-nav="profil" href="profil.html">
    <span data-icon="user"></span> Profil
  </a>
</nav>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

UI.bindLogout();

const params = new URLSearchParams(window.location.search);
const pertemuanId = params.get('id');

if (!pertemuanId) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.remove('hidden');
  document.getElementById('error').innerHTML = UI.errorHtml(
    'Pertemuan tidak ditentukan.',
    '<a href="beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
  );
}

(async () => {
  const profile = await Api.requireLogin();
  if (!profile || !pertemuanId) return;

  const res = await Api.call('pertemuan.detail', { pertemuan_id: Number(pertemuanId) });

  document.getElementById('loading').classList.add('hidden');

  if (!res.ok || !res.data) {
    document.getElementById('error').classList.remove('hidden');
    const errMsg = res.error || 'Gagal memuat data pertemuan.';
    const terkunci = errMsg.includes('Selesaikan Pertemuan') || errMsg.includes('terkunci');

    if (terkunci) {
      document.getElementById('error').innerHTML = `
        <div class="empty" style="padding:60px 20px;">
          <div class="empty-icon" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:var(--warning);">
            ${Icons.get('lock', { class: 'icon-lg' })}
          </div>
          <div class="empty-title" style="font-size:16px;">Pertemuan Terkunci</div>
          <div class="empty-desc" style="margin-bottom:20px;">${UI.escapeHtml(errMsg)}</div>
          <a href="beranda.html" class="btn btn-primary" style="display:inline-flex;">
            ${Icons.get('chevronLeft', { class: 'icon-sm' })}
            Kembali ke Beranda
          </a>
        </div>
      `;
    } else {
      document.getElementById('error').innerHTML = UI.errorHtml(
        errMsg,
        '<a href="beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
      );
    }
    return;
  }

  render(res.data);
})();

function render(data) {
  const p = data.pertemuan;
  document.title = p.judul + ' — NAKULAKU';
  document.getElementById('content').classList.remove('hidden');

  document.getElementById('hero').innerHTML = `
    <div class="hero-number">
      ${Icons.get('calendar', { class: 'icon-sm' })}
      PERTEMUAN #${p.urutan}
    </div>
    <h1 class="hero-title">${UI.escapeHtml(p.judul)}</h1>
    <div class="hero-meta">
      ${Icons.get('calendar', { class: 'icon-sm' })}
      ${UI.formatTanggal(p.tanggal)}${p.jam_mulai ? ' · ' + UI.formatJam(p.jam_mulai) : ''}
    </div>
    ${p.lokasi_nama ? `
      <div class="hero-meta">
        ${Icons.get('mapPin', { class: 'icon-sm' })}
        ${UI.escapeHtml(p.lokasi_nama)}
      </div>` : ''}
    ${p.narasumber_nama ? `
      <div class="hero-meta">
        ${Icons.get('user', { class: 'icon-sm' })}
        ${UI.escapeHtml(p.narasumber_nama)}
      </div>` : ''}
  `;

  renderPresensi(data.presensi_saya, p, data);
  renderMateri(data.materi);
  renderTugas(data.tugas, data.pengumpulan_saya);
  cekFeedback(p);

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const nama = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.toggle('active', panel.dataset.panel === nama);
      });
    });
  });
}

// ============================================================
// BADGE WINDOW PRESENSI (helper)
// ============================================================
function badgeWindow(data) {
  if (!data.presensi_status || !data.presensi_buka || !data.presensi_tutup) return '';

  const buka = new Date(data.presensi_buka).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  const tutup = new Date(data.presensi_tutup).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

  const map = {
    buka:  { label: 'Presensi Dibuka',       icon: 'checkCircle' },
    belum: { label: 'Presensi Belum Dibuka', icon: 'lock' },
    tutup: { label: 'Presensi Ditutup',      icon: 'x' },
  };
  const m = map[data.presensi_status] || map.belum;

  return `
    <div class="presensi-badge ${data.presensi_status}" style="margin-bottom:12px;">
      ${Icons.get(m.icon, { class: 'icon-sm' })}
      ${m.label} · ${buka}–${tutup}
    </div>
  `;
}

// ============================================================
// PANEL PRESENSI
// ============================================================
async function renderPresensi(presensi, pertemuan, data) {
  const el = document.getElementById('panelPresensi');

  if (!presensi) {
    const res = await Api.call('izin.saya', { pertemuan_id: pertemuan.id });
    const izin = res.ok ? res.data : null;

    if (izin) {
      const jenisLabel = { ijin: 'Ijin', sakit: 'Sakit', cuti: 'Cuti' }[izin.jenis] || izin.jenis;
      const statusInfo = izin.status_ks === 'menunggu'
        ? { cls: 'badge-warning', text: 'Menunggu Verifikasi KS' }
        : izin.status_ks === 'disetujui'
          ? { cls: 'badge-success', text: 'Disetujui KS' }
          : { cls: 'badge-danger', text: 'Ditolak KS' };

      el.innerHTML = `
        ${badgeWindow(data)}
        <div class="status-card info">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
            <span style="color:var(--info);">${Icons.get('fileText', { class: 'icon-lg' })}</span>
            <div style="font-weight:800;">Ajuan ${jenisLabel}</div>
          </div>
          <div style="margin-bottom:8px;">
            <span class="badge ${statusInfo.cls}">${statusInfo.text}</span>
          </div>
          <div class="text-sm text-muted" style="margin-bottom:12px;">
            <strong>Alasan:</strong> ${UI.escapeHtml(izin.alasan)}
          </div>
          ${izin.catatan_ks ? `
            <div class="text-sm" style="padding:10px;background:var(--bg);border-radius:8px;margin-bottom:12px;">
              <strong>Catatan KS:</strong><br />${UI.escapeHtml(izin.catatan_ks)}
            </div>
          ` : ''}
          ${izin.status_ks === 'menunggu' ? `
            <button class="btn btn-secondary btn-full" onclick="batalkanIzin()">Ubah Ajuan</button>
          ` : ''}
        </div>
      `;
      return;
    }

    el.innerHTML = `
      ${badgeWindow(data)}
      <div class="status-card belum">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <span style="color:var(--warning);">${Icons.get('alertCircle', { class: 'icon-lg' })}</span>
          <div style="font-weight:800;">Belum Presensi</div>
        </div>
        <p class="text-sm text-muted" style="margin-bottom:16px;">
          Silakan isi presensi saat pertemuan berlangsung. Pastikan Anda berada di lokasi kegiatan.
        </p>
        <button class="btn btn-primary btn-full" onclick="mulaiPresensi()" style="margin-bottom:8px;">
          ${Icons.get('camera', { class: 'icon-sm' })}
          Isi Presensi (Selfie + GPS)
        </button>
        <button class="btn btn-secondary btn-full" onclick="ajukanIzin()">
          ${Icons.get('fileText', { class: 'icon-sm' })}
          Ajukan Ijin/Sakit/Cuti
        </button>
      </div>
    `;
    return;
  }

  const statusMap = {
    tepat_waktu: { label: 'Tepat Waktu', cls: 'badge-success', icon: 'checkCircle' },
    terlambat: { label: 'Terlambat', cls: 'badge-warning', icon: 'clock' },
    luar_radius: { label: 'Luar Radius', cls: 'badge-warning', icon: 'alertTriangle' },
    ijin: { label: 'Ijin', cls: 'badge-info', icon: 'fileText' },
    sakit: { label: 'Sakit', cls: 'badge-info', icon: 'fileText' },
    cuti: { label: 'Cuti', cls: 'badge-info', icon: 'fileText' },
    alfa: { label: 'Alfa', cls: 'badge-danger', icon: 'x' },
  };
  const s = statusMap[presensi.status] || statusMap.alfa;

  el.innerHTML = `
    ${badgeWindow(data)}
    <div class="status-card sudah">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <span style="color:var(--success);">${Icons.get(s.icon, { class: 'icon-lg' })}</span>
        <div style="font-weight:800;">Presensi Tercatat</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <span class="badge ${s.cls}">${s.label}</span>
        <span class="text-xs text-muted">+${presensi.poin} poin</span>
      </div>
      <div class="text-xs text-muted" style="margin-top:12px;">
        ${Icons.get('clock', { class: 'icon-sm' })} 
        ${UI.formatTanggalJam(presensi.waktu_submit)}
      </div>
      ${presensi.verifikasi_ks && presensi.verifikasi_ks !== 'menunggu' ? `
        <div class="text-xs ${presensi.verifikasi_ks === 'disetujui' ? '' : 'text-danger'}" style="margin-top:8px;">
          ${presensi.verifikasi_ks === 'disetujui' ? '✓ Diverifikasi KS' : '✗ Ditolak KS'}
        </div>
      ` : ''}
    </div>
  `;
}

// ============================================================
// PANEL MATERI
// ============================================================
function renderMateri(materi) {
  const el = document.getElementById('panelMateri');

  if (!materi || materi.length === 0) {
    el.innerHTML = UI.emptyHtml('book', 'Belum ada materi', 'Materi akan muncul di sini.');
    return;
  }

  el.innerHTML = materi.map(m => `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:start;gap:10px;">
        <div style="width:40px;height:40px;border-radius:12px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${Icons.get('book', { class: 'icon' })}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;margin-bottom:4px;">${UI.escapeHtml(m.judul)}</div>
          ${m.deskripsi ? `<div class="text-sm text-muted" style="margin-bottom:8px;">${UI.escapeHtml(m.deskripsi)}</div>` : ''}
          ${m.link_url ? `
            <a href="${UI.escapeHtml(m.link_url)}" target="_blank" rel="noopener" class="text-sm" style="font-weight:700;display:inline-flex;align-items:center;gap:6px;">
              ${Icons.get('externalLink', { class: 'icon-sm' })}
              Buka Materi
            </a>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

// ============================================================
// PANEL TUGAS
// ============================================================
function renderTugas(tugas, pengumpulanSaya) {
  const el = document.getElementById('panelTugas');

  if (!tugas || tugas.length === 0) {
    el.innerHTML = UI.emptyHtml('clipboard', 'Belum ada tugas');
    return;
  }

  const mapKumpul = {};
  (pengumpulanSaya || []).forEach(p => mapKumpul[p.tugas_id] = p);

  el.innerHTML = tugas.map(t => {
    const kumpul = mapKumpul[t.id];
    const statusBadge = kumpul ? {
      menunggu: '<span class="badge badge-warning">Menunggu Dinilai</span>',
      diterima: '<span class="badge badge-success">Diterima</span>',
      revisi: '<span class="badge badge-info">Perlu Revisi</span>',
      ditolak: '<span class="badge badge-danger">Ditolak</span>',
    }[kumpul.status] : '<span class="badge badge-maroon">Belum Dikumpul</span>';

    return `
      <div class="card" style="margin-bottom:10px;">
        <div style="display:flex;align-items:start;gap:10px;margin-bottom:12px;">
          <div style="width:40px;height:40px;border-radius:12px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            ${Icons.get('clipboard', { class: 'icon' })}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;margin-bottom:4px;">${UI.escapeHtml(t.judul)}</div>
            ${t.deskripsi ? `<div class="text-sm text-muted" style="margin-bottom:6px;">${UI.escapeHtml(t.deskripsi)}</div>` : ''}
            ${t.deadline ? `
              <div class="text-xs text-muted">
                ${Icons.get('clock', { class: 'icon-sm' })} Deadline: ${UI.formatTanggalJam(t.deadline)}
              </div>` : ''}
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          ${statusBadge}
          ${kumpul 
            ? `<button class="btn btn-secondary btn-sm" onclick="lihatTugas(${t.id})">Lihat</button>`
            : `<button class="btn btn-primary btn-sm" onclick="kumpulTugas(${t.id})">Kumpul</button>`}
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// PANEL FEEDBACK
// ============================================================
async function cekFeedback(pertemuan) {
  const res = await Api.call('feedback.saya', { pertemuan_id: pertemuan.id });
  if (!res.ok) return;

  const sudahIsi = res.data;
  const tabFeedback = document.getElementById('tabFeedback');
  tabFeedback.classList.remove('hidden');

  if (sudahIsi) {
    tabFeedback.innerHTML = `<span data-icon="star"></span> Feedback <span class="tab-badge">✓</span>`;
    tabFeedback.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = Icons.get(el.dataset.icon);
      el.style.display = 'contents';
    });
    renderFeedbackSudah(sudahIsi);
  } else {
    renderFeedbackForm(pertemuan);
  }
}

function renderFeedbackSudah(fb) {
  const el = document.getElementById('panelFeedback');
  el.innerHTML = `
    <div class="status-card sudah">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <span style="color:var(--success);">${Icons.get('checkCircle', { class: 'icon-lg' })}</span>
        <div style="font-weight:800;">Feedback Terkirim</div>
      </div>
      <div style="margin-bottom:12px;">
        <div class="text-xs text-muted" style="font-weight:700;">SKOR RATA-RATA</div>
        <div style="font-size:32px;font-weight:800;color:var(--maroon);line-height:1;">${fb.skor_total}</div>
        <div class="text-xs text-muted" style="margin-top:2px;">dari skala 5.0</div>
      </div>
      ${fb.saran ? `
        <div style="padding:10px;background:var(--bg);border-radius:8px;margin-bottom:8px;">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;">SARAN:</div>
          <div style="font-size:13px;line-height:1.5;">${UI.escapeHtml(fb.saran)}</div>
        </div>
      ` : ''}
      ${fb.kritik ? `
        <div style="padding:10px;background:var(--bg);border-radius:8px;">
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;">KRITIK:</div>
          <div style="font-size:13px;line-height:1.5;">${UI.escapeHtml(fb.kritik)}</div>
        </div>
      ` : ''}
      <div class="text-xs text-muted" style="margin-top:12px;">
        ${Icons.get('clock', { class: 'icon-sm' })} 
        ${UI.timeAgo(fb.dibuat_pada)}
      </div>
    </div>
  `;
}

async function renderFeedbackForm(pertemuan) {
  const el = document.getElementById('panelFeedback');
  el.innerHTML = '<div class="skeleton" style="height:200px;border-radius:16px;"></div>';

  const resAspek = await Api.call('feedback.aspek_list', { periode_id: pertemuan.periode_id });
  if (!resAspek.ok || !resAspek.data || resAspek.data.length === 0) {
    el.innerHTML = UI.emptyHtml('info', 'Belum ada aspek feedback');
    return;
  }

  const grouped = {};
  resAspek.data.forEach(a => {
    if (!grouped[a.kategori]) grouped[a.kategori] = [];
    grouped[a.kategori].push(a);
  });

  const kategoriLabel = {
    sekolah: 'Sekolah Tuan Rumah',
    penyelenggara: 'Penyelenggara',
    narasumber: 'Narasumber',
    materi: 'Materi',
    umum: 'Umum',
  };
  const kategoriIcon = {
    sekolah: 'home',
    penyelenggara: 'users',
    narasumber: 'user',
    materi: 'book',
    umum: 'info',
  };

  el.innerHTML = `
    <div class="card" style="margin-bottom:12px;background:var(--maroon-soft);border:none;">
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <span style="color:var(--maroon);">${Icons.get('info', { class: 'icon-lg' })}</span>
        <div>
          <div style="font-weight:800;font-size:13px;margin-bottom:4px;color:var(--maroon);">Bantu kami jadi lebih baik</div>
          <div style="font-size:12.5px;color:var(--ink);line-height:1.5;">
            Isi penilaian Anda terhadap penyelenggaraan pertemuan ini. Feedback bersifat anonim.
          </div>
        </div>
      </div>
    </div>

    ${Object.keys(grouped).map(kat => `
      <div class="card" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);">
          <div style="width:32px;height:32px;border-radius:8px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;">
            ${Icons.get(kategoriIcon[kat] || 'star', { class: 'icon-sm' })}
          </div>
          <div style="font-weight:800;font-size:13.5px;">${kategoriLabel[kat] || kat}</div>
        </div>
        ${grouped[kat].map(a => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
            <div style="flex:1;font-size:12.5px;font-weight:600;line-height:1.4;">${UI.escapeHtml(a.nama_aspek)}</div>
            <div class="fb-rating" data-kat="${kat}" data-aspek="${a.id}">
              ${[1,2,3,4,5].map(n =>
                `<button type="button" data-skor="${n}" style="width:28px;height:28px;border:1.5px solid var(--border);background:var(--surface);border-radius:6px;font-weight:800;font-size:11px;color:var(--muted);cursor:pointer;padding:0;transition:all .12s;">${n}</button>`
              ).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('')}

    <div class="card" style="margin-bottom:10px;">
      <div class="field" style="margin-bottom:12px;">
        <label class="label">Saran (opsional)</label>
        <textarea id="fbSaran" class="input" rows="2" style="resize:vertical;" placeholder="Apa yang perlu dipertahankan?"></textarea>
      </div>
      <div class="field">
        <label class="label">Kritik & Masukan (opsional)</label>
        <textarea id="fbKritik" class="input" rows="2" style="resize:vertical;" placeholder="Apa yang perlu diperbaiki?"></textarea>
      </div>
    </div>

    <button class="btn btn-primary btn-full" id="btnKirimFeedback" style="margin-bottom:16px;">
      ${Icons.get('send', { class: 'icon-sm' })}
      Kirim Feedback
    </button>
  `;

  const ratingState = {};

  el.querySelectorAll('.fb-rating').forEach(r => {
    const kat = r.dataset.kat;
    const aspekId = r.dataset.aspek;
    r.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const skor = Number(b.dataset.skor);
        r.querySelectorAll('button').forEach(x => {
          const on = x === b;
          x.style.background = on ? 'var(--maroon)' : 'var(--surface)';
          x.style.color = on ? 'white' : 'var(--muted)';
          x.style.borderColor = on ? 'var(--maroon)' : 'var(--border)';
        });
        if (!ratingState[kat]) ratingState[kat] = {};
        ratingState[kat][aspekId] = skor;
      });
    });
  });

  el.querySelector('#btnKirimFeedback').addEventListener('click', async () => {
    const btn = el.querySelector('#btnKirimFeedback');
    const totalRating = Object.keys(ratingState).reduce((sum, k) => sum + Object.keys(ratingState[k]).length, 0);
    if (totalRating === 0) { UI.gagal('Isi minimal 1 penilaian.'); return; }

    const ok = await UI.konfirmasi(
      'Kirim Feedback',
      'Feedback tidak bisa diubah setelah dikirim. Lanjutkan?',
      { okText: 'Kirim' }
    );
    if (!ok) return;

    UI.btnLoading(btn, 'Mengirim…');

    const res = await Api.call('feedback.isi', {
      pertemuan_id: pertemuan.id,
      aspek: ratingState,
      saran: el.querySelector('#fbSaran').value.trim(),
      kritik: el.querySelector('#fbKritik').value.trim(),
    });

    UI.btnReset(btn);

    if (!res.ok) { UI.gagal(res.error || 'Gagal mengirim feedback.'); return; }

    UI.sukses('Terima kasih atas feedback Anda!');

    const resSaya = await Api.call('feedback.saya', { pertemuan_id: pertemuan.id });
    if (resSaya.ok && resSaya.data) {
      renderFeedbackSudah(resSaya.data);
      const tabFeedback = document.getElementById('tabFeedback');
      tabFeedback.innerHTML = `<span data-icon="star"></span> Feedback <span class="tab-badge">✓</span>`;
      tabFeedback.querySelectorAll('[data-icon]').forEach(el => {
        el.innerHTML = Icons.get(el.dataset.icon);
        el.style.display = 'contents';
      });
    }
  });
}

// ============================================================
// AKSI
// ============================================================
function mulaiPresensi() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  window.location.href = 'presensi.html?id=' + id;
}

function kumpulTugas(id) {
  window.location.href = 'tugas.html?id=' + id;
}

function lihatTugas(id) {
  window.location.href = 'tugas.html?id=' + id;
}

function ajukanIzin() {
  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get('id'));

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div style="background:white;border-radius:20px;padding:24px;max-width:480px;width:100%;box-shadow:var(--sh-xl);max-height:90vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;">Ajukan Ijin / Sakit / Cuti</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="field">
          <label class="label">Jenis *</label>
          <select id="izinJenis" class="input">
            <option value="">— Pilih —</option>
            <option value="ijin">Ijin</option>
            <option value="sakit">Sakit</option>
            <option value="cuti">Cuti</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Alasan *</label>
          <textarea id="izinAlasan" class="input" rows="3" style="resize:vertical;" placeholder="Jelaskan alasan Anda…"></textarea>
        </div>
        <div class="field">
          <label class="label">Lampiran (opsional)</label>
          <input type="url" id="izinLampiran" class="input" placeholder="https://drive.google.com/…" />
        </div>
      </div>

      <div id="izinAlert" class="alert alert-error" style="margin-top:14px;"></div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnKirimIzin" style="flex:2;">Kirim Ajuan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnKirimIzin').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnKirimIzin');
    const alertBox = overlay.querySelector('#izinAlert');
    alertBox.classList.remove('show');

    const jenis = overlay.querySelector('#izinJenis').value;
    const alasan = overlay.querySelector('#izinAlasan').value.trim();
    const lampiran = overlay.querySelector('#izinLampiran').value.trim();

    if (!jenis) { alertBox.textContent = 'Pilih jenis ajuan.'; alertBox.classList.add('show'); return; }
    if (!alasan) { alertBox.textContent = 'Alasan wajib diisi.'; alertBox.classList.add('show'); return; }

    UI.btnLoading(btn, 'Mengirim…');
    const res = await Api.call('izin.ajukan', {
      pertemuan_id: id,
      jenis,
      alasan,
      lampiran_url: lampiran,
    });
    UI.btnReset(btn);

    if (!res.ok) {
      alertBox.textContent = res.error || 'Gagal mengirim.';
      alertBox.classList.add('show');
      return;
    }

    UI.sukses('Ajuan terkirim. Menunggu verifikasi KS.');
    close();

    const resDetail = await Api.call('pertemuan.detail', { pertemuan_id: id });
    if (resDetail.ok) {
      renderPresensi(resDetail.data.presensi_saya, resDetail.data.pertemuan, resDetail.data);
    }
  });
}

function batalkanIzin() {
  UI.konfirmasi(
    'Ubah Ajuan',
    'Ajuan lama akan diganti. Anda bisa memilih jenis dan alasan baru.',
    { okText: 'Lanjut' }
  ).then(ok => { if (ok) ajukanIzin(); });
}
</script>
