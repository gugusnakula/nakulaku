<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Detail Pertemuan — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* ============================================
     HERO PERTEMUAN
     ============================================ */
  .hero-card {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 24px 20px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.28);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-card::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-number {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.5);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }
  .hero-title {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
    letter-spacing: 0.2px;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    font-weight: 600;
  }
  .hero-meta .icon { opacity: 0.8; }

  /* ============================================
     PROGRESS STEPS
     ============================================ */
  .steps-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 18px 16px;
    margin: 16px 0;
    animation: fade-in-up .5s var(--ease-out) .05s both;
  }
  .steps-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .steps-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 4px;
  }
  .step-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    min-width: 0;
  }
  .step-item::before {
    content: '';
    position: absolute;
    top: 15px;
    left: calc(-50% + 16px);
    right: calc(50% + 16px);
    height: 2px;
    background: var(--border);
    z-index: 0;
  }
  .step-item:first-child::before { display: none; }
  .step-item.done::before,
  .step-item.active::before {
    background: linear-gradient(90deg, var(--success), var(--gold));
  }
  .step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    border: 2px solid var(--border);
    position: relative;
    z-index: 1;
    transition: all .2s var(--ease-out);
  }
  .step-item.done .step-dot {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }
  .step-item.active .step-dot {
    background: linear-gradient(135deg, var(--maroon), var(--maroon-mid));
    color: white;
    border-color: var(--maroon);
    box-shadow: 0 0 0 5px var(--maroon-soft);
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 5px var(--maroon-soft); }
    50% { box-shadow: 0 0 0 8px rgba(125,29,58,.1); }
  }
  .step-label {
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
    word-break: break-word;
  }
  .step-item.done .step-label { color: var(--success); }
  .step-item.active .step-label { color: var(--maroon); }

  /* ============================================
     TABS
     ============================================ */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 14px;
    margin: 20px 0 16px;
    border: 1.5px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 84px;
    padding: 11px 8px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: all .15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: 0 2px 8px rgba(125,29,58,.08);
  }
  .tab-badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 999px;
    background: var(--success-soft);
    color: var(--success);
    font-weight: 800;
  }
  .panel { display: none; }
  .panel.active { display: block; animation: fade-in .3s var(--ease-out) both; }

  /* ============================================
     STATUS CARD (PRESENSI)
     ============================================ */
  .status-card {
    border-radius: 18px;
    padding: 18px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .status-card.belum {
    border-color: rgba(180,83,9,.25);
    background: linear-gradient(135deg, #FFFFFF 0%, #FFFCF3 100%);
  }
  .status-card.sudah {
    border-color: rgba(21,128,61,.25);
    background: linear-gradient(135deg, #FFFFFF 0%, #F5FDF9 100%);
  }
  .status-card.info {
    border-color: rgba(30,64,175,.25);
    background: linear-gradient(135deg, #FFFFFF 0%, #F5F9FF 100%);
  }
  .status-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .status-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 800;
  }
  .status-card.belum .status-icon {
    background: var(--warning-soft);
    color: var(--warning);
  }
  .status-card.sudah .status-icon {
    background: var(--success-soft);
    color: var(--success);
  }
  .status-card.info .status-icon {
    background: var(--info-soft);
    color: var(--info);
  }
  .status-title {
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: 0.2px;
  }
  .status-desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .status-desc strong { color: var(--ink); }

  .status-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .status-badge-lg {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }
  .status-badge-lg.poin {
    background: var(--maroon-soft);
    color: var(--maroon);
  }

  .btn-icon-inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }

  /* ============================================
     ITEM (MATERI & TUGAS)
     ============================================ */
  .item-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    position: relative;
    overflow: hidden;
  }
  .item-card:hover {
    border-color: var(--maroon-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(125,29,58,.08);
  }
  .item-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .item-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform .2s var(--ease-out);
  }
  .item-card:hover .item-icon {
    transform: scale(1.05);
  }
  .item-icon.materi {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
  }
  .item-icon.tugas {
    background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
    color: white;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .item-desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.55;
    font-weight: 500;
  }
  .item-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 6px;
  }
  .item-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--maroon);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--maroon-soft);
    transition: all .15s;
    margin-top: 10px;
  }
  .item-link:hover {
    background: var(--maroon);
    color: white;
    text-decoration: none;
  }
  .item-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  /* ============================================
     EMPTY / ERROR
     ============================================ */
  .empty-panel {
    text-align: center;
    padding: 40px 20px;
  }
  .empty-panel .big-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    position: relative;
  }
  .empty-panel .big-icon svg { width: 36px; height: 36px; }
  .empty-panel h3 {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-panel p {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 280px;
    margin: 0 auto;
  }

  /* Modal konfirmasi custom */
  .modal-sheet {
    position: fixed;
    inset: 0;
    background: rgba(28,20,20,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
    animation: fade-in .2s both;
  }
  .modal-sheet-inner {
    background: white;
    border-radius: 22px;
    padding: 24px;
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(125,29,58,.25);
    animation: scale-in .3s var(--ease-spring) both;
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="app-header-brand">
    <a href="beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Detail Pertemuan</div>
      <div class="app-header-sub">KKG Gugus Nakula</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;padding-bottom:40px;">

  <!-- LOADING -->
  <div id="loading">
    <div class="skeleton" style="height:200px;border-radius:24px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:110px;border-radius:18px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:60px;border-radius:14px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:140px;border-radius:16px;"></div>
  </div>

  <!-- CONTENT -->
  <div id="content" class="hidden">

    <div class="hero-card" id="hero"></div>

    <!-- STEPS -->
    <div class="steps-card" id="stepsCard">
      <div class="steps-title">
        <span data-icon="activity" class="icon-sm"></span>
        Tahapan Pertemuan
      </div>
      <div class="steps-row" id="stepsRow"></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" data-tab="presensi">
        <span data-icon="mapPin" class="icon-sm"></span> Presensi
      </button>
      <button class="tab" data-tab="materi">
        <span data-icon="book" class="icon-sm"></span> Materi
      </button>
      <button class="tab" data-tab="tugas">
        <span data-icon="clipboard" class="icon-sm"></span> Tugas
      </button>
      <button class="tab hidden" data-tab="feedback" id="tabFeedback">
        <span data-icon="star" class="icon-sm"></span> Feedback
      </button>
    </div>

    <div class="panel active" data-panel="presensi" id="panelPresensi"></div>
    <div class="panel" data-panel="materi" id="panelMateri"></div>
    <div class="panel" data-panel="tugas" id="panelTugas"></div>
    <div class="panel" data-panel="feedback" id="panelFeedback"></div>

  </div>

  <!-- ERROR -->
  <div id="error" class="hidden"></div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" data-nav="beranda" href="beranda.html">
    <span data-icon="home"></span> Beranda
  </a>
  <a class="nav-item active" data-nav="pertemuan" href="#">
    <span data-icon="calendar"></span> Pertemuan
  </a>
  <a class="nav-item" data-nav="galeri" href="galeri.html">
    <span data-icon="grid"></span> Galeri
  </a>
  <a class="nav-item" data-nav="aktivitas" href="aktivitas.html">
    <span data-icon="activity"></span> Aktivitas
  </a>
  <a class="nav-item" data-nav="profil" href="profil.html">
    <span data-icon="user"></span> Profil
  </a>
</nav>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
// ============================================================
// PASANG IKON
// ============================================================
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

UI.bindLogout();

const params = new URLSearchParams(window.location.search);
const pertemuanId = params.get('id');

if (!pertemuanId) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.remove('hidden');
  document.getElementById('error').innerHTML = UI.errorHtml(
    'Pertemuan tidak ditentukan.',
    '<a href="beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
  );
}

// ============================================================
// INIT
// ============================================================
(async () => {
  const profile = await Api.requireLogin();
  if (!profile || !pertemuanId) return;

  const res = await Api.call('pertemuan.detail', { pertemuan_id: Number(pertemuanId) });

  document.getElementById('loading').classList.add('hidden');

  if (!res.ok || !res.data) {
    document.getElementById('error').classList.remove('hidden');
    const errMsg = res.error || 'Gagal memuat data pertemuan.';
    const terkunci = errMsg.includes('Selesaikan Pertemuan') || errMsg.includes('terkunci');

    if (terkunci) {
      document.getElementById('error').innerHTML = `
        <div class="empty-panel">
          <div class="big-icon" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:var(--warning);">
            ${Icons.get('lock', { class: 'icon-xl' })}
          </div>
          <h3 style="font-size:17px;">Pertemuan Terkunci</h3>
          <p style="margin-bottom:20px;">${UI.escapeHtml(errMsg)}</p>
          <a href="beranda.html" class="btn btn-primary" style="display:inline-flex;">
            ${Icons.get('chevronLeft', { class: 'icon-sm' })}
            Kembali ke Beranda
          </a>
        </div>
      `;
    } else {
      document.getElementById('error').innerHTML = UI.errorHtml(
        errMsg,
        '<a href="beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
      );
    }
    return;
  }

  render(res.data);
})();

// ============================================================
// RENDER
// ============================================================
function render(data) {
  const p = data.pertemuan;
  document.title = p.judul + ' — NAKULAKU';
  document.getElementById('content').classList.remove('hidden');

  // HERO
  document.getElementById('hero').innerHTML = `
    <div class="hero-number">
      ${Icons.get('calendar', { class: 'icon-sm' })}
      PERTEMUAN #${p.urutan}
    </div>
    <h1 class="hero-title">${UI.escapeHtml(p.judul)}</h1>
    <div class="hero-meta">
      ${Icons.get('calendar', { class: 'icon-sm' })}
      ${UI.formatTanggal(p.tanggal)}${p.jam_mulai ? ' · ' + UI.formatJam(p.jam_mulai) : ''}
    </div>
    ${p.lokasi_nama ? `
      <div class="hero-meta">
        ${Icons.get('mapPin', { class: 'icon-sm' })}
        ${UI.escapeHtml(p.lokasi_nama)}
      </div>` : ''}
    ${p.narasumber_nama ? `
      <div class="hero-meta">
        ${Icons.get('user', { class: 'icon-sm' })}
        ${UI.escapeHtml(p.narasumber_nama)}
      </div>` : ''}
  `;

  // STEPS
  renderSteps(data);

  // PANELS
  renderPresensi(data.presensi_saya, p);
  renderMateri(data.materi);
  renderTugas(data.tugas, data.pengumpulan_saya);
  cekFeedback(p);

  // Tab listener
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const nama = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.toggle('active', panel.dataset.panel === nama);
      });
    });
  });
}

// ============================================================
// STEPS (Presensi · Materi · Tugas · Feedback)
// ============================================================
function renderSteps(data) {
  const p = data.pertemuan;
  const presensi = data.presensi_saya;
  const materi = data.materi || [];
  const tugas = data.tugas || [];
  const pengumpulan = data.pengumpulan_saya || [];

  const stepPresensi = presensi ? 'done' : 'active';
  const stepMateri = materi.length > 0 ? 'done' : (presensi ? 'active' : 'pending');
  const stepTugas = tugas.length === 0
    ? (presensi ? 'done' : 'pending')
    : (pengumpulan.length === tugas.length ? 'done' : (presensi ? 'active' : 'pending'));

  const steps = [
    { label: 'Presensi', icon: 'mapPin', status: stepPresensi },
    { label: 'Materi', icon: 'book', status: stepMateri },
    { label: 'Tugas', icon: 'clipboard', status: stepTugas },
  ];

  const el = document.getElementById('stepsRow');
  el.innerHTML = steps.map((s, i) => {
    const dot = s.status === 'done'
      ? Icons.get('check', { class: 'icon-sm' })
      : (i + 1);
    return `
      <div class="step-item ${s.status}">
        <div class="step-dot">${dot}</div>
        <div class="step-label">${s.label}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// PRESENSI
// ============================================================
async function renderPresensi(presensi, pertemuan) {
  const el = document.getElementById('panelPresensi');

  if (!presensi) {
    const res = await Api.call('izin.saya', { pertemuan_id: pertemuan.id });
    const izin = res.ok ? res.data : null;

    if (izin) {
      const jenisLabel = { ijin: 'Ijin', sakit: 'Sakit', cuti: 'Cuti' }[izin.jenis] || izin.jenis;
      const statusInfo = izin.status_ks === 'menunggu'
        ? { cls: 'badge-warning', text: 'Menunggu Verifikasi KS' }
        : izin.status_ks === 'disetujui'
          ? { cls: 'badge-success', text: 'Disetujui KS' }
          : { cls: 'badge-danger', text: 'Ditolak KS' };

      el.innerHTML = `
        <div class="status-card info">
          <div class="status-head">
            <div class="status-icon">${Icons.get('fileText', { class: 'icon-lg' })}</div>
            <div class="status-title">Ajuan ${jenisLabel}</div>
          </div>

          <div class="status-badges">
            <span class="badge ${statusInfo.cls}">${statusInfo.text}</span>
          </div>

          <div class="status-desc">
            <strong>Alasan:</strong> ${UI.escapeHtml(izin.alasan)}
          </div>

          ${izin.catatan_ks ? `
            <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:14px;font-size:12.5px;line-height:1.55;">
              <strong>Catatan KS:</strong><br>
              ${UI.escapeHtml(izin.catatan_ks)}
            </div>
          ` : ''}

          ${izin.status_ks === 'menunggu' ? `
            <button class="btn btn-secondary btn-full" onclick="batalkanIzin()">
              ${Icons.get('edit', { class: 'icon-sm' })} Ubah Ajuan
            </button>
          ` : ''}
        </div>
      `;
      return;
    }

    el.innerHTML = `
      <div class="status-card belum">
        <div class="status-head">
          <div class="status-icon">${Icons.get('alertCircle', { class: 'icon-lg' })}</div>
          <div class="status-title">Belum Presensi</div>
        </div>
        <div class="status-desc">
          Silakan isi presensi saat pertemuan berlangsung. Pastikan Anda berada di lokasi kegiatan.
        </div>
        <button class="btn btn-primary btn-full" onclick="mulaiPresensi()" style="margin-bottom:8px;">
          ${Icons.get('camera', { class: 'icon-sm' })}
          Isi Presensi (Selfie + GPS)
        </button>
        <button class="btn btn-secondary btn-full" onclick="ajukanIzin()">
          ${Icons.get('fileText', { class: 'icon-sm' })}
          Ajukan Ijin/Sakit/Cuti
        </button>
      </div>
    `;
    return;
  }

  const statusMap = {
    tepat_waktu: { label: 'Tepat Waktu', cls: 'badge-success', icon: 'checkCircle' },
    terlambat: { label: 'Terlambat', cls: 'badge-warning', icon: 'clock' },
    luar_radius: { label: 'Luar Radius', cls: 'badge-warning', icon: 'alertTriangle' },
    ijin: { label: 'Ijin', cls: 'badge-info', icon: 'fileText' },
    sakit: { label: 'Sakit', cls: 'badge-info', icon: 'fileText' },
    cuti: { label: 'Cuti', cls: 'badge-info', icon: 'fileText' },
    alfa: { label: 'Alfa', cls: 'badge-danger', icon: 'x' },
  };
  const s = statusMap[presensi.status] || statusMap.alfa;

  el.innerHTML = `
    <div class="status-card sudah">
      <div class="status-head">
        <div class="status-icon">${Icons.get(s.icon, { class: 'icon-lg' })}</div>
        <div class="status-title">Presensi Tercatat</div>
      </div>

      <div class="status-badges">
        <span class="badge ${s.cls}">${s.label}</span>
        <span class="status-badge-lg poin">
          ${Icons.get('award', { class: 'icon-sm' })}
          +${presensi.poin} poin
        </span>
      </div>

      <div class="btn-icon-inline" style="margin-top:12px;">
        ${Icons.get('clock', { class: 'icon-sm' })}
        ${UI.formatTanggalJam(presensi.waktu_submit)}
      </div>

      ${presensi.verifikasi_ks && presensi.verifikasi_ks !== 'menunggu' ? `
        <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:12.5px;font-weight:700;
          color:${presensi.verifikasi_ks === 'disetujui' ? 'var(--success)' : 'var(--danger)'};">
          ${presensi.verifikasi_ks === 'disetujui' ? '✓ Diverifikasi KS' : '✗ Ditolak KS'}
        </div>
      ` : ''}
    </div>
  `;
}

// ============================================================
// MATERI
// ============================================================
function renderMateri(materi) {
  const el = document.getElementById('panelMateri');

  if (!materi || materi.length === 0) {
    el.innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('book', { class: 'icon-lg' })}</div>
        <h3>Belum Ada Materi</h3>
        <p>Materi akan muncul di sini saat admin menambahkannya.</p>
      </div>
    `;
    return;
  }

  el.innerHTML = materi.map((m, idx) => `
    <div class="item-card" style="animation-delay:${idx * 0.04}s">
      <div class="item-top">
        <div class="item-icon materi">${Icons.get('book', { class: 'icon-sm' })}</div>
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(m.judul)}</div>
          ${m.deskripsi ? `<div class="item-desc">${UI.escapeHtml(m.deskripsi)}</div>` : ''}
        </div>
      </div>
      ${m.link_url ? `
        <a href="${UI.escapeHtml(m.link_url)}" target="_blank" rel="noopener" class="item-link">
          ${Icons.get('externalLink', { class: 'icon-sm' })}
          Buka Materi
        </a>
      ` : ''}
    </div>
  `).join('');
}

// ============================================================
// TUGAS
// ============================================================
function renderTugas(tugas, pengumpulanSaya) {
  const el = document.getElementById('panelTugas');

  if (!tugas || tugas.length === 0) {
    el.innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('clipboard', { class: 'icon-lg' })}</div>
        <h3>Belum Ada Tugas</h3>
        <p>Tugas dari narasumber akan muncul di sini.</p>
      </div>
    `;
    return;
  }

  const mapKumpul = {};
  (pengumpulanSaya || []).forEach(p => mapKumpul[p.tugas_id] = p);

  el.innerHTML = tugas.map((t, idx) => {
    const kumpul = mapKumpul[t.id];
    const statusBadge = kumpul ? {
      menunggu: '<span class="badge badge-warning">Menunggu Dinilai</span>',
      diterima: '<span class="badge badge-success">Diterima</span>',
      revisi: '<span class="badge badge-info">Perlu Revisi</span>',
      ditolak: '<span class="badge badge-danger">Ditolak</span>',
    }[kumpul.status] : '<span class="badge badge-maroon">Belum Dikumpul</span>';

    return `
      <div class="item-card" style="animation-delay:${idx * 0.04}s">
        <div class="item-top">
          <div class="item-icon tugas">${Icons.get('clipboard', { class: 'icon-sm' })}</div>
          <div class="item-info">
            <div class="item-title">${UI.escapeHtml(t.judul)}</div>
            ${t.deskripsi ? `<div class="item-desc">${UI.escapeHtml(t.deskripsi)}</div>` : ''}
            ${t.deadline ? `
              <div class="item-meta">
                ${Icons.get('clock', { class: 'icon-sm' })}
                Deadline: ${UI.formatTanggalJam(t.deadline)}
              </div>` : ''}
          </div>
        </div>

        <div class="item-footer">
          ${statusBadge}
          ${kumpul
            ? `<button class="btn btn-secondary btn-sm" onclick="lihatTugas(${t.id})">${Icons.get('eye', { class: 'icon-sm' })} Lihat</button>`
            : `<button class="btn btn-primary btn-sm" onclick="kumpulTugas(${t.id})">${Icons.get('send', { class: 'icon-sm' })} Kumpul</button>`}
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// FEEDBACK
// ============================================================
async function cekFeedback(pertemuan) {
  const res = await Api.call('feedback.saya', { pertemuan_id: pertemuan.id });
  if (!res.ok) return;

  const sudahIsi = res.data;
  const tabFeedback = document.getElementById('tabFeedback');
  tabFeedback.classList.remove('hidden');

  if (sudahIsi) {
    tabFeedback.innerHTML = `<span data-icon="star"></span> Feedback <span class="tab-badge">✓</span>`;
    tabFeedback.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = Icons.get(el.dataset.icon);
      el.style.display = 'contents';
    });
    renderFeedbackSudah(sudahIsi);
  } else {
    renderFeedbackForm(pertemuan);
  }
}

function renderFeedbackSudah(fb) {
  const el = document.getElementById('panelFeedback');
  el.innerHTML = `
    <div class="status-card sudah">
      <div class="status-head">
        <div class="status-icon">${Icons.get('checkCircle', { class: 'icon-lg' })}</div>
        <div class="status-title">Feedback Terkirim</div>
      </div>

      <div style="text-align:center;padding:16px 0;">
        <div style="font-size:11px;color:var(--muted);font-weight:800;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px;">Skor Rata-rata</div>
        <div style="font-size:42px;font-weight:800;color:var(--maroon);line-height:1;letter-spacing:-1.5px;">${fb.skor_total}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600;">dari skala 5.0</div>
      </div>

      ${fb.saran ? `
        <div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px;">
          <div style="font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:0.5px;margin-bottom:6px;">SARAN</div>
          <div style="font-size:13px;line-height:1.55;">${UI.escapeHtml(fb.saran)}</div>
        </div>
      ` : ''}

      ${fb.kritik ? `
        <div style="padding:12px;background:var(--bg);border-radius:12px;">
          <div style="font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:0.5px;margin-bottom:6px;">KRITIK</div>
          <div style="font-size:13px;line-height:1.55;">${UI.escapeHtml(fb.kritik)}</div>
        </div>
      ` : ''}

      <div class="btn-icon-inline" style="margin-top:14px;">
        ${Icons.get('clock', { class: 'icon-sm' })}
        ${UI.timeAgo(fb.dibuat_pada)}
      </div>
    </div>
  `;
}

async function renderFeedbackForm(pertemuan) {
  const el = document.getElementById('panelFeedback');
  el.innerHTML = '<div class="skeleton" style="height:200px;border-radius:16px;"></div>';

  const resAspek = await Api.call('feedback.aspek_list', { periode_id: pertemuan.periode_id });
  if (!resAspek.ok || !resAspek.data || resAspek.data.length === 0) {
    el.innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('info', { class: 'icon-lg' })}</div>
        <h3>Belum Ada Aspek Feedback</h3>
        <p>Aspek feedback akan muncul setelah admin mengaturnya.</p>
      </div>
    `;
    return;
  }

  const grouped = {};
  resAspek.data.forEach(a => {
    if (!grouped[a.kategori]) grouped[a.kategori] = [];
    grouped[a.kategori].push(a);
  });

  const kategoriLabel = {
    sekolah: 'Sekolah Tuan Rumah',
    penyelenggara: 'Penyelenggara',
    narasumber: 'Narasumber',
    materi: 'Materi',
    umum: 'Umum',
  };
  const kategoriIcon = {
    sekolah: 'home',
    penyelenggara: 'users',
    narasumber: 'user',
    materi: 'book',
    umum: 'info',
  };

  el.innerHTML = `
    <div style="background:linear-gradient(135deg,var(--maroon-soft) 0%, #F9DDE6 100%);border-radius:16px;padding:16px;margin-bottom:16px;">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <div style="width:36px;height:36px;border-radius:10px;background:var(--surface);color:var(--maroon);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${Icons.get('info', { class: 'icon-sm' })}
        </div>
        <div>
          <div style="font-weight:800;font-size:13.5px;margin-bottom:4px;color:var(--maroon);">Bantu Kami Jadi Lebih Baik</div>
          <div style="font-size:12.5px;color:var(--ink);line-height:1.55;">
            Isi penilaian Anda terhadap penyelenggaraan pertemuan ini. Feedback bersifat anonim.
          </div>
        </div>
      </div>
    </div>

    ${Object.keys(grouped).map((kat, idx) => `
      <div class="item-card" style="animation-delay:${idx * 0.05}s">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--border);">
          <div style="width:36px;height:36px;border-radius:10px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;">
            ${Icons.get(kategoriIcon[kat] || 'star', { class: 'icon-sm' })}
          </div>
          <div style="font-weight:800;font-size:14px;">${kategoriLabel[kat] || kat}</div>
        </div>

        ${grouped[kat].map(a => `
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
            <div style="flex:1;font-size:12.5px;font-weight:700;line-height:1.4;">${UI.escapeHtml(a.nama_aspek)}</div>
            <div class="fb-rating" data-kat="${kat}" data-aspek="${a.id}">
              ${[1,2,3,4,5].map(n =>
                `<button type="button" data-skor="${n}" style="width:30px;height:30px;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;font-weight:800;font-size:12px;color:var(--muted);cursor:pointer;padding:0;transition:all .12s;">${n}</button>`
              ).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('')}

    <div class="item-card">
      <div class="field" style="margin-bottom:12px;">
        <label class="label">Saran (opsional)</label>
        <textarea id="fbSaran" class="input" rows="2" style="resize:vertical;" placeholder="Apa yang perlu dipertahankan?"></textarea>
      </div>
      <div class="field">
        <label class="label">Kritik & Masukan (opsional)</label>
        <textarea id="fbKritik" class="input" rows="2" style="resize:vertical;" placeholder="Apa yang perlu diperbaiki?"></textarea>
      </div>
    </div>

    <button class="btn btn-primary btn-full" id="btnKirimFeedback" style="margin-bottom:16px;">
      ${Icons.get('send', { class: 'icon-sm' })}
      Kirim Feedback
    </button>
  `;

  const ratingState = {};

  el.querySelectorAll('.fb-rating').forEach(r => {
    const kat = r.dataset.kat;
    const aspekId = r.dataset.aspek;
    r.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const skor = Number(b.dataset.skor);
        r.querySelectorAll('button').forEach(x => {
          const on = x === b;
          x.style.background = on ? 'var(--maroon)' : 'var(--surface)';
          x.style.color = on ? 'white' : 'var(--muted)';
          x.style.borderColor = on ? 'var(--maroon)' : 'var(--border)';
        });
        if (!ratingState[kat]) ratingState[kat] = {};
        ratingState[kat][aspekId] = skor;
      });
    });
  });

  el.querySelector('#btnKirimFeedback').addEventListener('click', async () => {
    const btn = el.querySelector('#btnKirimFeedback');
    const totalRating = Object.keys(ratingState).reduce((sum, k) => sum + Object.keys(ratingState[k]).length, 0);
    if (totalRating === 0) { UI.gagal('Isi minimal 1 penilaian.'); return; }

    const ok = await UI.konfirmasi(
      'Kirim Feedback',
      'Feedback tidak bisa diubah setelah dikirim. Lanjutkan?',
      { okText: 'Kirim' }
    );
    if (!ok) return;

    UI.btnLoading(btn, 'Mengirim…');

    const res = await Api.call('feedback.isi', {
      pertemuan_id: pertemuan.id,
      aspek: ratingState,
      saran: el.querySelector('#fbSaran').value.trim(),
      kritik: el.querySelector('#fbKritik').value.trim(),
    });

    UI.btnReset(btn);

    if (!res.ok) { UI.gagal(res.error || 'Gagal mengirim feedback.'); return; }

    UI.sukses('Terima kasih atas feedback Anda!');

    const resSaya = await Api.call('feedback.saya', { pertemuan_id: pertemuan.id });
    if (resSaya.ok && resSaya.data) {
      renderFeedbackSudah(resSaya.data);
      const tabFeedback = document.getElementById('tabFeedback');
      tabFeedback.innerHTML = `<span data-icon="star"></span> Feedback <span class="tab-badge">✓</span>`;
      tabFeedback.querySelectorAll('[data-icon]').forEach(el => {
        el.innerHTML = Icons.get(el.dataset.icon);
        el.style.display = 'contents';
      });
    }
  });
}

// ============================================================
// AKSI
// ============================================================
function mulaiPresensi() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  window.location.href = 'presensi.html?id=' + id;
}

function kumpulTugas(id) {
  window.location.href = 'tugas.html?id=' + id;
}

function lihatTugas(id) {
  window.location.href = 'tugas.html?id=' + id;
}

function ajukanIzin() {
  const params = new URLSearchParams(window.location.search);
  const id = Number(params.get('id'));

  const overlay = document.createElement('div');
  overlay.className = 'modal-sheet';
  overlay.innerHTML = `
    <div class="modal-sheet-inner">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;font-weight:800;">Ajukan Ijin / Sakit / Cuti</h3>
        <button data-close class="btn-icon">${Icons.get('x')}</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <label class="label">Jenis *</label>
          <select id="izinJenis" class="input">
            <option value="">— Pilih —</option>
            <option value="ijin">Ijin</option>
            <option value="sakit">Sakit</option>
            <option value="cuti">Cuti</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Alasan *</label>
          <textarea id="izinAlasan" class="input" rows="3" style="resize:vertical;" placeholder="Jelaskan alasan Anda…"></textarea>
        </div>
        <div class="field">
          <label class="label">Lampiran (opsional)</label>
          <input type="url" id="izinLampiran" class="input" placeholder="https://drive.google.com/…" />
        </div>
      </div>

      <div id="izinAlert" class="alert alert-error" style="margin-top:14px;"></div>

      <div style="display:flex;gap:8px;margin-top:20px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnKirimIzin" style="flex:2;">Kirim Ajuan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnKirimIzin').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnKirimIzin');
    const alertBox = overlay.querySelector('#izinAlert');
    alertBox.classList.remove('show');

    const jenis = overlay.querySelector('#izinJenis').value;
    const alasan = overlay.querySelector('#izinAlasan').value.trim();
    const lampiran = overlay.querySelector('#izinLampiran').value.trim();

    if (!jenis) { alertBox.textContent = 'Pilih jenis ajuan.'; alertBox.classList.add('show'); return; }
    if (!alasan) { alertBox.textContent = 'Alasan wajib diisi.'; alertBox.classList.add('show'); return; }

    UI.btnLoading(btn, 'Mengirim…');
    const res = await Api.call('izin.ajukan', {
      pertemuan_id: id,
      jenis,
      alasan,
      lampiran_url: lampiran,
    });
    UI.btnReset(btn);

    if (!res.ok) {
      alertBox.textContent = res.error || 'Gagal mengirim.';
      alertBox.classList.add('show');
      return;
    }

    UI.sukses('Ajuan terkirim. Menunggu verifikasi KS.');
    close();

    const resDetail = await Api.call('pertemuan.detail', { pertemuan_id: id });
    if (resDetail.ok) {
      renderPresensi(resDetail.data.presensi_saya, resDetail.data.pertemuan);
    }
  });
}

function batalkanIzin() {
  UI.konfirmasi(
    'Ubah Ajuan',
    'Ajuan lama akan diganti. Anda bisa memilih jenis dan alasan baru.',
    { okText: 'Lanjut' }
  ).then(ok => { if (ok) ajukanIzin(); });
}
</script>
