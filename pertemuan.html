<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Detail Pertemuan — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* ═══════════════════════════════════════════════
     LAYOUT — 3 KOLOM (desktop) / 1 KOLOM (mobile)
     ═══════════════════════════════════════════════ */
  .hub-layout {
    display: block;
  }
  .hub-rail { display: none; }

  @media (min-width: 900px) {
    .hub-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }
  }
  @media (min-width: 1100px) {
    .hub-layout {
      grid-template-columns: 260px 1fr 320px;
    }
    .hub-rail {
      display: block;
      border-left: 1.5px solid var(--border);
      background: var(--bg);
      padding: 24px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .hub-rail::-webkit-scrollbar { width: 6px; }
    .hub-rail::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 3px;
    }
  }

  /* ═══════════════════════════════════════════════
     BREADCRUMB
     ═══════════════════════════════════════════════ */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .breadcrumb a {
    color: var(--muted);
    text-decoration: none;
    transition: color .15s;
  }
  .breadcrumb a:hover { color: var(--maroon); }
  .breadcrumb .sep { opacity: 0.5; }
  .breadcrumb .current { color: var(--maroon); font-weight: 800; }

  /* ═══════════════════════════════════════════════
     HERO PREMIUM
     ═══════════════════════════════════════════════ */
  .hero-card {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 24px 22px 22px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.28);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-card::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-top-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
  }
  .hero-number {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.4);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .hero-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }
  .hero-status-badge.open {
    background: rgba(34,197,94,.25);
    color: #86EFAC;
    border: 1px solid rgba(34,197,94,.4);
    animation: pulse-badge 2s infinite;
  }
  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .hero-status-badge.done {
    background: rgba(134,239,172,.2);
    color: #86EFAC;
    border: 1px solid rgba(134,239,172,.4);
  }
  .hero-status-badge.closed {
    background: rgba(239,68,68,.2);
    color: #FCA5A5;
    border: 1px solid rgba(239,68,68,.3);
  }

  .hero-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
    color: white; /* fix warna */
  }
  @media (min-width: 900px) {
    .hero-title { font-size: 24px; }
  }

  .hero-meta-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    opacity: 0.92;
  }
  .hero-meta svg { flex-shrink: 0; }

  /* Progress bar di hero */
  .hero-progress {
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
    z-index: 1;
  }
  .hero-progress-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .hero-progress-head .label {
    color: rgba(255,255,255,.9);
    opacity: 1;
  }
  .hero-progress-head .pct { font-size: 13px; font-weight: 800; }
  .hero-progress-bar {
    height: 8px;
    background: rgba(255,255,255,.15);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .hero-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold) 0%, #FCD34D 100%);
    border-radius: 999px;
    transition: width 1s var(--ease-out);
  }
  .hero-progress-items {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
  }
  .hero-p-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 11px;
    border-radius: 999px;
    letter-spacing: 0.2px;
    font-weight: 800;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    transition: all .2s var(--ease-out);
  }
  .hero-p-item.done {
    background: #16A34A;        /* hijau solid */
    color: #ffffff;              /* teks putih */
    border: 1px solid #15803D;
  }
  .hero-p-item.done svg {
    color: #ffffff;
    stroke-width: 3;
  }
  .hero-p-item.pending {
    background: #FFFFFF;         /* putih solid */
    color: #7D1D3A;              /* maroon solid */
    border: 1px solid rgba(125,29,58,.15);
  }
  .hero-p-item.pending svg {
    color: #7D1D3A;
  }
  .hero-p-item svg { width: 11px; height: 11px; }

  /* ═══════════════════════════════════════════════
     PRESENSI CARD (bukan tab — di bawah hero)
     ═══════════════════════════════════════════════ */
  .presensi-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 18px;
    border: 1.5px solid var(--border);
    margin: 16px 0 20px;
    animation: fade-in-up .5s var(--ease-out) .05s both;
  }
  .presensi-card.belum { border-left: 4px solid var(--warning); }
  .presensi-card.sudah { border-left: 4px solid var(--success); }
  .presensi-card.info { border-left: 4px solid var(--info); }

  .presensi-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .presensi-icon-wrap {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .presensi-card.belum .presensi-icon-wrap {
    background: var(--warning-soft);
    color: var(--warning);
  }
  .presensi-card.sudah .presensi-icon-wrap {
    background: var(--success-soft);
    color: var(--success);
  }
  .presensi-card.info .presensi-icon-wrap {
    background: var(--info-soft);
    color: var(--info);
  }
  .presensi-info { flex: 1; min-width: 0; }
  .presensi-title {
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .presensi-sub {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }

  .presensi-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .presensi-actions .btn { flex: 1; min-width: 140px; }

  /* Mini foto + lokasi */
  .presensi-media {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .media-thumb {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg);
    cursor: pointer;
    aspect-ratio: 4/3;
    border: 1.5px solid var(--border);
    transition: all .2s var(--ease-out);
  }
  .media-thumb:hover {
    transform: translateY(-2px);
    border-color: var(--maroon);
    box-shadow: 0 8px 20px rgba(125,29,58,.12);
  }
  .media-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .media-thumb.map {
    background:
      linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #15803D;
    font-size: 11px;
    font-weight: 800;
    text-align: center;
    padding: 12px;
  }
  .media-thumb.map svg { width: 24px; height: 24px; }
  .media-thumb .badge {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(0,0,0,.7);
    color: white;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    letter-spacing: 0.3px;
  }

  /* Countdown */
  .countdown-box {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: linear-gradient(135deg, #F5FDF9 0%, #ECFDF5 100%);
    border: 1px solid rgba(21,128,61,.2);
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--success);
    margin-top: 12px;
  }
  .countdown-box.warning {
    background: linear-gradient(135deg, #FFFCF3 0%, #FEF3C7 100%);
    border-color: rgba(180,83,9,.2);
    color: var(--warning);
  }
  .countdown-box.danger {
    background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
    border-color: rgba(185,28,28,.2);
    color: var(--danger);
    animation: pulse-badge 1s infinite;
  }

  /* ═══════════════════════════════════════════════
     TABS (sticky)
     ═══════════════════════════════════════════════ */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 14px;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 60px;
    z-index: 30;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  .tabs::-webkit-scrollbar { display: none; }
  @media (min-width: 900px) {
    .tabs { top: 0; }
  }
  .tab {
    flex: 1;
    min-width: 90px;
    padding: 11px 10px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: 0 2px 8px rgba(125,29,58,.08);
  }
  .tab-indicator {
    display: none;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 999px;
    margin-left: 2px;
    line-height: 1.3;
  }
  .tab-indicator.done {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: var(--success-soft);
    color: var(--success);
  }
  .tab-indicator.count {
    display: inline-flex;
    background: var(--maroon-soft);
    color: var(--maroon);
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fade-in .25s var(--ease-out) both; }

  /* ═══════════════════════════════════════════════
     PANEL — RINGKASAN
     ═══════════════════════════════════════════════ */
  .section-mini {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .section-mini-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    color: var(--maroon);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 12px;
  }
  .section-mini-title .icon-wrap {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--maroon-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-check {
    width: 20px; height: 20px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 800;
  }
  .todo-check.done {
    background: var(--success-soft);
    color: var(--success);
  }
  .todo-check.pending {
    background: var(--warning-soft);
    color: var(--warning);
  }
  .todo-label { flex: 1; }
  .todo-label.done {
    color: var(--muted);
    text-decoration: line-through;
  }
  .todo-action {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--maroon);
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--maroon-soft);
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    font-family: inherit;
    transition: all .15s;
  }
  .todo-action:hover { background: var(--maroon-soft); }

  .catatan-textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    line-height: 1.6;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: all .15s;
  }
  .catatan-textarea:focus {
    border-color: var(--maroon);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(125,29,58,.08);
  }
  .catatan-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ═══════════════════════════════════════════════
     PANEL — MATERI
     ═══════════════════════════════════════════════ */
  .materi-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
  }
  .materi-item:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 6px 16px rgba(125,29,58,.06);
  }
  .materi-item.read {
    opacity: 0.7;
    background: var(--bg);
  }
  .materi-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .materi-thumb {
    width: 64px; height: 64px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .materi-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .materi-thumb .fb {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .materi-body { flex: 1; min-width: 0; }
  .materi-judul {
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .materi-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .materi-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .btn-mini-icon {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .15s;
    padding: 0;
    flex-shrink: 0;
  }
  .btn-mini-icon:hover { border-color: var(--maroon); color: var(--maroon); }
  .btn-mini-icon.active {
    background: var(--gold);
    color: white;
    border-color: var(--gold);
  }
  .btn-mini-icon.done {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }

  /* ═══════════════════════════════════════════════
     PANEL — TUGAS
     ═══════════════════════════════════════════════ */
  .tugas-filter {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tugas-filter::-webkit-scrollbar { display: none; }
  .tf-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    white-space: nowrap;
  }
  .tf-chip.active {
    background: var(--maroon);
    border-color: var(--maroon);
    color: white;
  }

  .tugas-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
  }
  .tugas-item.urgent {
    border-left: 4px solid var(--danger);
  }
  .tugas-item.soon {
    border-left: 4px solid var(--warning);
  }
  .tugas-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .tugas-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .tugas-body { flex: 1; min-width: 0; }
  .tugas-judul {
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .tugas-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .tugas-deadline {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tugas-deadline.urgent { color: var(--danger); }
  .tugas-deadline.soon { color: var(--warning); }

  .badge-status {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge-status.menunggu { background: var(--warning-soft); color: var(--warning); }
  .badge-status.diterima { background: var(--success-soft); color: var(--success); }
  .badge-status.revisi { background: var(--info-soft); color: var(--info); }
  .badge-status.ditolak { background: var(--danger-soft); color: var(--danger); }
  .badge-status.belum { background: var(--maroon-soft); color: var(--maroon); }

  /* ═══════════════════════════════════════════════
     PANEL — DISKUSI
     ═══════════════════════════════════════════════ */
  .diskusi-intro {
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;

<script>
// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

const params = new URLSearchParams(window.location.search);
const pertemuanId = params.get('id');

let profile = null;
let data = null;
let tabAktif = 'ringkasan';
let daftarDiskusi = [];
let replyToId = null;
let countdownTimer = null;
let pesertaPollTimer = null;

// ═══════════════════════════════════════════════
// INIT DATA
// ═══════════════════════════════════════════════
if (!pertemuanId) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error').classList.remove('hidden');
  document.getElementById('error').innerHTML = UI.errorHtml(
    'Pertemuan tidak ditentukan.',
    '<a href="beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
  );
}

(async () => {
  if (!pertemuanId) return;
  profile = await Api.requireLogin();
  if (!profile) return;

  // Hide menu Galeri untuk non-admin (guru & KS)
  const isAdmin = (profile.peran || []).includes('pengurus') || (profile.peran || []).includes('super_admin');
  if (!isAdmin) {
    document.querySelectorAll('.galeri-menu').forEach(el => el.style.display = 'none');
  }

  // Render user chip
  const chip = document.getElementById('userChip');
  if (chip) {
    const init = (profile.nama || 'A').charAt(0).toUpperCase();
    const fotoUrl = Api.fotoSayaUrl('t');
    chip.innerHTML = `
      <div class="avatar">${fotoUrl ? `<img src="${fotoUrl}" onerror="this.parentElement.textContent='${init}'">` : init}</div>
      <span>${UI.escapeHtml(profile.nama || '-')}</span>
    `;
  }

  const res = await Api.call('pertemuan.detail', { pertemuan_id: Number(pertemuanId) });
  document.getElementById('loading').classList.add('hidden');

  if (!res.ok || !res.data) {
    document.getElementById('error').classList.remove('hidden');
    const errMsg = res.error || 'Gagal memuat data.';
    const terkunci = errMsg.includes('Selesaikan Pertemuan') || errMsg.includes('terkunci');

    if (terkunci) {
      document.getElementById('error').innerHTML = `
        <div class="empty" style="padding:60px 20px;">
          <div class="empty-icon" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:var(--warning);">
            ${Icons.get('lock', { class: 'icon-lg' })}
          </div>
          <div class="empty-title" style="font-size:16px;">Pertemuan Terkunci</div>
          <div class="empty-desc" style="margin-bottom:20px;">${UI.escapeHtml(errMsg)}</div>
          <a href="beranda.html" class="btn btn-primary" style="display:inline-flex;">
            ${Icons.get('chevronLeft', { class: 'icon-sm' })}
            Kembali ke Beranda
          </a>
        </div>
      `;
    } else {
      document.getElementById('error').innerHTML = UI.errorHtml(
        errMsg,
        '<a href="beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
      );
    }
    return;
  }

  data = res.data;
  renderAll();

  // Polling peserta hadir tiap 30 detik
  pesertaPollTimer = setInterval(pollPeserta, 30000);
})();

// ═══════════════════════════════════════════════
// RENDER UTAMA
// ═══════════════════════════════════════════════
function renderAll() {
  const p = data.pertemuan;
  document.title = p.judul + ' — NAKULAKU';
  document.getElementById('content').classList.remove('hidden');
  document.getElementById('bcCurrent').textContent = `#${p.urutan} · ${p.judul}`;

  renderHero();
  renderPresensi();
  renderIndikator();
  renderRingkasan();
  renderMateri();
  renderTugas();
  renderDiskusi();
  renderFeedback();
  renderRail();

  // Bind tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const nama = tab.dataset.tab;
      tabAktif = nama;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.toggle('active', panel.dataset.panel === nama);
      });
    });
  });
}

    <div class="hero-meta-list">

        ${Icons.get('calendar', { class: 'icon-sm' })}

      </div>
      ${p.lokasi_nama ? `
        <div class="hero-meta">
          ${Icons.get('mapPin', { class: 'icon-sm' })}
          ${UI.escapeHtml(p.lokasi_nama)}

      ` : ''}
      ${p.narasumber_nama ? `

          ${UI.escapeHtml(p.narasumber_nama)}
        </div>
      ` : ''}
    </div>
    <div class="hero-progress">
      <div class="hero-progress-head">
        <span class="label">Progres Anda</span>
        <span class="pct">${progress.persen}%</span>
      </div>
      <div class="hero-progress-bar">
        <div class="hero-progress-fill" style="width: ${progress.persen}%"></div>
      </div>
      <div class="hero-progress-items">
        ${pItems.map(it => `
          <span class="hero-p-item ${it.done ? 'done' : 'pending'}">
            ${it.done ? Icons.get('check', { class: 'icon-sm' }) : Icons.get('circle', { class: 'icon-sm' })}
            ${it.label}
          </span>
        `).join('')}
      </div>
    </div>
  `;
}

function hitungProgres() {
  const totalMateri = (data.materi || []).length;
  const materiDibaca = (data.materi || []).filter(m => getBaca(m.id)).length;
  const materiSelesai = totalMateri === 0 || materiDibaca >= totalMateri;

  const totalTugas = (data.tugas || []).length;
  const tugasKumpul = (data.pengumpulan_saya || []).length;
  const tugasSelesai = totalTugas === 0 || tugasKumpul >= totalTugas;

  const feedbackSelesai = !!(data.diskusi_terbaru && false); // placeholder — diganti setelah cek feedback
  const feedbackDone = window._feedbackDone || false;

  const items = [
    !!data.presensi_saya,
    materiSelesai,
    tugasSelesai,
    feedbackDone,
  ];
  const done = items.filter(x => x).length;
  const persen = Math.round((done / items.length) * 100);

  return { persen, materiSelesai, tugasSelesai, feedbackSelesai: feedbackDone, materiDibaca, totalMateri, tugasKumpul, totalTugas };
}

function mulaiCountdown(tutupIso) {
  if (countdownTimer) clearInterval(countdownTimer);
  const tutup = new Date(tutupIso).getTime();
  const tick = () => {
    const el = document.getElementById('countdownText');
    const box = document.getElementById('countdownBox');
    if (!el) return;
    const sisa = Math.max(0, tutup - Date.now());
    if (sisa <= 0) {
      el.textContent = 'Waktu presensi habis';
      if (box) box.className = 'countdown-box danger';
      if (countdownTimer) clearInterval(countdownTimer);
      return;
    }
    const jam = Math.floor(sisa / 3600000);
    const m = Math.floor((sisa % 3600000) / 60000);
    const s = Math.floor((sisa % 60000) / 1000);
    let text = jam > 0 ? `Sisa ${jam}j ${m}m` : (m > 0 ? `Sisa ${m}m ${String(s).padStart(2, '0')}s` : `Sisa ${s} detik`);
    el.textContent = text;
    if (box) {
      if (sisa <= 5 * 60000) box.className = 'countdown-box danger';
      else if (sisa <= 30 * 60000) box.className = 'countdown-box warning';
      else box.className = 'countdown-box';
    }
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderRingkasan() {
  const el = document.getElementById('panelRingkasan');
  const progress = hitungProgres();

  // Todo list
  const todos = [];
  if (!data.presensi_saya) {
    todos.push({ done: false, label: 'Isi presensi', action: data.presensi_status === 'buka' ? 'mulaiPresensi()' : 'ajukanIzin()', actionText: data.presensi_status === 'buka' ? 'Isi' : 'Ajukan Izin' });
  }
  const totalMateri = (data.materi || []).length;
  if (totalMateri > 0) {
    const dibaca = (data.materi || []).filter(m => getBaca(m.id)).length;
    if (dibaca < totalMateri) {
      todos.push({ done: false, label: `Baca ${totalMateri - dibaca} materi lagi`, action: "pindahTab('materi')", actionText: 'Baca' });
    }
  }
  const totalTugas = (data.tugas || []).length;
  const kumpul = (data.pengumpulan_saya || []).length;
  if (kumpul < totalTugas) {
    todos.push({ done: false, label: `Kumpulkan ${totalTugas - kumpul} tugas`, action: "pindahTab('tugas')", actionText: 'Buka' });
  }
  if (!progress.feedbackSelesai && data.diskusi_count >= 0) {
    todos.push({ done: false, label: 'Isi feedback pertemuan', action: "pindahTab('feedback')", actionText: 'Isi' });
  }

  const catatan = data.catatan_pribadi || '';

  el.innerHTML = `
    <!-- Checklist -->
    <div class="section-mini">
      <div class="section-mini-title">
        <span class="icon-wrap">${Icons.get('checkCircle', { class: 'icon-sm' })}</span>

      ${todos.length === 0 ? `
        <div style="text-align:center;padding:16px;color:var(--success);font-weight:700;font-size:13px;">
          ✓ Semua selesai. Kerja bagus!

      ` : todos.map(t => `
        <div class="todo-item">
          <div class="todo-check pending">${Icons.get('circle', { class: 'icon-sm' })}</div>
          <div class="todo-label">${UI.escapeHtml(t.label)}</div>
          <button class="todo-action" onclick="${t.action}">${t.actionText}</button>
        </div>
      `).join('')}
    </div>

    <!-- Catatan Pribadi -->
    <div class="section-mini">
      <div class="section-mini-title">
        <span class="icon-wrap">${Icons.get('edit', { class: 'icon-sm' })}</span>
        Catatan Pribadi
      </div>
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;line-height:1.5;">
        Tulis catatan Anda tentang pertemuan ini. Hanya Anda yang bisa lihat.
      </div>
      <textarea class="catatan-textarea" id="catatanInput" placeholder="Contoh: materi asesmen formatif sangat berguna untuk kelas 6...">${UI.escapeHtml(catatan)}</textarea>
      <div class="catatan-meta">
        <span id="catatanStatus">${catatan ? 'Tersimpan' : 'Belum ada catatan'}</span>
        <button class="btn btn-primary btn-sm" id="btnSimpanCatatan">Simpan</button>
      </div>
    </div>

    <!-- Refleksi (hanya kalau semua selesai) -->
    ${(progress.persen >= 75 && !data.refleksi) ? `
      <div class="section-mini" style="background:linear-gradient(135deg,#FDF2F8 0%,#FCE7F3 100%);border-color:var(--maroon-light);">
        <div class="section-mini-title">
          <span class="icon-wrap">${Icons.get('sparkles', { class: 'icon-sm' })}</span>
          Refleksi Akhir
        </div>
        <div style="font-size:12.5px;color:var(--ink);line-height:1.55;margin-bottom:12px;font-weight:500;">
          Anda hampir selesai pertemuan ini. Ceritakan <strong>1 hal</strong> yang akan Anda terapkan di kelas dari materi KKG.
        </div>
        <button class="btn btn-primary" id="btnRefleksi">Tulis Refleksi</button>
      </div>
    ` : ''}

    ${data.refleksi ? `
      <div class="section-mini">
        <div class="section-mini-title">
          <span class="icon-wrap">${Icons.get('sparkles', { class: 'icon-sm' })}</span>
          Refleksi Anda
        </div>
        <div style="padding:12px;background:var(--bg);border-radius:10px;font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap;">${UI.escapeHtml(data.refleksi)}</div>
      </div>
    ` : ''}
  `;

  // Bind catatan
  document.getElementById('btnSimpanCatatan')?.addEventListener('click', simpanCatatan);
  document.getElementById('btnRefleksi')?.addEventListener('click', bukaModalRefleksi);
}

async function simpanCatatan() {
  const btn = document.getElementById('btnSimpanCatatan');
  const isi = document.getElementById('catatanInput').value.trim();
  UI.btnLoading(btn, 'Menyimpan…');
  const res = await Api.call('catatan.simpan', { pertemuan_id: data.pertemuan.id, isi });
  UI.btnReset(btn);

  if (res.ok) {
    document.getElementById('catatanStatus').textContent = 'Tersimpan';
    UI.sukses('Catatan tersimpan.');
  } else {
    UI.gagal(res.error);
  }
}

function bukaModalRefleksi() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-backdrop';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-title">Refleksi Akhir</div>
      <div class="modal-sub">Ceritakan 1 hal yang akan Anda terapkan di kelas dari materi KKG ini.</div>
      <textarea class="catatan-textarea" id="refleksiInput" rows="4" placeholder="Contoh: Saya akan mencoba asesmen formatif dengan exit ticket di akhir pelajaran..." style="min-height:120px;"></textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-close>Batal</button>
        <button class="btn btn-primary" id="btnRefleksiSimpan">Simpan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelector('[data-close]').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnRefleksiSimpan').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnRefleksiSimpan');
    const isi = overlay.querySelector('#refleksiInput').value.trim();
    if (!isi) { UI.gagal('Refleksi wajib diisi.'); return; }

    UI.btnLoading(btn, 'Menyimpan…');
    const res = await Api.call('refleksi.simpan', { pertemuan_id: data.pertemuan.id, isi });
    UI.btnReset(btn);

    if (res.ok) {
      UI.sukses('Refleksi tersimpan.');
      close();
      data.refleksi = isi;
      renderRingkasan();
    } else {
      UI.gagal(res.error);
    }
  });
}

                <a href="${UI.escapeHtml(m.link_url)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm" style="flex:1;" onclick="setBaca(${m.id});">
                  ${Icons.get('externalLink', { class: 'icon-sm' })} Buka Materi

              ` : ''}

                ${Icons.get('star')}
              </button>
              <button class="btn-mini-icon ${dibaca ? 'done' : ''}" onclick="toggleBaca(${m.id});" title="Tandai sudah baca">

}

// localStorage materi
function getBaca(id) { return localStorage.getItem(`nakula_read_${data.pertemuan.id}_${id}`) === '1'; }
function getMark(id) { return localStorage.getItem(`nakula_bm_${data.pertemuan.id}_${id}`) === '1'; }
function setBaca(id) { localStorage.setItem(`nakula_read_${data.pertemuan.id}_${id}`, '1'); }
function toggleBaca(id) {
  const cur = getBaca(id);
  localStorage.setItem(`nakula_read_${data.pertemuan.id}_${id}`, cur ? '0' : '1');
  renderMateri();
  renderIndikator();
  renderHero();
}
function toggleMark(id) {
  const cur = getMark(id);
  localStorage.setItem(`nakula_bm_${data.pertemuan.id}_${id}`, cur ? '0' : '1');
  renderMateri();
}

let tugasFilter = 'semua';

function renderTugas() {
  const el = document.getElementById('panelTugas');
  const tugas = data.tugas || [];
  const mapKumpul = {};
  (data.pengumpulan_saya || []).forEach(p => mapKumpul[p.tugas_id] = p);

  if (tugas.length === 0) {
    el.innerHTML = UI.emptyHtml('clipboard', 'Belum ada tugas');
    return;
  }

  let filtered = tugas;
  if (tugasFilter === 'belum') filtered = tugas.filter(t => !mapKumpul[t.id]);
  if (tugasFilter === 'selesai') filtered = tugas.filter(t => !!mapKumpul[t.id]);

  const html = `
    <div class="tugas-filter">
      <button class="tf-chip ${tugasFilter === 'semua' ? 'active' : ''}" onclick="setTugasFilter('semua')">Semua (${tugas.length})</button>
      <button class="tf-chip ${tugasFilter === 'belum' ? 'active' : ''}" onclick="setTugasFilter('belum')">Belum (${tugas.length - Object.keys(mapKumpul).length})</button>
      <button class="tf-chip ${tugasFilter === 'selesai' ? 'active' : ''}" onclick="setTugasFilter('selesai')">Selesai (${Object.keys(mapKumpul).length})</button>
    </div>
    ${filtered.map(t => {
      const kumpul = mapKumpul[t.id];
      const statusBadge = kumpul ? {
        menunggu: '<span class="badge-status menunggu">Menunggu Dinilai</span>',
        diterima: '<span class="badge-status diterima">Diterima</span>',
        revisi: '<span class="badge-status revisi">Perlu Revisi</span>',
        ditolak: '<span class="badge-status ditolak">Ditolak</span>',
      }[kumpul.status] : '<span class="badge-status belum">Belum Dikumpul</span>';

      let urgencyCls = '';
      let dlCls = '';
      if (t.deadline) {
        const sisa = new Date(t.deadline).getTime() - Date.now();
        if (sisa < 0) { urgencyCls = 'urgent'; dlCls = 'urgent'; }
        else if (sisa < 24 * 3600 * 1000) { urgencyCls = 'urgent'; dlCls = 'urgent'; }
        else if (sisa < 3 * 24 * 3600 * 1000) { urgencyCls = 'soon'; dlCls = 'soon'; }
      }

      return `
        <div class="tugas-item ${urgencyCls}">
          <div class="tugas-head">
            <div class="tugas-icon">${Icons.get('clipboard', { class: 'icon-sm' })}</div>
            <div class="tugas-body">
              <div class="tugas-judul">${UI.escapeHtml(t.judul)}</div>
              ${t.deskripsi ? `<div class="tugas-desc">${UI.escapeHtml(t.deskripsi)}</div>` : ''}
              ${t.deadline ? `<div class="tugas-deadline ${dlCls}">${Icons.get('clock', { class: 'icon-sm' })} Deadline: ${UI.formatTanggalJam(t.deadline)}</div>` : ''}
              ${kumpul && kumpul.nilai !== null ? `<div class="tugas-deadline" style="color:var(--success);margin-top:4px;">Nilai: ${kumpul.nilai}</div>` : ''}
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            ${statusBadge}
            ${kumpul 
              ? `<button class="btn btn-secondary btn-sm" onclick="lihatTugas(${t.id})">Lihat</button>`
              : `<button class="btn btn-primary btn-sm" onclick="kumpulTugas(${t.id})">Kumpul</button>`}
          </div>
        </div>
      `;
    }).join('')}
  `;

  el.innerHTML = html;
}

function setTugasFilter(f) { tugasFilter = f; renderTugas(); }

async function renderDiskusi() {
  const el = document.getElementById('panelDiskusi');
  el.innerHTML = '<div class="skeleton" style="height:120px;border-radius:16px;"></div>';

  const res = await Api.call('diskusi.list', { pertemuan_id: data.pertemuan.id });
  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error);
    return;
  }

  daftarDiskusi = res.data || [];

  const topLevel = daftarDiskusi.filter(d => !d.parent_id);
  const replies = {};
  daftarDiskusi.filter(d => d.parent_id).forEach(d => {
    if (!replies[d.parent_id]) replies[d.parent_id] = [];
    replies[d.parent_id].push(d);
  });

  el.innerHTML = `
    <div class="diskusi-intro">
      <div class="diskusi-intro-icon">${Icons.get('messageCircle', { class: 'icon-lg' })}</div>
      <div class="diskusi-intro-text">
        <div class="diskusi-intro-title">Diskusi Pertemuan</div>
        <div class="diskusi-intro-desc">Tanya jawab dengan narasumber & sesama guru. Pertanyaan penting akan di-pin.</div>
      </div>
    </div>

    <div class="diskusi-list" id="diskusiList">
      ${topLevel.length === 0 ? `
        <div style="text-align:center;padding:30px 20px;color:var(--muted);font-size:13px;line-height:1.6;">
          Belum ada diskusi. Jadilah yang pertama bertanya! 👋
        </div>
      ` : topLevel.map(d => renderDiskusiItem(d, replies[d.id] || [], false)).join('')}
    </div>

    <div class="diskusi-input">
      <textarea id="diskusiTextarea" placeholder="Tulis pertanyaan atau tanggapan…" rows="1"></textarea>
      <button class="diskusi-send" id="btnKirimDiskusi" disabled>
        ${Icons.get('send')}
      </button>
    </div>
  `;

  // Bind
  const ta = el.querySelector('#diskusiTextarea');
  const btn = el.querySelector('#btnKirimDiskusi');

  ta.addEventListener('input', () => {
    btn.disabled = !ta.value.trim();
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  });

  btn.addEventListener('click', () => kirimDiskusi(null));

  el.querySelectorAll('[data-reply]').forEach(b => {
    b.addEventListener('click', () => {
      const id = Number(b.dataset.reply);
      replyToId = id;
      ta.focus();
      ta.placeholder = `Balas ke ${b.dataset.nama}…`;
    });
  });
  el.querySelectorAll('[data-pin]').forEach(b => {
    b.addEventListener('click', () => pinDiskusi(Number(b.dataset.pin)));
  });
  el.querySelectorAll('[data-hapus]').forEach(b => {
    b.addEventListener('click', () => hapusDiskusi(Number(b.dataset.hapus)));
  });
}

function renderDiskusiItem(d, replies, isReply) {
  const init = (d.user?.nama_lengkap || '?').charAt(0).toUpperCase();
  const fotoUrl = d.user?.id ? Api.fotoUrl(d.user.id, 't') : null;
  const isAdmin = (profile.peran || []).includes('super_admin') || (profile.peran || []).includes('pengurus');
  const isNarsum = (profile.peran || []).includes('narasumber');
  const isOwner = d.user?.id === profile.id;

  let roleBadge = '';
  if (d.user?.jabatan) {
    roleBadge = `<span class="diskusi-jabatan">${UI.escapeHtml(d.user.jabatan)}</span>`;
  }

  return `
    <div class="diskusi-item ${d.di_pin ? 'pinned' : ''} ${isReply ? 'reply' : ''}">
      <div class="diskusi-head">
        <div class="diskusi-avatar">
          ${init}
          ${fotoUrl ? `<img src="${fotoUrl}" loading="lazy" onerror="UI.fotoError(this)">` : ''}
        </div>
        <div class="diskusi-info">
          <div class="diskusi-nama">
            ${UI.escapeHtml(d.user?.nama_lengkap || '-')}
            ${roleBadge}
            ${d.di_pin ? `<span class="diskusi-pin-badge">${Icons.get('star', { class: 'icon-sm' })} PIN</span>` : ''}
          </div>
          <div class="diskusi-time">${UI.timeAgo(d.dibuat_pada)}</div>
        </div>
      </div>
      <div class="diskusi-isi">${UI.escapeHtml(d.isi)}</div>
      <div class="diskusi-actions-row">
        ${!isReply ? `<button class="diskusi-btn" data-reply="${d.id}" data-nama="${UI.escapeHtml(d.user?.nama_lengkap || '')}">${Icons.get('messageCircle', { class: 'icon-sm' })} Balas</button>` : ''}
        ${(isAdmin || isNarsum) && !isReply ? `<button class="diskusi-btn" data-pin="${d.id}">${Icons.get('star', { class: 'icon-sm' })} ${d.di_pin ? 'Unpin' : 'Pin'}</button>` : ''}
        ${(isOwner || isAdmin) ? `<button class="diskusi-btn danger" data-hapus="${d.id}">${Icons.get('trash', { class: 'icon-sm' })} Hapus</button>` : ''}
      </div>
      ${replies.length > 0 ? `<div style="margin-top:10px;">${replies.map(r => renderDiskusiItem(r, [], true)).join('')}</div>` : ''}
    </div>
  `;
}

async function kirimDiskusi(parentId) {
  const ta = document.getElementById('diskusiTextarea');
  const isi = ta.value.trim();
  if (!isi) return;

  const btn = document.getElementById('btnKirimDiskusi');
  btn.disabled = true;
  UI.btnLoading(btn, '');

  const res = await Api.call('diskusi.kirim', {
    pertemuan_id: data.pertemuan.id,
    isi,
    parent_id: parentId,
  });

  UI.btnReset(btn);
  btn.disabled = false;

  if (!res.ok) { UI.gagal(res.error); return; }

  ta.value = '';
  ta.placeholder = 'Tulis pertanyaan atau tanggapan…';
  replyToId = null;
  data.diskusi_count = (data.diskusi_count || 0) + 1;
  await renderDiskusi();
  renderIndikator();
}

async function pinDiskusi(id) {
  const res = await Api.call('diskusi.pin', { id });
  if (!res.ok) { UI.gagal(res.error); return; }
  await renderDiskusi();
}

async function hapusDiskusi(id) {
  const ok = await UI.konfirmasi('Hapus Diskusi', 'Hapus pesan ini?', { danger: true, okText: 'Hapus' });
  if (!ok) return;
  const res = await Api.call('diskusi.hapus', { id });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses('Dihapus.');
  await renderDiskusi();
  renderIndikator();
}

    document.getElementById('panelFeedback').innerHTML = `
      <div class="section-mini">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <span style="color:var(--success);">${Icons.get('checkCircle', { class: 'icon-lg' })}</span>
          <div style="font-weight:800;">Feedback Terkirim</div>
        </div>
        <div style="margin-bottom:12px;">

      </div>
    `;
    return;
  }

  // Render form
  await renderFeedbackForm();

async function renderFeedbackForm() {
  const el = document.getElementById('panelFeedback');
  el.innerHTML = '<div class="skeleton" style="height:200px;border-radius:16px;"></div>';

  const resAspek = await Api.call('feedback.aspek_list', { periode_id: data.pertemuan.periode_id });
  if (!resAspek.ok || !resAspek.data || resAspek.data.length === 0) {
    el.innerHTML = UI.emptyHtml('info', 'Belum ada aspek feedback');
    return;
  }

  const grouped = {};
  resAspek.data.forEach(a => {
    if (!grouped[a.kategori]) grouped[a.kategori] = [];
    grouped[a.kategori].push(a);
  });

  const kategoriLabel = {
    sekolah: 'Sekolah Tuan Rumah', penyelenggara: 'Penyelenggara',
    narasumber: 'Narasumber', materi: 'Materi', umum: 'Umum',
  };
  const kategoriIcon = {
    sekolah: 'home', penyelenggara: 'users', narasumber: 'user', materi: 'book', umum: 'info',
  };

  el.innerHTML = `
    <div class="section-mini" style="background:var(--maroon-soft);border:none;">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <span style="color:var(--maroon);">${Icons.get('info', { class: 'icon-lg' })}</span>
        <div>
          <div style="font-weight:800;font-size:13px;color:var(--maroon);margin-bottom:4px;">Bantu kami jadi lebih baik</div>
          <div style="font-size:12.5px;color:var(--ink);line-height:1.5;">Isi penilaian Anda terhadap penyelenggaraan pertemuan ini. Feedback bersifat anonim.</div>
        </div>
      </div>
    </div>

    ${Object.keys(grouped).map(kat => `
      <div class="fb-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);">
          <div style="width:28px;height:28px;border-radius:8px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;">
            ${Icons.get(kategoriIcon[kat] || 'star', { class: 'icon-sm' })}
          </div>
          <div style="font-weight:800;font-size:13px;">${kategoriLabel[kat] || kat}</div>
        </div>
        ${grouped[kat].map(a => `
          <div class="fb-row">
            <div class="fb-row-label">${UI.escapeHtml(a.nama_aspek)}</div>
            <div class="fb-rating" data-kat="${kat}" data-aspek="${a.id}">
              ${[1,2,3,4,5].map(n => `<button type="button" data-skor="${n}">${n}</button>`).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `).join('')}

    <div class="fb-card">
      <div style="margin-bottom:10px;">
        <label style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;display:block;margin-bottom:6px;">Saran (opsional)</label>
        <textarea id="fbSaran" class="catatan-textarea" rows="2" placeholder="Apa yang perlu dipertahankan?" style="min-height:60px;"></textarea>
      </div>
      <div>
        <label style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;display:block;margin-bottom:6px;">Kritik (opsional)</label>
        <textarea id="fbKritik" class="catatan-textarea" rows="2" placeholder="Apa yang perlu diperbaiki?" style="min-height:60px;"></textarea>
      </div>
    </div>

    <div class="feedback-progress" id="fbProgress">
      <span>Progres penilaian</span>
      <span class="val" id="fbProgressVal">0/0</span>
    </div>

    <button class="btn btn-primary btn-full" id="btnKirimFeedback" style="margin-bottom:16px;">
      ${Icons.get('send', { class: 'icon-sm' })} Kirim Feedback
    </button>
  `;

  const ratingState = {};
  const totalAspek = el.querySelectorAll('.fb-rating').length;
  const updateProgress = () => {
    const dinilai = Object.keys(ratingState).reduce((s, k) => s + Object.keys(ratingState[k]).length, 0);
    const valEl = document.getElementById('fbProgressVal');
    if (valEl) {
      valEl.textContent = `${dinilai}/${totalAspek}`;
      valEl.style.color = dinilai >= totalAspek ? 'var(--success)' : 'var(--maroon)';
    }
  };
  updateProgress();

  el.querySelectorAll('.fb-rating').forEach(r => {
    const kat = r.dataset.kat;
    const aid = r.dataset.aspek;
    r.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const skor = Number(b.dataset.skor);
        r.querySelectorAll('button').forEach(x => {
          const on = x === b;
          x.style.background = on ? 'var(--maroon)' : 'var(--surface)';
          x.style.color = on ? 'white' : 'var(--muted)';
          x.style.borderColor = on ? 'var(--maroon)' : 'var(--border)';
        });
        if (!ratingState[kat]) ratingState[kat] = {};
        ratingState[kat][aid] = skor;
        updateProgress();
      });
    });
  });

  el.querySelector('#btnKirimFeedback').addEventListener('click', async () => {
    const btn = el.querySelector('#btnKirimFeedback');
    const total = Object.keys(ratingState).reduce((s, k) => s + Object.keys(ratingState[k]).length, 0);
    if (total === 0) { UI.gagal('Isi minimal 1 penilaian.'); return; }
    const ok = await UI.konfirmasi('Kirim Feedback', 'Feedback tidak bisa diubah setelah dikirim. Lanjutkan?', { okText: 'Kirim' });
    if (!ok) return;
    UI.btnLoading(btn, 'Mengirim…');
    const res = await Api.call('feedback.isi', {
      pertemuan_id: data.pertemuan.id,
      aspek: ratingState,
      saran: el.querySelector('#fbSaran').value.trim(),
      kritik: el.querySelector('#fbKritik').value.trim(),
    });
    UI.btnReset(btn);
    if (!res.ok) { UI.gagal(res.error); return; }
    UI.sukses('Terima kasih atas feedback Anda!');
    window._feedbackDone = true;
    renderHero();
    renderFeedback();
    renderRail();
  });
}

    <div class="rail-card">
      <div class="rail-card-title">${Icons.get('calendar', { class: 'icon-sm' })} Navigasi</div>
      <div class="nav-pertemuan">
        ${data.pertemuan_prev ? `
          <a href="pertemuan.html?id=${data.pertemuan_prev.id}" class="nav-pertemuan-btn">
            <div class="num">← Sebelumnya</div>
            <div class="title">#${data.pertemuan_prev.urutan} ${UI.escapeHtml(data.pertemuan_prev.judul)}</div>
          </a>
        ` : `<div class="nav-pertemuan-btn disabled"><div class="num">←</div><div class="title">Tidak ada</div></div>`}
        ${data.pertemuan_next ? `
          <a href="pertemuan.html?id=${data.pertemuan_next.id}" class="nav-pertemuan-btn">
            <div class="num">Berikutnya →</div>
            <div class="title">#${data.pertemuan_next.urutan} ${UI.escapeHtml(data.pertemuan_next.judul)}</div>
          </a>
        ` : `<div class="nav-pertemuan-btn disabled"><div class="num">→</div><div class="title">Tidak ada</div></div>`}
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="rail-card">
      <div class="rail-card-title">${Icons.get('externalLink', { class: 'icon-sm' })} Aksi Cepat</div>
      <div class="quick-actions">
        <button class="quick-btn" onclick="sharePertemuan()">
          ${Icons.get('send')} Bagikan via WhatsApp
        </button>
        <button class="quick-btn" onclick="copyLinkPertemuan()">
          ${Icons.get('link')} Salin Link
        </button>
        <button class="quick-btn" onclick="window.print()">
          ${Icons.get('fileText')} Cetak Halaman
        </button>
      </div>
    </div>
  `;

  // Render peserta avatars
  renderPesertaAvatars(data.peserta_hadir_count || 0, data.peserta_hadir_sample || []);
}

function renderPesertaAvatars(jumlah, sample) {
  const el = document.getElementById('pesertaAvatars');
  if (!el) return;

  if (jumlah === 0) {
    el.innerHTML = '<span style="font-size:12px;color:var(--muted);font-weight:600;">Belum ada yang presensi</span>';
    return;
  }

  const max = 5;
  const tampil = sample.slice(0, max);
  const sisa = Math.max(0, jumlah - tampil.length);

  el.innerHTML = tampil.map(u => {
    const init = (u.nama_lengkap || '?').charAt(0).toUpperCase();
    const url = u.foto_thumb_url || (u.id ? Api.fotoUrl(u.id, 't') : null);
    return `<div class="peserta-av" title="${UI.escapeHtml(u.nama_lengkap)}">${init}${url ? `<img src="${url}" onerror="UI.fotoError(this)">` : ''}</div>`;
  }).join('') + (sisa > 0 ? `<div class="peserta-av more">+${sisa}</div>` : '');
}

async function pollPeserta() {
  if (!data || !document.getElementById('pesertaCount')) return;
  const res = await Api.call('pertemuan.peserta_hadir', { pertemuan_id: data.pertemuan.id });
  if (!res.ok) return;
  data.peserta_hadir_count = res.data.jumlah;
  data.peserta_hadir_sample = res.data.sample;
  renderPesertaAvatars(res.data.jumlah, res.data.sample);
  const countEl = document.getElementById('pesertaCount');
  if (countEl) countEl.innerHTML = `<span>${res.data.jumlah}</span> guru tercatat hadir`;
}

function pindahTab(nama) {
  tabAktif = nama;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === nama));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === nama));
  document.querySelector('.tabs')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function mulaiPresensi() { window.location.href = 'presensi.html?id=' + pertemuanId; }
function ajukanIzin() { window.location.href = 'ajukan.html?id=' + pertemuanId; }
function kumpulTugas(id) { window.location.href = 'tugas.html?id=' + id; }
function lihatTugas(id) { window.location.href = 'tugas.html?id=' + id; }

function bukaFoto(url) {
  if (!url) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${UI.escapeHtml(url)}" alt="Foto Presensi">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}

function bukaLokasi(lat, lng) {
  if (!lat || !lng) return;
  window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
}

function sharePertemuan() {
  const url = window.location.href;
  const text = `Cek pertemuan #${data.pertemuan.urutan} — ${data.pertemuan.judul}\n${url}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

async function copyLinkPertemuan() {
  try {
    await navigator.clipboard.writeText(window.location.href);
    UI.sukses('Link disalin');
  } catch { UI.gagal('Gagal menyalin'); }
}
