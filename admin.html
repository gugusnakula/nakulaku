<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Pusat Akun Nakula</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold">🛠️ Admin Nakulaku</h1>
    <div><a href="index.html" class="text-blue-600 text-sm mr-3">Beranda</a>
    <button id="btn-logout" class="text-red-500 text-sm">Keluar</button></div>
  </div>
  <div id="no-access" class="hidden bg-red-50 text-red-600 p-4 rounded-lg">Akun Anda bukan admin.</div>

  <div id="admin-panel" class="hidden">
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h2 class="font-semibold mb-2">➕ Tambah User</h2>
      <div class="grid grid-cols-2 gap-2">
        <input id="a-email" placeholder="Email" class="border rounded p-2">
        <input id="a-pass" placeholder="Password awal" class="border rounded p-2">
        <input id="a-nama" placeholder="Nama" class="border rounded p-2">
        <input id="a-jab" placeholder="Jabatan" class="border rounded p-2">
        <input id="a-ins" placeholder="Instansi" class="border rounded p-2">
        <input id="a-role" placeholder="Role (guru / admin,narasumber)" class="border rounded p-2">
      </div>
      <button id="btn-add" class="mt-2 bg-blue-600 text-white rounded p-2 w-full">Simpan User</button>
    </div>
    <div class="bg-white rounded-xl shadow p-4">
      <input id="search" placeholder="Cari nama / email / instansi…" class="border rounded p-2 w-full mb-3">
      <div id="list" class="space-y-2"></div>
    </div>
  </div>
</div>

<div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-xl p-4 w-full max-w-md">
    <h2 class="font-semibold mb-2">✏️ Edit User</h2>
    <input id="e-nama" placeholder="Nama" class="border rounded p-2 w-full mb-2">
    <input id="e-jab" placeholder="Jabatan" class="border rounded p-2 w-full mb-2">
    <input id="e-ins" placeholder="Instansi" class="border rounded p-2 w-full mb-2">
    <input id="e-role" placeholder="Role" class="border rounded p-2 w-full mb-2">
    <select id="e-status" class="border rounded p-2 w-full mb-3">
      <option value="active">active</option><option value="nonactive">nonactive</option>
    </select>
    <div class="flex gap-2">
      <button id="btn-save" class="bg-blue-600 text-white rounded p-2 flex-1">Simpan</button>
      <button id="btn-close" class="bg-slate-300 rounded p-2 flex-1">Batal</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDaTXg2_oaKNYjJ0HxSGa9qXPQQ7VK0uDs",
  authDomain: "nakulaku-ekosistem.firebaseapp.com",
  projectId: "nakulaku-ekosistem",
  storageBucket: "nakulaku-ekosistem.firebasestorage.app",
  messagingSenderId: "672296906494",
  appId: "1:672296906494:web:2e90334b9d3136a4917faf"
};
firebase.initializeApp(firebaseConfig);
firebase.initializeApp(firebaseConfig,'secondary');
const auth=firebase.auth(), db=firebase.firestore(), sec=firebase.app('secondary').auth();
const $=id=>document.getElementById(id);
let ALL=[], editEmail=null;

auth.onAuthStateChanged(async u=>{
  if(!u){ location.href='index.html'; return; }
  const doc=await db.collection('users').doc(u.email).get();
  const role=doc.exists?(doc.data().role||''):'';
  if(!role.includes('admin')){ $('no-access').classList.remove('hidden'); return; }
  $('admin-panel').classList.remove('hidden'); load();
});

async function load(){
  const s=await db.collection('users').get();
  ALL=s.docs.map(d=>({email:d.id,...d.data()})); render();
}
function render(){
  const q=($('search').value||'').toLowerCase();
  $('list').innerHTML=ALL.filter(u=>(u.nama+u.email+u.instansi+u.role).toLowerCase().includes(q))
   .map(u=>`<div class="border rounded p-2 flex justify-between items-center text-sm">
     <div><b>${u.nama||u.email}</b> <span class="text-xs text-slate-500">(${u.role||'-'})</span><br>
     <span class="text-xs">${u.email} • ${u.instansi||'-'} • ${u.status==='active'?'🟢':'🔴'}</span></div>
     <div class="flex gap-1">
       <button onclick="openEdit('${u.email}')" class="bg-blue-100 text-blue-700 rounded px-2 py-1">Edit</button>
       <button onclick="resetPw('${u.email}')" class="bg-yellow-100 text-yellow-700 rounded px-2 py-1">Reset PW</button>
     </div></div>`).join('');
}
$('search').oninput=render;

$('btn-add').onclick=async()=>{
  const em=$('a-email').value.trim().toLowerCase();
  try{
    await sec.createUserWithEmailAndPassword(em,$('a-pass').value); await sec.signOut();
    await db.collection('users').doc(em).set({email:em,pin:'',nama:$('a-nama').value,jabatan:$('a-jab').value,instansi:$('a-ins').value,role:$('a-role').value||'guru',status:'active'});
    alert('User dibuat ✅'); load();
  }catch(e){ alert('Gagal: '+e.message); }
};
function openEdit(em){
  editEmail=em; const u=ALL.find(x=>x.email===em);
  $('e-nama').value=u.nama||''; $('e-jab').value=u.jabatan||''; $('e-ins').value=u.instansi||'';
  $('e-role').value=u.role||''; $('e-status').value=u.status||'active';
  $('modal').classList.remove('hidden'); $('modal').classList.add('flex');
}
$('btn-close').onclick=()=>{ $('modal').classList.add('hidden'); $('modal').classList.remove('flex'); };
$('btn-save').onclick=async()=>{
  await db.collection('users').doc(editEmail).update({nama:$('e-nama').value,jabatan:$('e-jab').value,instansi:$('e-ins').value,role:$('e-role').value,status:$('e-status').value});
  $('btn-close').onclick(); load();
};
function resetPw(em){ auth.sendPasswordResetEmail(em).then(()=>alert('Email reset terkirim ✅')).catch(e=>alert(e.message)); }
$('btn-logout').onclick=()=>auth.signOut();
</script>
</body>
</html>
