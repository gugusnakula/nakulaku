<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk — NAKULAKU EKOSISTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#0D9488',
          'primary-dark': '#0F766E',
          'primary-soft': '#CCFBF1',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      }
    }
  }
</script>
<style>
  body {
    background: linear-gradient(135deg, #0D9488 0%, #0891B2 100%);
    min-height: 100vh;
  }
  .card { backdrop-filter: blur(8px); }
</style>
</head>
<body class="font-sans flex items-center justify-center p-4">

  <div class="card w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-soft text-primary-dark mb-4">
        <i data-lucide="graduation-cap" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-gray-800">NAKULAKU</h1>
      <p class="text-sm text-gray-500 mt-1">Ekosistem KKG Gugus Nakula</p>
    </div>

    <!-- Form -->
    <form id="formLogin" class="space-y-5" autocomplete="off">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input
            type="email"
            id="email"
            required
            placeholder="nama@email.com"
            class="w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary"
          />
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">PIN</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input
            type="password"
            id="pin"
            required
            inputmode="numeric"
            maxlength="6"
            placeholder="•••••"
            class="w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary tracking-widest"
          />
          <button type="button" id="togglePin" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div id="alert" class="hidden text-sm rounded-xl px-3 py-2.5"></div>

      <button
        type="submit"
        id="btnMasuk"
        class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2"
      >
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk</span>
      </button>

    </form>

    <p class="text-center text-xs text-gray-500 mt-6">
      Lupa PIN? Hubungi admin KKG untuk reset.
    </p>

  </div>

  <script src="assets/js/api.js"></script>
  <script>
    // Ikon Lucide
    lucide.createIcons();

    // Toggle show/hide PIN
    const pinEl = document.getElementById('pin');
    document.getElementById('togglePin').addEventListener('click', () => {
      pinEl.type = pinEl.type === 'password' ? 'text' : 'password';
    });

    // Kalau sudah ada token valid, langsung ke beranda
    (async () => {
      const token = NakulaApi.getToken();
      if (!token) return;
      const v = await NakulaApi.verify(token);
      if (v.valid) {
        NakulaApi.setSession(token, v.profile);
        window.location.href = 'beranda.html';
      } else {
        NakulaApi.clearSession();
      }
    })();

    // Submit form
    const form = document.getElementById('formLogin');
    const alertBox = document.getElementById('alert');
    const btnMasuk = document.getElementById('btnMasuk');

    function showAlert(pesan, tipe = 'error') {
      alertBox.textContent = pesan;
      alertBox.className = 'text-sm rounded-xl px-3 py-2.5 ' +
        (tipe === 'error'
          ? 'bg-red-50 text-red-700 border border-red-100'
          : 'bg-green-50 text-green-700 border border-green-100');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      btnMasuk.disabled = true;
      btnMasuk.innerHTML = '<span class="animate-pulse">Memproses…</span>';

      try {
        const email = document.getElementById('email').value.trim();
        const pin = pinEl.value.trim();

        const res = await NakulaApi.login(email, pin);

        if (res.error) {
          showAlert(res.error, 'error');
          return;
        }
        if (!res.token) {
          showAlert('Login gagal. Coba lagi.', 'error');
          return;
        }

        NakulaApi.setSession(res.token, res.profile);
        showAlert('Login berhasil! Mengalihkan…', 'success');
        setTimeout(() => window.location.href = 'beranda.html', 600);

      } catch (err) {
        console.error(err);
        showAlert('Tidak bisa terhubung ke server. Cek koneksi.', 'error');
      } finally {
        btnMasuk.disabled = false;
        btnMasuk.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i><span>Masuk</span>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
