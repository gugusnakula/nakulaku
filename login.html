<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Masuk — NAKULAKU EKOSISTEM</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="apple-touch-icon" href="assets/img/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/nakula.css" />
</head>
<body class="login-page">

  <div class="login-box">

    <!-- Logo -->
    <div class="login-logo-wrap">
      <img src="assets/img/logo.svg" alt="Logo KKG Gugus Nakula" />
    </div>

    <!-- Judul -->
    <h1 class="login-title">NAKULAKU</h1>
    <p class="login-subtitle">Ekosistem KKG Gugus Nakula</p>

    <!-- Form -->
    <form id="formLogin" class="login-form" autocomplete="off" novalidate>

      <div class="field">
        <label class="label" for="email">Email</label>
        <div class="input-wrap">
          <span data-icon="mail"></span>
          <input
            type="email"
            id="email"
            class="input with-icon"
            placeholder="nama@email.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="field">
        <label class="label" for="pin">PIN</label>
        <div class="input-wrap">
          <span data-icon="lock"></span>
          <input
            type="password"
            id="pin"
            class="input with-icon"
            placeholder="•••••"
            inputmode="numeric"
            maxlength="6"
            autocomplete="current-password"
            required
          />
          <button type="button" id="togglePin" class="input-suffix" aria-label="Tampilkan PIN">
            <span data-icon="eye"></span>
          </button>
        </div>
      </div>

      <div id="alert" class="alert alert-error"></div>

      <button type="submit" id="btnMasuk" class="btn btn-primary btn-full" style="margin-top:8px;">
        <span data-icon="logIn"></span>
        <span>Masuk</span>
      </button>

    </form>

    <p class="login-footer">
      Lupa PIN? Hubungi <strong>admin KKG</strong> untuk reset.
    </p>

    <div class="divider">GUGUS NAKULA</div>

  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    // ---------- Pasang ikon ke elemen [data-icon] ----------
    document.querySelectorAll('[data-icon]').forEach(el => {
      el.innerHTML = Icons.get(el.dataset.icon);
      el.style.display = 'contents';
    });

    // ---------- Auto-redirect kalau sudah login ----------
    (async () => {
      const token = Api.getToken();
      if (!token) return;
      const v = await Api.verify(token);
      if (v.valid) {
        Api.setSession(token, v.profile);
        window.location.replace('beranda.html');
      } else {
        Api.clearSession();
      }
    })();

    // ---------- Toggle show/hide PIN ----------
    const pinEl = document.getElementById('pin');
    const toggleBtn = document.getElementById('togglePin');
    let pinVisible = false;

    toggleBtn.addEventListener('click', () => {
      pinVisible = !pinVisible;
      pinEl.type = pinVisible ? 'text' : 'password';
      toggleBtn.innerHTML = Icons.get(pinVisible ? 'eyeOff' : 'eye');
    });

    // ---------- Submit form ----------
    const form = document.getElementById('formLogin');
    const alertBox = document.getElementById('alert');
    const btnMasuk = document.getElementById('btnMasuk');

    function showAlert(pesan, tipe = 'error') {
      alertBox.textContent = pesan;
      alertBox.className = 'alert alert-' + tipe + ' show';
    }
    function hideAlert() {
      alertBox.className = 'alert';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const pin = pinEl.value.trim();

      if (!email || !pin) {
        showAlert('Email dan PIN wajib diisi.');
        return;
      }

      UI.btnLoading(btnMasuk, 'Memeriksa…');

      try {
        const res = await Api.login(email, pin);

        if (!res || res.error) {
          showAlert(res?.error || 'Login gagal.');
          return;
        }

        if (!res.token) {
          showAlert('Login gagal: server tidak mengirim token.');
          return;
        }

        Api.setSession(res.token, res.profile);
        showAlert('Berhasil! Mengalihkan…', 'success');
        setTimeout(() => window.location.replace('beranda.html'), 500);

      } catch (err) {
        console.error(err);
        showAlert('Tidak bisa terhubung ke server. Cek koneksi internet.');
      } finally {
        UI.btnReset(btnMasuk);
      }
    });

    // Enter di field PIN → submit
    pinEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // Fokus otomatis
    window.addEventListener('load', () => {
      const emailEl = document.getElementById('email');
      if (emailEl && !emailEl.value) emailEl.focus();
    });
  </script>

</body>
</html>
