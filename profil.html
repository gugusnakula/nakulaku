<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Profil Saya — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* HERO PROFIL / KARTU IDENTITAS */
  .identity-card {
    background: linear-gradient(135deg, #4A0D1F 0%, var(--maroon) 50%, var(--maroon-mid) 100%);
    border-radius: 28px;
    padding: 30px 20px 24px;
    color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(97,19,41,.3);
    margin-bottom: 20px;
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .identity-card::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.1;
  }
  .identity-card::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -50px;
    width: 150px; height: 150px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.05);
  }

  /* FOTO PROFIL */
  .profile-avatar-wrap {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: white;
    margin: 0 auto 16px;
    position: relative;
    cursor: pointer;
    border: 4px solid var(--gold);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    transition: transform .2s var(--ease-out);
    z-index: 1;
  }
  .profile-avatar-wrap:hover {
    transform: scale(1.03);
  }
  .profile-avatar-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
  .profile-avatar-fallback {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 800;
  }
  .edit-badge {
    position: absolute;
    bottom: 0; right: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--maroon);
    color: white;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
  }

  .identity-name {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
    position: relative;
    z-index: 1;
  }
  .identity-sub {
    font-size: 13px;
    opacity: 0.85;
    font-weight: 600;
    margin-bottom: 14px;
    position: relative;
    z-index: 1;
  }
  
  .identity-badges {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .identity-badges .badge {
    background: rgba(255,255,255,.15);
    color: white;
    border: 1px solid rgba(201,169,97,.5);
    backdrop-filter: blur(4px);
    font-size: 10.5px;
    padding: 4px 12px;
  }

  /* KARTU INFORMASI */
  .info-group {
    background: var(--surface);
    border-radius: 20px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: var(--sh-xs);
    animation: fade-in-up .5s var(--ease-out) .1s both;
  }
  .info-row {
    display: flex;
    align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    gap: 14px;
  }
  .info-row:last-child { border-bottom: none; }
  
  .info-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--bg);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .info-content { flex: 1; min-width: 0; }
  .info-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .info-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* SECTION TITLE */
  .section-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 24px 0 10px 4px;
  }

  /* ACTION LIST */
  .action-list {
    background: var(--surface);
    border-radius: 20px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    animation: fade-in-up .5s var(--ease-out) .2s both;
  }
  .action-item {
    display: flex;
    align-items: center;
    padding: 16px;
    gap: 14px;
    text-decoration: none;
    color: var(--ink);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    font-family: inherit;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
  }
  .action-item:last-child { border-bottom: none; }
  .action-item:hover { background: var(--bg); }
  
  .action-item .info-icon {
    background: var(--maroon-soft);
  }
  .action-item.danger .info-icon {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .action-item.danger .info-value {
    color: var(--danger);
  }

  .chevron-right {
    color: var(--muted-soft);
    transition: transform .2s;
  }
  .action-item:hover .chevron-right {
    transform: translateX(4px);
    color: var(--maroon);
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Profil Saya</div>
      <div class="app-header-sub">NAKULAKU</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<main class="container page" style="max-width:600px;padding-top:20px;">

  <!-- IDENTITY CARD -->
  <div class="identity-card" id="identityCard">
    <div class="profile-avatar-wrap" id="avatarWrap">
      <div class="profile-avatar-fallback" id="avatarFallback">?</div>
      <div class="edit-badge"><span data-icon="camera" class="icon-sm"></span></div>
    </div>
    <div class="identity-name" id="profileName">Memuat…</div>
    <div class="identity-sub" id="profileSub">—</div>
    <div class="identity-badges" id="profileBadges"></div>
  </div>

  <div id="mainContent" class="hidden">
    
    <!-- DATA PRIBADI -->
    <div class="section-title">Data Pribadi</div>
    <div class="info-group">
      <div class="info-row">
        <div class="info-icon"><span data-icon="mail"></span></div>
        <div class="info-content">
          <div class="info-label">Email</div>
          <div class="info-value" id="infoEmail">—</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon"><span data-icon="fileText"></span></div>
        <div class="info-content">
          <div class="info-label">NIP / NI PPPK</div>
          <div class="info-value" id="infoNip">—</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon"><span data-icon="briefcase"></span></div>
        <div class="info-content">
          <div class="info-label">Jabatan</div>
          <div class="info-value" id="infoJabatan">—</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon"><span data-icon="home"></span></div>
        <div class="info-content">
          <div class="info-label">Sekolah</div>
          <div class="info-value" id="infoSekolah">—</div>
        </div>
      </div>
    </div>

    <!-- KEAMANAN & PENGATURAN -->
    <div class="section-title">Keamanan & Pengaturan</div>
    <div class="action-list">
      <button class="action-item" id="btnGantiPin">
        <div class="info-icon"><span data-icon="lock"></span></div>
        <div class="info-content">
          <div class="info-value">Ubah PIN Akses</div>
        </div>
        <span class="chevron-right"><span data-icon="chevronRight"></span></span>
      </button>
      <button class="action-item danger" data-act="logout">
        <div class="info-icon"><span data-icon="logOut"></span></div>
        <div class="info-content">
          <div class="info-value">Keluar dari Akun</div>
        </div>
        <span class="chevron-right"><span data-icon="chevronRight"></span></span>
      </button>
    </div>

    <!-- APP INFO -->
    <div style="text-align:center; margin-top:32px; padding-bottom:24px;">
      <div style="font-weight:800; color:var(--muted); letter-spacing:1px; font-size:12px;">NAKULAKU EKOSISTEM</div>
      <div style="font-size:11px; color:var(--muted-soft); margin-top:4px;">Versi 3.0.0 · KKG Gugus Nakula</div>
    </div>

  </div>
</main>

<input type="file" id="fileFoto" accept="image/*" style="display:none;" />

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app-nav.js"></script>
<script>
// Render Ikon
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

let profile = null;

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  renderProfil(profile);
  
  // Bind events
  document.getElementById('avatarWrap').addEventListener('click', () => document.getElementById('fileFoto').click());
  document.getElementById('fileFoto').addEventListener('change', (e) => {
    if (e.target.files[0]) uploadFoto(e.target.files[0]);
    e.target.value = '';
  });
  
  document.getElementById('btnGantiPin').addEventListener('click', bukaFormGantiPin);

  document.getElementById('mainContent').classList.remove('hidden');
})();

function renderProfil(p) {
  document.getElementById('profileName').textContent = p.nama || '-';
  document.getElementById('profileSub').textContent = p.sekolah?.nama || 'KKG Gugus Nakula';
  
  // Render Badges (Peran)
  const badgesEl = document.getElementById('profileBadges');
  const peranLabels = {
    super_admin: 'Super Admin',
    pengurus: 'Pengurus',
    narasumber: 'Narasumber',
    pengamat: 'Pengamat',
    peserta: 'Guru Peserta',
    ks: 'Kepala Sekolah'
  };
  badgesEl.innerHTML = (p.peran || []).map(r => 
    `<span class="badge">${peranLabels[r] || r}</span>`
  ).join('');

  // Render Data Grid
  document.getElementById('infoEmail').textContent = p.email || '-';
  document.getElementById('infoNip').textContent = p.nip || 'Belum diisi';
  document.getElementById('infoJabatan').textContent = p.jabatan || '-';
  document.getElementById('infoSekolah').textContent = p.sekolah?.nama || '-';

  // Render Foto
  renderFotoProfil(p);
}

function renderFotoProfil(p) {
  const wrap = document.getElementById('avatarWrap');
  const fallback = document.getElementById('avatarFallback');
  const url = p.foto_thumb_url || (p.id ? Api.fotoUrl(p.id, 't') : null);
  const init = (p.nama || 'U').charAt(0).toUpperCase();

  // Hapus img lama jika ada
  const oldImg = wrap.querySelector('img');
  if (oldImg) oldImg.remove();

  if (url) {
    fallback.style.display = 'none';
    const img = document.createElement('img');
    img.src = url + '?v=' + Date.now();
    img.onerror = () => { img.remove(); fallback.style.display = 'flex'; };
    wrap.insertBefore(img, wrap.firstChild);
  } else {
    fallback.style.display = 'flex';
    fallback.textContent = init;
  }
}

// ============================================================
// UPLOAD FOTO
// ============================================================
async function uploadFoto(file) {
  if (!file.type.startsWith('image/')) { UI.gagal('File harus berupa gambar.'); return; }
  if (file.size > 5 * 1024 * 1024) { UI.gagal('Maksimal 5 MB.'); return; }

  UI.toast('Memproses foto...', 'info');

  try {
    const dataUrl = await kompresFoto(file, 200, 0.85);
    const res = await Api.call('profile.upload_foto', { foto: dataUrl });
    
    if (!res.ok) { UI.gagal(res.error || 'Gagal upload.'); return; }
    
    UI.sukses('Foto profil diperbarui!');
    profile.foto_thumb_url = res.data.foto_url;
    Api.updateProfile({ foto_thumb_url: res.data.foto_url });
    renderFotoProfil(profile);
  } catch (err) {
    console.error(err);
    UI.gagal('Gagal memproses foto.');
  }
}

function kompresFoto(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, maxSize, maxSize);
        const size = Math.min(img.width, img.height);
        const sx = (img.width - size) / 2;
        const sy = (img.height - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/webp', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============================================================
// GANTI PIN (MODAL)
// ============================================================
function bukaFormGantiPin() {
  const overlay = document.createElement('div');
  overlay.className = 'bottom-sheet-overlay';
  overlay.innerHTML = `
    <div class="bottom-sheet">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
          ${Icons.get('lock', { class: 'icon-lg' })}
        </div>
        <h3 style="font-size:18px;color:var(--maroon);margin-bottom:4px;">Ubah PIN</h3>
        <p style="font-size:12px;color:var(--muted);">Demi keamanan, Anda akan diminta login ulang setelah PIN diubah.</p>
      </div>

      <div class="field" style="margin-bottom:12px;">
        <label class="label">PIN Lama *</label>
        <input type="password" id="pinLama" class="input" inputmode="numeric" maxlength="6" placeholder="••••••" />
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label class="label">PIN Baru *</label>
        <input type="password" id="pinBaru" class="input" inputmode="numeric" maxlength="6" placeholder="5-6 digit angka" />
      </div>
      <div class="field" style="margin-bottom:16px;">
        <label class="label">Ulangi PIN Baru *</label>
        <input type="password" id="pinUlang" class="input" inputmode="numeric" maxlength="6" placeholder="Ulangi PIN baru" />
      </div>

      <div id="pinAlert" class="alert alert-error hidden" style="margin-bottom:16px;"></div>

      <div style="display:flex;gap:10px;">
        <button class="btn btn-secondary" data-close style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpanPin" style="flex:2;">Simpan PIN</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnSimpanPin').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnSimpanPin');
    const alertBox = overlay.querySelector('#pinAlert');
    alertBox.classList.add('hidden');

    const lama = overlay.querySelector('#pinLama').value.trim();
    const baru = overlay.querySelector('#pinBaru').value.trim();
    const ulang = overlay.querySelector('#pinUlang').value.trim();

    if (!lama || !baru || !ulang) {
      alertBox.textContent = 'Semua field wajib diisi.'; alertBox.classList.remove('hidden'); return;
    }
    if (baru !== ulang) {
      alertBox.textContent = 'PIN baru dan ulangi PIN tidak cocok.'; alertBox.classList.remove('hidden'); return;
    }

    UI.btnLoading(btn, 'Menyimpan…');
    const res = await Api.call('profile.ganti_pin', { pin_lama: lama, pin_baru: baru });
    UI.btnReset(btn);

    if (!res.ok) {
      alertBox.textContent = res.error; alertBox.classList.remove('hidden'); return;
    }

    UI.sukses('PIN berhasil diubah. Silakan login ulang.');
    setTimeout(() => {
      Api.logout();
    }, 1500);
  });
}
</script>
</body>
</html>
