<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Nakulaku Ekosistem</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
tailwind.config={theme:{extend:{
colors:{wine:{50:'#FBF2F5',100:'#F7E1E8',200:'#EFC3D1',300:'#E19AB1',400:'#D06A8C',500:'#B9446C',600:'#A62C57',700:'#8C1D3C',800:'#771731',900:'#64142B',950:'#400A1B'},accent:{500:'#C9A227'},ink:'#202024'},
fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},
boxShadow:{card:'0 1px 2px rgba(32,32,36,.05),0 8px 24px rgba(32,32,36,.06)'}
}}}
</script>
</head>
<body class="bg-[#F7F4F5] font-sans text-ink">

<header class="bg-gradient-to-b from-wine-800 to-wine-700 rounded-b-[28px] px-4 md:px-6 pt-5 pb-6">
  <div class="max-w-2xl mx-auto flex items-center gap-3">
    <a href="home.html" class="text-white/80 bg-white/10 p-2 rounded-full"><i data-lucide="arrow-left" class="w-4 h-4"></i></a>
    <div class="flex-1"><h1 class="text-white font-extrabold text-lg">Profil & Identitas</h1><p class="text-white/60 text-xs">Nakulaku Ekosistem</p></div>
    <span id="demo-badge" class="hidden bg-amber-400 text-amber-950 text-[9px] font-extrabold px-1.5 py-0.5 rounded">DEMO</span>
  </div>
</header>

<main class="max-w-2xl mx-auto p-4 md:p-6 space-y-5 pb-16">
  <!-- IDENTITAS -->
  <div class="bg-white rounded-2xl shadow-card p-6 text-center">
    <div id="p-avatar" class="w-20 h-20 rounded-full bg-wine-700 text-white flex items-center justify-center text-2xl font-extrabold mx-auto">?</div>
    <p class="font-extrabold text-lg mt-3" id="p-nama">-</p>
    <p class="text-sm text-gray-500" id="p-jab">-</p>
    <p class="text-sm text-gray-500" id="p-inst">-</p>
    <div class="flex justify-center gap-1 mt-3" id="p-roles"></div>
    <p class="mt-3" id="p-status"></p>
  </div>

  <!-- DATA -->
  <div class="bg-white rounded-2xl shadow-card p-5 text-sm">
    <p class="font-bold mb-2">Data Akun</p>
    <div class="py-2 flex border-b border-gray-50"><span class="w-28 text-gray-400">Email</span><span id="p-email" class="font-semibold break-all">-</span></div>
    <div class="py-2 flex border-b border-gray-50"><span class="w-28 text-gray-400">Jabatan</span><span id="p-jab2">-</span></div>
    <div class="py-2 flex"><span class="w-28 text-gray-400">Instansi</span><span id="p-inst2">-</span></div>
  </div>

  <!-- KTA DIGITAL -->
  <div class="rounded-3xl bg-gradient-to-br from-wine-800 to-wine-600 text-white p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-4"><p class="font-extrabold">KTA Digital Nakulaku</p><i data-lucide="graduation-cap" class="w-6 h-6"></i></div>
    <p class="text-xl font-extrabold" id="k-nama">-</p>
    <p class="text-sm text-white/80" id="k-jab">-</p>
    <p class="text-sm text-white/80" id="k-inst">-</p>
    <p class="text-xs text-white/60 mt-1" id="k-email">-</p>
    <div class="bg-white rounded-xl p-3 mt-4 flex justify-center"><div id="qr"></div></div>
    <p class="text-[10px] text-white/60 text-center mt-2">Tunjukkan QR saat check-in kegiatan</p>
  </div>

  <!-- AKSI -->
  <div class="space-y-2">
    <a href="index.html" class="block w-full bg-wine-800 text-white rounded-xl py-3 font-bold text-center flex items-center justify-center gap-2"><i data-lucide="shield-check" class="w-4 h-4"></i> Kelola Akun (Pusat Akun)</a>
    <a href="home.html" class="block w-full bg-white rounded-xl py-3 font-bold text-center">Kembali ke Beranda</a>
    <button onclick="doLogout()" class="w-full bg-red-50 text-red-600 rounded-xl py-3 font-bold">Keluar</button>
  </div>
</main>

<script>
const DEMO = location.protocol==='file:' || location.hostname==='localhost' || location.hostname==='127.0.0.1' || location.search.includes('demo=1');
const firebaseConfig={apiKey:"AIzaSyDaTXg2_oaKNYjJ0HxSGa9qXPQQ7VK0uDs",authDomain:"nakulaku-ekosistem.firebaseapp.com",projectId:"nakulaku-ekosistem",storageBucket:"nakulaku-ekosistem.firebasestorage.app",messagingSenderId:"672296906494",appId:"1:672296906494:web:2e90334b9d3136a4917faf"};
let auth=null, db=null;
if(!DEMO){ firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore(); }
const $=id=>document.getElementById(id);

function render(ME){
  const nama=ME.nama||ME.email||'User';
  $('p-avatar').textContent=nama.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  $('p-nama').textContent=nama;
  $('p-jab').textContent=ME.jabatan||'-'; $('p-jab2').textContent=ME.jabatan||'-';
  $('p-inst').textContent=ME.instansi||'-'; $('p-inst2').textContent=ME.instansi||'-';
  $('p-email').textContent=ME.email||'-'; $('k-email').textContent=ME.email||'-';
  $('k-nama').textContent=nama; $('k-jab').textContent=ME.jabatan||'-'; $('k-inst').textContent=ME.instansi||'-';
  $('p-roles').innerHTML=(ME.role||'').split(',').filter(Boolean).map(r=>`<span class="text-[11px] bg-wine-100 text-wine-700 px-2 py-0.5 rounded-full font-bold">${r.trim()}</span>`).join('');
  const st=ME.status||'active';
  const m={active:['bg-emerald-100 text-emerald-700','AKTIF'],pending:['bg-amber-100 text-amber-700','PENDING'],nonactive:['bg-red-100 text-red-600','NONAKTIF'],rejected:['bg-gray-200 text-gray-500','DITOLAK']};
  const[c,l]=m[st]||m.active; $('p-status').innerHTML=`<span class="text-[10px] font-extrabold px-2 py-1 rounded-full ${c}">${l}</span>`;
  $('qr').innerHTML=''; new QRCode($('qr'),{text:JSON.stringify({e:ME.email,n:ME.nama}),width:150,height:150});
  lucide.createIcons();
}

if(DEMO){
  $('demo-badge').classList.remove('hidden');
  render({email:'iwan4943@gmail.com',nama:'Ekwan Nugroho, S.Pd.I.',jabatan:'Kepala Sekolah',instansi:'SD Negeri 3 Krisak',role:'admin,narasumber',status:'active'});
}else{
  auth.onAuthStateChanged(async u=>{
    if(!u){location.href='index.html';return;}
    const d=await db.collection('users').doc(u.email).get();
    render(d.exists?d.data():{email:u.email,nama:u.displayName});
  });
}
function doLogout(){ if(auth) auth.signOut(); else alert('Mode demo.'); }
lucide.createIcons();
</script>
</body>
</html>
