<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Detail Tugas — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  .app-header-brand { flex: 1; justify-content: flex-start; }
  .app-header-text { text-align: left; }

  .tugas-stage { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
  
  /* CARD UTAMA TUGAS */
  .tugas-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 20px; margin-bottom: 20px;
    box-shadow: var(--sh-sm); animation: fade-in-up .5s var(--ease-out) both;
  }
  .tugas-icon-wrap {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon); display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .tugas-title { font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.3; margin-bottom: 8px; }
  .tugas-desc { font-size: 14px; color: var(--muted); line-height: 1.6; white-space: pre-line; margin-bottom: 16px; }
  
  .tugas-meta-box {
    display: flex; gap: 12px; padding: 12px; background: var(--bg);
    border-radius: 12px; font-size: 12.5px; font-weight: 700; color: var(--ink);
  }
  .tugas-meta-box span { display: flex; align-items: center; gap: 6px; }

  /* FORM PENGUMPULAN */
  .kumpul-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 20px; margin-bottom: 20px;
    box-shadow: var(--sh-sm);
  }
  .status-banner {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-radius: 12px; font-size: 13px; font-weight: 700; margin-bottom: 16px;
  }
  .status-banner.diterima { background: var(--success-soft); color: var(--success); }
  .status-banner.revisi { background: var(--warning-soft); color: var(--warning); }
  .status-banner.ditolak { background: var(--danger-soft); color: var(--danger); }
  .status-banner.menunggu { background: var(--info-soft); color: var(--info); }

  /* KOMENTAR */
  .komentar-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .komentar-item {
    display: flex; gap: 12px; padding: 14px;
    background: var(--bg); border-radius: 16px;
  }
  .komentar-item.narsum { background: var(--maroon-soft); }
  .kom-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: white;
    color: var(--maroon); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; flex-shrink: 0; overflow: hidden; position: relative;
  }
  .kom-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .kom-body { flex: 1; min-width: 0; }
  .kom-name { font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .kom-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--maroon); color: white; text-transform: uppercase; }
  .kom-text { font-size: 13px; color: var(--ink); line-height: 1.5; margin-top: 4px; }
  .kom-time { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 4px; }

  .komentar-input-wrap {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 10px;
  }
  .komentar-input-wrap textarea {
    flex: 1; border: none; background: transparent; padding: 8px;
    font-size: 13.5px; font-family: inherit; resize: none; outline: none; min-height: 44px;
  }
  .btn-send {
    width: 44px; height: 44px; border-radius: 12px; border: none;
    background: var(--maroon); color: white; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand" style="display:flex; align-items:center; gap:10px;">
    <div class="app-header-text" style="text-align:left;">
      <div class="app-header-title">Detail Tugas</div>
      <div class="app-header-sub">NAKULAKU</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar"><span data-icon="logOut"></span></button>
</header>

<div class="desktop-layout">
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo"><img src="assets/img/logo-mark.svg" alt="Nakula" /></div>
      <div class="sidebar-brand-text"><div class="name">NAKULAKU</div><div class="sub">KKG Gugus Nakula</div></div>
    </div>
    <nav class="sidebar-menu">
      <a class="sidebar-item" data-nav="beranda" href="beranda.html"><span data-icon="home"></span> Beranda</a>
      <a class="sidebar-item active" data-nav="pertemuan" href="beranda.html#sectionPertemuan"><span data-icon="calendar"></span> Pertemuan</a>
      <a class="sidebar-item" data-nav="aktivitas" href="aktivitas.html"><span data-icon="activity"></span> Aktivitas Saya</a>
      <a class="sidebar-item" data-nav="profil" href="profil.html"><span data-icon="user"></span> Profil</a>
    </nav>
  </aside>

  <main class="desktop-main">
    <div class="desktop-topbar">
      <h2>Detail Tugas</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-icon" data-act="logout"><span data-icon="logOut"></span></button>
      </div>
    </div>

    <div class="tugas-stage">
      <div id="loading">
        <div class="skeleton" style="height:200px;border-radius:20px;margin-bottom:20px;"></div>
        <div class="skeleton" style="height:100px;border-radius:20px;"></div>
      </div>

      <div id="content" class="hidden">
        <!-- Detail Tugas -->
        <div class="tugas-card" id="detailTugas"></div>

        <!-- Form Kumpul / Status -->
        <div class="kumpul-card" id="kumpulArea"></div>

        <!-- Komentar -->
        <div class="kumpul-card" id="komentarArea">
          <h3 style="font-size:15px;font-weight:800;margin-bottom:16px;">Diskusi & Komentar</h3>
          <div class="komentar-list" id="komentarList"></div>
          <div class="komentar-input-wrap">
            <textarea id="komentarInput" placeholder="Tulis komentar atau pertanyaan..." rows="1"></textarea>
            <button class="btn-send" id="btnKirimKomentar" disabled><span data-icon="send"></span></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app-nav.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

const params = new URLSearchParams(window.location.search);
const tugasId = Number(params.get('id'));
let profile = null;
let dataTugas = null;

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  // Setup User Chip
  const chip = document.getElementById('userChip');
  if (chip) {
    const init = (profile.nama || 'A').charAt(0).toUpperCase();
    const fotoUrl = Api.fotoSayaUrl('t');
    chip.innerHTML = `<div class="avatar">${fotoUrl ? `<img src="${fotoUrl}" onerror="this.parentElement.textContent='${init}'">` : init}</div><span>${UI.escapeHtml(profile.nama || '-')}</span>`;
  }

  if (!tugasId) { UI.gagal('Tugas tidak ditemukan.'); return; }
  await loadData();
})();

async function loadData() {
  const res = await Api.call('tugas.detail', { tugas_id: tugasId });
  document.getElementById('loading').classList.add('hidden');
  
  if (!res.ok) {
    document.getElementById('content').innerHTML = UI.errorHtml(res.error || 'Gagal memuat.');
    document.getElementById('content').classList.remove('hidden');
    return;
  }

  dataTugas = res.data;
  document.getElementById('content').classList.remove('hidden');
  renderTugas();
  renderKumpul();
  renderKomentar();

  // Setup Komentar
  const ta = document.getElementById('komentarInput');
  const btn = document.getElementById('btnKirimKomentar');
  ta.addEventListener('input', () => {
    btn.disabled = !ta.value.trim();
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  btn.addEventListener('click', kirimKomentar);
}

function renderTugas() {
  const t = dataTugas.tugas;
  const p = dataTugas.pertemuan;
  
  document.getElementById('detailTugas').innerHTML = `
    <div class="tugas-icon-wrap">${Icons.get('clipboard', { class: 'icon-lg' })}</div>
    <div class="tugas-title">${UI.escapeHtml(t.judul)}</div>
    <div class="tugas-desc">${UI.escapeHtml(t.deskripsi || 'Tidak ada deskripsi.')}</div>
    <div class="tugas-meta-box">
      <span>${Icons.get('book', { class: 'icon-sm' })} Pertemuan #${p.urutan}</span>
      ${t.deadline ? `<span>${Icons.get('clock', { class: 'icon-sm' })} Deadline: ${UI.formatTanggalJam(t.deadline)}</span>` : ''}
    </div>
  `;
}

function renderKumpul() {
  const el = document.getElementById('kumpulArea');
  const k = dataTugas.pengumpulan_saya;
  
  let html = '';
  
  if (k) {
    const statusMap = {
      menunggu: { cls: 'menunggu', icon: 'clock', text: 'Menunggu Dinilai' },
      diterima: { cls: 'diterima', icon: 'checkCircle', text: 'Tugas Diterima' },
      revisi: { cls: 'revisi', icon: 'alertCircle', text: 'Perlu Revisi' },
      ditolak: { cls: 'ditolak', icon: 'xCircle', text: 'Tugas Ditolak' }
    };
    const s = statusMap[k.status] || statusMap.menunggu;

    html += `
      <div class="status-banner ${s.cls}">
        ${Icons.get(s.icon, { class: 'icon-sm' })} ${s.text}
      </div>
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;">LINK ANDA:</div>
        <a href="${UI.escapeHtml(k.link)}" target="_blank" style="font-size:13.5px;font-weight:700;color:var(--maroon);text-decoration:underline;">${UI.escapeHtml(k.link)}</a>
      </div>
      ${k.nilai !== null ? `<div style="font-size:14px;font-weight:800;color:var(--success);margin-bottom:16px;">Nilai: ${k.nilai}</div>` : ''}
    `;
  }

  // Form (Selalu ada untuk edit/upload baru)
  html += `
    <h3 style="font-size:15px;font-weight:800;margin-bottom:12px;margin-top:${k ? '16px' : '0'};">${k ? 'Perbarui Pengumpulan' : 'Kumpulkan Tugas'}</h3>
    <div class="field" style="margin-bottom:12px;">
      <label class="label">Link Tugas (Google Drive, YouTube, dll) *</label>
      <input type="url" id="inputLink" class="input" placeholder="https://..." value="${k ? UI.escapeHtml(k.link) : ''}" />
    </div>
    <div class="field" style="margin-bottom:16px;">
      <label class="label">Catatan (Opsional)</label>
      <textarea id="inputCatatan" class="input" rows="2" style="resize:vertical;">${k ? UI.escapeHtml(k.catatan || '') : ''}</textarea>
    </div>
    <button class="btn btn-primary btn-full" id="btnKumpul">${k ? 'Perbarui Tugas' : 'Kumpulkan Tugas'}</button>
  `;

  el.innerHTML = html;

  document.getElementById('btnKumpul').addEventListener('click', async () => {
    const btn = document.getElementById('btnKumpul');
    const link = document.getElementById('inputLink').value.trim();
    const catatan = document.getElementById('inputCatatan').value.trim();
    
    if (!link) { UI.gagal('Link wajib diisi.'); return; }
    
    UI.btnLoading(btn, 'Menyimpan…');
    const res = await Api.call('tugas.kumpul', { tugas_id: tugasId, link, catatan });
    UI.btnReset(btn);
    
    if (!res.ok) { UI.gagal(res.error); return; }
    UI.sukses(k ? 'Tugas diperbarui.' : 'Tugas dikumpulkan!');
    await loadData();
  });
}

function renderKomentar() {
  const el = document.getElementById('komentarList');
  const list = dataTugas.komentar || [];
  
  if (list.length === 0) {
    el.innerHTML = '<div style="text-align:center;font-size:12.5px;color:var(--muted);padding:10px;">Belum ada komentar.</div>';
    return;
  }

  el.innerHTML = list.map(c => {
    const isNarsum = c.peran_penulis === 'narasumber' || c.peran_penulis === 'pengurus';
    const init = (c.penulis?.nama_lengkap || '?').charAt(0).toUpperCase();
    const fotoUrl = c.penulis?.foto_thumb_url || (c.penulis?.id ? Api.fotoUrl(c.penulis.id, 't') : null);

    return `
      <div class="komentar-item ${isNarsum ? 'narsum' : ''}">
        <div class="kom-avatar">
          <span>${init}</span>
          ${fotoUrl ? `<img src="${fotoUrl}" onerror="this.remove()">` : ''}
        </div>
        <div class="kom-body">
          <div class="kom-name">
            ${UI.escapeHtml(c.penulis?.nama_lengkap || '-')}
            ${isNarsum ? `<span class="kom-badge">${c.peran_penulis === 'narasumber' ? 'Narsum' : 'Admin'}</span>` : ''}
          </div>
          <div class="kom-text">${UI.escapeHtml(c.isi)}</div>
          <div class="kom-time">${UI.timeAgo(c.dibuat_pada)}</div>
        </div>
      </div>
    `;
  }).join('');
}

async function kirimKomentar() {
  const ta = document.getElementById('komentarInput');
  const btn = document.getElementById('btnKirimKomentar');
  const isi = ta.value.trim();
  if (!isi) return;

  btn.disabled = true;
  UI.btnLoading(btn, '');
  
  const res = await Api.call('tugas.komentar', { 
    pengumpulan_id: dataTugas.pengumpulan_saya.id, 
    isi 
  });
  
  UI.btnReset(btn);
  
  if (!res.ok) { 
    UI.gagal(res.error); 
    btn.disabled = false;
    return; 
  }
  
  ta.value = '';
  ta.style.height = '44px';
  await loadData(); // Reload untuk dapat komentar baru
}
</script>
</body>
</html>
