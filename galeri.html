<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Galeri Sekolah — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* ============================================
     PUBLIC HEADER
     ============================================ */
  .public-header {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 100%);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(97,19,41,.15);
  }
  .public-header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: white;
  }
  .public-header-logo {
    width: 40px; height: 40px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--gold);
    flex-shrink: 0;
    overflow: hidden;
  }
  .public-header-logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.25);
  }
  .public-header-btn {
    color: white;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.12);
    padding: 8px 14px;
    border-radius: 10px;
    transition: all .15s;
  }
  .public-header-btn:hover {
    background: rgba(255,255,255,.22);
    color: white;
    text-decoration: none;
  }

  /* ============================================
     HERO GALERI
     ============================================ */
  .hero-galeri {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px 20px 0;
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-galeri .icon-big {
    width: 84px; height: 84px;
    margin: 0 auto 16px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 12px 32px rgba(125,29,58,.3),
      inset 0 0 0 2px rgba(201,169,97,.3);
    position: relative;
  }
  .hero-galeri .icon-big::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 28px;
    border: 1.5px solid var(--gold);
    opacity: 0.25;
  }
  .hero-galeri h1 {
    font-size: 24px;
    font-weight: 800;
    color: var(--maroon);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .hero-galeri p {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.6;
  }

  /* ============================================
     STATISTIK
     ============================================ */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
    animation: fade-in-up .5s var(--ease-out) .1s both;
  }
  .stat-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    transition: all .2s var(--ease-out);
  }
  .stat-box:hover {
    border-color: var(--maroon-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(125,29,58,.08);
  }
  .stat-box .n {
    font-size: 26px;
    font-weight: 800;
    color: var(--maroon);
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .stat-box .l {
    font-size: 10px;
    color: var(--muted);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 6px;
  }

  /* ============================================
     FILTER CHIP
     ============================================ */
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    animation: fade-in-up .5s var(--ease-out) .15s both;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .2s var(--ease-out);
    white-space: nowrap;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-chip:hover {
    border-color: var(--maroon-light);
    color: var(--maroon);
    transform: translateY(-1px);
  }
  .filter-chip.active {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    border-color: var(--maroon);
    color: white;
    box-shadow:
      0 4px 12px rgba(125,29,58,.25),
      inset 0 0 0 1px rgba(201,169,97,.3);
  }

  /* ============================================
     ITEM GALERI
     ============================================ */
  .item-publik {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    position: relative;
    overflow: hidden;
  }
  .item-publik:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 10px 24px rgba(125,29,58,.1);
    transform: translateY(-2px);
  }

  /* Ornamen jenis */
  .item-publik.prestasi::after,
  .item-publik.kegiatan::after,
  .item-publik.pembiasaan::after {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.5;
  }
  .item-publik.prestasi::after {
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
  }
  .item-publik.kegiatan::after {
    background: radial-gradient(circle, rgba(30,64,175,.12) 0%, transparent 70%);
  }
  .item-publik.pembiasaan::after {
    background: radial-gradient(circle, rgba(21,128,61,.12) 0%, transparent 70%);
  }

  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .item-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    transition: transform .2s var(--ease-out);
  }
  .item-publik:hover .item-icon {
    transform: scale(1.05);
  }
  .item-icon.prestasi {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: white;
  }
  .item-icon.pembiasaan {
    background: linear-gradient(135deg, #22C55E 0%, #15803D 100%);
    color: white;
  }
  .item-icon.kegiatan {
    background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
    color: white;
  }

  .item-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .item-title {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 4px;
    line-height: 1.4;
    color: var(--ink);
  }
  .item-sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }

  .item-extra {
    margin-top: 8px;
    position: relative;
    z-index: 1;
  }
  .badge-tingkat {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-right: 5px;
    margin-bottom: 4px;
  }
  .badge-tingkat.sekolah { background: #E5E7EB; color: #4B5563; }
  .badge-tingkat.kecamatan { background: #DBEAFE; color: #1E40AF; }
  .badge-tingkat.kabupaten { background: #FEF3C7; color: #B45309; }
  .badge-tingkat.provinsi { background: #FBF3D0; color: #A37E2E; }
  .badge-tingkat.nasional { background: var(--maroon-soft); color: var(--maroon); }
  .badge-tingkat.internasional {
    background: linear-gradient(135deg, var(--gold) 0%, var(--maroon) 100%);
    color: white;
  }
  .badge-peringkat {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: inline-block;
    margin-bottom: 4px;
  }

  .item-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 12px;
    margin-top: 12px;
    border-top: 1px dashed var(--border);
    position: relative;
    z-index: 1;
  }
  .item-sekolah {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: var(--maroon-soft);
    color: var(--maroon);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    text-decoration: none;
    transition: all .15s;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-sekolah:hover {
    background: var(--maroon);
    color: white;
    text-decoration: none;
  }
  .link-bukti {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--maroon);
    text-decoration: none;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--maroon-soft);
    background: transparent;
    transition: all .15s;
    margin-left: auto;
  }
  .link-bukti:hover {
    background: var(--maroon-soft);
    color: var(--maroon);
    text-decoration: none;
  }

  @media (min-width: 720px) {
    .item-publik { padding: 18px; }
    .hero-galeri .icon-big { width: 96px; height: 96px; }
    .hero-galeri h1 { font-size: 28px; }
  }
</style>
</head>
<body>

<header class="public-header">
  <a href="beranda.html" class="public-header-brand">
    <div class="public-header-logo">
      <img src="assets/img/logo-mark.svg" alt="Nakula" />
    </div>
    <div>
      <div style="font-weight:800;font-size:14px;letter-spacing:.5px;">NAKULAKU</div>
      <div style="font-size:10px;opacity:.8;">KKG Gugus Nakula</div>
    </div>
  </a>
  <a href="sekolah.html" class="public-header-btn">
    <span data-icon="home" class="icon-sm"></span>
    Profil Sekolah
  </a>
</header>

<main class="container page" style="max-width:720px;padding-top:20px;padding-bottom:40px;">

  <!-- HERO -->
  <div class="hero-galeri">
    <div class="icon-big">
      <span data-icon="grid" class="icon-xl"></span>
    </div>
    <h1>GALERI SEKOLAH</h1>
    <p>Prestasi siswa, kegiatan, dan pembiasaan<br />dari 10 sekolah KKG Gugus Nakula</p>
  </div>

  <!-- STATISTIK -->
  <div class="stat-row" id="statRow">
    <div class="stat-box">
      <div class="n" id="statTotal">—</div>
      <div class="l">Total Item</div>
    </div>
    <div class="stat-box">
      <div class="n" id="statSekolah">—</div>
      <div class="l">Sekolah</div>
    </div>
    <div class="stat-box">
      <div class="n" id="statBulan">—</div>
      <div class="l">Bulan Ini</div>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter-row" id="filterJenis">
    <button class="filter-chip active" data-jenis="">
      <span data-icon="grid" class="icon-sm"></span> Semua
    </button>
    <button class="filter-chip" data-jenis="prestasi">
      <span data-icon="award" class="icon-sm"></span> Prestasi
    </button>
    <button class="filter-chip" data-jenis="kegiatan">
      <span data-icon="calendar" class="icon-sm"></span> Kegiatan
    </button>
    <button class="filter-chip" data-jenis="pembiasaan">
      <span data-icon="sparkles" class="icon-sm"></span> Pembiasaan
    </button>
  </div>

  <div id="listItem">
    <div class="skeleton" style="height:140px;border-radius:18px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:140px;border-radius:18px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:140px;border-radius:18px;"></div>
  </div>

</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let jenisAktif = '';
let cacheGaleri = {};
let semuaData = [];

(async () => {
  await loadGaleri();

  document.querySelectorAll('.filter-chip').forEach(c => {
    c.addEventListener('click', () => {
      jenisAktif = c.dataset.jenis;
      document.querySelectorAll('.filter-chip').forEach(x => x.classList.toggle('active', x === c));
      loadGaleri();
    });
  });
})();

async function loadGaleri() {
  const el = document.getElementById('listItem');

  if (cacheGaleri[jenisAktif]) {
    renderList(cacheGaleri[jenisAktif]);
    return;
  }

  el.innerHTML = `
    <div class="skeleton" style="height:140px;border-radius:18px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:140px;border-radius:18px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:140px;border-radius:18px;"></div>
  `;

  const res = await Api.callSekolahPublik('sekolah.galeri', {
    jenis: jenisAktif || undefined,
    limit: 100,
  });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error);
    return;
  }

  const data = res.data.data || [];
  cacheGaleri[jenisAktif] = data;
  semuaData = data;
  updateStatistik(data);
  renderList(data);
}

function updateStatistik(list) {
  document.getElementById('statTotal').textContent = list.length;

  const sekolahSet = new Set();
  list.forEach(it => {
    if (it.sekolah?.nama) sekolahSet.add(it.sekolah.nama);
  });
  document.getElementById('statSekolah').textContent = sekolahSet.size;

  const now = new Date();
  const bulanIni = list.filter(it => {
    const tgl = it.tanggal || (it.tahun ? `${it.tahun}-01-01` : null);
    if (!tgl) return false;
    const d = new Date(tgl);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
  document.getElementById('statBulan').textContent = bulanIni;
}

function renderList(list) {
  const el = document.getElementById('listItem');

  if (list.length === 0) {
    el.innerHTML = `
      <div class="empty-state" style="text-align:center;padding:50px 20px;">
        <div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--maroon-soft) 0%,#F9DDE6 100%);color:var(--maroon);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;position:relative;">
          ${Icons.get('inbox', { class: 'icon-xl' })}
        </div>
        <div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:6px;">Belum Ada Data</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.55;max-width:320px;margin:0 auto;">
          Galeri akan muncul setelah panitia memverifikasi submission dari sekolah.
        </div>
      </div>
    `;
    return;
  }

  el.innerHTML = list.map((it, idx) => renderItem(it, idx)).join('');
}

function renderItem(it, idx) {
  const jenis = it._jenis;
  const sekolah = it.sekolah || {};
  const sekolahId = sekolah.id || '';

  let judul = '';
  let sub = '';
  let extra = '';

  if (jenis === 'prestasi') {
    judul = it.nama_lomba;
    const tingkatLabel = {
      sekolah: 'Sekolah', kecamatan: 'Kecamatan', kabupaten: 'Kabupaten',
      provinsi: 'Provinsi', nasional: 'Nasional', internasional: 'Internasional',
    }[it.tingkat] || it.tingkat;
    const peringkatLabel = {
      juara_1: 'Juara 1', juara_2: 'Juara 2', juara_3: 'Juara 3', harapan: 'Harapan',
    }[it.peringkat] || it.peringkat;
    sub = `${it.nama_siswa}${it.kelas ? ' (' + it.kelas + ')' : ''} · ${UI.formatTanggalPendek(it.tanggal)}`;
    extra = `
      <div class="item-extra">
        <span class="badge-tingkat ${it.tingkat}">${tingkatLabel}</span>
        <span class="badge-peringkat">${peringkatLabel}</span>
      </div>
    `;
  } else if (jenis === 'kegiatan') {
    judul = it.nama;
    const skalaLabel = {
      internal: 'Internal', orang_tua: 'Orang Tua',
      komunitas: 'Komunitas', kecamatan: 'Kecamatan', kabupaten_plus: 'Kabupaten+',
    }[it.skala] || it.skala;
    sub = `${UI.formatTanggalPendek(it.tanggal)}${it.tempat ? ' · ' + it.tempat : ''}`;
    extra = `<div class="item-extra"><span class="badge-tingkat kecamatan">${skalaLabel}</span></div>`;
  } else if (jenis === 'pembiasaan') {
    judul = it.nama;
    sub = `${it.frekuensi || '-'}${it.bulan ? ' · Bulan ' + it.bulan : ''} ${it.tahun}`;
    extra = it.deskripsi
      ? `<div class="item-extra" style="font-size:12.5px;color:var(--muted);line-height:1.5;">${UI.escapeHtml(it.deskripsi)}</div>`
      : '';
  }

  const sekolahLink = sekolahId
    ? `<a href="sekolah.html?id=${sekolahId}" class="item-sekolah">
         ${Icons.get('home', { class: 'icon-sm' })} ${UI.escapeHtml(sekolah.nama || '-')}
       </a>`
    : `<span class="item-sekolah">${Icons.get('home', { class: 'icon-sm' })} ${UI.escapeHtml(sekolah.nama || '-')}</span>`;

  const buktiHtml = it.bukti_url
    ? `<a href="${UI.escapeHtml(it.bukti_url)}" target="_blank" rel="noopener" class="link-bukti">
         ${Icons.get('externalLink', { class: 'icon-sm' })} Bukti
       </a>`
    : '';

  const iconName = jenis === 'prestasi' ? 'award' : jenis === 'kegiatan' ? 'calendar' : 'sparkles';

  return `
    <div class="item-publik ${jenis}" style="animation-delay:${idx * 0.04}s">
      <div class="item-head">
        <div class="item-icon ${jenis}">
          ${Icons.get(iconName, { class: 'icon-sm' })}
        </div>
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(judul)}</div>
          <div class="item-sub">${UI.escapeHtml(sub)}</div>
        </div>
      </div>
      ${extra}
      <div class="item-footer">
        ${sekolahLink}
        ${buktiHtml}
      </div>
    </div>
  `;
}
</script>

</body>
</html>
