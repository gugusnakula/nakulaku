<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Galeri Sekolah — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* ═══════════════════════════════════════
     HEADER PUBLIC
     ═══════════════════════════════════════ */
  .public-header {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 100%);
    color: white;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 12px rgba(97,19,41,.15);
    min-height: 60px;
    gap: 10px;
  }
  .public-header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: white;
    min-width: 0;
    flex-shrink: 0;
  }
  .public-header-logo {
    width: 36px; height: 36px;
    background: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--gold);
    flex-shrink: 0;
    overflow: hidden;
  }
  .public-header-logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.25);
  }
  .public-header-text { min-width: 0; }
  .public-header-title { font-weight: 800; font-size: 14px; letter-spacing: .5px; line-height: 1.1; }
  .public-header-sub { font-size: 10px; opacity: .8; }

  .public-header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  .public-header-btn {
    color: white;
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,.12);
    padding: 8px 12px;
    border-radius: 10px;
    transition: all .15s;
    border: none;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .public-header-btn:hover {
    background: rgba(255,255,255,.22);
    color: white;
    text-decoration: none;
  }

  /* ═══════════════════════════════════════
     HERO GALERI
     ═══════════════════════════════════════ */
  .hero-galeri {
    text-align: center;
    margin-bottom: 20px;
    padding: 12px 16px 0;
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-galeri .icon-big {
    width: 76px; height: 76px;
    margin: 0 auto 14px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 32px rgba(125,29,58,.3), inset 0 0 0 2px rgba(201,169,97,.3);
    position: relative;
  }
  .hero-galeri .icon-big::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 24px;
    border: 1.5px solid var(--gold);
    opacity: 0.25;
  }
  .hero-galeri h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--maroon);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .hero-galeri p {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto;
  }

  /* ═══════════════════════════════════════
     STATISTIK (4 box)
     ═══════════════════════════════════════ */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 18px;
    animation: fade-in-up .5s var(--ease-out) .05s both;
  }
  .stat-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 6px;
    text-align: center;
    transition: all .2s var(--ease-out);
  }
  .stat-box:hover {
    border-color: var(--maroon-light);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(125,29,58,.08);
  }
  .stat-box .n {
    font-size: 20px;
    font-weight: 800;
    color: var(--maroon);
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .stat-box .l {
    font-size: 9px;
    color: var(--muted);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 5px;
  }

  /* ═══════════════════════════════════════
     SEARCH + SORT ROW
     ═══════════════════════════════════════ */
  .search-sort-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    animation: fade-in-up .5s var(--ease-out) .1s both;
  }
  .search-wrap {
    flex: 1;
    position: relative;
    min-width: 0;
  }
  .search-wrap input {
    width: 100%;
    padding: 11px 36px 11px 38px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    font-weight: 600;
    outline: none;
    transition: all .15s;
  }
  .search-wrap input::placeholder {
    color: var(--muted-soft);
    font-weight: 500;
  }
  .search-wrap input:focus {
    border-color: var(--maroon);
    box-shadow: 0 0 0 3px rgba(125,29,58,.08);
  }
  .search-wrap .icon-left {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  .search-wrap .icon-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
    border: none;
    color: var(--muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all .15s;
  }
  .search-wrap .icon-clear:hover {
    background: var(--maroon-soft);
    color: var(--maroon);
  }
  .search-wrap.has-value .icon-clear { display: flex; }

  .sort-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .sort-btn:hover {
    border-color: var(--maroon-light);
    color: var(--maroon);
  }
  .sort-btn.active {
    background: var(--maroon-soft);
    border-color: var(--maroon);
    color: var(--maroon);
  }

  /* ═══════════════════════════════════════
     SEKOLAH FILTER CHIPS
     ═══════════════════════════════════════ */
  .sekolah-chips-wrap {
    margin-bottom: 12px;
    animation: fade-in-up .5s var(--ease-out) .12s both;
  }
  .sekolah-chips-label {
    font-size: 10px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    padding-left: 2px;
  }
  .sekolah-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .sekolah-chips::-webkit-scrollbar { display: none; }
  .sk-chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px 6px 6px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .sk-chip:hover {
    border-color: var(--maroon-light);
    color: var(--maroon);
    transform: translateY(-1px);
  }
  .sk-chip.active {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    border-color: var(--maroon);
    color: white;
    box-shadow: 0 4px 12px rgba(125,29,58,.25);
  }
  .sk-chip .sk-logo {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 800;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    border: 1.5px solid white;
  }
  .sk-chip.active .sk-logo {
    border-color: var(--gold);
  }
  .sk-chip .sk-logo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .sk-chip.all {
    padding: 6px 12px;
  }

  /* ═══════════════════════════════════════
     TAB JENIS
     ═══════════════════════════════════════ */
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    animation: fade-in-up .5s var(--ease-out) .15s both;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all .2s var(--ease-out);
    white-space: nowrap;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-chip:hover {
    border-color: var(--maroon-light);
    color: var(--maroon);
    transform: translateY(-1px);
  }
  .filter-chip.active {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    border-color: var(--maroon);
    color: white;
    box-shadow: 0 4px 12px rgba(125,29,58,.25), inset 0 0 0 1px rgba(201,169,97,.3);
  }
  .filter-chip .count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
    font-size: 9.5px;
    font-weight: 800;
    line-height: 1;
  }
  .filter-chip.active .count {
    background: rgba(255,255,255,.25);
    color: white;
  }

  /* ═══════════════════════════════════════
     INFO BAR
     ═══════════════════════════════════════ */
  .info-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 4px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .info-bar .active-filters {
    display: inline-flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .info-bar .af-tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
    background: var(--maroon-soft);
    color: var(--maroon);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
  }

  /* ═══════════════════════════════════════
     ITEM CARD
     ═══════════════════════════════════════ */
  .item-publik {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    position: relative;
    overflow: hidden;
  }
  .item-publik:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 10px 24px rgba(125,29,58,.1);
    transform: translateY(-2px);
  }

  .item-publik.prestasi::after,
  .item-publik.kegiatan::after,
  .item-publik.pembiasaan::after,
  .item-publik.karya::after {
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.5;
  }
  .item-publik.prestasi::after { background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%); }
  .item-publik.kegiatan::after { background: radial-gradient(circle, rgba(30,64,175,.12) 0%, transparent 70%); }
  .item-publik.pembiasaan::after { background: radial-gradient(circle, rgba(21,128,61,.12) 0%, transparent 70%); }
  .item-publik.karya::after { background: radial-gradient(circle, rgba(124,58,237,.12) 0%, transparent 70%); }

  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .item-thumb {
    width: 84px;
    height: 84px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--bg);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .item-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .item-thumb .fallback-icon {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .item-thumb .fallback-icon svg { width: 28px; height: 28px; }
  .item-thumb.prestasi .fallback-icon { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); }
  .item-thumb.pembiasaan .fallback-icon { background: linear-gradient(135deg, #22C55E 0%, #15803D 100%); }
  .item-thumb.kegiatan .fallback-icon { background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%); }
  .item-thumb.karya .fallback-icon { background: linear-gradient(135deg, #A855F7 0%, #7C3AED 100%); }
  .item-thumb .play-badge {
    position: absolute;
    bottom: 4px; right: 4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .item-thumb .play-badge svg { width: 11px; height: 11px; }

  /* Baru badge */
  .item-thumb .new-badge {
    position: absolute;
    top: 4px; left: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
    color: white;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 2px 6px rgba(220,38,38,.4);
    animation: pulse-badge 2s infinite;
  }
  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }

  .item-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .item-title {
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.4;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item-sub {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }
  .item-extra {
    margin-top: 8px;
    position: relative;
    z-index: 1;
  }
  .badge-tingkat {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .badge-tingkat.sekolah { background: #E5E7EB; color: #4B5563; }
  .badge-tingkat.kecamatan { background: #DBEAFE; color: #1E40AF; }
  .badge-tingkat.kabupaten { background: #FEF3C7; color: #B45309; }
  .badge-tingkat.provinsi { background: #FBF3D0; color: #A37E2E; }
  .badge-tingkat.nasional { background: var(--maroon-soft); color: var(--maroon); }
  .badge-tingkat.internasional { background: linear-gradient(135deg, var(--gold) 0%, var(--maroon) 100%); color: white; }
  .badge-peringkat {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    display: inline-block;
    margin-bottom: 4px;
  }
  .badge-jenis {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  .badge-jenis.inovasi { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); color: white; }
  .badge-jenis.implementasi { background: linear-gradient(135deg, #22C55E 0%, #15803D 100%); color: white; }

  .karya-author {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }
  .karya-author .av {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 800;
    overflow: hidden;
    position: relative;
    border: 1.5px solid white;
  }
  .karya-author .av img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .item-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 10px;
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }
  .item-sekolah {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 4px;
    background: var(--maroon-soft);
    color: var(--maroon);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    text-decoration: none;
    transition: all .15s;
    max-width: 100%;
    overflow: hidden;
    flex-shrink: 1;
    min-width: 0;
  }
  .item-sekolah:hover {
    background: var(--maroon);
    color: white;
    text-decoration: none;
  }
  .item-sekolah .sk-logo {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 800;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .item-sekolah:hover .sk-logo {
    border: 1.5px solid var(--gold);
  }
  .item-sekolah .sk-logo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .link-bukti {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 800;
    color: var(--maroon);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--maroon-soft);
    background: transparent;
    transition: all .15s;
    margin-left: auto;
    flex-shrink: 0;
  }
  .link-bukti:hover {
    background: var(--maroon-soft);
    color: var(--maroon);
    text-decoration: none;
  }

  /* ═══════════════════════════════════════
     LOAD MORE
     ═══════════════════════════════════════ */
  .load-more-wrap {
    text-align: center;
    padding: 20px 0 10px;
  }
  .load-more-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--surface);
    border: 1.5px solid var(--maroon-soft);
    border-radius: 999px;
    color: var(--maroon);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s var(--ease-out);
  }
  .load-more-btn:hover {
    background: var(--maroon);
    border-color: var(--maroon);
    color: white;
    box-shadow: 0 8px 20px rgba(125,29,58,.25);
    transform: translateY(-2px);
  }
  .load-more-btn .remaining {
    padding: 2px 8px;
    background: var(--maroon-soft);
    color: var(--maroon);
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
  }
  .load-more-btn:hover .remaining {
    background: rgba(255,255,255,.25);
    color: white;
  }
  .all-loaded {
    text-align: center;
    padding: 16px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
  }

  /* ═══════════════════════════════════════
     EMPTY STATE
     ═══════════════════════════════════════ */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
  }
  .empty-state .big-icon {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    position: relative;
  }
  .empty-state .big-icon svg { width: 36px; height: 36px; }
  .empty-state .title {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-state .desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto 16px;
  }
  .empty-state .reset-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    background: var(--maroon);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .empty-state .reset-btn:hover {
    background: var(--maroon-dark);
    box-shadow: 0 6px 16px rgba(125,29,58,.25);
  }

  /* ═══════════════════════════════════════
     LIGHTBOX
     ═══════════════════════════════════════ */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fade-in .2s both;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  /* ═══════════════════════════════════════
     DESKTOP: 2-COLUMN GRID
     ═══════════════════════════════════════ */
  @media (min-width: 900px) {
    #listItem {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .item-publik {
      margin-bottom: 0;
    }
    .load-more-wrap,
    .all-loaded,
    .empty-state {
      grid-column: 1 / -1;
    }
    .hero-galeri h1 { font-size: 28px; }
    .hero-galeri .icon-big { width: 88px; height: 88px; }
  }
</style>
</head>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
// ═══════════════════════════════════════════════
// INIT ICONS
// ═══════════════════════════════════════════════
document.querySelectorAll('[data-icon]').forEach(el => {
  const cls = el.dataset.iconClass || '';
  el.innerHTML = Icons.get(el.dataset.icon, { class: cls });
  el.style.display = 'contents';
});

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const PAGE_SIZE = 20;
const SORT_OPTIONS = [
  { key: 'terbaru', label: 'Terbaru', icon: 'clock' },
  { key: 'terlama', label: 'Terlama', icon: 'clock' },
  { key: 'sekolah_az', label: 'Sekolah A-Z', icon: 'home' },
];

let semuaData = [];          // gabungan prestasi + kegiatan + pembiasaan + karya
let filteredData = [];       // setelah filter & sort
let displayed = PAGE_SIZE;

let jenisAktif = '';
let sekolahFilter = null;
let sortBy = 'terbaru';
let searchQuery = '';

let allSchools = [];         // unique schools dari semuaData
let dataLoaded = false;

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
(async () => {
  // Baca URL state
  const url = new URL(location.href);
  jenisAktif = url.searchParams.get('jenis') || '';
  const skParam = url.searchParams.get('sekolah');
  sekolahFilter = skParam ? Number(skParam) : null;
  sortBy = url.searchParams.get('sort') || 'terbaru';
  searchQuery = url.searchParams.get('q') || '';

  // Set UI initial dari URL
  document.getElementById('inputSearch').value = searchQuery;
  updateSearchClearBtn();
  updateSortLabel();

  // Set tab aktif dari URL
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.jenis === jenisAktif);
  });

  // Load data
  await loadSemuaData();

  // Bind events
  bindEvents();
})();

// ═══════════════════════════════════════════════
// LOAD SEMUA DATA (paralel 2 call)
// ═══════════════════════════════════════════════
async function loadSemuaData() {
  const [resGaleri, resKarya] = await Promise.all([
    Api.callSekolahPublik('sekolah.galeri', { limit: 200 }),
    Api.callSekolahPublik('karya.publik', { limit: 100 }),
  ]);

  const base = (resGaleri.ok && resGaleri.data?.data) ? resGaleri.data.data : [];
  const karya = (resKarya.ok && resKarya.data?.data) ? resKarya.data.data : [];

  // Merge dengan _jenis marker
  semuaData = [
    ...base.map(x => ({ ...x, _jenis: x._jenis || 'prestasi' })),
    ...karya.map(x => ({ ...x, _jenis: 'karya' })),
  ];

  dataLoaded = true;

  // Extract unique schools
  const map = new Map();
  semuaData.forEach(it => {
    const s = it.sekolah;
    if (s?.id && !map.has(s.id)) map.set(s.id, s);
  });
  allSchools = Array.from(map.values()).sort((a, b) =>
    (a.nama || '').localeCompare(b.nama || '')
  );

  // Render sekolah chips
  renderSekolahChips();

  // Update counts & stats
  updateStats();
  updateTabCounts();

  // Apply filter & render
  applyFilterAndRender();
}

// ═══════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════
function updateStats() {
  document.getElementById('statTotal').textContent = semuaData.length;
  document.getElementById('statSekolah').textContent = allSchools.length;

  const now = new Date();
  const bulanIni = semuaData.filter(it => {
    const d = getDate(it);
    if (!d) return false;
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
  document.getElementById('statBulan').textContent = bulanIni;

  const jmlKarya = semuaData.filter(it => it._jenis === 'karya').length;
  document.getElementById('statKarya').textContent = jmlKarya;
}

function updateTabCounts() {
  // Hitung per jenis (global, tidak terpengaruh filter sekolah/search)
  const counts = { '': 0, prestasi: 0, kegiatan: 0, pembiasaan: 0, karya: 0 };
  semuaData.forEach(it => {
    counts['']++;
    if (counts[it._jenis] !== undefined) counts[it._jenis]++;
  });
  document.querySelectorAll('.filter-chip [data-count]').forEach(el => {
    el.textContent = counts[el.dataset.count] || 0;
  });
}

// ═══════════════════════════════════════════════
// SEKOLAH CHIPS
// ═══════════════════════════════════════════════
function renderSekolahChips() {
  const wrap = document.getElementById('sekolahChipsWrap');
  const el = document.getElementById('sekolahChips');

  if (allSchools.length < 2) {
    wrap.classList.add('hidden');
    return;
  }

  wrap.classList.remove('hidden');

  let html = `
    <button class="sk-chip all ${sekolahFilter === null ? 'active' : ''}" data-sk="">
      ${Icons.get('grid', { class: 'icon-sm' })}
      <span>Semua</span>
    </button>
  `;

  allSchools.forEach(s => {
    const active = sekolahFilter === s.id ? 'active' : '';
    const logoUrl = Api.logoUrl(s.id, s.logo_updated_at);
    const init = Api.inisialSekolah(s.nama);

    html += `
      <button class="sk-chip ${active}" data-sk="${s.id}">
        <span class="sk-logo">
          <span style="position:relative;z-index:0;">${init}</span>
          ${logoUrl ? `<img src="${logoUrl}" onerror="this.remove()" />` : ''}
        </span>
        <span>${UI.escapeHtml(s.nama || '-')}</span>
      </button>
    `;
  });

  el.innerHTML = html;

  el.querySelectorAll('.sk-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.sk;
      sekolahFilter = v ? Number(v) : null;
      displayed = PAGE_SIZE;
      syncUrl();
      renderSekolahChips();
      applyFilterAndRender();
    });
  });
}

// ═══════════════════════════════════════════════
// FILTER & SORT & RENDER
// ═══════════════════════════════════════════════
function applyFilterAndRender() {
  let result = [...semuaData];

  // 1. Filter jenis
  if (jenisAktif) {
    result = result.filter(it => it._jenis === jenisAktif);
  }

  // 2. Filter sekolah
  if (sekolahFilter !== null) {
    result = result.filter(it => it.sekolah?.id === sekolahFilter);
  }

  // 3. Search
  if (searchQuery) {
    result = result.filter(it => matchesSearch(it, searchQuery));
  }

  // 4. Sort
  result = sortData(result, sortBy);

  filteredData = result;
  displayed = PAGE_SIZE;

  renderInfoBar();
  renderList();
}

function matchesSearch(it, q) {
  const f = q.toLowerCase();
  const fields = [
    it.nama_lomba, it.nama_siswa, it.jenis_lomba,
    it.nama, it.deskripsi, it.tempat,
    it.judul,
    it.sekolah?.nama,
    it.user?.nama_lengkap,
  ];
  return fields.some(x => x && String(x).toLowerCase().includes(f));
}

function getDate(it) {
  if (it.tanggal) return new Date(it.tanggal);
  if (it.dibuat_pada) return new Date(it.dibuat_pada);
  if (it.tahun) return new Date(`${it.tahun}-01-01`);
  return null;
}

function sortData(list, mode) {
  const arr = [...list];
  if (mode === 'terbaru') {
    return arr.sort((a, b) => {
      const da = getDate(a)?.getTime() || 0;
      const db = getDate(b)?.getTime() || 0;
      return db - da;
    });
  }
  if (mode === 'terlama') {
    return arr.sort((a, b) => {
      const da = getDate(a)?.getTime() || Infinity;
      const db = getDate(b)?.getTime() || Infinity;
      return da - db;
    });
  }
  if (mode === 'sekolah_az') {
    return arr.sort((a, b) => {
      const na = (a.sekolah?.nama || '').localeCompare(b.sekolah?.nama || '');
      if (na !== 0) return na;
      const da = getDate(a)?.getTime() || 0;
      const db = getDate(b)?.getTime() || 0;
      return db - da;
    });
  }
  return arr;
}

// ═══════════════════════════════════════════════
// INFO BAR
// ═══════════════════════════════════════════════
function renderInfoBar() {
  const infoText = document.getElementById('infoText');
  const activeFilters = document.getElementById('activeFilters');

  const total = filteredData.length;
  const showing = Math.min(displayed, total);
  infoText.textContent = total === 0
    ? 'Tidak ada hasil'
    : `Menampilkan ${showing} dari ${total} item`;

  // Active filter tags
  const tags = [];
  if (jenisAktif) {
    const label = { prestasi: 'Prestasi', kegiatan: 'Kegiatan', pembiasaan: 'Pembiasaan', karya: 'Karya' }[jenisAktif];
    tags.push(`<span class="af-tag">${Icons.get('tag', { class: 'icon-sm' })} ${label}</span>`);
  }
  if (sekolahFilter !== null) {
    const s = allSchools.find(x => x.id === sekolahFilter);
    if (s) tags.push(`<span class="af-tag">${Icons.get('home', { class: 'icon-sm' })} ${UI.escapeHtml(s.nama)}</span>`);
  }
  if (searchQuery) {
    tags.push(`<span class="af-tag">${Icons.get('search', { class: 'icon-sm' })} "${UI.escapeHtml(searchQuery)}"</span>`);
  }
  if (sortBy !== 'terbaru') {
    const opt = SORT_OPTIONS.find(o => o.key === sortBy);
    tags.push(`<span class="af-tag">${Icons.get('list', { class: 'icon-sm' })} ${opt?.label || sortBy}</span>`);
  }

  activeFilters.innerHTML = tags.join('');
}

// ═══════════════════════════════════════════════
// RENDER LIST
// ═══════════════════════════════════════════════
function renderList() {
  const el = document.getElementById('listItem');
  const total = filteredData.length;

  if (total === 0) {
    el.innerHTML = renderEmptyState();
    bindEmptyStateActions();
    return;
  }

  const slice = filteredData.slice(0, displayed);
  let html = slice.map((it, idx) => {
    if (it._jenis === 'karya') return renderKaryaItem(it, idx);
    return renderItem(it, idx);
  }).join('');

  if (displayed < total) {
    html += `
      <div class="load-more-wrap">
        <button class="load-more-btn" id="btnLoadMore">
          ${Icons.get('plus', { class: 'icon-sm' })}
          Muat Lebih
          <span class="remaining">${total - displayed}</span>
        </button>
      </div>
    `;
  } else if (total > PAGE_SIZE) {
    html += `<div class="all-loaded">✓ Semua ${total} item sudah ditampilkan</div>`;
  }

  el.innerHTML = html;

  // Bind load more
  document.getElementById('btnLoadMore')?.addEventListener('click', () => {
    displayed += PAGE_SIZE;
    renderList();
    renderInfoBar();
  });

  // Bind thumbnail click
  el.querySelectorAll('[data-thumb]').forEach(thumb => {
    thumb.addEventListener('click', () => {
      const url = thumb.dataset.fullurl;
      const isImg = thumb.dataset.isImage === '1';
      if (isImg) showLightbox(url);
      else if (url) window.open(url, '_blank');
    });
  });
}

// ═══════════════════════════════════════════════
// RENDER ITEM
// ═══════════════════════════════════════════════
function renderItem(it, idx) {
  const jenis = it._jenis;
  const sekolah = it.sekolah || {};
  const sekolahId = sekolah.id || '';

  let judul = '';
  let sub = '';
  let extra = '';

  if (jenis === 'prestasi') {
    judul = it.nama_lomba;
    const tingkatLabel = {
      sekolah: 'Sekolah', kecamatan: 'Kecamatan', kabupaten: 'Kabupaten',
      provinsi: 'Provinsi', nasional: 'Nasional', internasional: 'Internasional',
    }[it.tingkat] || it.tingkat;
    const peringkatLabel = {
      juara_1: 'Juara 1', juara_2: 'Juara 2', juara_3: 'Juara 3', harapan: 'Harapan',
    }[it.peringkat] || it.peringkat;
    sub = `${it.nama_siswa}${it.kelas ? ' (' + it.kelas + ')' : ''} · ${UI.formatTanggalPendek(it.tanggal)}`;
    extra = `
      <div class="item-extra">
        <span class="badge-tingkat ${it.tingkat}">${tingkatLabel}</span>
        <span class="badge-peringkat">${peringkatLabel}</span>
      </div>
    `;
  } else if (jenis === 'kegiatan') {
    judul = it.nama;
    const skalaLabel = {
      internal: 'Internal', orang_tua: 'Orang Tua',
      komunitas: 'Komunitas', kecamatan: 'Kecamatan', kabupaten_plus: 'Kabupaten+',
    }[it.skala] || it.skala;
    sub = `${UI.formatTanggalPendek(it.tanggal)}${it.tempat ? ' · ' + it.tempat : ''}`;
    extra = `<div class="item-extra"><span class="badge-tingkat kecamatan">${skalaLabel}</span></div>`;
  } else if (jenis === 'pembiasaan') {
    judul = it.nama;
    sub = `${it.frekuensi || '-'}${it.bulan ? ' · Bulan ' + it.bulan : ''} ${it.tahun}`;
    extra = it.deskripsi
      ? `<div class="item-extra" style="font-size:12px;color:var(--muted);line-height:1.5;">${UI.escapeHtml(it.deskripsi)}</div>`
      : '';
  }

  const thumbUrl = UI.thumbnail(it.bukti_url);
  const isYT = it.bukti_url && /youtube\.com|youtu\.be/.test(it.bukti_url);
  const isDirectImg = it.bukti_url && /\.(jpg|jpeg|png|webp|gif|avif)(\?|#|$)/i.test(it.bukti_url);
  const iconName = jenis === 'prestasi' ? 'award' : jenis === 'kegiatan' ? 'calendar' : 'sparkles';
  const isNew = isRecent(it);

  const logoSekolah = sekolahId
    ? `<span class="sk-logo">
         <span style="position:relative;z-index:0;">${Api.inisialSekolah(sekolah.nama)}</span>
         ${Api.logoUrl(sekolahId, sekolah.logo_updated_at) ? `<img src="${Api.logoUrl(sekolahId, sekolah.logo_updated_at)}" onerror="this.remove()" />` : ''}
       </span>`
    : '';

  const sekolahLink = sekolahId
    ? `<a href="sekolah.html?id=${sekolahId}" class="item-sekolah">
         ${logoSekolah}
         <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${UI.escapeHtml(sekolah.nama || '-')}</span>
       </a>`
    : '';

  const buktiHtml = it.bukti_url
    ? `<a href="${UI.escapeHtml(it.bukti_url)}" target="_blank" rel="noopener" class="link-bukti">
         ${Icons.get('externalLink', { class: 'icon-sm' })} Bukti
       </a>`
    : '';

  const thumbHtml = `
    <div class="item-thumb ${jenis}"
         ${it.bukti_url ? `data-thumb data-fullurl="${UI.escapeHtml(it.bukti_url)}" data-is-image="${isDirectImg ? '1' : '0'}"` : ''}>
      ${thumbUrl
        ? `<img src="${thumbUrl}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
           <div class="fallback-icon" style="display:none;">${Icons.get(iconName)}</div>
           ${isYT ? `<div class="play-badge">${Icons.get('play')}</div>` : ''}`
        : `<div class="fallback-icon">${Icons.get(iconName)}</div>`}
      ${isNew ? `<span class="new-badge">Baru</span>` : ''}
    </div>
  `;

  return `
    <div class="item-publik ${jenis}" style="animation-delay:${(idx % PAGE_SIZE) * 0.03}s">
      <div class="item-head">
        ${thumbHtml}
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(judul)}</div>
          <div class="item-sub">${UI.escapeHtml(sub)}</div>
          ${extra}
        </div>
      </div>
      <div class="item-footer">
        ${sekolahLink}
        ${buktiHtml}
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════
// RENDER KARYA
// ═══════════════════════════════════════════════
function renderKaryaItem(k, idx) {
  const jenisKarya = k.jenis;
  const user = k.user || {};
  const isYT = k.link_url && /youtube\.com|youtu\.be/.test(k.link_url);
  const isDirectImg = k.link_url && /\.(jpg|jpeg|png|webp|gif|avif)(\?|#|$)/i.test(k.link_url);
  const thumbUrl = UI.thumbnail(k.link_url);
  const iconName = jenisKarya === 'inovasi' ? 'sparkles' : 'target';
  const isNew = isRecent(k);

  const jenisLabel = jenisKarya === 'inovasi' ? 'Inovasi' : 'Aksi Nyata';
  const kategoriLabel = {
    media: 'Media', metode: 'Metode', modul: 'Modul Ajar',
    alat: 'Alat Peraga', video: 'Video', lainnya: 'Lainnya',
  }[k.kategori] || '';

  let extra = `<span class="badge-jenis ${jenisKarya}">${jenisLabel}</span>`;
  if (jenisKarya === 'inovasi' && kategoriLabel) {
    extra += `<span class="badge-tingkat kabupaten">${kategoriLabel}</span>`;
  }

  const init = (user.nama_lengkap || '?').charAt(0).toUpperCase();
  const fotoUrl = user.id ? Api.fotoUrl(user.id, 't') : null;
  const authorHtml = `
    <div class="karya-author">
      <span class="av">
        <span style="position:relative;z-index:0;">${init}</span>
        ${fotoUrl ? `<img src="${fotoUrl}" onerror="this.remove()" />` : ''}
      </span>
      <span>${UI.escapeHtml(user.nama_lengkap || '-')}</span>
    </div>
  `;

  const sekolah = k.sekolah || {};
  const sekolahId = sekolah.id || user.sekolah?.id;
  const sekolahNama = sekolah.nama || user.sekolah?.nama;

  const logoSekolah = sekolahId
    ? `<span class="sk-logo">
         <span style="position:relative;z-index:0;">${Api.inisialSekolah(sekolahNama)}</span>
       </span>`
    : '';

  const sekolahLink = sekolahId
    ? `<a href="sekolah.html?id=${sekolahId}" class="item-sekolah">
         ${logoSekolah}
         <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${UI.escapeHtml(sekolahNama || '-')}</span>
       </a>`
    : '';

  const buktiHtml = k.link_url
    ? `<a href="${UI.escapeHtml(k.link_url)}" target="_blank" rel="noopener" class="link-bukti">
         ${Icons.get('externalLink', { class: 'icon-sm' })} Karya
       </a>`
    : '';

  const thumbHtml = `
    <div class="item-thumb karya"
         ${k.link_url ? `data-thumb data-fullurl="${UI.escapeHtml(k.link_url)}" data-is-image="${isDirectImg ? '1' : '0'}"` : ''}>
      ${thumbUrl
        ? `<img src="${thumbUrl}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
           <div class="fallback-icon" style="display:none;">${Icons.get(iconName)}</div>
           ${isYT ? `<div class="play-badge">${Icons.get('play')}</div>` : ''}`
        : `<div class="fallback-icon">${Icons.get(iconName)}</div>`}
      ${isNew ? `<span class="new-badge">Baru</span>` : ''}
    </div>
  `;

  return `
    <div class="item-publik karya" style="animation-delay:${(idx % PAGE_SIZE) * 0.03}s">
      <div class="item-head">
        ${thumbHtml}
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(k.judul)}</div>
          ${k.deskripsi ? `<div class="item-sub" style="margin-top:2px;">${UI.escapeHtml(k.deskripsi)}</div>` : ''}
          <div class="item-extra">${extra}</div>
          ${authorHtml}
        </div>
      </div>
      <div class="item-footer">
        ${sekolahLink}
        ${buktiHtml}
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function isRecent(it) {
  const d = getDate(it);
  if (!d) return false;
  const diff = (Date.now() - d.getTime()) / 86400000;
  return diff >= 0 && diff <= 7;
}

// ═══════════════════════════════════════════════
// EMPTY STATE (contextual)
// ═══════════════════════════════════════════════
function renderEmptyState() {
  let title = 'Belum Ada Data';
  let desc = 'Galeri akan muncul setelah panitia memverifikasi submission dari sekolah.';
  let showReset = false;

  if (searchQuery) {
    title = `Tidak Ada Hasil untuk "${searchQuery}"`;
    desc = 'Coba kata kunci lain, atau reset pencarian.';
    showReset = true;
  } else if (sekolahFilter !== null) {
    const s = allSchools.find(x => x.id === sekolahFilter);
    title = `Belum Ada Data dari ${s?.nama || 'Sekolah Ini'}`;
    desc = 'Data akan muncul setelah panitia memverifikasi. Coba lihat sekolah lain.';
    showReset = true;
  } else if (jenisAktif) {
    const label = { prestasi: 'Prestasi', kegiatan: 'Kegiatan', pembiasaan: 'Pembiasaan', karya: 'Karya Guru' }[jenisAktif];
    title = `Belum Ada ${label}`;
    desc = 'Data akan muncul setelah panitia memverifikasi.';
    showReset = true;
  }

  return `
    <div class="empty-state">
      <div class="big-icon">${Icons.get('inbox', { class: 'icon-xl' })}</div>
      <div class="title">${UI.escapeHtml(title)}</div>
      <div class="desc">${UI.escapeHtml(desc)}</div>
      ${showReset ? `<button class="reset-btn" id="btnResetAll">
        ${Icons.get('rotateCcw', { class: 'icon-sm' })} Reset Semua Filter
      </button>` : ''}
    </div>
  `;
}

function bindEmptyStateActions() {
  document.getElementById('btnResetAll')?.addEventListener('click', () => {
    jenisAktif = '';
    sekolahFilter = null;
    searchQuery = '';
    sortBy = 'terbaru';
    displayed = PAGE_SIZE;

    document.getElementById('inputSearch').value = '';
    updateSearchClearBtn();
    updateSortLabel();
    document.querySelectorAll('.filter-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.jenis === '');
    });

    syncUrl();
    renderSekolahChips();
    applyFilterAndRender();
  });
}

// ═══════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════
function bindEvents() {
  // Jenis tabs
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.addEventListener('click', () => {
      jenisAktif = c.dataset.jenis;
      displayed = PAGE_SIZE;
      document.querySelectorAll('.filter-chip').forEach(x => x.classList.toggle('active', x === c));
      syncUrl();
      applyFilterAndRender();
    });
  });

  // Search (debounced)
  let searchTimer;
  const inputSearch = document.getElementById('inputSearch');
  inputSearch.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value;
    updateSearchClearBtn();

    searchTimer = setTimeout(() => {
      searchQuery = q.trim();
      displayed = PAGE_SIZE;
      syncUrl();
      applyFilterAndRender();
    }, 300);
  });

  // Clear search
  document.getElementById('btnClearSearch').addEventListener('click', () => {
    inputSearch.value = '';
    searchQuery = '';
    updateSearchClearBtn();
    displayed = PAGE_SIZE;
    syncUrl();
    applyFilterAndRender();
    inputSearch.focus();
  });

  // Sort dropdown
  document.getElementById('btnSort').addEventListener('click', () => {
    showSortMenu();
  });
}

function updateSearchClearBtn() {
  const wrap = document.getElementById('searchWrap');
  const val = document.getElementById('inputSearch').value.trim();
  wrap.classList.toggle('has-value', !!val);
}

function updateSortLabel() {
  const opt = SORT_OPTIONS.find(o => o.key === sortBy) || SORT_OPTIONS[0];
  document.getElementById('sortLabel').textContent = opt.label;
  const btn = document.getElementById('btnSort');
  btn.classList.toggle('active', sortBy !== 'terbaru');
}

function showSortMenu() {
  // Bikin overlay kecil di bawah tombol
  const existing = document.getElementById('sortMenu');
  if (existing) { existing.remove(); return; }

  const btn = document.getElementById('btnSort');
  const rect = btn.getBoundingClientRect();

  const menu = document.createElement('div');
  menu.id = 'sortMenu';
  menu.style.cssText = `
    position: fixed;
    top: ${rect.bottom + 8}px;
    right: ${window.innerWidth - rect.right}px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(125,29,58,.15);
    z-index: 1000;
    min-width: 180px;
    overflow: hidden;
    animation: fade-in .15s var(--ease-out) both;
  `;

  SORT_OPTIONS.forEach(opt => {
    const item = document.createElement('button');
    item.style.cssText = `
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      background: ${sortBy === opt.key ? 'var(--maroon-soft)' : 'transparent'};
      border: none;
      color: ${sortBy === opt.key ? 'var(--maroon)' : 'var(--ink)'};
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: background .12s;
    `;
    item.innerHTML = `${Icons.get(opt.icon, { class: 'icon-sm' })} <span style="flex:1;">${opt.label}</span> ${sortBy === opt.key ? Icons.get('check', { class: 'icon-sm' }) : ''}`;
    item.onmouseenter = () => { if (sortBy !== opt.key) item.style.background = 'var(--bg)'; };
    item.onmouseleave = () => { if (sortBy !== opt.key) item.style.background = 'transparent'; };
    item.onclick = () => {
      sortBy = opt.key;
      displayed = PAGE_SIZE;
      updateSortLabel();
      syncUrl();
      applyFilterAndRender();
      menu.remove();
    };
    menu.appendChild(item);
  });

  document.body.appendChild(menu);

  // Close on outside click
  setTimeout(() => {
    const handler = (e) => {
      if (!menu.contains(e.target) && e.target !== btn) {
        menu.remove();
        document.removeEventListener('click', handler);
      }
    };
    document.addEventListener('click', handler);
  }, 0);
}

// ═══════════════════════════════════════════════
// URL SYNC
// ═══════════════════════════════════════════════
function syncUrl() {
  const p = new URLSearchParams();
  if (jenisAktif) p.set('jenis', jenisAktif);
  if (sekolahFilter !== null) p.set('sekolah', String(sekolahFilter));
  if (sortBy !== 'terbaru') p.set('sort', sortBy);
  if (searchQuery) p.set('q', searchQuery);

  const newUrl = location.pathname + (p.toString() ? '?' + p.toString() : '');
  history.replaceState(null, '', newUrl);
}

// ═══════════════════════════════════════════════
// LIGHTBOX
// ═══════════════════════════════════════════════
function showLightbox(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${UI.escapeHtml(url)}" alt="">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}
</script>
