<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mengalihkan… — NAKULAKU</title>
<meta http-equiv="refresh" content="0; url=../beranda.html">
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
</head>
<body style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#7D1D3A;margin:0;background:#FCFAF7;">
  <div style="max-width:400px;margin:0 auto;">
    <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FBEBF0,#F9DDE6);color:#7D1D3A;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;">⏳</div>
    <div style="font-weight:800;font-size:16px;margin-bottom:8px;">Mengalihkan…</div>
    <div style="font-size:13px;color:#6E6060;line-height:1.6;">Anda akan diarahkan ke halaman Sekolah yang baru.</div>
    <a href="../beranda.html" style="display:inline-block;margin-top:24px;padding:10px 20px;background:#7D1D3A;color:white;text-decoration:none;border-radius:10px;font-weight:700;font-size:13px;">Buka Beranda</a>
  </div>
  <script>
  (async () => {
    try {
      const profile = await Api.requireLogin();
      if (!profile) return;
      const ksSekolah = (profile.ks_sekolah || []).filter(k => k.jenis === 'induk');
      const target = ksSekolah[0]?.sekolah_id || profile.sekolah?.id;
      if (target) {
        window.location.replace(`../sekolah.html?id=${target}`);
      } else {
        window.location.replace('../beranda.html');
      }
    } catch {
      window.location.replace('../beranda.html');
    }
  })();
  </script>
</body>
</html>
