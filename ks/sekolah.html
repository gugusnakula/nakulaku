<style>
  /* HERO SEKOLAH */
  .hero-sekolah {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 22px 20px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.28);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-sekolah::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-sekolah::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .hero-logo-wrap {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    background: white;
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    box-shadow:
      0 12px 28px rgba(0,0,0,.25),
      0 0 0 6px rgba(201,169,97,.12);
    transition: transform .2s var(--ease-out);
  }
  .hero-logo-wrap:hover {
    transform: scale(1.03);
  }
  .hero-logo-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hero-logo-wrap .fallback {
    font-size: 28px;
    font-weight: 800;
    color: var(--maroon);
    letter-spacing: 1.5px;
  }
  .hero-logo-wrap .edit-badge {
    position: absolute;
    bottom: 0; right: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2.5px solid var(--maroon);
    z-index: 2;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .hero-info-wrap { flex: 1; min-width: 0; }
  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.4);
    border-radius: 999px;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .hero-nama {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .hero-npsn {
    font-size: 11.5px;
    opacity: 0.85;
    font-weight: 600;
  }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
    z-index: 1;
  }
  .hero-stat { text-align: center; }
  .hero-stat .n { font-size: 20px; font-weight: 800; line-height: 1; }
  .hero-stat .l {
    font-size: 9px;
    opacity: 0.8;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-top: 5px;
    text-transform: uppercase;
  }

  /* PILIH SEKOLAH */
  .pilih-sekolah-wrap {
    margin-bottom: 16px;
    animation: fade-in-up .4s var(--ease-out) both;
  }

  /* TAB SWITCH */
  .tab-switch {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 14px;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .tab-switch::-webkit-scrollbar { display: none; }
  .tsw {
    flex: 1;
    min-width: 84px;
    padding: 11px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: all .15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .tsw.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: 0 2px 8px rgba(125,29,58,.08);
  }

  /* ITEM SEKOLAH */
  .item-sekolah {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    position: relative;
    overflow: hidden;
  }
  .item-sekolah:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 8px 20px rgba(125,29,58,.08);
    transform: translateY(-2px);
  }

  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .item-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    transition: transform .2s var(--ease-out);
  }
  .item-sekolah:hover .item-icon {
    transform: scale(1.05);
  }
  .item-icon.prestasi {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: white;
  }
  .item-icon.pembiasaan {
    background: linear-gradient(135deg, #22C55E 0%, #15803D 100%);
    color: white;
  }
  .item-icon.kegiatan {
    background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%);
    color: white;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-title {
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.4;
    color: var(--ink);
  }
  .item-sub {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }

  .status-pill {
    font-size: 9.5px;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 999px;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.4px;
  }
  .st-menunggu { background: var(--warning-soft); color: var(--warning); }
  .st-disetujui { background: var(--success-soft); color: var(--success); }
  .st-ditolak { background: var(--danger-soft); color: var(--danger); }

  .poin-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: white;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    box-shadow: 0 3px 8px rgba(201,169,97,.25);
    margin-top: 8px;
  }

  .item-actions {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    margin-top: 12px;
    border-top: 1px dashed var(--border);
  }
  .item-actions .btn { flex: 1; }

  .catatan-box {
    background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
    color: var(--danger);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.55;
    font-weight: 600;
    border: 1px solid rgba(185,28,28,.15);
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }

  /* EMPTY */
  .empty-panel {
    text-align: center;
    padding: 44px 20px;
  }
  .empty-panel .big-icon {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    position: relative;
  }
  .empty-panel .big-icon svg { width: 36px; height: 36px; }
  .empty-panel h3 {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-panel p {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 300px;
    margin: 0 auto;
  }
</style>
</head>

<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

let profile;
let daftarSekolah = [];
let sekolahAktif = null;
let tabAktif = 'prestasi';
let daftarItem = [];

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  const peran = profile.peran || [];
  const isPanitia = peran.includes('pengurus') || peran.includes('super_admin');
  const isKS = peran.includes('ks');

  if (isPanitia) {
    const res = await Api.call('sekolah.list');
    if (res.ok) daftarSekolah = res.data || [];
  } else if (isKS) {
    const ksSekolah = profile.ks_sekolah || [];
    if (ksSekolah.length > 0) {
      daftarSekolah = ksSekolah
        .map(k => ({
          id: k.sekolah_id,
          nama: k.sekolah?.nama || '-',
          npsn: k.sekolah?.npsn || '-',
        }))
        .filter(s => s.id);
    } else if (profile.sekolah) {
      daftarSekolah = [{
        id: profile.sekolah.id,
        nama: profile.sekolah.nama,
        npsn: profile.sekolah.npsn,
      }];
    }
  } else {
    const res = await Api.callSekolah('pelapor.list_saya');
    if (res.ok && res.data && res.data.length > 0) {
      daftarSekolah = res.data.map(x => x.sekolah).filter(Boolean);
    } else if (profile.sekolah) {
      daftarSekolah = [profile.sekolah];
    }
  }

  if (daftarSekolah.length === 0) {
    document.querySelector('main').innerHTML = UI.errorHtml('Anda tidak punya akses ke sekolah mana pun.');
    return;
  }

  if (daftarSekolah.length > 1) {
    document.getElementById('pilihSekolahWrap').classList.remove('hidden');
    const sel = document.getElementById('pilihSekolah');
    sel.innerHTML = daftarSekolah.map(s => `<option value="${s.id}">${UI.escapeHtml(s.nama)}</option>`).join('');
    sel.addEventListener('change', () => {
      sekolahAktif = daftarSekolah.find(s => s.id === Number(sel.value));
      refresh();
    });
  }

  sekolahAktif = daftarSekolah[0];
  refresh();

  document.querySelectorAll('.tsw').forEach(t => {
    t.addEventListener('click', () => {
      tabAktif = t.dataset.tab;
      document.querySelectorAll('.tsw').forEach(x => x.classList.toggle('active', x === t));
      loadTab();
    });
  });

  document.getElementById('btnTambah').addEventListener('click', tambahData);

  document.getElementById('fileLogo').addEventListener('change', (e) => {
    if (e.target.files[0]) handleUploadLogo(e.target.files[0]);
    e.target.value = '';
  });
})();

async function refresh() {
  if (!sekolahAktif) return;

  document.getElementById('heroNama').textContent = sekolahAktif.nama;
  document.getElementById('heroNpsn').textContent = 'NPSN ' + (sekolahAktif.npsn || '-');
  document.getElementById('heroSekolah').classList.remove('hidden');

  renderLogoHero(sekolahAktif);

  const res = await Api.callSekolahPublik('sekolah.profil', { sekolah_id: sekolahAktif.id });
  if (res.ok && res.data) {
    const r = res.data.ringkasan;
    document.getElementById('statPrestasi').textContent = r.jumlah_prestasi;
    document.getElementById('statPembiasaan').textContent = r.jumlah_pembiasaan;
    document.getElementById('statKegiatan').textContent = r.jumlah_kegiatan;

    // Update logo_updated_at dari response
    if (res.data.sekolah?.logo_updated_at !== undefined) {
      sekolahAktif.logo_updated_at = res.data.sekolah.logo_updated_at;
    }
  }

  await loadTab();
}

// ============================================================
// LOGO HERO
// ============================================================
function renderLogoHero(sekolah) {
  const wrap = document.getElementById('heroLogoWrap');
  if (!wrap) return;

  const ver = sekolah.logo_updated_at;
  const url = Api.logoUrl(sekolah.id, ver);
  const init = Api.inisialSekolah(sekolah.nama);

  wrap.innerHTML = `
    ${url
      ? `<img src="${url}" alt="${UI.escapeHtml(sekolah.nama)}"
           onerror="this.remove(); this.parentElement.querySelector('.fallback').style.display='flex';" />`
      : ''}
    <div class="fallback" style="${url ? 'display:none;' : ''}">${init}</div>
    <div class="edit-badge">${Icons.get('camera', { class: 'icon-sm' })}</div>
  `;

  wrap.onclick = () => {
    const peran = profile.peran || [];
    const isPanitia = peran.includes('pengurus') || peran.includes('super_admin');
    const isKS = peran.includes('ks');

    if (!isPanitia && !isKS) {
      UI.gagal('Hanya KS atau panitia yang bisa upload logo.');
      return;
    }
    document.getElementById('fileLogo').click();
  };
}

// ============================================================
// UPLOAD LOGO
// ============================================================
async function handleUploadLogo(file) {
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    UI.gagal('File harus berupa gambar.');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    UI.gagal('File terlalu besar (maks 5 MB).');
    return;
  }

  UI.toast('Memproses logo…', 'info');

  try {
    const dataUrl = await kompresLogo(file, 200, 0.85);

    const sizeKb = Math.round((dataUrl.length * 3 / 4) / 1024);
    if (sizeKb > 500) {
      UI.gagal('Logo masih terlalu besar (' + sizeKb + ' KB). Coba foto lain.');
      return;
    }

    const res = await Api.callSekolah('sekolah.upload_logo', {
      sekolah_id: sekolahAktif.id,
      foto: dataUrl,
    });

    if (!res.ok) {
      UI.gagal(res.error || 'Gagal upload logo.');
      return;
    }

    UI.sukses('Logo berhasil diunggah (' + res.data.size_kb + ' KB)');

    sekolahAktif.logo_updated_at = res.data.logo_updated_at;
    const idx = daftarSekolah.findIndex(s => s.id === sekolahAktif.id);
    if (idx >= 0) daftarSekolah[idx].logo_updated_at = res.data.logo_updated_at;

    renderLogoHero(sekolahAktif);
  } catch (err) {
    console.error(err);
    UI.gagal('Gagal memproses logo.');
  }
}

function kompresLogo(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = maxSize;
        canvas.height = maxSize;
        const ctx = canvas.getContext('2d');

        // Background putih
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, maxSize, maxSize);

        // Center crop ke persegi
        const size = Math.min(img.width, img.height);
        const sx = (img.width - size) / 2;
        const sy = (img.height - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, maxSize, maxSize);

        const out = canvas.toDataURL('image/webp', quality);
        resolve(out);
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============================================================
// LOAD TAB
// ============================================================
async function loadTab() {
  if (tabAktif === 'pelapor') {
    await loadPelapor();
    return;
  }

  const el = document.getElementById('listItem');
  el.innerHTML = '<div class="skeleton" style="height:120px;border-radius:18px;"></div>';

  const actionMap = {
    prestasi: 'prestasi.list',
    pembiasaan: 'pembiasaan.list',
    kegiatan: 'kegiatan.list',
  };
  const action = actionMap[tabAktif];
  if (!action) return;

  const res = await Api.callSekolah(action, { sekolah_id: sekolahAktif.id, limit: 100 });
  if (!res.ok) { el.innerHTML = UI.errorHtml(res.error); return; }

  daftarItem = res.data || [];

  if (daftarItem.length === 0) {
    const label = { prestasi: 'prestasi', pembiasaan: 'pembiasaan', kegiatan: 'kegiatan' }[tabAktif];
    el.innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('inbox', { class: 'icon-lg' })}</div>
        <h3>Belum Ada ${label.charAt(0).toUpperCase() + label.slice(1)}</h3>
        <p>Klik tombol Tambah Data di atas untuk mulai mengisi.</p>
      </div>
    `;
    return;
  }

  el.innerHTML = daftarItem.map((it, idx) => renderItem(it, idx)).join('');

  el.querySelectorAll('[data-act="edit"]').forEach(b => {
    b.addEventListener('click', () => tambahData(Number(b.dataset.id)));
  });
  el.querySelectorAll('[data-act="hapus"]').forEach(b => {
    b.addEventListener('click', () => hapusData(Number(b.dataset.id)));
  });
}

function renderItem(it, idx) {
  const statusLabel = {
    menunggu: 'Menunggu',
    disetujui: 'Disetujui',
    ditolak: 'Ditolak',
  }[it.status] || it.status;

  let judul = '';
  let sub = '';
  let iconName = 'award';
  let iconCls = 'prestasi';

  if (tabAktif === 'prestasi') {
    judul = it.nama_lomba;
    const tingkatLabel = {
      sekolah: 'Sekolah', kecamatan: 'Kecamatan', kabupaten: 'Kabupaten',
      provinsi: 'Provinsi', nasional: 'Nasional', internasional: 'Internasional',
    }[it.tingkat] || it.tingkat;
    const peringkatLabel = {
      juara_1: 'Juara 1', juara_2: 'Juara 2', juara_3: 'Juara 3', harapan: 'Harapan',
    }[it.peringkat] || it.peringkat;
    sub = `${it.nama_siswa}${it.kelas ? ' · ' + it.kelas : ''} · ${tingkatLabel} ${peringkatLabel}`;
    iconName = 'award';
    iconCls = 'prestasi';
  } else if (tabAktif === 'pembiasaan') {
    judul = it.nama;
    sub = `${it.frekuensi || '-'}${it.bulan ? ' · Bulan ' + it.bulan : ''} ${it.tahun}`;
    iconName = 'sparkles';
    iconCls = 'pembiasaan';
  } else if (tabAktif === 'kegiatan') {
    judul = it.nama;
    sub = `${UI.formatTanggalPendek(it.tanggal)}${it.tempat ? ' · ' + it.tempat : ''}`;
    iconName = 'calendar';
    iconCls = 'kegiatan';
  }

  const bisaEdit = it.status === 'menunggu';
  // Poin TIDAK ditampilkan — hanya admin yang tahu (rahasia di balik layar)

  const catatanHtml = it.status === 'ditolak' && it.catatan_verifikator
    ? `<div class="catatan-box">
         ${Icons.get('alertCircle', { class: 'icon-sm' })}
         <span>${UI.escapeHtml(it.catatan_verifikator)}</span>
       </div>`
    : '';

  return `
    <div class="item-sekolah" style="animation-delay:${idx * 0.04}s">
      <div class="item-head">
        <div class="item-icon ${iconCls}">${Icons.get(iconName, { class: 'icon-sm' })}</div>
        <div class="item-info">
          <div class="item-title">${UI.escapeHtml(judul)}</div>
          <div class="item-sub">${UI.escapeHtml(sub)}</div>
        </div>
        <span class="status-pill st-${it.status}">${statusLabel}</span>
      </div>

      ${it.bukti_url ? `
        <a href="${UI.escapeHtml(it.bukti_url)}" target="_blank" rel="noopener"
          style="font-size:12px;font-weight:700;color:var(--maroon);display:inline-flex;align-items:center;gap:4px;text-decoration:none;">
          ${Icons.get('externalLink', { class: 'icon-sm' })}
          Lihat Bukti
        </a>
      ` : ''}

      ${catatanHtml}

      ${bisaEdit ? `
        <div class="item-actions">
          <button class="btn btn-secondary btn-sm" data-act="edit" data-id="${it.id}">
            ${Icons.get('edit', { class: 'icon-sm' })} Edit
          </button>
          <button class="btn btn-ghost btn-sm" data-act="hapus" data-id="${it.id}" style="color:var(--danger);">
            ${Icons.get('trash', { class: 'icon-sm' })} Hapus
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

async function loadPelapor() {
  const el = document.getElementById('listItem');
  el.innerHTML = '<div class="skeleton" style="height:88px;border-radius:18px;"></div>';

  const res = await Api.callSekolah('pelapor.list', { sekolah_id: sekolahAktif.id });
  if (!res.ok) { el.innerHTML = UI.errorHtml(res.error); return; }

  const list = res.data || [];

  let html = `
    <div class="item-sekolah" style="background:linear-gradient(135deg,var(--maroon-soft) 0%,#F9DDE6 100%);border-color:var(--maroon-soft);">
      <div style="font-size:12.5px;line-height:1.6;color:var(--ink);font-weight:500;">
        ${Icons.get('info', { class: 'icon-sm' })}
        Pelapor adalah guru yang ditunjuk untuk membantu KS menginput data prestasi, pembiasaan, dan kegiatan. Maksimal 3 guru + KS.
      </div>
    </div>
    <button class="btn btn-primary btn-full" id="btnTambahPelapor" style="margin-bottom:12px;">
      ${Icons.get('plus', { class: 'icon-sm' })} Tunjuk Pelapor
    </button>
  `;

  if (list.length === 0) {
    html += `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('users', { class: 'icon-lg' })}</div>
        <h3>Belum Ada Pelapor</h3>
        <p>Klik tombol di atas untuk menunjuk guru sebagai pelapor.</p>
      </div>
    `;
  } else {
    html += list.map((p, idx) => `
      <div class="item-sekolah" style="animation-delay:${idx * 0.04}s">
        <div class="item-head">
          <div class="item-icon" style="background:linear-gradient(135deg,var(--maroon) 0%,var(--maroon-mid) 100%);color:white;">
            ${Icons.get('user', { class: 'icon-sm' })}
          </div>
          <div class="item-info">
            <div class="item-title">${UI.escapeHtml(p.user?.nama_lengkap || '-')}</div>
            <div class="item-sub">${UI.escapeHtml(p.user?.jabatan || '-')}</div>
          </div>
          <button class="btn-icon" data-hapus-pelapor="${p.id}" style="color:var(--danger);">
            ${Icons.get('trash', { class: 'icon-sm' })}
          </button>
        </div>
      </div>
    `).join('');
  }

  el.innerHTML = html;

  el.querySelector('#btnTambahPelapor')?.addEventListener('click', tambahPelapor);
  el.querySelectorAll('[data-hapus-pelapor]').forEach(b => {
    b.addEventListener('click', () => hapusPelapor(Number(b.dataset.hapusPelapor)));
  });
}

async function tambahPelapor() {
  const res = await Api.call('users.list', { sekolah_id: sekolahAktif.id, limit: 100 });
  if (!res.ok) { UI.gagal(res.error); return; }

  const guruList = res.data.hasil || [];
  if (guruList.length === 0) { UI.gagal('Tidak ada guru di sekolah ini.'); return; }

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div style="background:white;border-radius:22px;padding:24px;max-width:480px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(125,29,58,.25);">
      <h3 style="font-size:17px;color:var(--maroon);margin:0 0 14px;font-weight:800;">Tunjuk Pelapor</h3>
      <div style="flex:1;overflow-y:auto;border:1.5px solid var(--border);border-radius:14px;padding:6px;margin-bottom:14px;min-height:200px;">
        ${guruList.map(g => `
          <label style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .15s;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">
            <input type="radio" name="pilihGuru" value="${g.id}" style="width:18px;height:18px;accent-color:var(--maroon);" />
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:13px;">${UI.escapeHtml(g.nama_lengkap)}</div>
              <div style="font-size:11px;color:var(--muted);">${UI.escapeHtml(g.jabatan || '-')}</div>
            </div>
          </label>
        `).join('')}
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" id="btnBatal" style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpan" style="flex:2;">Tunjuk</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  let selectedId = null;
  overlay.querySelectorAll('input[name="pilihGuru"]').forEach(r => {
    r.addEventListener('change', () => { selectedId = Number(r.value); });
  });

  const close = () => overlay.remove();
  overlay.querySelector('#btnBatal').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnSimpan').addEventListener('click', async () => {
    if (!selectedId) { UI.gagal('Pilih guru dulu.'); return; }

    const res2 = await Api.callSekolah('pelapor.tambah', {
      sekolah_id: sekolahAktif.id,
      user_id: selectedId,
    });
    if (!res2.ok) { UI.gagal(res2.error); return; }

    UI.sukses('Pelapor ditambahkan.');
    close();
    await loadPelapor();
  });
}

async function hapusPelapor(id) {
  const ok = await UI.konfirmasi('Hapus Pelapor', 'Cabut akses guru ini sebagai pelapor?', { danger: true, okText: 'Hapus' });
  if (!ok) return;
  const res = await Api.callSekolah('pelapor.hapus', { pelapor_id: id });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses('Pelapor dihapus.');
  await loadPelapor();
}

// ============================================================
// TAMBAH DATA
// ============================================================
async function tambahData(id = null) {
  const item = id ? daftarItem.find(x => x.id === id) : null;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,20,20,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;';
  overlay.innerHTML = `
    <div style="background:white;border-radius:22px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(125,29,58,.25);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="font-size:17px;color:var(--maroon);margin:0;font-weight:800;">${id ? 'Edit' : 'Tambah'} ${tabAktif.charAt(0).toUpperCase() + tabAktif.slice(1)}</h3>
        <button class="btn-icon" id="btnX">${Icons.get('x')}</button>
      </div>
      <div id="formContent"></div>
      <div style="display:flex;gap:8px;margin-top:18px;">
        <button class="btn btn-secondary" id="btnBatalForm" style="flex:1;">Batal</button>
        <button class="btn btn-primary" id="btnSimpanData" style="flex:2;">Simpan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const formEl = overlay.querySelector('#formContent');
  if (tabAktif === 'prestasi') formEl.innerHTML = formPrestasi(item);
  else if (tabAktif === 'pembiasaan') formEl.innerHTML = formPembiasaan(item);
  else if (tabAktif === 'kegiatan') formEl.innerHTML = formKegiatan(item);

  const close = () => overlay.remove();
  overlay.querySelector('#btnX').addEventListener('click', close);
  overlay.querySelector('#btnBatalForm').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnSimpanData').addEventListener('click', async () => {
    const btn = overlay.querySelector('#btnSimpanData');
    const data = collectForm(overlay, id);
    if (!data) return;

    UI.btnLoading(btn, 'Menyimpan…');
    const res = await Api.callSekolah(`${tabAktif}.simpan`, { data });
    UI.btnReset(btn);

    if (!res.ok) { UI.gagal(res.error); return; }

    UI.sukses(id ? 'Diperbarui.' : 'Ditambahkan. Menunggu verifikasi panitia.');
    close();
    await loadTab();
    await refresh();
  });
}

function collectForm(overlay, id) {
  const val = (sel) => overlay.querySelector(sel)?.value.trim() || '';
  const base = { sekolah_id: sekolahAktif.id, id: id || null };

  if (tabAktif === 'prestasi') {
    const d = {
      ...base,
      nama_siswa: val('#f1'),
      kelas: val('#f2'),
      nama_lomba: val('#f3'),
      jenis_lomba: val('#f4'),
      tingkat: val('#f5'),
      peringkat: val('#f6'),
      tanggal: val('#f7'),
      guru_pembina: val('#f8'),
      bukti_url: val('#f9'),
    };
    if (!d.nama_siswa || !d.nama_lomba || !d.tingkat || !d.peringkat || !d.tanggal) {
      UI.gagal('Lengkapi field bertanda *'); return null;
    }
    return d;
  }

  if (tabAktif === 'pembiasaan') {
    const d = {
      ...base,
      nama: val('#f1'),
      deskripsi: val('#f2'),
      frekuensi: val('#f3'),
      bulan: val('#f4') ? Number(val('#f4')) : null,
      tahun: Number(val('#f5')),
      bukti_url: val('#f6'),
    };
    if (!d.nama || !d.tahun) { UI.gagal('Lengkapi field bertanda *'); return null; }
    return d;
  }

  if (tabAktif === 'kegiatan') {
    const d = {
      ...base,
      nama: val('#f1'),
      kategori: val('#f2'),
      deskripsi: val('#f3'),
      tanggal: val('#f4'),
      tempat: val('#f5'),
      jumlah_peserta: val('#f6') ? Number(val('#f6')) : null,
      skala: val('#f7'),
      bukti_url: val('#f8'),
    };
    if (!d.nama || !d.tanggal || !d.skala) { UI.gagal('Lengkapi field bertanda *'); return null; }
    return d;
  }

  return null;
}

async function hapusData(id) {
  const ok = await UI.konfirmasi('Hapus Data', 'Yakin hapus data ini?', { danger: true, okText: 'Hapus' });
  if (!ok) return;

  const res = await Api.callSekolah(`${tabAktif}.hapus`, { id });
  if (!res.ok) { UI.gagal(res.error); return; }

  UI.sukses('Dihapus.');
  await loadTab();
  await refresh();
}
