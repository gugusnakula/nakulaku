<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#611329" />
<title>Verifikasi Presensi — NAKULAKU</title>

<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/nakula.css" />

<style>
  .stat-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-mini {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 14px;
    text-align: center;
  }
  .stat-mini .n {
    font-size: 26px;
    font-weight: 800;
    line-height: 1;
    color: var(--maroon);
  }
  .stat-mini .l {
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-top: 4px;
  }

  .tab-verif {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all .15s;
  }
  .tab-verif.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: var(--sh-sm);
  }

  .verif-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 14px;
    margin-bottom: 12px;
    transition: all .15s;
  }
  .verif-item:hover { box-shadow: var(--sh-md); }

  .verif-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .verif-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .verif-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .verif-info { flex: 1; min-width: 0; }
  .verif-name {
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .verif-meta {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }

  .verif-foto {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: var(--r-md);
    background: var(--bg);
    object-fit: cover;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .verif-detail {
    background: var(--bg);
    border-radius: var(--r-md);
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 12.5px;
  }
  .verif-detail-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    gap: 8px;
  }
  .verif-detail-row .lbl { color: var(--muted); font-weight: 600; flex-shrink: 0; }
  .verif-detail-row .val { font-weight: 700; text-align: right; }
  .verif-detail-row .val.warn { color: var(--warning); }

  .verif-actions {
    display: flex;
    gap: 8px;
  }
  .verif-actions .btn { flex: 1; }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--r-md);
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="../beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Verifikasi</div>
      <div class="app-header-sub">Panel Kepala Sekolah</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout">
    <span data-icon="logOut"></span>
  </button>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;">

  <div class="stat-row">
    <div class="stat-mini">
      <div class="n" id="statTotal">—</div>
      <div class="l">Presensi Perlu Verifikasi</div>
    </div>
    <div class="stat-mini">
      <div class="n" id="statIzin">—</div>
      <div class="l">Ajuan Izin</div>
    </div>
  </div>

  <!-- Tab switch -->
  <div style="display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:16px;border:1px solid var(--border);">
    <button class="tab-verif active" data-tipe="presensi">
      <span data-icon="mapPin" class="icon-sm"></span> Presensi
    </button>
    <button class="tab-verif" data-tipe="izin">
      <span data-icon="fileText" class="icon-sm"></span> Ajuan Izin
    </button>
  </div>

  <div id="listVerif">
    <div class="skeleton" style="height:200px;border-radius:16px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:200px;border-radius:16px;"></div>
  </div>

</main>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

let profile;
let tabAktif = 'presensi';
let daftarPresensi = [];
let daftarIzin = [];

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  if (!profile.peran.includes('ks') && !profile.peran.includes('pengurus') && !profile.peran.includes('super_admin')) {
    document.querySelector('main').innerHTML = UI.errorHtml(
      'Halaman ini hanya untuk Kepala Sekolah.',
      '<a href="../beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
    );
    return;
  }

  await loadSemua();

  document.querySelectorAll('.tab-verif').forEach(t => {
    t.addEventListener('click', () => {
      tabAktif = t.dataset.tipe;
      document.querySelectorAll('.tab-verif').forEach(x => {
        x.classList.toggle('active', x === t);
      });
      renderList();
    });
  });
})();

async function loadSemua() {
  const el = document.getElementById('listVerif');
  el.innerHTML = '<div class="skeleton" style="height:200px;border-radius:16px;"></div>';

  const [resPresensi, resIzin] = await Promise.all([
    Api.call('presensi.menunggu_ks'),
    Api.call('izin.menunggu_ks'),
  ]);

  daftarPresensi = resPresensi.ok ? (resPresensi.data || []) : [];
  daftarIzin = resIzin.ok ? (resIzin.data || []) : [];

  document.getElementById('statTotal').textContent = daftarPresensi.length;
  document.getElementById('statIzin').textContent = daftarIzin.length;

  renderList();
}

function renderList() {
  const el = document.getElementById('listVerif');

  if (tabAktif === 'presensi') {
    if (daftarPresensi.length === 0) {
      el.innerHTML = UI.emptyHtml('checkCircle', 'Semua presensi sudah diverifikasi', 'Tidak ada yang menunggu.');
      return;
    }
    el.innerHTML = daftarPresensi.map(v => renderPresensiItem(v)).join('');
    daftarPresensi.forEach(v => {
      const item = document.getElementById('verif-' + v.id);
      if (!item) return;
      item.querySelector('[data-act="setuju"]').addEventListener('click', () => verifikasiPresensi(v.id, 'disetujui'));
      item.querySelector('[data-act="tolak"]').addEventListener('click', () => verifikasiPresensi(v.id, 'ditolak'));
      item.querySelector('[data-act="foto"]')?.addEventListener('click', () => showFoto(v.foto_thumb_url));
    });
  } else {
    if (daftarIzin.length === 0) {
      el.innerHTML = UI.emptyHtml('checkCircle', 'Tidak ada ajuan izin', 'Semua ajuan sudah diproses.');
      return;
    }
    el.innerHTML = daftarIzin.map(v => renderIzinItem(v)).join('');
    daftarIzin.forEach(v => {
      const item = document.getElementById('verif-' + v.id);
      if (!item) return;
      item.querySelector('[data-act="setuju"]').addEventListener('click', () => verifikasiIzin(v.id, 'disetujui'));
      item.querySelector('[data-act="tolak"]').addEventListener('click', () => verifikasiIzin(v.id, 'ditolak'));
    });
  }
}

function renderPresensiItem(v) {
  const init = (v.user?.nama_lengkap || '?').charAt(0).toUpperCase();
  const fotoUrl = v.foto_thumb_url;
  const waktu = UI.formatTanggalJam(v.waktu_submit);
  const pertemuanInfo = v.pertemuan
    ? `Pertemuan #${v.pertemuan.urutan} · ${UI.escapeHtml(v.pertemuan.judul)}`
    : 'Pertemuan tidak diketahui';

  return `
    <div class="verif-item" id="verif-${v.id}">
      <div class="verif-head">
        <div class="verif-avatar"><span>${init}</span></div>
        <div class="verif-info">
          <div class="verif-name">${UI.escapeHtml(v.user?.nama_lengkap || '-')}</div>
          <div class="verif-meta">${UI.escapeHtml(v.user?.sekolah?.nama || '-')}</div>
          <div class="verif-meta">${UI.escapeHtml(v.user?.jabatan || '-')}</div>
        </div>
      </div>

      ${fotoUrl ? `<img class="verif-foto" data-act="foto" src="${fotoUrl}" alt="Foto presensi" loading="lazy" />` : ''}

      <div class="verif-detail">
        <div class="verif-detail-row">
          <span class="lbl">Pertemuan</span>
          <span class="val" style="font-size:11.5px;">${pertemuanInfo}</span>
        </div>
        <div class="verif-detail-row">
          <span class="lbl">Waktu Submit</span>
          <span class="val">${waktu}</span>
        </div>
        <div class="verif-detail-row">
          <span class="lbl">Jarak dari Lokasi</span>
          <span class="val warn">${v.jarak_meter !== null ? v.jarak_meter + ' m' : '—'}</span>
        </div>
        <div class="verif-detail-row">
          <span class="lbl">Status Awal</span>
          <span class="val"><span class="badge badge-warning">Luar Radius</span></span>
        </div>
      </div>

      <div class="verif-actions">
        <button class="btn btn-secondary btn-sm" data-act="tolak">
          ${Icons.get('x', { class: 'icon-sm' })} Tolak
        </button>
        <button class="btn btn-primary btn-sm" data-act="setuju">
          ${Icons.get('check', { class: 'icon-sm' })} Setujui
        </button>
      </div>
    </div>
  `;
}

function renderIzinItem(v) {
  const init = (v.user?.nama_lengkap || '?').charAt(0).toUpperCase();
  const waktu = UI.formatTanggalJam(v.waktu);
  const jenisLabel = { ijin: 'Ijin', sakit: 'Sakit', cuti: 'Cuti' }[v.jenis] || v.jenis;
  const jenisColor = { ijin: 'badge-info', sakit: 'badge-warning', cuti: 'badge-maroon' }[v.jenis] || 'badge-maroon';
  const pertemuanInfo = v.pertemuan
    ? `Pertemuan #${v.pertemuan.urutan} · ${UI.escapeHtml(v.pertemuan.judul)}`
    : '-';

  return `
    <div class="verif-item" id="verif-${v.id}">
      <div class="verif-head">
        <div class="verif-avatar"><span>${init}</span></div>
        <div class="verif-info">
          <div class="verif-name">${UI.escapeHtml(v.user?.nama_lengkap || '-')}</div>
          <div class="verif-meta">${UI.escapeHtml(v.user?.sekolah?.nama || '-')}</div>
          <div class="verif-meta">${UI.escapeHtml(v.user?.jabatan || '-')}</div>
        </div>
      </div>

      <div class="verif-detail">
        <div class="verif-detail-row">
          <span class="lbl">Jenis</span>
          <span class="val"><span class="badge ${jenisColor}">${jenisLabel}</span></span>
        </div>
        <div class="verif-detail-row">
          <span class="lbl">Pertemuan</span>
          <span class="val" style="font-size:11.5px;">${pertemuanInfo}</span>
        </div>
        <div class="verif-detail-row">
          <span class="lbl">Diajukan</span>
          <span class="val">${waktu}</span>
        </div>
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;">ALASAN:</div>
          <div style="font-size:13px;line-height:1.5;">${UI.escapeHtml(v.alasan || '-')}</div>
          ${v.lampiran_url ? `
            <a href="${UI.escapeHtml(v.lampiran_url)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:700;">
              ${Icons.get('externalLink', { class: 'icon-sm' })} Lihat Lampiran
            </a>
          ` : ''}
        </div>
      </div>

      <div class="verif-actions">
        <button class="btn btn-secondary btn-sm" data-act="tolak">
          ${Icons.get('x', { class: 'icon-sm' })} Tolak
        </button>
        <button class="btn btn-primary btn-sm" data-act="setuju">
          ${Icons.get('check', { class: 'icon-sm' })} Setujui
        </button>
      </div>
    </div>
  `;
}

async function verifikasiPresensi(presensiId, keputusan) {
  const item = daftarPresensi.find(v => v.id === presensiId);
  const nama = item?.user?.nama_lengkap || 'guru';
  const pesan = keputusan === 'disetujui'
    ? `Setujui presensi ${nama}? Poin akan diubah menjadi 70.`
    : `Tolak presensi ${nama}? Poin akan diubah menjadi 0 (alfa).`;

  const ok = await UI.konfirmasi(
    keputusan === 'disetujui' ? 'Setujui Presensi' : 'Tolak Presensi',
    pesan,
    { okText: keputusan === 'disetujui' ? 'Setujui' : 'Tolak', danger: keputusan === 'ditolak' }
  );
  if (!ok) return;

  const res = await Api.call('presensi.verifikasi', { presensi_id: presensiId, keputusan });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses(keputusan === 'disetujui' ? 'Presensi disetujui.' : 'Presensi ditolak.');
  await loadSemua();
}

async function verifikasiIzin(pengajuanId, keputusan) {
  const item = daftarIzin.find(v => v.id === pengajuanId);
  const nama = item?.user?.nama_lengkap || 'guru';
  const pesan = keputusan === 'disetujui'
    ? `Setujui ajuan ${item?.jenis} dari ${nama}? Poin presensi akan menjadi 50.`
    : `Tolak ajuan ${item?.jenis} dari ${nama}?`;

  const ok = await UI.konfirmasi(
    keputusan === 'disetujui' ? 'Setujui Ajuan' : 'Tolak Ajuan',
    pesan,
    { okText: keputusan === 'disetujui' ? 'Setujui' : 'Tolak', danger: keputusan === 'ditolak' }
  );
  if (!ok) return;

  const res = await Api.call('izin.verifikasi', { pengajuan_id: pengajuanId, keputusan });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses(keputusan === 'disetujui' ? 'Ajuan disetujui.' : 'Ajuan ditolak.');
  await loadSemua();
}

function showFoto(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${url}" alt="Foto presensi">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}
</script>

</body>
</html>
