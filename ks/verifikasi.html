<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Verifikasi — NAKULAKU</title>

<link rel="icon" type="image/png" href="../assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/nakula.css" />

<style>
  /* ============================================
     HERO
     ============================================ */
  .hero-ks {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 24px 20px 20px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.28);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-ks::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-ks::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .hero-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: rgba(255,255,255,.15);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    flex-shrink: 0;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
  }
  .hero-info { flex: 1; min-width: 0; }
  .hero-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 3px;
    letter-spacing: 0.3px;
  }
  .hero-sub {
    font-size: 12.5px;
    opacity: 0.85;
    font-weight: 600;
  }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
    z-index: 1;
  }
  .hero-stat {
    text-align: center;
  }
  .hero-stat .n {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .hero-stat .l {
    font-size: 10px;
    opacity: 0.8;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 6px;
  }
  .hero-stat.izin .n { color: #FCD34D; }

  /* ============================================
     TAB SWITCH
     ============================================ */
  .tab-switch {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 14px;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
    animation: fade-in-up .4s var(--ease-out) .05s both;
  }
  .tsw {
    flex: 1;
    padding: 12px 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all .15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .tsw.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: 0 2px 8px rgba(125,29,58,.08);
  }
  .tsw-count {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--danger);
    color: white;
    font-weight: 800;
    min-width: 18px;
    text-align: center;
  }
  .tsw:not(.active) .tsw-count {
    background: var(--border);
    color: var(--muted);
  }

  /* ============================================
     ITEM VERIFIKASI
     ============================================ */
  .verif-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    position: relative;
    overflow: hidden;
  }
  .verif-item:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 8px 24px rgba(125,29,58,.08);
  }

  .verif-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .verif-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(125,29,58,.1);
  }
  .verif-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .verif-info { flex: 1; min-width: 0; }
  .verif-name {
    font-weight: 800;
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .verif-meta {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.5;
  }

  .verif-foto {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 14px;
    background: var(--bg);
    object-fit: cover;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform .15s;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  .verif-foto:hover {
    transform: scale(1.01);
  }

  .verif-detail {
    background: var(--bg);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 12.5px;
    border: 1px solid var(--border);
  }
  .verif-detail-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    gap: 10px;
  }
  .verif-detail-row .lbl {
    color: var(--muted);
    font-weight: 700;
    flex-shrink: 0;
    font-size: 11.5px;
  }
  .verif-detail-row .val {
    font-weight: 700;
    text-align: right;
    color: var(--ink);
  }
  .verif-detail-row .val.warn {
    color: var(--warning);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* ALASAN BOX */
  .alasan-box {
    background: linear-gradient(135deg, #FFFCF3 0%, #FEF3C7 100%);
    border: 1px solid rgba(180,83,9,.15);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .alasan-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 800;
    color: var(--warning);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .alasan-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    font-weight: 500;
  }

  .lampiran-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--maroon);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--maroon-soft);
    margin-top: 10px;
    transition: all .15s;
  }
  .lampiran-link:hover {
    background: var(--maroon);
    color: white;
    text-decoration: none;
  }

  /* ACTIONS */
  .verif-actions {
    display: flex;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .verif-actions .btn { flex: 1; }

  /* JENIS BADGE */
  .jenis-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .jenis-badge.izin { background: var(--info-soft); color: var(--info); }
  .jenis-badge.sakit { background: var(--warning-soft); color: var(--warning); }
  .jenis-badge.cuti { background: var(--maroon-soft); color: var(--maroon); }
  .jenis-badge.luar { background: var(--warning-soft); color: var(--warning); }

  /* LIGHTBOX */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fade-in .2s both;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  /* EMPTY */
  .empty-panel {
    text-align: center;
    padding: 50px 20px;
  }
  .empty-panel .big-icon {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--success-soft) 0%, #D1FAE5 100%);
    color: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    position: relative;
  }
  .empty-panel .big-icon svg { width: 40px; height: 40px; }
  .empty-panel h3 {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-panel p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 300px;
    margin: 0 auto;
  }

  /* PEMILIH PERTEMUAN */
  .picker-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .picker-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .picker-select {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    outline: none;
    transition: all .15s;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%237D1D3A' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='m4 6 3 3 3-3'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 38px;
  }
  .picker-select:focus {
    border-color: var(--maroon);
    background-color: var(--surface);
    box-shadow: 0 0 0 3px rgba(125,29,58,.08);
  }

  /* GURU BELUM PRESENSI */
  .guru-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    margin-bottom: 8px;
    transition: all .15s;
  }
  .guru-row:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 4px 12px rgba(125,29,58,.06);
  }
  .guru-row.sudah {
    background: linear-gradient(135deg, #F5FDF9 0%, #ECFDF5 100%);
    border-color: rgba(21,128,61,.2);
  }
  .guru-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .guru-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .guru-info { flex: 1; min-width: 0; }
  .guru-nama {
    font-weight: 800;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .guru-jabatan {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .guru-status {
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .guru-status.belum {
    background: var(--warning-soft);
    color: var(--warning);
  }
  .guru-status.hadir {
    background: var(--success-soft);
    color: var(--success);
  }
  .guru-status.izin {
    background: var(--info-soft);
    color: var(--info);
  }
  .guru-status.alfa {
    background: var(--danger-soft);
    color: var(--danger);
  }
  .guru-btn {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--maroon);
    color: white;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .guru-btn:hover { background: var(--maroon-dark); }
  .guru-btn:active { transform: scale(.96); }

  /* MODAL OVERRIDE */
  .ov-modal {
    position: fixed;
    inset: 0;
    background: rgba(28,20,20,.55);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fade-in .2s both;
  }
  .ov-modal-inner {
    background: var(--surface);
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.3);
    animation: slide-up .3s var(--ease-out) both;
  }
  .ov-modal-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--maroon);
    margin-bottom: 4px;
  }
  .ov-modal-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 18px;
    font-weight: 600;
    line-height: 1.5;
  }
  .ov-field {
    margin-bottom: 14px;
  }
  .ov-label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .ov-status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .ov-status-opt {
    padding: 10px 6px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    transition: all .15s;
    font-family: inherit;
  }
  .ov-status-opt.active {
    background: var(--maroon);
    color: white;
    border-color: var(--maroon);
  }
  .ov-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .ov-actions .btn { flex: 1; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="../beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Verifikasi</div>
      <div class="app-header-sub">Panel Kepala Sekolah</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout">
    <span data-icon="logOut"></span>
  </button>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;">

  <!-- HERO -->
  <div class="hero-ks">
    <div class="hero-head">
      <div class="hero-icon">
        <span data-icon="shield" class="icon-xl"></span>
      </div>
      <div class="hero-info">
        <div class="hero-title">Verifikasi</div>
        <div class="hero-sub">Presensi & Ajuan Izin</div>
      </div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="n" id="statTotal">—</div>
        <div class="l">Belum Presensi</div>
      </div>
      <div class="hero-stat izin">
        <div class="n" id="statIzin">—</div>
        <div class="l">Ajuan Izin</div>
      </div>
    </div>
  </div>

  <!-- TAB -->
  <div class="tab-switch">
    <button class="tsw active" data-tipe="presensi">
      <span data-icon="userCheck" class="icon-sm"></span>
      Presensi
      <span class="tsw-count" id="countPresensi">0</span>
    </button>
    <button class="tsw" data-tipe="izin">
      <span data-icon="fileText" class="icon-sm"></span>
      Ajuan Izin
      <span class="tsw-count" id="countIzin">0</span>
    </button>
  </div>

  <!-- Pemilih Pertemuan (khusus tab presensi) -->
  <div class="picker-box" id="pickerBox">
    <div class="picker-label">
      <span data-icon="calendar" class="icon-sm"></span>
      Pilih Pertemuan
    </div>
    <select class="picker-select" id="pilihPertemuan">
      <option value="">— Memuat pertemuan… —</option>
    </select>
  </div>

  <div id="listVerif">
    <div class="skeleton" style="height:220px;border-radius:20px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:220px;border-radius:20px;"></div>
  </div>

</main>

<nav class="bottom-nav">
  <a class="nav-item" data-nav="beranda" href="../beranda.html"><span data-icon="home"></span> Beranda</a>
  <a class="nav-item" data-nav="pertemuan" href="../beranda.html#sectionPertemuan"><span data-icon="calendar"></span> Pertemuan</a>
  <a class="nav-item" data-nav="galeri" href="../galeri.html"><span data-icon="grid"></span> Galeri</a>
  <a class="nav-item" data-nav="aktivitas" href="../aktivitas.html"><span data-icon="activity"></span> Aktivitas</a>
  <a class="nav-item" data-nav="profil" href="../profil.html"><span data-icon="user"></span> Profil</a>
</nav>

<script src="../assets/js/icons.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/app-nav.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

let profile;
let tabAktif = 'presensi';
let daftarGuruSekolah = [];   // hasil presensi.guru_sekolah
let daftarIzin = [];
let pertemuanList = [];
let pertemuanDipilih = null;

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  const peran = profile.peran || [];
  if (!peran.includes('ks') && !peran.includes('pengurus') && !peran.includes('super_admin')) {
    document.querySelector('main').innerHTML = UI.errorHtml(
      'Halaman ini hanya untuk Kepala Sekolah.',
      '<a href="../beranda.html" class="btn btn-primary btn-sm" style="margin-top:12px;">Kembali</a>'
    );
    return;
  }

  await loadSemua();

  document.querySelectorAll('.tsw').forEach(t => {
    t.addEventListener('click', () => {
      tabAktif = t.dataset.tipe;
      document.querySelectorAll('.tsw').forEach(x => x.classList.toggle('active', x === t));
      // Sembunyikan picker pertemuan kalau tab izin
      document.getElementById('pickerBox').style.display =
        (tabAktif === 'presensi') ? 'block' : 'none';
      renderList();
    });
  });

  // Handler dropdown pertemuan
  document.getElementById('pilihPertemuan').addEventListener('change', async (e) => {
    const pid = Number(e.target.value);
    if (!pid) return;
    pertemuanDipilih = pid;
    await loadGuruSekolah();
  });
})();

async function loadSemua() {
  const el = document.getElementById('listVerif');
  el.innerHTML = '<div class="skeleton" style="height:220px;border-radius:20px;"></div>';

  // Load pertemuan list + izin pending secara paralel
  const [resPertemuan, resIzin] = await Promise.all([
    Api.call('pertemuan.list'),
    Api.call('izin.menunggu_ks'),
  ]);

  pertemuanList = resPertemuan.ok ? (resPertemuan.data || []) : [];
  daftarIzin = resIzin.ok ? (resIzin.data || []) : [];

  document.getElementById('statIzin').textContent = daftarIzin.length;
  document.getElementById('countIzin').textContent = daftarIzin.length;

  // Populate dropdown pertemuan (terbaru dulu)
  const sel = document.getElementById('pilihPertemuan');
  if (pertemuanList.length === 0) {
    sel.innerHTML = '<option value="">— Belum ada pertemuan —</option>';
    document.getElementById('statTotal').textContent = '0';
    document.getElementById('countPresensi').textContent = '0';
    renderList();
    return;
  }

  const listSorted = [...pertemuanList].sort((a, b) => b.urutan - a.urutan);
  sel.innerHTML = '<option value="">— Pilih Pertemuan —</option>' +
    listSorted.map(p => {
      const tgl = p.tanggal ? UI.formatTanggalPendek(p.tanggal) : '';
      return `<option value="${p.id}">#${p.urutan} · ${UI.escapeHtml(p.judul)}${tgl ? ' (' + tgl + ')' : ''}</option>`;
    }).join('');

  // Auto-pilih pertemuan paling baru
  const autoId = listSorted[0].id;
  sel.value = String(autoId);
  pertemuanDipilih = autoId;

  // Auto-load guru sekolah untuk pertemuan itu
  await loadGuruSekolah();
}

async function loadGuruSekolah() {
  if (!pertemuanDipilih) return;

  const el = document.getElementById('listVerif');
  el.innerHTML = '<div class="skeleton" style="height:180px;border-radius:20px;margin-bottom:10px;"></div><div class="skeleton" style="height:180px;border-radius:20px;"></div>';

  const res = await Api.call('presensi.guru_sekolah', { pertemuan_id: pertemuanDipilih });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat data guru.');
    return;
  }

  daftarGuruSekolah = res.data?.data || [];
  const belum = daftarGuruSekolah.filter(g => !g.presensi).length;

  document.getElementById('statTotal').textContent = belum;
  document.getElementById('countPresensi').textContent = belum;

  renderList();
}

function renderList() {
  const el = document.getElementById('listVerif');

  if (tabAktif === 'presensi') {
    if (daftarGuruSekolah.length === 0) {
      el.innerHTML = `
        <div class="empty-panel">
          <div class="big-icon">${Icons.get('users', { class: 'icon-lg' })}</div>
          <h3>Tidak Ada Data Guru</h3>
          <p>Belum ada guru terdaftar di sekolah Anda.</p>
        </div>
      `;
      return;
    }

    // Urutkan: belum presensi dulu, lalu sudah
    const sorted = [...daftarGuruSekolah].sort((a, b) => {
      if (!a.presensi && b.presensi) return -1;
      if (a.presensi && !b.presensi) return 1;
      return (a.nama_lengkap || '').localeCompare(b.nama_lengkap || '');
    });

    const belumList = sorted.filter(g => !g.presensi);
    const sudahList = sorted.filter(g => g.presensi);

    let html = '';

    if (belumList.length > 0) {
      html += `
        <div style="font-size:11px;font-weight:800;color:var(--warning);text-transform:uppercase;letter-spacing:0.5px;margin:8px 4px 10px;display:flex;align-items:center;gap:6px;">
          ${Icons.get('alertCircle', { class: 'icon-sm' })}
          Belum Presensi (${belumList.length})
        </div>
      `;
      html += belumList.map(g => renderGuruRow(g, true)).join('');
    }

    if (sudahList.length > 0) {
      html += `
        <div style="font-size:11px;font-weight:800;color:var(--success);text-transform:uppercase;letter-spacing:0.5px;margin:18px 4px 10px;display:flex;align-items:center;gap:6px;">
          ${Icons.get('checkCircle', { class: 'icon-sm' })}
          Sudah Presensi (${sudahList.length})
        </div>
      `;
      html += sudahList.map(g => renderGuruRow(g, false)).join('');
    }

    el.innerHTML = html;

    // Bind override buttons
    el.querySelectorAll('[data-ov]').forEach(btn => {
      btn.addEventListener('click', () => {
        const uid = Number(btn.dataset.ov);
        const guru = daftarGuruSekolah.find(g => g.user_id === uid);
        if (guru) bukaModalOverride(guru);
      });
    });

  } else {
    if (daftarIzin.length === 0) {
      el.innerHTML = `
        <div class="empty-panel">
          <div class="big-icon">${Icons.get('checkCircle', { class: 'icon-lg' })}</div>
          <h3>Tidak Ada Ajuan Izin</h3>
          <p>Semua ajuan sudah diproses.</p>
        </div>
      `;
      return;
    }
    el.innerHTML = daftarIzin.map((v, idx) => renderIzinItem(v, idx)).join('');
    daftarIzin.forEach(v => {
      const item = document.getElementById('verif-' + v.id);
      if (!item) return;
      item.querySelector('[data-act="setuju"]').addEventListener('click', () => verifikasiIzin(v.id, 'disetujui'));
      item.querySelector('[data-act="tolak"]').addEventListener('click', () => verifikasiIzin(v.id, 'ditolak'));
    });
  }
}

function renderGuruRow(g, belumPresensi) {
  const init = (g.nama_lengkap || '?').charAt(0).toUpperCase();
  const fotoUrl = Api.fotoUrl(g.user_id, 't');

  let statusBadge = '';
  if (g.presensi) {
    const statusMap = {
      tepat_waktu:       { label: 'Tepat',   cls: 'hadir' },
      terlambat:         { label: 'Telat',   cls: 'hadir' },
      luar_radius:       { label: 'Luar',    cls: 'izin' },
      izin_pribadi:      { label: 'Izin',    cls: 'izin' },
      sakit:             { label: 'Sakit',   cls: 'izin' },
      sakit_tanpa_surat: { label: 'Sakit',   cls: 'izin' },
      dinas_luar:        { label: 'Dinas',   cls: 'izin' },
      cuti_melahirkan:   { label: 'Cuti',    cls: 'izin' },
      ijin:              { label: 'Ijin',    cls: 'izin' },
      cuti:              { label: 'Cuti',    cls: 'izin' },
      alfa:              { label: 'Alfa',    cls: 'alfa' },
    };
    const s = statusMap[g.presensi.status] || { label: g.presensi.status, cls: 'hadir' };
    statusBadge = `<span class="guru-status ${s.cls}">${s.label}</span>`;
  } else {
    statusBadge = `<span class="guru-status belum">Belum</span>`;
  }

  return `
    <div class="guru-row ${belumPresensi ? '' : 'sudah'}">
      <div class="guru-avatar">
        <span>${init}</span>
        ${fotoUrl ? `<img src="${fotoUrl}" loading="lazy" alt="" onerror="this.remove()">` : ''}
      </div>
      <div class="guru-info">
        <div class="guru-nama">${UI.escapeHtml(g.nama_lengkap || '-')}</div>
        <div class="guru-jabatan">${UI.escapeHtml(g.jabatan || '-')}</div>
      </div>
      ${statusBadge}
      ${belumPresensi ? `
        <button class="guru-btn" data-ov="${g.user_id}">
          ${Icons.get('userCheck', { class: 'icon-sm' })}
          Override
        </button>
      ` : ''}
    </div>
  `;
}

function renderIzinItem(v, idx) {
  const init = (v.user?.nama_lengkap || '?').charAt(0).toUpperCase();
  const waktu = UI.formatTanggalJam(v.waktu);
  const kode = v.kategori_kode || v.jenis;
  const jenisLabel = {
    ijin: 'Ijin',
    izin_pribadi: 'Izin Pribadi',
    sakit: 'Sakit',
    sakit_tanpa_surat: 'Sakit (tanpa surat)',
    dinas_luar: 'Dinas Luar',
    cuti: 'Cuti',
    cuti_melahirkan: 'Cuti Melahirkan',
  }[kode] || kode;

  const jenisIcon = {
    ijin: 'fileText',
    izin_pribadi: 'userX',
    sakit: 'heartPulse',
    sakit_tanpa_surat: 'heart',
    dinas_luar: 'briefcase',
    cuti: 'calendar',
    cuti_melahirkan: 'baby',
  }[kode] || 'fileText';

  const jenisCls = {
    ijin: 'izin',
    izin_pribadi: 'izin',
    sakit: 'sakit',
    sakit_tanpa_surat: 'sakit',
    dinas_luar: 'izin',
    cuti: 'cuti',
    cuti_melahirkan: 'cuti',
  }[kode] || 'izin';
  const pertemuanInfo = v.pertemuan
    ? `Pertemuan #${v.pertemuan.urutan} · ${UI.escapeHtml(v.pertemuan.judul)}`
    : '-';

  return `
    <div class="verif-item" id="verif-${v.id}" style="animation-delay:${idx * 0.05}s">
      <div class="verif-head">
        <div class="verif-avatar"><span>${init}</span></div>
        <div class="verif-info">
          <div class="verif-name">${UI.escapeHtml(v.user?.nama_lengkap || '-')}</div>
          <div class="verif-meta">${UI.escapeHtml(v.user?.sekolah?.nama || '-')}</div>
          <div class="verif-meta">${UI.escapeHtml(v.user?.jabatan || '-')}</div>
        </div>
        <span class="jenis-badge ${jenisCls}">
          ${Icons.get(jenisIcon, { class: 'icon-sm' })}
          ${jenisLabel}
        </span>
      </div>

      <div class="verif-detail">
        <div class="verif-detail-row">
          <span class="lbl">Pertemuan</span>
          <span class="val" style="font-size:11.5px;">${pertemuanInfo}</span>
        </div>
        <div class="verif-detail-row">
          <span class="lbl">Diajukan</span>
          <span class="val">${waktu}</span>
        </div>
      </div>

      <div class="alasan-box">
        <div class="alasan-label">
          ${Icons.get('messageSquare', { class: 'icon-sm' })}
          Alasan
        </div>
        <div class="alasan-text">${UI.escapeHtml(v.alasan || '-')}</div>
        ${v.lampiran_url ? `
          <a href="${UI.escapeHtml(v.lampiran_url)}" target="_blank" rel="noopener" class="lampiran-link">
            ${Icons.get('externalLink', { class: 'icon-sm' })}
            Lihat Lampiran
          </a>
        ` : ''}
      </div>

      <div class="verif-actions">
        <button class="btn btn-secondary" data-act="tolak">
          ${Icons.get('x', { class: 'icon-sm' })}
          Tolak
        </button>
        <button class="btn btn-primary" data-act="setuju">
          ${Icons.get('check', { class: 'icon-sm' })}
          Setujui
        </button>
      </div>
    </div>
  `;
}

// ============================================================
// MODAL OVERRIDE PRESENSI
// ============================================================
function bukaModalOverride(guru) {
  let statusDipilih = 'tepat_waktu';

  const overlay = document.createElement('div');
  overlay.className = 'ov-modal';
  overlay.innerHTML = `
    <div class="ov-modal-inner">
      <div class="ov-modal-title">Override Presensi</div>
      <div class="ov-modal-sub">
        Tandai <strong>${UI.escapeHtml(guru.nama_lengkap)}</strong> sebagai hadir manual.
        Gunakan hanya untuk kasus HP rusak, GPS error, atau kendala teknis.
      </div>

      <div class="ov-field">
        <label class="ov-label">Status Kehadiran</label>
        <div class="ov-status-grid">
          <button type="button" class="ov-status-opt active" data-status="tepat_waktu">Tepat Waktu</button>
          <button type="button" class="ov-status-opt" data-status="terlambat">Terlambat</button>
          <button type="button" class="ov-status-opt" data-status="luar_radius">Luar Radius</button>
        </div>
      </div>

      <div class="ov-field">
        <label class="ov-label">Alasan Override *</label>
        <textarea id="ovAlasan" class="input" rows="3" placeholder="Contoh: HP guru rusak, tidak bisa akses kamera. Dikonfirmasi hadir di lokasi." style="width:100%;resize:vertical;font-family:inherit;padding:12px;border:1.5px solid var(--border);border-radius:12px;font-size:13.5px;line-height:1.5;outline:none;"></textarea>
      </div>

      <div class="ov-actions">
        <button class="btn btn-secondary" data-cancel>Batal</button>
        <button class="btn btn-primary" id="ovSimpan">
          ${Icons.get('check', { class: 'icon-sm' })}
          Tandai Hadir
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const close = () => overlay.remove();

  // Bind status picker
  overlay.querySelectorAll('.ov-status-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      overlay.querySelectorAll('.ov-status-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      statusDipilih = btn.dataset.status;
    });
  });

  overlay.querySelector('[data-cancel]').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

  // Focus textarea
  setTimeout(() => overlay.querySelector('#ovAlasan').focus(), 150);

  // Simpan
  overlay.querySelector('#ovSimpan').addEventListener('click', async () => {
    const btn = overlay.querySelector('#ovSimpan');
    const alasan = overlay.querySelector('#ovAlasan').value.trim();

    if (!alasan) {
      UI.gagal('Alasan override wajib diisi.');
      return;
    }

    UI.btnLoading(btn, 'Menyimpan…');

    const res = await Api.call('presensi.override', {
      user_id: guru.user_id,
      pertemuan_id: pertemuanDipilih,
      status: statusDipilih,
      alasan,
    });

    UI.btnReset(btn);

    if (!res.ok) {
      UI.gagal(res.error || 'Gagal override.');
      return;
    }

    UI.sukses(res.data.pesan || 'Presensi di-override.');
    close();
    await loadGuruSekolah();
  });
}

async function verifikasiIzin(pengajuanId, keputusan) {
  const item = daftarIzin.find(v => v.id === pengajuanId);
  const nama = item?.user?.nama_lengkap || 'guru';
  const kode = item?.kategori_kode || item?.jenis;
  const label = {
    ijin: 'Ijin',
    izin_pribadi: 'Izin Pribadi',
    sakit: 'Sakit',
    sakit_tanpa_surat: 'Sakit (tanpa surat)',
    dinas_luar: 'Dinas Luar',
    cuti: 'Cuti',
    cuti_melahirkan: 'Cuti Melahirkan',
  }[kode] || kode;
  const pesan = keputusan === 'disetujui'
    ? `Setujui ajuan "${label}" dari ${nama}? Poin akan diberikan sesuai kategori.`
    : `Tolak ajuan "${label}" dari ${nama}?`;

  const ok = await UI.konfirmasi(
    keputusan === 'disetujui' ? 'Setujui Ajuan' : 'Tolak Ajuan',
    pesan,
    { okText: keputusan === 'disetujui' ? 'Setujui' : 'Tolak', danger: keputusan === 'ditolak' }
  );
  if (!ok) return;

  const res = await Api.call('izin.verifikasi', { pengajuan_id: pengajuanId, keputusan });
  if (!res.ok) { UI.gagal(res.error); return; }
  UI.sukses(keputusan === 'disetujui' ? 'Ajuan disetujui.' : 'Ajuan ditolak.');
  await loadSemua();
}

function showFoto(url) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${url}" alt="Foto presensi">`;
  lb.addEventListener('click', () => lb.remove());
  document.body.appendChild(lb);
}
