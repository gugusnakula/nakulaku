<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Sertifikat Saya — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  .sertifikat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--sh-md);
    transition: all .15s;
  }
  .sertifikat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--sh-lg);
  }
  .sertifikat-header {
    background: linear-gradient(135deg, var(--maroon-dark) 0%, var(--maroon-mid) 100%);
    color: white;
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
  }
  .sertifikat-header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.15;
  }
  .sertifikat-header::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.08;
  }
  .sertifikat-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(201,169,97,.5);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    position: relative;
  }
  .sertifikat-title {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
    position: relative;
  }
  .sertifikat-nomor {
    font-size: 11.5px;
    opacity: 0.85;
    font-family: monospace;
    position: relative;
  }
  .sertifikat-body {
    padding: 16px 20px;
  }
  .sertifikat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    gap: 12px;
  }
  .sertifikat-row .lbl {
    color: var(--muted);
    font-weight: 600;
  }
  .sertifikat-row .val {
    font-weight: 700;
    text-align: right;
  }
  .sertifikat-actions {
    display: flex;
    gap: 8px;
    padding: 0 20px 20px;
  }

  .empty-sertifikat {
    text-align: center;
    padding: 50px 20px;
  }
  .empty-sertifikat .big-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--maroon-soft);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Sertifikat Saya</div>
      <div class="app-header-sub">KKG Gugus Nakula</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout">
    <span data-icon="logOut"></span>
  </button>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;">

  <div id="loading">
    <div class="skeleton" style="height:180px;border-radius:24px;margin-bottom:16px;"></div>
    <div class="skeleton" style="height:180px;border-radius:24px;"></div>
  </div>

  <div id="content" class="hidden"></div>

</main>

<nav class="bottom-nav">
  <a class="nav-item" data-nav="beranda" href="beranda.html"><span data-icon="home"></span> Beranda</a>
  <a class="nav-item" data-nav="pertemuan" href="beranda.html"><span data-icon="calendar"></span> Pertemuan</a>
  <a class="nav-item" data-nav="award" href="award.html"><span data-icon="award"></span> Award</a>
  <a class="nav-item" data-nav="sertifikat" href="#" class="active"><span data-icon="fileText"></span> Sertifikat</a>
  <a class="nav-item" data-nav="profil" href="profil.html"><span data-icon="user"></span> Profil</a>
</nav>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

(async () => {
  const profile = await Api.requireLogin();
  if (!profile) return;

  const res = await Api.call('sertifikat.saya');
  document.getElementById('loading').classList.add('hidden');
  const content = document.getElementById('content');
  content.classList.remove('hidden');

  if (!res.ok) {
    content.innerHTML = UI.errorHtml(res.error || 'Gagal memuat data.');
    return;
  }

  const list = res.data || [];

  if (list.length === 0) {
    content.innerHTML = `
      <div class="empty-sertifikat">
        <div class="big-icon">${Icons.get('award', { class: 'icon-xl' })}</div>
        <div style="font-size:16px;font-weight:800;color:var(--ink);margin-bottom:6px;">Belum Ada Sertifikat</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6;">
          Sertifikat akan muncul di sini setelah Anda menyelesaikan periode pelatihan.
        </div>
      </div>
    `;
    return;
  }

  content.innerHTML = list.map(s => renderSertifikat(s)).join('');
})();

function renderSertifikat(s) {
  const periode = s.periode?.nama || '-';
  const tgl = s.tanggal_terbit ? UI.formatTanggal(s.tanggal_terbit) : '-';

  return `
    <div class="sertifikat-card">
      <div class="sertifikat-header">
        <div class="sertifikat-badge">
          ${Icons.get('award', { class: 'icon-sm' })}
          SERTIFIKAT RESMI
        </div>
        <div class="sertifikat-title">${UI.escapeHtml(periode)}</div>
        ${s.nomor ? `<div class="sertifikat-nomor">No: ${UI.escapeHtml(s.nomor)}</div>` : ''}
      </div>

      <div class="sertifikat-body">
        <div class="sertifikat-row">
          <span class="lbl">Tanggal Terbit</span>
          <span class="val">${tgl}</span>
        </div>
        ${s.catatan ? `
          <div class="sertifikat-row">
            <span class="lbl">Catatan</span>
            <span class="val" style="font-weight:600;color:var(--muted);font-size:12.5px;">${UI.escapeHtml(s.catatan)}</span>
          </div>
        ` : ''}
      </div>

      <div class="sertifikat-actions">
        <a href="${UI.escapeHtml(s.url_pdf)}" target="_blank" rel="noopener" class="btn btn-primary btn-full" style="text-decoration:none;">
          ${Icons.get('download', { class: 'icon-sm' })}
          Buka / Unduh PDF
        </a>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
