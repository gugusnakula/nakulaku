<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Pengamat — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* HEADER MOBILE */
  .app-header-brand { flex: 1; justify-content: flex-start; }
  .app-header-text { text-align: left; }

  /* HERO */
  .hero-pengamat {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 24px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(97,19,41,.3);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-pengamat::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
  }
  .hero-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: rgba(255,255,255,.15);
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); margin-bottom: 16px; position: relative; z-index: 1;
  }
  .hero-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; position: relative; z-index: 1; }
  .hero-desc { font-size: 13px; opacity: 0.9; line-height: 1.5; font-weight: 500; position: relative; z-index: 1; }

  /* SECTION TITLE */
  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 800; color: var(--maroon);
    margin-bottom: 12px; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .section-title .icon-wrap {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--maroon-soft); display: flex; align-items: center; justify-content: center;
  }

  /* CARD PERTEMUAN (STEP 1) */
  .pertemuan-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 18px; padding: 16px; display: flex; align-items: center;
    gap: 14px; margin-bottom: 12px; cursor: pointer; transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .pertemuan-card:hover { border-color: var(--maroon-light); transform: translateY(-2px); box-shadow: var(--sh-md); }
  .pertemuan-num {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; flex-shrink: 0;
  }
  .pertemuan-info { flex: 1; min-width: 0; }
  .pertemuan-judul { font-size: 14.5px; font-weight: 800; color: var(--ink); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pertemuan-meta { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); font-weight: 700; }
  .pertemuan-meta + .pertemuan-meta { margin-top: 3px; }

  /* INFO HEADER (STEP 2) */
  .info-header {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 18px; padding: 16px; margin-bottom: 16px; box-shadow: var(--sh-xs);
  }

  /* SEARCH BAR */
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap input {
    width: 100%; padding: 12px 16px 12px 42px;
    background: var(--surface); border: 1.5px solid var(--border-strong);
    border-radius: 14px; font-size: 13.5px; font-family: inherit;
    font-weight: 600; color: var(--ink); outline: none; transition: all .15s;
    box-shadow: var(--sh-xs);
  }
  .search-wrap input:focus { border-color: var(--maroon); box-shadow: var(--sh-glow); background: #FFFFFF; }
  .search-wrap .icon-left {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: flex; align-items: center; justify-content: center;
  }
  .search-wrap .icon-left svg { width: 18px; height: 18px; }

  /* TAB SWITCH */
  .tab-switch {
    display: flex; gap: 4px; background: var(--bg); padding: 4px;
    border-radius: 14px; margin-bottom: 16px; border: 1.5px solid var(--border);
  }
  .tsw {
    flex: 1; padding: 11px 8px; text-align: center; font-size: 13px; font-weight: 700;
    color: var(--muted); border-radius: 10px; cursor: pointer; border: none;
    background: transparent; display: flex; align-items: center; justify-content: center;
    gap: 6px; transition: all .15s; font-family: inherit;
  }
  .tsw.active { background: var(--surface); color: var(--maroon); box-shadow: 0 2px 8px rgba(125,29,58,.08); }

  /* LIST GURU */
  .guru-list { display: flex; flex-direction: column; gap: 10px; }
  .guru-row {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 14px; display: flex; align-items: center;
    gap: 12px; cursor: pointer; transition: all .15s;
  }
  .guru-row:hover { border-color: var(--maroon); transform: translateY(-1px); box-shadow: var(--sh-sm); }
  .guru-avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--maroon-soft);
    color: var(--maroon); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; flex-shrink: 0; overflow: hidden; position: relative;
  }
  .guru-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .guru-info { flex: 1; min-width: 0; }
  .guru-nama { font-size: 14px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  .guru-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  
  /* BADGE DIAMATI */
  .badge-diamati {
    font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 999px;
    background: var(--success-soft); color: var(--success); flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;
  }

  /* MODAL / BOTTOM SHEET */
  .modal-sheet {
    position: fixed; inset: 0; background: rgba(28,20,20,.5); backdrop-filter: blur(2px);
    z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
    animation: fade-in .2s both;
  }
  .modal-content {
    background: white; border-radius: 24px 24px 0 0; width: 100%; max-width: 600px;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    animation: slide-up .3s var(--ease-out) both; max-height: 90vh; overflow-y: auto;
  }
  @media (min-width: 900px) {
    .modal-sheet { align-items: center; }
    .modal-content { border-radius: 24px; max-height: 85vh; animation: scale-in .25s var(--ease-spring) both; }
  }
  .modal-handle { width: 40px; height: 5px; background: var(--border-strong); border-radius: 999px; margin: 0 auto 16px; }
  
  /* TALLY (GURU) */
  .tally-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .tally-row:last-of-type { border-bottom: none; }
  .tally-label { font-size: 13.5px; font-weight: 700; color: var(--ink); flex: 1; }
  .tally-controls { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .btn-tally {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted); font-size: 20px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: all .15s; font-family: inherit;
  }
  .btn-tally:active { transform: scale(.9); }
  .btn-tally.minus:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
  .btn-tally.plus:hover { border-color: var(--success); color: var(--success); background: var(--success-soft); }
  .tally-val {
    font-size: 18px; font-weight: 800; color: var(--maroon); min-width: 30px; text-align: center;
  }

  /* RATING (SEKOLAH) */
  .rating-pick { display: flex; gap: 6px; flex-shrink: 0; }
  .rating-pick button {
    width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 14px; font-weight: 800; color: var(--muted);
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .rating-pick button:hover { border-color: var(--maroon); color: var(--maroon); }
  .rating-pick button.on {
    background: var(--maroon); color: white; border-color: var(--maroon);
    box-shadow: 0 4px 10px rgba(125,29,58,.25); transform: translateY(-1px);
  }

  /* SAVE BAR */
  .save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,.98); backdrop-filter: blur(12px);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1.5px solid var(--border); box-shadow: 0 -4px 20px rgba(97,19,41,.08); z-index: 40;
  }
  .save-bar-inner { width: 100%; max-width: 800px; display: flex; gap: 10px; margin: 0 auto; }
  .save-bar-inner .btn { flex: 1; }
  @media (min-width: 900px) { .save-bar { left: 260px; padding: 16px 32px; } }

  body.has-savebar { padding-bottom: 100px; }
  @media (min-width: 900px) { body.has-savebar { padding-bottom: 120px; } }

  /* EMPTY */
  .empty-panel { text-align: center; padding: 40px 20px; }
  .empty-panel .big-icon { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%); color: var(--maroon); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .empty-panel h3 { font-size: 16px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
  .empty-panel p { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 300px; margin: 0 auto; }
</style>
</head>
<body>

<!-- HEADER MOBILE -->
<header class="app-header">
  <div class="app-header-brand" style="display:flex; align-items:center; gap:10px;">
    <div class="app-header-text" style="text-align:left;">
      <div class="app-header-title">Pengamat</div>
      <div class="app-header-sub" id="subHeader">Formulir Observasi</div>
    </div>
  </div>
  <button class="header-btn" data-act="logout" aria-label="Keluar">
    <span data-icon="logOut"></span>
  </button>
</header>

<div class="desktop-layout">

  <!-- SIDEBAR DESKTOP -->
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo"><img src="assets/img/logo-mark.svg" alt="Nakula" /></div>
      <div class="sidebar-brand-text">
        <div class="name">NAKULAKU</div>
        <div class="sub">KKG Gugus Nakula</div>
      </div>
    </div>
    <nav class="sidebar-menu">
      <a class="sidebar-item" data-nav="beranda" href="beranda.html"><span data-icon="home"></span> Beranda</a>
      <a class="sidebar-item" data-nav="pertemuan" href="beranda.html#sectionPertemuan"><span data-icon="calendar"></span> Pertemuan</a>
      <a class="sidebar-item galeri-menu" data-nav="galeri" href="galeri.html"><span data-icon="grid"></span> Galeri Sekolah</a>
      <a class="sidebar-item" data-nav="aktivitas" href="aktivitas.html"><span data-icon="activity"></span> Aktivitas Saya</a>
      <a class="sidebar-item active" data-nav="pengamat" href="pengamat.html"><span data-icon="eye"></span> Pengamat</a>
      <a class="sidebar-item" data-nav="profil" href="profil.html"><span data-icon="user"></span> Profil</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="desktop-main">
    <div class="desktop-topbar">
      <h2>Formulir Pengamatan</h2>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="user-chip" id="userChip"></div>
        <button class="btn-icon" data-act="logout" aria-label="Keluar"><span data-icon="logOut"></span></button>
      </div>
    </div>

    <div class="container page" style="max-width:800px; padding-top:20px;">

      <!-- STEP PILIH -->
      <section id="stepPilih">
        <div class="hero-pengamat">
          <div class="hero-icon"><span data-icon="eye" class="icon-xl"></span></div>
          <div class="hero-title">Tugas Pengamatan</div>
          <div class="hero-desc">Catat keaktifan guru (tally) dan nilai kekompakan sekolah. Data akan direkap oleh admin.</div>
        </div>

        <div class="section-title">
          <span class="icon-wrap"><span data-icon="calendar" class="icon-sm"></span></span>
          Pertemuan yang Ditugaskan
        </div>

        <div id="listTugas">
          <div class="skeleton" style="height:88px;border-radius:16px;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:88px;border-radius:16px;"></div>
        </div>
      </section>

      <!-- STEP ISI -->
      <section id="stepIsi" class="hidden">
        <div class="info-header">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:44px;height:44px;border-radius:12px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span data-icon="calendar" class="icon-sm"></span>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:800;font-size:15px;color:var(--ink);" id="infoPertemuan">—</div>
              <div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;" id="infoPertemuan2">—</div>
            </div>
          </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-wrap">
          <span class="icon-left"><span data-icon="search"></span></span>
          <input type="text" id="searchTarget" placeholder="Cari nama guru atau sekolah..." autocomplete="off" />
        </div>

        <div class="tab-switch">
          <button class="tsw active" data-tipe="guru"><span data-icon="user" class="icon-sm"></span> Guru</button>

<!-- SAVE BAR -->
<div class="save-bar hidden" id="saveBar">
  <div class="save-bar-inner">
    <button class="btn btn-secondary" id="btnBatal">
      <span data-icon="x" class="icon-sm"></span> Batal
    </button>
    <button class="btn btn-primary" id="btnSimpan">
      <span data-icon="check" class="icon-sm"></span> Simpan Catatan
    </button>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app-nav.js"></script>
<script>
// Render Ikon
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});
UI.bindLogout();

let profile;
let tugasList = [];
let pertemuanAktif = null;
let dataSesi = null;
let catatanState = {}; // { guru-123: { bertanya: 2, ... , catatan: "" } }
let tipeAktif = 'guru';
let searchQuery = '';

const ASPEK_GURU = [
  { key: 'bertanya',    label: 'Keaktifan bertanya' },
  { key: 'menjawab',    label: 'Keaktifan menjawab' },
  { key: 'diskusi',     label: 'Kontribusi diskusi' },
  { key: 'presentasi',  label: 'Presentasi di depan' },
  { key: 'kerjasama',   label: 'Kerjasama tim' },
];
const ASPEK_SEKOLAH = [
  { key: 'kekompakan',  label: 'Kekompakan tim' },
  { key: 'atribut',     label: 'Kelengkapan atribut' },
  { key: 'kehadiran',   label: 'Kehadiran kolektif' },
  { key: 'solidaritas', label: 'Solidaritas & kerjasama' },
];

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  const chip = document.getElementById('userChip');
  if (chip) {
    const init = (profile.nama || 'A').charAt(0).toUpperCase();
    const fotoUrl = Api.fotoSayaUrl('t');
    chip.innerHTML = `<div class="avatar">${fotoUrl ? `<img src="${fotoUrl}" onerror="this.parentElement.textContent='${init}'">` : init}</div><span>${UI.escapeHtml(profile.nama || '-')}</span>`;
  }

  const isAdmin = (profile.peran || []).includes('pengurus') || (profile.peran || []).includes('super_admin');
  if (!isAdmin) document.querySelectorAll('.galeri-menu').forEach(el => el.style.display = 'none');

  const res = await Api.call('pengamat.tugas_saya');
  document.getElementById('listTugas').innerHTML = '';

  if (!res.ok) {
    document.getElementById('listTugas').innerHTML = UI.errorHtml(res.error);
    return;
  }

  tugasList = res.data || [];
  if (tugasList.length === 0) {
    document.getElementById('listTugas').innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('eye', { class: 'icon-lg' })}</div>
        <h3>Belum Ada Tugas</h3>
        <p>Anda belum ditunjuk sebagai pengamat di pertemuan manapun.</p>
      </div>
    `;
    return;
  }

  if (tugasList.length === 1) {
    bukaPertemuan(tugasList[0].id);
    return;
  }

  renderListTugas();
})();

function renderListTugas() {
  const el = document.getElementById('listTugas');
  el.innerHTML = tugasList.map((t, idx) => `
    <div class="pertemuan-card" data-id="${t.id}" style="animation-delay:${idx * 0.05}s">
      <div class="pertemuan-num">${t.urutan}</div>
      <div class="pertemuan-info">
        <div class="pertemuan-judul">${UI.escapeHtml(t.judul)}</div>
        <div class="pertemuan-meta">${Icons.get('calendar', { class: 'icon-sm' })} ${UI.formatTanggal(t.tanggal)}</div>
        ${t.lokasi_nama ? `<div class="pertemuan-meta">${Icons.get('mapPin', { class: 'icon-sm' })} ${UI.escapeHtml(t.lokasi_nama)}</div>` : ''}
      </div>
      <span style="color:var(--muted);">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </div>
  `).join('');

  el.querySelectorAll('.pertemuan-card').forEach(item => {
    item.addEventListener('click', () => bukaPertemuan(Number(item.dataset.id)));
  });
}

async function bukaPertemuan(id) {
  pertemuanAktif = id;
  document.getElementById('stepPilih').classList.add('hidden');
  document.getElementById('stepIsi').classList.remove('hidden');
  document.body.classList.add('has-savebar');
  document.getElementById('subHeader').textContent = 'Isi Catatan';

  const el = document.getElementById('targetList');
  el.innerHTML = '<div class="skeleton" style="height:200px;border-radius:18px;"></div>';

  const res = await Api.call('pengamat.sesi_info', { pertemuan_id: id });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat.');
    return;
  }

  dataSesi = res.data;
  document.getElementById('infoPertemuan').textContent = `Pertemuan #${dataSesi.pertemuan.urutan} · ${dataSesi.pertemuan.judul}`;
  document.getElementById('infoPertemuan2').textContent = `${UI.formatTanggal(dataSesi.pertemuan.tanggal)} · ${dataSesi.jumlah_peserta} peserta hadir`;

  catatanState = {};
  (dataSesi.catatan || []).forEach(c => {
    const targetId = c.target_tipe === 'guru' ? c.target_user_id : c.target_sekolah_id;
    const baseKey = `${c.target_tipe}-${targetId}`;
    if (!catatanState[baseKey]) catatanState[baseKey] = { catatan: '' };
    
    if (c.aspek !== '__umum') {
      catatanState[baseKey][c.aspek] = (catatanState[baseKey][c.aspek] || 0) + c.skor;
    } else {
      catatanState[baseKey].catatan = c.catatan || '';
    }
  });

  renderTargets();

  document.querySelectorAll('.tsw').forEach(t => {
    t.addEventListener('click', () => {
      tipeAktif = t.dataset.tipe;
      document.querySelectorAll('.tsw').forEach(x => x.classList.toggle('active', x === t));
      renderTargets();
    });
  });

  document.getElementById('searchTarget').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderTargets();
  });
  
  document.getElementById('saveBar').classList.remove('hidden');
}

function renderTargets() {
  const el = document.getElementById('targetList');
  let list = tipeAktif === 'guru' ? dataSesi.peserta : dataSesi.sekolah;

  if (searchQuery && list) {
    list = list.filter(t => {
      const nama = (t.nama_lengkap || t.nama || '').toLowerCase();
      const sub = (t.sekolah?.nama || t.npsn || '').toLowerCase();
      return nama.includes(searchQuery) || sub.includes(searchQuery);
    });
  }

  if (!list || list.length === 0) {
    el.innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get(searchQuery ? 'search' : 'users', { class: 'icon-lg' })}</div>
        <h3>${searchQuery ? 'Tidak Ditemukan' : 'Belum Ada Data'}</h3>
        <p>${searchQuery ? `Tidak ada hasil untuk "${searchQuery}"` : 'Peserta akan muncul setelah mereka presensi.'}</p>
      </div>
    `;
    return;
  }

  el.innerHTML = list.map((t, idx) => {
    const isSekolah = tipeAktif === 'sekolah';
    const init = (t.nama_lengkap || t.nama || '?').charAt(0).toUpperCase();
    const nama = isSekolah ? t.nama : t.nama_lengkap;
    const sub = isSekolah ? (t.npsn || '') : (t.sekolah?.nama || t.jabatan || '');
    const targetId = t.id;
    const key = `${tipeAktif}-${targetId}`;
    const state = catatanState[key] || {};
    
    // Cek apakah sudah ada data yang diisi (Diamati/Dinilai)
    const aspekList = isSekolah ? ASPEK_SEKOLAH : ASPEK_GURU;
    let hasData = false;
    aspekList.forEach(a => { if (state[a.key] > 0) hasData = true; });

    const fotoUrl = t.foto_thumb_url || (t.id ? Api.fotoUrl(t.id, 't') : null);

    return `
      <div class="guru-row" onclick="bukaModal('${tipeAktif}', ${targetId}, '${UI.escapeHtml(nama)}')">
        <div class="guru-avatar">
          <span>${init}</span>
          ${fotoUrl && !isSekolah ? `<img src="${fotoUrl}" onerror="this.remove()">` : ''}
        </div>
        <div class="guru-info">
          <div class="guru-nama">${UI.escapeHtml(nama || '-')}</div>
          <div class="guru-sub">${UI.escapeHtml(sub)}</div>
        </div>
        ${hasData ? `
          <div class="badge-diamati">
            ${Icons.get('check', { class: 'icon-sm' })} ${isSekolah ? 'Dinilai' : 'Diamati'}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

// ==========================================
// MODAL (TALLY GURU / RATING SEKOLAH)
// ==========================================
function bukaModal(tipe, targetId, nama) {
  const isSekolah = tipe === 'sekolah';
  const aspekList = isSekolah ? ASPEK_SEKOLAH : ASPEK_GURU;
  const key = `${tipe}-${targetId}`;
  
  const state = catatanState[key] || { catatan: '' };
  const aspekState = {};
  aspekList.forEach(a => aspekState[a.key] = state[a.key] || 0);
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-sheet';
  overlay.innerHTML = `
    <div class="modal-content">
      <div class="modal-handle"></div>
      
      <div style="text-align:center; margin-bottom:20px;">
        <h3 style="font-size:18px; color:var(--maroon); margin-bottom:4px;">${isSekolah ? 'Nilai Kekompakan' : 'Catat Keaktifan'}</h3>
        <p style="font-size:13px; color:var(--muted); font-weight:600;">${UI.escapeHtml(nama)}</p>
      </div>

      <div style="background:var(--bg); border-radius:16px; padding:10px 16px; margin-bottom:16px;">
        ${aspekList.map(a => `
          <div class="tally-row">
            <div class="tally-label">${a.label}</div>
            ${isSekolah 
              ? `<div class="rating-pick" data-aspek="${a.key}">
                   ${[1,2,3,4,5].map(n => `<button type="button" data-skor="${n}" class="${aspekState[a.key] === n ? 'on' : ''}">${n}</button>`).join('')}
                 </div>`
              : `<div class="tally-controls">
                   <button class="btn-tally minus" data-aksi="minus" data-aspek="${a.key}">−</button>
                   <div class="tally-val" id="val-${a.key}">${aspekState[a.key]}</div>
                   <button class="btn-tally plus" data-aksi="plus" data-aspek="${a.key}">+</button>
                 </div>`
            }
          </div>
        `).join('')}
      </div>

      <div class="field" style="margin-bottom:20px;">
        <label class="label">Catatan Tambahan (Opsional)</label>
        <textarea id="tallyCatatan" class="input" rows="2" placeholder="Contoh: Sangat aktif di sesi diskusi kelompok...">${UI.escapeHtml(state.catatan || '')}</textarea>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" id="btnTutupModal" style="flex:1;">Tutup</button>
        <button class="btn btn-primary" id="btnSimpanTally" style="flex:2;">Simpan Catatan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Bind Tally Buttons (Khusus Guru)
  overlay.querySelectorAll('.btn-tally').forEach(btn => {
    btn.addEventListener('click', () => {
      const aspek = btn.dataset.aspek;
      const aksi = btn.dataset.aksi;
      const elVal = overlay.querySelector(`#val-${aspek}`);
      let cur = Number(elVal.textContent);
      
      if (aksi === 'plus' && cur < 99) cur++; // Max 99
      if (aksi === 'minus' && cur > 0) cur--;
      
      elVal.textContent = cur;
      aspekState[aspek] = cur;
    });
  });

  // Bind Rating Buttons (Khusus Sekolah)
  overlay.querySelectorAll('.rating-pick').forEach(r => {
    const aspek = r.dataset.aspek;
    r.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        r.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        aspekState[aspek] = Number(b.dataset.skor);
      });
    });
  });

  const close = () => overlay.remove();
  overlay.querySelector('#btnTutupModal').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  overlay.querySelector('#btnSimpanTally').addEventListener('click', () => {
    catatanState[key] = { ...aspekState, catatan: overlay.querySelector('#tallyCatatan').value.trim() };
    close();
    renderTargets();
    UI.sukses('Catatan tersimpan di daftar.');
  });
}

// AKSI BAWAH
document.getElementById('btnBatal').addEventListener('click', async () => {
  const ok = await UI.konfirmasi('Batalkan', 'Catatan yang belum disimpan ke server akan hilang. Lanjutkan?', { danger: true });
  if (ok) window.location.href = 'beranda.html';
});

document.getElementById('btnSimpan').addEventListener('click', async () => {
  const btn = document.getElementById('btnSimpan');
  UI.btnLoading(btn, 'Menyimpan ke Server…');

  const items = [];
  Object.keys(catatanState).forEach(baseKey => {
    const [tipe, targetIdStr] = baseKey.split('-');
    const targetId = Number(targetIdStr);
    const state = catatanState[baseKey];
    
    Object.keys(state).forEach(k => {
      if (k === 'catatan') return;
      if (state[k] > 0) {
        items.push({
          target_tipe: tipe,
          target_id: targetId,
          aspek: k,
          skor: state[k],
          catatan: null,
        });
      }
    });

    if (state.catatan && state.catatan.trim()) {
      items.push({
        target_tipe: tipe,
        target_id: targetId,
        aspek: '__umum',
        skor: 1,
        catatan: state.catatan.trim(),
      });
    }
  });

  const res = await Api.call('pengamat.simpan_catatan', {
    pertemuan_id: pertemuanAktif,
    items,
  });

  UI.btnReset(btn);

  if (!res.ok) { UI.gagal(res.error || 'Gagal menyimpan.'); return; }

  UI.sukses('Semua catatan berhasil disimpan!');
  setTimeout(() => window.location.href = 'beranda.html', 800);
});
</script>
