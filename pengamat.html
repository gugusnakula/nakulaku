<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#611329" />
<title>Pengamat — NAKULAKU</title>

<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/nakula.css" />

<style>
  /* HERO */
  .hero-pengamat {
    background: linear-gradient(135deg, #4A0D1F 0%, #7D1D3A 50%, #9B2649 100%);
    color: white;
    border-radius: 24px;
    padding: 24px 20px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(125,29,58,.28);
    animation: fade-in-up .5s var(--ease-out) both;
  }
  .hero-pengamat::before {
    content: '';
    position: absolute;
    top: -80px; right: -60px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-pengamat::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-icon {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: rgba(255,255,255,.15);
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
  }
  .hero-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
    letter-spacing: 0.3px;
  }
  .hero-desc {
    font-size: 13px;
    opacity: 0.9;
    line-height: 1.5;
    font-weight: 600;
    position: relative;
    z-index: 1;
  }

  /* SECTION */
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 800;
    color: var(--maroon);
    margin-bottom: 12px;
    letter-spacing: 0.3px;
  }
  .section-title .icon-wrap {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--maroon-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* PILIH PERTEMUAN CARD */
  .pertemuan-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .2s var(--ease-out);
    animation: fade-in-up .4s var(--ease-out) both;
    -webkit-tap-highlight-color: transparent;
  }
  .pertemuan-card:hover {
    border-color: var(--maroon-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(125,29,58,.08);
  }
  .pertemuan-card:active { transform: translateY(0) scale(.99); }
  .pertemuan-num {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    flex-shrink: 0;
    border: 1.5px solid rgba(125,29,58,.1);
  }
  .pertemuan-info { flex: 1; min-width: 0; }
  .pertemuan-judul {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .pertemuan-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 700;
  }
  .pertemuan-meta + .pertemuan-meta { margin-top: 3px; }

  /* TAB SWITCH */
  .tab-switch {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 14px;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
    animation: fade-in-up .4s var(--ease-out) both;
  }
  .tsw {
    flex: 1;
    padding: 11px 8px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 10px;
    cursor: pointer;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: all .15s;
    font-family: inherit;
  }
  .tsw.active {
    background: var(--surface);
    color: var(--maroon);
    box-shadow: 0 2px 8px rgba(125,29,58,.08);
  }

  /* TARGET CARD */
  .target-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    animation: fade-in-up .4s var(--ease-out) both;
    transition: all .2s var(--ease-out);
  }
  .target-card:hover {
    border-color: var(--maroon-light);
    box-shadow: 0 6px 16px rgba(125,29,58,.06);
  }
  .target-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .target-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(125,29,58,.1);
  }
  .target-avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .target-avatar.sekolah {
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-soft) 0%, #FBF3D0 100%);
    color: var(--gold-dark);
  }
  .target-info { flex: 1; min-width: 0; }
  .target-nama {
    font-weight: 800;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .target-sub {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ASPEK ROW */
  .aspek-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .aspek-row:last-of-type { border-bottom: none; }
  .aspek-name {
    flex: 1;
    font-size: 12.5px;
    font-weight: 700;
    min-width: 0;
    color: var(--ink);
  }
  .rating {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .rating button {
    width: 32px; height: 32px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    border-radius: 9px;
    font-weight: 800;
    font-size: 12.5px;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    transition: all .12s var(--ease-out);
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .rating button:hover {
    border-color: var(--maroon);
    color: var(--maroon);
    transform: translateY(-1px);
  }
  .rating button.on {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-mid) 100%);
    color: white;
    border-color: var(--maroon);
    box-shadow: 0 4px 10px rgba(125,29,58,.25);
    transform: translateY(-1px);
  }
  .rating button:active {
    transform: translateY(0) scale(.92);
  }

  .catatan-input {
    margin-top: 12px;
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    resize: vertical;
    min-height: 48px;
    background: var(--bg);
    color: var(--ink);
    transition: all .15s;
  }
  .catatan-input:focus {
    outline: none;
    border-color: var(--maroon);
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(125,29,58,.08);
  }

  /* SAVE BAR */
  .save-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,255,255,.98);
    backdrop-filter: blur(12px);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1.5px solid var(--border);
    box-shadow: 0 -4px 20px rgba(125,29,58,.08);
    z-index: 40;
  }
  .save-bar-inner {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
    margin: 0 auto;
  }
  .save-bar-inner .btn { flex: 1; }

  /* EMPTY */
  .empty-panel {
    text-align: center;
    padding: 50px 20px;
  }
  .empty-panel .big-icon {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--maroon-soft) 0%, #F9DDE6 100%);
    color: var(--maroon);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    position: relative;
  }
  .empty-panel .big-icon svg { width: 40px; height: 40px; }
  .empty-panel h3 {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-panel p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 300px;
    margin: 0 auto;
  }

  body.has-savebar { padding-bottom: 100px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-header-brand">
    <a href="beranda.html" class="header-btn" style="text-decoration:none;">
      <span data-icon="chevronLeft"></span>
    </a>
    <div class="app-header-text">
      <div class="app-header-title">Pengamat</div>
      <div class="app-header-sub" id="subHeader">Memuat…</div>
    </div>
  </div>
</header>

<main class="container page" style="max-width:720px;padding-top:16px;">

  <!-- STEP PILIH -->
  <section id="stepPilih">
    <div class="hero-pengamat">
      <div class="hero-icon">
        <span data-icon="eye" class="icon-xl"></span>
      </div>
      <div class="hero-title">Tugas Pengamatan</div>
      <div class="hero-desc">Catat keaktifan peserta dan kekompakan sekolah selama pertemuan berlangsung.</div>
    </div>

    <div class="section-title">
      <span class="icon-wrap"><span data-icon="calendar" class="icon-sm"></span></span>
      Pertemuan yang Ditugaskan
    </div>

    <div id="listTugas">
      <div class="skeleton" style="height:88px;border-radius:16px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:88px;border-radius:16px;"></div>
    </div>
  </section>

  <!-- STEP ISI -->
  <section id="stepIsi" class="hidden">
    <div class="info-header" style="background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="width:40px;height:40px;border-radius:12px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${''}
          <span data-icon="calendar" class="icon-sm"></span>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:14px;" id="infoPertemuan">—</div>
          <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;" id="infoPertemuan2">—</div>
        </div>
      </div>
    </div>

    <div class="tab-switch">
      <button class="tsw active" data-tipe="guru">
        <span data-icon="user" class="icon-sm"></span> Guru
      </button>
      <button class="tsw" data-tipe="sekolah">
        <span data-icon="home" class="icon-sm"></span> Sekolah
      </button>
    </div>

    <div id="targetList"></div>
  </section>

</main>

<!-- SAVE BAR -->
<div class="save-bar hidden" id="saveBar">
  <div class="save-bar-inner">
    <button class="btn btn-secondary" id="btnBatal">
      <span data-icon="x" class="icon-sm"></span>
      Batal
    </button>
    <button class="btn btn-primary" id="btnSimpan">
      <span data-icon="check" class="icon-sm"></span>
      Simpan Catatan
    </button>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" data-nav="beranda" href="beranda.html"><span data-icon="home"></span> Beranda</a>
  <a class="nav-item" data-nav="pertemuan" href="beranda.html#sectionPertemuan"><span data-icon="calendar"></span> Pertemuan</a>
  <a class="nav-item" data-nav="galeri" href="galeri.html"><span data-icon="grid"></span> Galeri</a>
  <a class="nav-item" data-nav="aktivitas" href="aktivitas.html"><span data-icon="activity"></span> Aktivitas</a>
  <a class="nav-item" data-nav="profil" href="profil.html"><span data-icon="user"></span> Profil</a>
</nav>

<script src="assets/js/icons.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.querySelectorAll('[data-icon]').forEach(el => {
  el.innerHTML = Icons.get(el.dataset.icon);
  el.style.display = 'contents';
});

let profile;
let tugasList = [];
let pertemuanAktif = null;
let dataSesi = null;
let catatanState = {};
let tipeAktif = 'guru';

const ASPEK_GURU = [
  { key: 'bertanya',    label: 'Keaktifan bertanya' },
  { key: 'menjawab',    label: 'Keaktifan menjawab' },
  { key: 'diskusi',     label: 'Kontribusi diskusi' },
  { key: 'presentasi',  label: 'Presentasi di depan' },
  { key: 'kerjasama',   label: 'Kerjasama tim' },
];
const ASPEK_SEKOLAH = [
  { key: 'kekompakan',  label: 'Kekompakan tim' },
  { key: 'atribut',     label: 'Kelengkapan atribut' },
  { key: 'kehadiran',   label: 'Kehadiran kolektif' },
  { key: 'solidaritas', label: 'Solidaritas & kerjasama' },
];

(async () => {
  profile = await Api.requireLogin();
  if (!profile) return;

  const res = await Api.call('pengamat.tugas_saya');
  document.getElementById('listTugas').innerHTML = '';

  if (!res.ok) {
    document.getElementById('listTugas').innerHTML = UI.errorHtml(res.error);
    return;
  }

  tugasList = res.data || [];

  if (tugasList.length === 0) {
    document.getElementById('listTugas').innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('eye', { class: 'icon-lg' })}</div>
        <h3>Belum Ada Tugas</h3>
        <p>Anda belum ditunjuk sebagai pengamat di pertemuan manapun.</p>
      </div>
    `;
    return;
  }

  if (tugasList.length === 1) {
    bukaPertemuan(tugasList[0].id);
    return;
  }

  renderListTugas();
})();

function renderListTugas() {
  const el = document.getElementById('listTugas');
  el.innerHTML = tugasList.map((t, idx) => `
    <div class="pertemuan-card" data-id="${t.id}" style="animation-delay:${idx * 0.05}s">
      <div class="pertemuan-num">${t.urutan}</div>
      <div class="pertemuan-info">
        <div class="pertemuan-judul">${UI.escapeHtml(t.judul)}</div>
        <div class="pertemuan-meta">
          ${Icons.get('calendar', { class: 'icon-sm' })}
          ${UI.formatTanggal(t.tanggal)}
        </div>
        ${t.lokasi_nama ? `
          <div class="pertemuan-meta">
            ${Icons.get('mapPin', { class: 'icon-sm' })}
            ${UI.escapeHtml(t.lokasi_nama)}
          </div>
        ` : ''}
      </div>
      <span style="color:var(--muted);">${Icons.get('chevronRight', { class: 'icon' })}</span>
    </div>
  `).join('');

  el.querySelectorAll('.pertemuan-card').forEach(item => {
    item.addEventListener('click', () => bukaPertemuan(Number(item.dataset.id)));
  });
}

async function bukaPertemuan(id) {
  pertemuanAktif = id;
  document.getElementById('stepPilih').classList.add('hidden');
  document.getElementById('stepIsi').classList.remove('hidden');
  document.getElementById('saveBar').classList.remove('hidden');
  document.getElementById('subHeader').textContent = 'Isi Catatan';
  document.body.classList.add('has-savebar');

  const el = document.getElementById('targetList');
  el.innerHTML = '<div class="skeleton" style="height:200px;border-radius:18px;"></div>';

  const res = await Api.call('pengamat.sesi_info', { pertemuan_id: id });

  if (!res.ok) {
    el.innerHTML = UI.errorHtml(res.error || 'Gagal memuat.');
    return;
  }

  dataSesi = res.data;
  document.getElementById('infoPertemuan').textContent = `Pertemuan #${dataSesi.pertemuan.urutan} · ${dataSesi.pertemuan.judul}`;
  document.getElementById('infoPertemuan2').textContent =
    `${UI.formatTanggal(dataSesi.pertemuan.tanggal)} · ${dataSesi.jumlah_peserta} peserta hadir`;

  catatanState = {};
  (dataSesi.catatan || []).forEach(c => {
    const targetId = c.target_tipe === 'guru' ? c.target_user_id : c.target_sekolah_id;
    const key = `${c.target_tipe}-${targetId}-${c.aspek}`;
    catatanState[key] = { skor: c.skor, catatan: c.catatan || '' };
  });

  renderTargets();

  document.querySelectorAll('.tsw').forEach(t => {
    t.addEventListener('click', () => {
      tipeAktif = t.dataset.tipe;
      document.querySelectorAll('.tsw').forEach(x => x.classList.toggle('active', x === t));
      renderTargets();
    });
  });
}

function renderTargets() {
  const el = document.getElementById('targetList');
  const aspek = tipeAktif === 'guru' ? ASPEK_GURU : ASPEK_SEKOLAH;
  const list = tipeAktif === 'guru' ? dataSesi.peserta : dataSesi.sekolah;

  if (!list || list.length === 0) {
    const label = tipeAktif === 'guru' ? 'peserta hadir' : 'sekolah';
    el.innerHTML = `
      <div class="empty-panel">
        <div class="big-icon">${Icons.get('users', { class: 'icon-lg' })}</div>
        <h3>Belum Ada ${label.charAt(0).toUpperCase() + label.slice(1)}</h3>
        <p>${tipeAktif === 'guru' ? 'Peserta akan muncul setelah mereka presensi.' : 'Sekolah akan muncul setelah ada peserta hadir.'}</p>
      </div>
    `;
    return;
  }

  el.innerHTML = list.map((t, idx) => {
    const init = (t.nama_lengkap || t.nama || '?').charAt(0).toUpperCase();
    const fotoUrl = t.foto_thumb_url || (t.id ? Api.fotoUrl(t.id, 't') : null);
    const isSekolah = tipeAktif === 'sekolah';
    const nama = isSekolah ? t.nama : t.nama_lengkap;
    const sub = isSekolah ? (t.npsn || '') : (t.sekolah?.nama || t.jabatan || '');
    const targetId = t.id;

    return `
      <div class="target-card" style="animation-delay:${idx * 0.04}s">
        <div class="target-head">
          <div class="target-avatar ${isSekolah ? 'sekolah' : ''}">
            <span>${init}</span>
            ${fotoUrl && !isSekolah ? `<img src="${fotoUrl}" onerror="this.remove()">` : ''}
          </div>
          <div class="target-info">
            <div class="target-nama">${UI.escapeHtml(nama || '-')}</div>
            <div class="target-sub">${UI.escapeHtml(sub)}</div>
          </div>
        </div>

        <div>
          ${aspek.map(a => {
            const key = `${tipeAktif}-${targetId}-${a.key}`;
            const cur = catatanState[key]?.skor || 0;
            return `
              <div class="aspek-row">
                <div class="aspek-name">${a.label}</div>
                <div class="rating" data-key="${key}">
                  ${[1,2,3,4,5].map(n =>
                    `<button type="button" data-skor="${n}" class="${cur === n ? 'on' : ''}">${n}</button>`
                  ).join('')}
                </div>
              </div>
            `;
          }).join('')}

          <textarea class="catatan-input" data-catatan-key="${tipeAktif}-${targetId}"
            placeholder="Catatan tambahan (opsional)…">${UI.escapeHtml(catatanState[`${tipeAktif}-${targetId}-__note`]?.catatan || '')}</textarea>
        </div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('.rating').forEach(r => {
    const key = r.dataset.key;
    r.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const skor = Number(b.dataset.skor);
        r.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        if (!catatanState[key]) catatanState[key] = { skor: null, catatan: '' };
        catatanState[key].skor = skor;
      });
    });
  });

  el.querySelectorAll('[data-catatan-key]').forEach(ta => {
    const key = ta.dataset.catatanKey + '-__note';
    ta.addEventListener('input', () => {
      if (!catatanState[key]) catatanState[key] = { skor: null, catatan: '' };
      catatanState[key].catatan = ta.value;
    });
  });
}

document.getElementById('btnBatal').addEventListener('click', async () => {
  const ok = await UI.konfirmasi('Batalkan', 'Catatan yang belum disimpan akan hilang. Lanjutkan?', { danger: true });
  if (ok) window.location.href = 'beranda.html';
});

document.getElementById('btnSimpan').addEventListener('click', async () => {
  const btn = document.getElementById('btnSimpan');
  UI.btnLoading(btn, 'Menyimpan…');

  const items = [];
  Object.keys(catatanState).forEach(key => {
    if (key.endsWith('-__note')) {
      const base = key.replace('-__note', '');
      const parts = base.split('-');
      const tipe = parts[0];
      const targetId = parts[1];
      const catatanText = catatanState[key].catatan;
      if (catatanText && catatanText.trim()) {
        items.push({
          target_tipe: tipe,
          target_id: Number(targetId),
          aspek: '__umum',
          skor: 1,
          catatan: catatanText.trim(),
        });
      }
    } else {
      const parts = key.split('-');
      const tipe = parts[0];
      const targetId = parts[1];
      const aspek = parts[2];
      const v = catatanState[key];
      if (v.skor !== null && v.skor !== undefined) {
        items.push({
          target_tipe: tipe,
          target_id: Number(targetId),
          aspek,
          skor: v.skor,
          catatan: null,
        });
      }
    }
  });

  const res = await Api.call('pengamat.simpan_catatan', {
    pertemuan_id: pertemuanAktif,
    items,
  });

  UI.btnReset(btn);

  if (!res.ok) { UI.gagal(res.error || 'Gagal menyimpan.'); return; }

  UI.sukses('Catatan tersimpan.');
  setTimeout(() => window.location.href = 'beranda.html', 800);
});
</script>
